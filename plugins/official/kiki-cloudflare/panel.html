<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloudflare</title>
<style>
:root {
  color-scheme: light dark;
  font-synthesis: none;
  --bg: var(--color-canvas, #f6f4ef);
  --paper: var(--color-paper, #fcfbf8);
  --panel: var(--color-panel, #efece4);
  --ink: var(--color-ink, #1b1a17);
  --ink-soft: var(--color-ink-soft, #5c5850);
  --ink-faint: var(--color-ink-faint, #8c867b);
  --line: var(--color-hairline, rgba(27, 26, 23, 0.10));
  --line-strong: var(--color-hairline-strong, rgba(27, 26, 23, 0.18));
  --accent: var(--color-accent, #2c5e4f);
  --accent-deep: var(--color-accent-deep, #22493d);
  --accent-soft: rgba(44, 94, 79, 0.10);
  --on-accent: var(--color-on-accent, #fcfbf8);
  --ok: var(--color-success, #2c6e49);
  --warn: var(--color-amber-ink, #8a5a19);
  --warn-bg: var(--color-amber-card, rgba(138, 90, 25, 0.11));
  --danger: var(--color-danger, #a63429);
  --danger-bg: rgba(166, 52, 41, 0.09);
  --wash: rgba(27, 26, 23, 0.04);
  --sans: "Instrument Sans", ui-sans-serif, system-ui, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --display: "Newsreader", Georgia, "Songti SC", "Noto Serif SC", serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 6px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--color-canvas, #141413);
    --paper: var(--color-paper, #1c1b19);
    --panel: var(--color-panel, #252320);
    --ink: var(--color-ink, #edeae2);
    --ink-soft: var(--color-ink-soft, #b2aca0);
    --ink-faint: var(--color-ink-faint, #7b766c);
    --line: var(--color-hairline, rgba(237, 234, 226, 0.10));
    --line-strong: var(--color-hairline-strong, rgba(237, 234, 226, 0.18));
    --accent: var(--color-accent, #58a88f);
    --accent-deep: var(--color-accent-deep, #6ebe9f);
    --accent-soft: rgba(88, 168, 143, 0.15);
    --on-accent: var(--color-on-accent, #141413);
    --ok: var(--color-success, #6bbf8e);
    --warn: var(--color-amber-ink, #dca056);
    --warn-bg: var(--color-amber-card, rgba(220, 160, 86, 0.14));
    --danger: var(--color-danger, #e27a6e);
    --danger-bg: rgba(226, 122, 110, 0.14);
    --wash: rgba(237, 234, 226, 0.05);
  }
}

:root[data-theme="dark"] {
  --bg: var(--color-canvas, #141413);
  --paper: var(--color-paper, #1c1b19);
  --panel: var(--color-panel, #252320);
  --ink: var(--color-ink, #edeae2);
  --ink-soft: var(--color-ink-soft, #b2aca0);
  --ink-faint: var(--color-ink-faint, #7b766c);
  --line: var(--color-hairline, rgba(237, 234, 226, 0.10));
  --line-strong: var(--color-hairline-strong, rgba(237, 234, 226, 0.18));
  --accent: var(--color-accent, #58a88f);
  --accent-deep: var(--color-accent-deep, #6ebe9f);
  --accent-soft: rgba(88, 168, 143, 0.15);
  --on-accent: var(--color-on-accent, #141413);
  --ok: var(--color-success, #6bbf8e);
  --warn: var(--color-amber-ink, #dca056);
  --warn-bg: var(--color-amber-card, rgba(220, 160, 86, 0.14));
  --danger: var(--color-danger, #e27a6e);
  --danger-bg: rgba(226, 122, 110, 0.14);
  --wash: rgba(237, 234, 226, 0.05);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.55 var(--sans);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

.sheet {
  max-width: 820px;
  margin: 0 auto;
  padding: 20px 20px 48px;
}

.icon {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  flex: none;
}

.masthead {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line-strong);
}

.title-wrap {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}

h1 {
  margin: 0;
  font: 500 20px/1.28 var(--display);
  letter-spacing: 0;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--paper);
  border: 1px solid var(--line);
  font-size: 11.5px;
  color: var(--ink-soft);
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ink-faint);
  flex: none;
}
.dot[data-tone="running"], .dot[data-tone="ok"] { background: var(--ok); }
.dot[data-tone="busy"] { background: var(--warn); }
.dot[data-tone="error"] { background: var(--danger); }

.top-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.seg {
  display: inline-flex;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--paper);
}

.seg button {
  border: 0;
  border-right: 1px solid var(--line);
  border-radius: 0;
  min-height: 29px;
  padding: 0 11px;
  background: transparent;
  color: var(--ink-soft);
  font: 500 12px/1 var(--sans);
  cursor: pointer;
}
.seg button:last-child { border-right: 0; }
.seg button:hover:not([aria-pressed="true"]):not(:disabled) { background: var(--wash); color: var(--ink); }
.seg button[aria-pressed="true"] {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}

button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font: 500 12px/1 var(--sans);
  min-height: 30px;
  padding: 0 11px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: background-color 0.13s ease, border-color 0.13s ease, color 0.13s ease;
}
button.primary { background: var(--accent); color: var(--on-accent); }
button.primary:hover:not(:disabled) { background: var(--accent-deep); }
button.secondary { border-color: var(--line-strong); background: var(--paper); color: var(--ink-soft); }
button.secondary:hover:not(:disabled) { background: var(--panel); color: var(--ink); }
button.quiet { color: var(--ink-faint); padding: 0 7px; min-height: 26px; }
button.quiet:hover:not(:disabled) { color: var(--ink); background: var(--wash); }
button.danger-btn:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
button.sm { min-height: 25px; padding: 0 8px; font-size: 11.5px; }
button:disabled { opacity: 0.48; cursor: default; }

@keyframes spin { to { transform: rotate(360deg); } }
button[data-busy="true"] .icon { animation: spin 0.9s linear infinite; }

:is(button, summary, input, select, a):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.reason {
  margin: 8px 0 0;
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--ink-soft);
}
.reason[data-tone="error"] {
  color: var(--danger);
  background: var(--danger-bg);
  padding: 7px 10px;
  border-radius: var(--radius);
}
.saved-note {
  margin: 8px 0 0;
  font-size: 12px;
  color: var(--ok);
}

.url-strip {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
  padding: 8px 11px;
  border-radius: var(--radius);
  background: var(--paper);
  border: 1px solid var(--line);
}

.url-code {
  font: 12px/1.35 var(--mono);
  color: var(--ink);
  overflow-wrap: anywhere;
  min-width: 0;
  flex: 1 1 auto;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
}
.actions.tight { margin-top: 8px; }

.rule {
  height: 1px;
  background: var(--line);
  border: 0;
  margin: 16px 0;
}

.surface-card {
  margin-top: 14px;
  padding: 14px 16px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

.field { display: block; margin: 0 0 11px; min-width: 0; }
.field > .label { display: block; font-size: 12px; color: var(--ink-soft); margin: 0 0 4px; }
.hint { display: block; font-size: 11.5px; line-height: 1.45; color: var(--ink-faint); margin: 4px 0 0; }

input[type="text"], input[type="password"], select {
  width: 100%;
  min-width: 0;
  min-height: 32px;
  padding: 5px 9px;
  font: 12.5px/1.35 var(--sans);
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
}
input:focus, select:focus { border-color: var(--accent); outline: none; }
input::placeholder { color: var(--ink-faint); }
.mono { font-family: var(--mono); font-size: 12px; }

.choices { display: flex; gap: 6px; flex-wrap: wrap; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; width: 0; height: 0; }
.choice span {
  display: inline-flex;
  align-items: center;
  min-height: 28px;
  padding: 0 10px;
  font-size: 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--ink-soft);
  cursor: pointer;
}
.choice input:checked + span {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}

.pref {
  display: flex;
  gap: 9px;
  align-items: flex-start;
  margin: 12px 0 0;
  padding: 0;
  border: 0;
}
.pref input { margin: 3px 0 0; width: 14px; height: 14px; accent-color: var(--accent); flex: none; }

details { margin-top: 12px; }
summary {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 34px;
  cursor: pointer;
  font-size: 12.5px;
  color: var(--ink-soft);
  list-style: none;
  user-select: none;
}
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; margin-left: auto; font-family: var(--mono); color: var(--ink-faint); }
details[open] > summary::after { content: "-"; }
details .inside { padding: 6px 0 10px; }

a.link { color: var(--accent); font-size: 12px; text-underline-offset: 2px; cursor: pointer; }

.loginurl {
  display: block;
  margin: 8px 0 0;
  padding: 8px 10px;
  word-break: break-all;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  font: 12px/1.4 var(--mono);
  color: var(--ink-soft);
}

.tunnels {
  list-style: none;
  margin: 8px 0 0;
  padding: 0;
  border-top: 1px solid var(--line);
}
.tunnels li { border-bottom: 1px solid var(--line); }
.tunnels button {
  display: flex;
  width: 100%;
  justify-content: flex-start;
  align-items: baseline;
  gap: 8px;
  text-align: left;
  min-height: 36px;
  padding: 6px 4px;
  border-radius: 0;
}
.tunnels .tname { color: var(--ink); font-size: 12.5px; }
.tunnels .tid { color: var(--ink-faint); font-size: 11.5px; margin-left: auto; }

/* --- DNS & Worker Routes --- */
.dns-head-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.dns-head-bar select {
  width: auto;
  min-width: 180px;
  max-width: 100%;
  background: var(--paper);
  font-weight: 500;
}

.zone-badge {
  font: 11px/1.3 var(--mono);
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
}

.dns-filter-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.type-pills {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.type-pill {
  min-height: 26px;
  padding: 0 9px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--paper);
  color: var(--ink-soft);
  font: 500 11px/1 var(--mono);
}
.type-pill[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
}

.dns-search {
  flex: 1 1 160px;
  min-width: 0;
  background: var(--paper) !important;
}

.dns-editor {
  margin-top: 12px;
  padding: 12px 14px;
  border-radius: var(--radius);
  background: var(--paper);
  border: 1px solid var(--accent);
}

.dns-form-grid {
  display: grid;
  grid-template-columns: 96px minmax(110px, 1fr) minmax(130px, 1.3fr) 96px;
  gap: 8px 10px;
  align-items: end;
}

.dns-ledger {
  margin-top: 12px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

.dns-row {
  display: grid;
  grid-template-columns: 54px minmax(100px, 1fr) minmax(120px, 1.4fr) auto;
  align-items: center;
  gap: 8px 10px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--line);
}
.dns-row:last-child { border-bottom: 0; }
.dns-row:hover { background: var(--wash); }

.rec-type {
  display: inline-flex;
  justify-content: center;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--panel);
  color: var(--ink);
  font: 600 11px/1.3 var(--mono);
}

.rec-name {
  font: 500 12px/1.35 var(--mono);
  color: var(--ink);
  overflow-wrap: anywhere;
}

.rec-content {
  font: 12px/1.35 var(--mono);
  color: var(--ink-soft);
  overflow-wrap: anywhere;
}

.rec-actions {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.proxy-toggle {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 24px;
  padding: 0 7px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--bg);
  color: var(--ink-faint);
  font: 500 11px/1 var(--sans);
}
.proxy-toggle[aria-checked="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
}

.routes-section {
  margin-top: 18px;
}

.routes-section h2 {
  margin: 0 0 8px;
  font: 600 12px/1.35 var(--sans);
  color: var(--ink-soft);
}

.route-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
}
.route-row:last-child { border-bottom: 0; }

.empty-box {
  padding: 22px 14px;
  text-align: center;
  color: var(--ink-faint);
  font-size: 12.5px;
}

.vis-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

@media (max-width: 620px) {
  .sheet { padding: 14px 12px 38px; }
  .top-right { margin-left: 0; width: 100%; justify-content: space-between; }
  .dns-form-grid { grid-template-columns: minmax(0, 1fr); }
  .dns-row { grid-template-columns: auto minmax(0, 1fr); }
  .dns-row .rec-content { grid-column: 1 / -1; }
  .dns-row .rec-actions { grid-column: 1 / -1; justify-content: flex-start; }
}

@media (pointer: coarse) {
  button, input, select, summary { min-height: 40px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<main class="sheet">
  <header class="masthead">
    <div class="title-wrap">
      <h1 data-i18n="title">Cloudflare</h1>
      <span class="status-pill" id="statusPill">
        <span class="dot" id="dot" data-tone="" aria-hidden="true"></span>
        <span id="stat">…</span>
      </span>
    </div>
    <div class="top-right">
      <div class="seg" role="tablist" aria-label="视图切换">
        <button type="button" id="tabTunnel" aria-pressed="true" data-i18n="tabTunnel">隧道连接</button>
        <button type="button" id="tabDns" aria-pressed="false" data-i18n="tabDns">域名与 DNS</button>
      </div>
      <button type="button" class="secondary sm" id="langBtn">EN</button>
    </div>
  </header>

  <p class="vis-hidden" id="live" role="status" aria-live="polite"></p>
  <p class="reason" id="root-reason" data-tone="error" role="alert" hidden></p>

  <!-- SURFACE 1: TUNNEL CONNECTOR -->
  <section id="tunnelView">
    <p class="reason" id="reason"></p>

    <div class="url-strip" id="public-url-bar" hidden>
      <span class="url-code" id="public-url-val"></span>
      <button type="button" class="secondary sm" id="copyPublicUrlBtn" data-i18n="copyBtn">复制</button>
      <button type="button" class="secondary sm" id="openPublicUrlBtn" data-i18n="openBtn">打开</button>
    </div>

    <div class="actions" id="lifecycle" hidden></div>
    <p class="reason" id="busy" hidden></p>

    <section id="dep-section" class="surface-card" hidden>
      <p class="reason" id="dep-note" style="margin-top:0"></p>
      <div class="actions tight" id="dep-actions"></div>
    </section>

    <div id="setup" class="surface-card">
      <div id="setup-fields">
        <div class="actions tight" id="create-actions" style="margin-top:0">
          <button type="button" class="secondary" id="create" data-i18n="createButton">在 Cloudflare 创建隧道</button>
          <a class="link" id="docs" href="https://developers.cloudflare.com/tunnel/get-started/" data-i18n="docsLink">文档说明</a>
        </div>
        <p class="hint" id="create-hint" data-i18n="createHint"></p>

        <div class="field" id="wrap-token" style="margin-top:12px">
          <label class="label" for="token" data-i18n="tokenLabel">隧道 Connector Token</label>
          <input type="password" id="token" autocomplete="off" spellcheck="false" data-i18n-placeholder="tokenPlaceholder">
          <div class="actions tight" id="clear-token-row">
            <button type="button" class="quiet" id="clear-token" data-i18n="clearSecret" hidden>清除已存 Token</button>
          </div>
          <span class="hint" id="token-hint"></span>
        </div>

        <div class="choices" id="mode" role="radiogroup" data-i18n-aria="modeGroup" aria-label="配置方式">
          <label class="choice">
            <input type="radio" name="mode" value="token" checked>
            <span data-i18n="modeToken">Connector Token</span>
          </label>
          <label class="choice">
            <input type="radio" name="mode" value="local">
            <span data-i18n="modeLocal">已有本地配置</span>
          </label>
        </div>

        <div id="local-fields" hidden>
          <label class="field" for="tunnelid" style="margin-top:12px">
            <span class="label" data-i18n="tunnelIdLabel">隧道 UUID</span>
            <input type="text" id="tunnelid" class="mono" spellcheck="false" autocomplete="off" data-i18n-placeholder="uuidPlaceholder">
          </label>
          <label class="field" for="configpath">
            <span class="label" data-i18n="configPathLabel">cloudflared 配置文件</span>
            <input type="text" id="configpath" class="mono" spellcheck="false" autocomplete="off" data-i18n-placeholder="configPathPlaceholder">
          </label>
        </div>

        <div class="actions" id="reuse-actions">
          <button type="button" class="primary" id="save" data-i18n="saveButton">保存并连接</button>
          <button type="button" class="secondary" id="reuse" data-i18n="reuseButton">选用已有隧道</button>
          <button type="button" class="secondary" id="login" data-i18n="loginButton">证书登录</button>
        </div>

        <p class="reason" id="setup-reason" role="alert" hidden></p>
      </div>
    </div>

    <div id="login-panel" class="surface-card" hidden>
      <p class="reason" id="login-state" style="margin-top:0"></p>
      <a class="link" id="login-link" href="#" hidden data-i18n="loginLink">打开授权页面</a>
      <p class="loginurl" id="login-url" hidden></p>
      <div class="actions tight">
        <button type="button" class="quiet" id="cancel-login" data-i18n="loginCancel">取消登录</button>
      </div>
    </div>

    <div id="reuse-panel" class="surface-card" hidden>
      <div class="actions tight" style="margin-top:0;justify-content:space-between">
        <span class="label" data-i18n="reuseTitle" style="font-weight:600">账户下的隧道</span>
        <button type="button" class="quiet" id="reuse-close" data-i18n="reuseClose">收起</button>
      </div>
      <input type="text" id="tunnelFilter" style="margin-top:8px" autocomplete="off" spellcheck="false" data-i18n-placeholder="tunnelFilterPh" placeholder="搜索隧道名或 ID…">

function applyPresentation(pres, topTheme) {
  const root = document.documentElement;
  const theme = (pres && pres.theme) || topTheme;
  if (theme === 'dark' || theme === 'light') {
    root.setAttribute('data-theme', theme);
  }
  if (!safeStorage.get('cf.lang') && pres && typeof pres.locale === 'string') {
    lang = pres.locale.toLowerCase().startsWith('zh') ? 'zh' : 'en';
    t = I18N[lang] || I18N.zh;
  }
  if (pres && pres.tokens && typeof pres.tokens === 'object') {
    for (const [k, v] of Object.entries(pres.tokens)) {
      if (typeof k === 'string' && k.startsWith('--color-') && typeof v === 'string' && v.trim()) {
        root.style.setProperty(k, v.trim());
      }
    }
  }
}

async function copySafe(text, btnNode) {
  const prev = btnNode ? btnNode.textContent : '';
  const mark = () => {
    if (!btnNode) return;
    btnNode.textContent = t.copiedBtn;
    setTimeout(() => { btnNode.textContent = prev; }, 1200);
  };
  try {
    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      await navigator.clipboard.writeText(String(text));
      mark();
      return;
    }
    throw new Error('no clipboard');
  } catch {
    const ta = document.createElement('textarea');
    ta.value = String(text);
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    ta.style.opacity = '0';
    document.body.append(ta);
    ta.select();
    try { document.execCommand('copy'); mark(); } catch {}
    ta.remove();
  }
}

function request(payload) {
  const id = ++sequence;
  const targetOrigin = !parentOrigin || parentOrigin === 'null' ? '*' : parentOrigin;
  const response = new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  window.parent.postMessage({ channel: CHANNEL, kind: 'request', id, ...payload }, targetOrigin);
  return response;
}

function call(action, args) {
  if (!bridgeReady || blocked !== '') return Promise.reject(new Error(blocked || t.err.unknown));
  return request({ method: 'plugin.call', action, args: args ?? {} });
}

function installPrerequisite(id) {
  if (!bridgeReady || blocked !== '') return Promise.reject(new Error(blocked || t.err.unknown));
  return request({ method: 'plugin.installPrerequisite', prerequisiteId: id, consent: true });
}

function openExternal(url) {
  if (!bridgeReady || blocked !== '') return;
  request({ method: 'plugin.openExternal', url: String(url) }).catch(() => { $('live').textContent = String(url); });
}

function applyStrings() {
  t = I18N[lang] || I18N.zh;
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.title = t.title;
  $('langBtn').textContent = t.langBtn;
  for (const node of document.querySelectorAll('[data-i18n]')) {
    const val = t[node.getAttribute('data-i18n')];
    if (typeof val === 'string') node.textContent = val;
  }
  for (const node of document.querySelectorAll('[data-i18n-placeholder]')) {
    const val = t[node.getAttribute('data-i18n-placeholder')];
    if (typeof val === 'string') node.placeholder = val;
  }
  const aria = document.querySelector('[data-i18n-aria]');
  if (aria) aria.setAttribute('aria-label', t[aria.getAttribute('data-i18n-aria')]);
}

function switchTab(nextTab) {
  activeTab = nextTab === 'dns' ? 'dns' : 'tunnel';
  safeStorage.set('cf.tab', activeTab);
  $('tabTunnel').setAttribute('aria-pressed', activeTab === 'tunnel' ? 'true' : 'false');
  $('tabDns').setAttribute('aria-pressed', activeTab === 'dns' ? 'true' : 'false');
  $('tunnelView').hidden = activeTab !== 'tunnel';
  $('dnsView').hidden = activeTab !== 'dns';
  if (activeTab === 'dns' && bridgeReady) {
    syncDnsSurface();
  }
}

function btn(kind, label, onClick, disabled) {
  const node = document.createElement('button');
  node.type = 'button';
  node.className = kind;
  node.textContent = label;
  node.disabled = disabled === true;
  node.addEventListener('click', onClick);
  return node;
}

function hasPendingEdit() {
  return clearedSecrets.size > 0 || [
    $('token'), $('tunnelid'), $('configpath'), $('accountid'), $('tokenfile'), $('certpath'),
    $('credfile'), $('binarypath'), $('publicurl'), $('apitoken'),
  ].some((node) => node.value.trim() !== '');
}

function validateTunnelForm() {
  if (mode === 'token') {
    if ($('token').value.trim() || $('tokenfile').value.trim()) return null;
    if (status?.configuration?.tokenConfigured && !clearedSecrets.has('tunnelToken')) return null;
    if (hasPendingEdit()) return null;
    return t.err.tokenRequired;
  }
  const tid = $('tunnelid').value.trim();
  if (tid && !UUID.test(tid)) return t.err.uuidInvalid;
  if (!tid || !$('configpath').value.trim()) return t.err.localRequired;
  return null;
}

function collectTunnelValues() {
  const values = { mode };
  if (mode === 'token') {
    const tok = $('token').value.trim();
    if (tok) values.tunnelToken = tok;
  } else {
    const tid = $('tunnelid').value.trim();
    const cfgp = $('configpath').value.trim();
    if (tid) values.tunnelId = tid;
    if (cfgp) values.configPath = cfgp;
  }
  if (clearedSecrets.has('tunnelToken')) values.tunnelToken = null;
  const cfg = status?.configuration || {};
  const savedValues = {
    accountId: cfg.accountId || '',
    tokenFile: cfg.tokenFile || '',
    certificatePath: cfg.certificatePath && cfg.certificatePath.indexOf('.cloudflared') === -1 ? cfg.certificatePath : '',
    credentialsFile: cfg.credentialsFile || '',
    cloudflaredPath: cfg.cloudflaredPath || '',
    publicUrl: cfg.publicUrl || '',
  };
  for (const [node, key] of [
    [$('accountid'), 'accountId'], [$('tokenfile'), 'tokenFile'], [$('certpath'), 'certificatePath'],
    [$('credfile'), 'credentialsFile'], [$('binarypath'), 'cloudflaredPath'], [$('publicurl'), 'publicUrl'],
  ]) {
    const val = node.value.trim();
    if (val !== String(savedValues[key]).trim()) values[key] = val || null;
  }
  const apiToken = $('apitoken').value.trim();
  if (apiToken) values.apiToken = apiToken;
  else if (clearedSecrets.has('apiToken')) values.apiToken = null;
  if ($('autoStart').checked !== (cfg.autoStart !== false)) {
    values.autoStart = $('autoStart').checked;
  }
  return values;
}

function syncFields() {
  const cfg = status?.configuration || {};
  mode = cfg.mode === 'local' ? 'local' : 'token';
  const radio = $('mode').querySelector(`input[value="${mode}"]`);
  if (radio && !radio.checked) radio.checked = true;
  const fill = (node, val) => { if (node !== document.activeElement) node.value = val; };
  fill($('tunnelid'), cfg.tunnelId || '');
  fill($('configpath'), cfg.configPath || '');
  fill($('accountid'), cfg.accountId || '');
  fill($('tokenfile'), cfg.tokenFile || '');
  fill($('certpath'), cfg.certificatePath && cfg.certificatePath.indexOf('.cloudflared') === -1 ? cfg.certificatePath : '');
  fill($('credfile'), cfg.credentialsFile || '');
  fill($('binarypath'), cfg.cloudflaredPath || '');
  fill($('publicurl'), cfg.publicUrl || '');
  $('autoStart').checked = cfg.autoStart !== false;
}

function renderTunnel(next) {
  if (next) {
    const reported = next.configuration?.mode;
    if (reported === 'local' || reported === 'token') {
      const radio = $('mode').querySelector(`input[value="${reported}"]`);
      if (radio && !radio.checked) { radio.checked = true; mode = reported; }
    }
    status = next;
    if (!fieldsFilled) { syncFields(); fieldsFilled = true; }
  }
  const dep = status?.dependency || { state: 'missing' };
  const cfg = status?.configuration || {};
  const svc = status?.service || { state: 'unconfigured' };
  const login = status?.login || { state: 'idle' };
  const depReady = dep.state === 'ready';
  const configured = Boolean(cfg.tokenConfigured || cfg.tunnelId);
  const running = svc.state === 'running' && svc.ready === true;
  const starting = svc.state === 'starting' || svc.state === 'retrying';
  const working = busy !== '';

  $('setup').hidden = !depReady;
  $('dep-section').hidden = depReady;
  $('advanced').hidden = !depReady;

  let tone = '';
  let headline = '';
  let reason = '';
  if (!depReady) {
    tone = dep.state === 'error' ? 'error' : '';
    headline = dep.state === 'error' ? t.depTooOld : t.depMissing;
    reason = t.depMissingReason;
  } else if (!configured) {
    headline = t.unconfigured;
    reason = t.unconfiguredReason;
  } else if (running) {
    tone = 'running';
    headline = t.running;
    reason = t.runningReason;
  } else if (svc.state === 'error') {
    tone = 'error';
    headline = t.error;
    reason = svc.error || t.err.unknown;
  } else if (starting) {
    tone = 'busy';
    headline = svc.state === 'retrying' ? t.retrying : t.starting;
    reason = svc.state === 'retrying' ? t.retryingReason : t.startingReason;
  } else if (svc.manualStop || svc.state === 'stopped') {
    headline = t.stopped;
    reason = cfg.autoStart !== false ? t.stoppedAutoReason : t.stoppedReason;
  } else {
    headline = t.authOnly;
    reason = t.authOnlyReason;
  }

  $('dot').dataset.tone = tone;
  $('stat').textContent = headline;
  $('reason').textContent = reason;
  $('reason').dataset.tone = tone === 'error' ? 'error' : '';

  const pubUrl = cfg.publicUrl || '';
  $('public-url-bar').hidden = !pubUrl;
  if (pubUrl) $('public-url-val').textContent = pubUrl;

  const lc = $('lifecycle');
  lc.replaceChildren();
  const depAct = $('dep-actions');
  depAct.replaceChildren();

  if (depReady) {
    if (running || starting) {
      lc.append(btn('secondary', t.stopButton, () => runLifecycle('stop'), working));
    } else if (configured) {
      lc.append(btn('primary', svc.state === 'error' ? t.errorStart : t.startButton, () => runLifecycle('start'), working));
    }
    if (cfg.tunnelId) {
      lc.append(btn('secondary', t.dashLink, () => {
        call('setup').then((r) => { if (r?.url) openExternal(r.url); }, () => {});
      }, false));
    }
    lc.hidden = lc.childElementCount === 0;
  } else {
    depAct.append(btn('primary', working ? t.depInstalling : t.depInstall, () => runInstall(), working));
    $('dep-note').textContent = depInstallError || t.depInstallNote;
  }

  $('busy').hidden = !working;
  if (working) $('busy').textContent = busy;

  $('wrap-token').hidden = mode === 'local';
  $('local-fields').hidden = mode !== 'local';
  $('create-actions').hidden = configured;
  $('create-hint').hidden = configured;

  $('token-hint').textContent = clearedSecrets.has('tunnelToken') ? t.clearPending : (cfg.tokenConfigured ? t.tokenSavedHint : t.tokenHint);
  $('token').placeholder = cfg.tokenConfigured ? t.tokenReplace : t.tokenPlaceholder;
  $('apitoken').placeholder = clearedSecrets.has('apiToken') ? t.clearPending : (status?.account?.apiToken ? t.tokenSavedHint : t.apiTokenPlaceholder);
  $('clear-token').hidden = mode === 'local' || cfg.credentialSource !== 'plugin-secret-store';
  $('clear-apitoken').hidden = !status?.account?.apiToken;
  $('clear-token').textContent = clearedSecrets.has('tunnelToken') ? t.undoSecret : t.clearSecret;
  $('clear-apitoken').textContent = clearedSecrets.has('apiToken') ? t.undoSecret : t.clearSecret;

  for (const b of [$('clear-token'), $('clear-apitoken'), $('save'), $('login'), $('reuse'), $('create'), $('autoStart')]) {
    b.disabled = working;
  }

  if (login.state === 'idle' || login.state === 'complete') lastLoginUrl = '';
  const signInVisible = login.state === 'pending' || login.state === 'error' || lastLoginUrl !== '';
  $('login-panel').hidden = !signInVisible || loginDismissed;
  if (login.state === 'pending') {
    $('login-state').textContent = login.url ? t.loginPending : t.loginWaiting;
    $('login-link').hidden = !login.url;
    $('cancel-login').hidden = false;
    $('login-url').hidden = !login.url;
    if (login.url) {
      $('login-link').href = login.url;
      $('login-url').textContent = login.url;
      if (login.url !== lastLoginUrl) { lastLoginUrl = login.url; openExternal(login.url); }
    }
  } else if (login.state === 'error') {
    $('login-state').textContent = login.error || t.err.unknown;
    $('login-link').hidden = true;
    $('login-url').hidden = true;
    $('cancel-login').hidden = true;
  }

  $('saved-note').hidden = !savedNote;
  if (savedNote) $('saved-note').textContent = savedNote;

  $('cert-fact').textContent = status?.account?.certificate
    ? t.certPresent.replace('{path}', cfg.certificatePath || '')
    : t.certAbsent;

  if (activeTab === 'dns') syncDnsSurface();
  schedulePoll();
}

function schedulePoll() {
  clearTimeout(pollTimer);
  const svc = status?.service;
  const login = status?.login;
  const watch = busy !== '' || login?.state === 'pending' || svc?.state === 'starting' || svc?.state === 'retrying';
  if (watch) pollTimer = setTimeout(() => { void refreshStatus(); }, 2000);
}

async function refreshStatus() {
  try {
    renderTunnel(await call('status'));
  } catch (err) {
    blocked = err?.message || t.err.unknown;
    $('dot').dataset.tone = 'error';
    $('stat').textContent = t.unavailable;
    $('root-reason').hidden = false;
    $('root-reason').textContent = blocked;
  }
}

async function runLifecycle(action) {
  busy = action === 'stop' ? t.stopped_note : t.started_note;
  renderTunnel();
  try {
    renderTunnel(await call(action));
    savedNote = action === 'stop' ? t.stopped_note : t.started_note;
  } catch (err) {
    $('setup-reason').hidden = false;
    $('setup-reason').dataset.tone = 'error';
    $('setup-reason').textContent = err?.message || t.err.unknown;
  } finally {
    busy = '';
    renderTunnel();
  }
}

async function runInstall() {
  busy = t.depInstalling;
  renderTunnel();
  try {
    await installPrerequisite(PREREQUISITE);
  } catch (err) {
    busy = '';
    depInstallError = err?.message || t.err.unknown;
    renderTunnel();
    return;
  }
  for (let i = 0; i < 20; i += 1) {
    await new Promise((r) => setTimeout(r, 1500));
    try {
      const next = await call('status');
      if (next?.dependency?.state === 'ready') {
        busy = '';
        depInstallError = '';
        savedNote = t.depInstalled;
        renderTunnel(next);
        return;
      }
    } catch {}
  }
  busy = '';
  renderTunnel();
}

function renderTunnelList() {
  const q = $('tunnelFilter').value.trim().toLowerCase();
  const ul = $('tunnels');
  ul.replaceChildren();
  const filtered = cachedTunnels.filter((it) =>
    !q || String(it.name || '').toLowerCase().includes(q) || String(it.id || '').toLowerCase().includes(q));
  $('reuse-state').textContent = filtered.length === 0 ? t.reuseEmpty : '';
  for (const item of filtered) {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    const name = document.createElement('span');
    name.className = 'tname';
    name.textContent = item.name || item.id;
    const id = document.createElement('span');
    id.className = 'tid mono';
    id.textContent = String(item.id || '').slice(0, 8);
    b.append(name, id);
    b.onclick = async () => {
      b.disabled = true;
      busy = t.saving;
      renderTunnel();
      try {
        const next = await call('selectTunnel', { id: item.id });
        $('reuse-panel').hidden = true;
        $('setup-reason').hidden = true;
        savedNote = t.saved;
        renderTunnel(next);
      } catch (err) {
        $('setup-reason').hidden = false;
        $('setup-reason').dataset.tone = 'error';
        $('setup-reason').textContent = err?.message || t.err.unknown;
      } finally {
        busy = '';
        renderTunnel();
      }
    };
    li.append(b);
    ul.append(li);
  }
}

/* --- DNS & WORKER ROUTES CONTROLLER --- */

function setDnsError(msg) {
  const el = $('dnsError');
  el.hidden = !msg;
  el.textContent = msg || '';
}

function showDnsToast(msg) {
  const el = $('dnsToast');
  el.textContent = msg;
  el.hidden = false;
  setTimeout(() => { el.hidden = true; }, 2200);
}

function syncDnsSurface() {
  const hasApiToken = Boolean(status?.account?.apiToken);
  $('dnsTokenSetup').hidden = hasApiToken;
  $('dnsWorkspace').hidden = !hasApiToken;
  if (hasApiToken && zones.length === 0 && !dnsBusy) {
    void loadZonesAndRecords();
  }
}

async function loadZonesAndRecords() {
  if (dnsBusy) return;
  dnsBusy = true;
  $('refreshZoneBtn').disabled = true;
  $('refreshZoneBtn').dataset.busy = 'true';
  setDnsError('');
  try {
    const res = await call('zones');
    zones = Array.isArray(res?.items) ? res.items : [];
    const sel = $('zoneSelect');
    sel.replaceChildren();
    if (zones.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = t.zonesEmpty;
      sel.append(opt);
      $('zonePlanBadge').hidden = true;
      dnsRecords = [];
      workerRoutes = [];
      reconcileDnsRows();
      renderWorkerRoutes();
      return;
    }
    if (!activeZoneId || !zones.some((z) => z.id === activeZoneId)) {
      activeZoneId = zones[0].id;
      safeStorage.set('cf.zoneId', activeZoneId);
    }
    for (const z of zones) {
      const opt = document.createElement('option');
      opt.value = z.id;
      opt.textContent = z.name;
      sel.append(opt);
    }
    sel.value = activeZoneId;
    await loadZoneData(activeZoneId);
  } catch (err) {
    setDnsError(err?.message || t.err.unknown);
  } finally {
    dnsBusy = false;
    $('refreshZoneBtn').disabled = false;
    $('refreshZoneBtn').dataset.busy = 'false';
  }
}

async function loadZoneData(zoneId) {
  const zoneMeta = zones.find((z) => z.id === zoneId);
  const badge = $('zonePlanBadge');
  if (zoneMeta) {
    badge.hidden = false;
    badge.textContent = [zoneMeta.status, zoneMeta.plan].filter(Boolean).join(' · ');
  } else {
    badge.hidden = true;
  }
  const prevScroll = window.scrollY;
  const overview = await call('zoneOverview', { zoneId });
  dnsRecords = Array.isArray(overview?.records) ? overview.records : [];
  workerRoutes = Array.isArray(overview?.workerRoutes?.items) ? overview.workerRoutes.items : [];
  reconcileDnsRows();
  renderWorkerRoutes();
  if (Math.abs(window.scrollY - prevScroll) > 2) window.scrollTo(0, prevScroll);
}

function visibleDnsRecords() {
  const q = dnsSearchQuery.toLowerCase();
  return dnsRecords.filter((rec) => {
    if (dnsTypeFilter !== 'ALL' && rec.type !== dnsTypeFilter) return false;
    if (!q) return true;
    return rec.name.toLowerCase().includes(q) || rec.content.toLowerCase().includes(q) || rec.type.toLowerCase().includes(q);
  });
}

function syncEditorTypeControls() {
  const type = $('recType').value;
  const canProxy = PROXIABLE.has(type);
  $('recProxiedWrap').hidden = !canProxy;
  $('recPriorityWrap').hidden = type !== 'MX';
}

function openRecordEditor(rec = null) {
  editingRecordId = rec ? rec.id : '';
  $('recType').value = rec ? rec.type : (dnsTypeFilter !== 'ALL' ? dnsTypeFilter : 'A');
  $('recName').value = rec ? rec.name : '';
  $('recContent').value = rec ? rec.content : '';
  $('recTtl').value = rec && [1, 60, 300, 3600, 86400].includes(rec.ttl) ? String(rec.ttl) : '1';
  $('recProxied').checked = rec ? Boolean(rec.proxied) : true;
  $('recPriority').value = rec?.priority !== undefined ? String(rec.priority) : '10';
  syncEditorTypeControls();
  $('dnsEditor').hidden = false;
  $('recName').focus();
}

function updateDnsRowDom(entry, rec) {
  entry.rec = rec;
  entry.typeEl.textContent = rec.type;
  entry.nameEl.textContent = rec.name;
  entry.contentEl.textContent = rec.priority !== undefined ? `[${rec.priority}] ${rec.content}` : rec.content;

  if (rec.proxiable && PROXIABLE.has(rec.type)) {
    entry.proxyBtn.hidden = false;
    entry.proxyBtn.setAttribute('aria-checked', rec.proxied ? 'true' : 'false');
    entry.proxyBtn.textContent = rec.proxied ? t.proxyOn : t.proxyOff;
  } else {
    entry.proxyBtn.hidden = true;
  }

  entry.copyBtn.textContent = t.copyBtn;
  entry.editBtn.textContent = t.editBtn;
  const confirming = deletingRecordId === rec.id;
  entry.delBtn.textContent = confirming ? t.confirmDelBtn : t.delBtn;
  entry.cancelDelBtn.hidden = !confirming;
}

function createDnsRowDom(rec) {
  const row = document.createElement('div');
  row.className = 'dns-row';
  row.dataset.recId = rec.id;

  const typeEl = document.createElement('span');
  typeEl.className = 'rec-type';

  const nameEl = document.createElement('span');
  nameEl.className = 'rec-name';

  const contentEl = document.createElement('span');
  contentEl.className = 'rec-content';

  const actions = document.createElement('div');
  actions.className = 'rec-actions';

  const proxyBtn = document.createElement('button');
  proxyBtn.type = 'button';
  proxyBtn.className = 'proxy-toggle';
  proxyBtn.setAttribute('role', 'switch');

  const copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.className = 'secondary sm';

  const editBtn = document.createElement('button');
  editBtn.type = 'button';
  editBtn.className = 'secondary sm';

  const delBtn = document.createElement('button');
  delBtn.type = 'button';
  delBtn.className = 'secondary sm danger-btn';

  const cancelDelBtn = document.createElement('button');
  cancelDelBtn.type = 'button';
  cancelDelBtn.className = 'quiet sm';
  cancelDelBtn.textContent = t.cancelBtn;
  cancelDelBtn.hidden = true;

  const entry = { row, typeEl, nameEl, contentEl, proxyBtn, copyBtn, editBtn, delBtn, cancelDelBtn, rec };

  proxyBtn.onclick = async () => {
    const cur = entry.rec;
    proxyBtn.disabled = true;
    setDnsError('');
    try {
      const res = await call('saveDnsRecord', {
        zoneId: activeZoneId,
        record: {
          id: cur.id,
          type: cur.type,
          name: cur.name,
          content: cur.content,
          ttl: cur.ttl,
          proxied: !cur.proxied,
        },
      });
      const idx = dnsRecords.findIndex((r) => r.id === cur.id);
      if (idx !== -1 && res?.record) dnsRecords[idx] = res.record;
      reconcileDnsRows();
    } catch (err) {
      setDnsError(err?.message || t.err.unknown);
    } finally {
      proxyBtn.disabled = false;
    }
  };

  copyBtn.onclick = () => { void copySafe(entry.rec.content, copyBtn); };
  editBtn.onclick = () => { openRecordEditor(entry.rec); };

  delBtn.onclick = async () => {
    const cur = entry.rec;
    if (deletingRecordId !== cur.id) {
      deletingRecordId = cur.id;
      reconcileDnsRows();
      return;
    }
    delBtn.disabled = true;
    setDnsError('');
    try {
      await call('deleteDnsRecord', { zoneId: activeZoneId, recordId: cur.id });
      deletingRecordId = '';
      dnsRecords = dnsRecords.filter((r) => r.id !== cur.id);
      reconcileDnsRows();
      showDnsToast(t.recordDeleted);
    } catch (err) {
      setDnsError(err?.message || t.err.unknown);
    } finally {
      delBtn.disabled = false;
    }
  };

  cancelDelBtn.onclick = () => {
    deletingRecordId = '';
    reconcileDnsRows();
  };

  actions.append(proxyBtn, copyBtn, editBtn, delBtn, cancelDelBtn);
  row.append(typeEl, nameEl, contentEl, actions);
  updateDnsRowDom(entry, rec);
  return entry;
}

function reconcileDnsRows() {
  const host = $('dnsList');
  const visible = visibleDnsRecords();
  if (visible.length === 0) {
    dnsRowMap.clear();
    host.replaceChildren();
    const empty = document.createElement('div');
    empty.className = 'empty-box';
    empty.textContent = zones.length === 0 ? t.zonesEmpty : t.dnsEmpty;
    host.append(empty);
    return;
  }

  for (const child of [...host.children]) {
    if (!child.dataset || !child.dataset.recId) child.remove();
  }

  const nextIds = new Set(visible.map((r) => r.id));
  for (const [id, entry] of dnsRowMap.entries()) {
    if (!nextIds.has(id)) {
      entry.row.remove();
      dnsRowMap.delete(id);
    }
  }

  let cursor = host.firstElementChild;
  for (const rec of visible) {
    let entry = dnsRowMap.get(rec.id);
    if (!entry) {
      entry = createDnsRowDom(rec);
      dnsRowMap.set(rec.id, entry);
    } else {
      updateDnsRowDom(entry, rec);
    }
    if (entry.row !== cursor) host.insertBefore(entry.row, cursor);
    else cursor = cursor.nextElementSibling;
  }
}

function renderWorkerRoutes() {
  const sec = $('routesSection');
  const host = $('routesList');
  host.replaceChildren();
  if (!workerRoutes.length) {
    sec.hidden = true;
    return;
  }
  sec.hidden = false;
  for (const r of workerRoutes) {
    const row = document.createElement('div');
    row.className = 'route-row';
    const urlStr = /^https?:\/\//i.test(r.pattern) ? r.pattern : `https://${r.pattern.replace(/^\*\./, '')}`;
    const info = document.createElement('span');
    info.className = 'mono';
    info.textContent = r.script ? `${r.pattern} → ${r.script}` : r.pattern;

    const acts = document.createElement('span');
    acts.className = 'rec-actions';
    const cp = document.createElement('button');
    cp.type = 'button';
    cp.className = 'secondary sm';
    cp.textContent = t.copyRouteBtn;
    cp.onclick = () => { void copySafe(urlStr, cp); };

    const op = document.createElement('button');
    op.type = 'button';
    op.className = 'secondary sm';
    op.textContent = t.openBtn;
    op.onclick = () => openExternal(urlStr.replace(/\*$/, ''));

    acts.append(cp, op);
    row.append(info, acts);
    host.append(row);
  }
}

/* --- EVENT WIRING --- */

$('tabTunnel').onclick = () => switchTab('tunnel');
$('tabDns').onclick = () => switchTab('dns');
$('langBtn').onclick = () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  safeStorage.set('cf.lang', lang);
  applyStrings();
  renderTunnel();
  if (zones.length) reconcileDnsRows();
  renderWorkerRoutes();
};

$('copyPublicUrlBtn').onclick = () => {
  const val = $('public-url-val').textContent;
  if (val) void copySafe(val, $('copyPublicUrlBtn'));
};
$('openPublicUrlBtn').onclick = () => {
  const val = $('public-url-val').textContent;
  if (val) openExternal(val);
};

$('mode').addEventListener('change', (ev) => {
  if (ev.target.name !== 'mode') return;
  mode = ev.target.value;
  $('setup-reason').hidden = true;
  renderTunnel();
});

for (const [inp, key] of [[$('token'), 'tunnelToken'], [$('apitoken'), 'apiToken']]) {
  inp.addEventListener('input', () => { clearedSecrets.delete(key); $('setup-reason').hidden = true; renderTunnel(); });
}

for (const [b, key] of [[$('clear-token'), 'tunnelToken'], [$('clear-apitoken'), 'apiToken']]) {
  b.addEventListener('click', () => {
    if (clearedSecrets.has(key)) clearedSecrets.delete(key);
    else {
      clearedSecrets.add(key);
      (key === 'tunnelToken' ? $('token') : $('apitoken')).value = '';
    }
    $('setup-reason').hidden = true;
    renderTunnel();
  });
}

$('save').onclick = async () => {
  const issue = validateTunnelForm();
  if (issue) {
    $('setup-reason').hidden = false;
    $('setup-reason').dataset.tone = 'error';
    $('setup-reason').textContent = issue;
    return;
  }
  $('setup-reason').hidden = true;
  busy = t.saving;
  renderTunnel();
  try {
    const next = await call('configure', { values: collectTunnelValues() });
    $('token').value = '';
    $('apitoken').value = '';
    clearedSecrets.clear();
    syncFields();
    savedNote = ['running', 'starting', 'retrying'].includes(next?.service?.state) ? t.saved : t.savedOnly;
    renderTunnel(next);
  } catch (err) {
    $('setup-reason').hidden = false;
    $('setup-reason').dataset.tone = 'error';
    $('setup-reason').textContent = err?.message || t.err.unknown;
  } finally {
    busy = '';
    renderTunnel();
  }
};

for (const node of [$('token'), $('tunnelid'), $('configpath'), $('accountid'), $('tokenfile'), $('certpath'), $('credfile'), $('binarypath'), $('publicurl'), $('apitoken')]) {
  node.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter' || ev.shiftKey) return;
    ev.preventDefault();
    $('save').click();
  });
}

$('create').onclick = async () => {
  try {
    const res = await call('setup');
    if (res?.url) openExternal(res.url);
    if (res?.docsUrl) $('docs').href = res.docsUrl;
  } catch (err) {
    $('setup-reason').hidden = false;
    $('setup-reason').textContent = err?.message || t.err.unknown;
  }
};

$('docs').onclick = (ev) => { ev.preventDefault(); openExternal($('docs').href); };

$('login').onclick = async () => {
  loginDismissed = false;
  lastLoginUrl = '';
  busy = t.loginWaiting;
  renderTunnel();
  try { renderTunnel(await call('login')); }
  catch (err) {
    $('setup-reason').hidden = false;
    $('setup-reason').dataset.tone = 'error';
    $('setup-reason').textContent = err?.message || t.err.unknown;
  } finally { busy = ''; renderTunnel(); }
};

$('cancel-login').onclick = async () => {
  loginDismissed = true;
  lastLoginUrl = '';
  await runLifecycle('cancelLogin');
};

$('login-link').onclick = (ev) => { ev.preventDefault(); openExternal($('login-link').href); };

$('reuse').onclick = async () => {
  $('reuse-panel').hidden = false;
  $('tunnels').replaceChildren();
  $('reuse-state').textContent = t.reuseLoading;
  try {
    const pendingVals = {};
    if ($('apitoken').value.trim()) pendingVals.apiToken = $('apitoken').value.trim();
    if ($('accountid').value.trim()) pendingVals.accountId = $('accountid').value.trim();
    if (Object.keys(pendingVals).length > 0) {
      const saved = await call('configure', { values: { mode, ...pendingVals } });
      $('apitoken').value = '';
      syncFields();
      renderTunnel(saved);
    }
    const res = await call('tunnels');
    cachedTunnels = Array.isArray(res?.items) ? res.items : [];
    renderTunnelList();
  } catch (err) {
    $('reuse-state').textContent = err?.message || t.err.unknown;
  }
};

$('tunnelFilter').oninput = () => renderTunnelList();
$('reuse-close').onclick = () => { $('reuse-panel').hidden = true; };

$('autoStart').onchange = async () => {
  $('setup-reason').hidden = true;
  const wanted = $('autoStart').checked;
  try { renderTunnel(await call('configure', { values: { autoStart: wanted } })); }
  catch (err) {
    $('autoStart').checked = !wanted;
    $('setup-reason').hidden = false;
    $('setup-reason').textContent = err?.message || t.err.unknown;
  }
};

// DNS events
$('saveQuickApiTokenBtn').onclick = async () => {
  const val = $('quickApiToken').value.trim();
  if (!val) return;
  $('saveQuickApiTokenBtn').disabled = true;
  setDnsError('');
  try {
    const next = await call('configure', { values: { apiToken: val } });
    $('quickApiToken').value = '';
    renderTunnel(next);
    await loadZonesAndRecords();
  } catch (err) {
    setDnsError(err?.message || t.err.unknown);
  } finally {
    $('saveQuickApiTokenBtn').disabled = false;
  }
};

$('zoneSelect').onchange = async () => {
  activeZoneId = $('zoneSelect').value;
  safeStorage.set('cf.zoneId', activeZoneId);
  $('dnsEditor').hidden = true;
  if (!activeZoneId) return;
  setDnsError('');
  try {
    await loadZoneData(activeZoneId);
  } catch (err) {
    setDnsError(err?.message || t.err.unknown);
  }
};

$('refreshZoneBtn').onclick = () => {
  if (zones.length && activeZoneId) {
    $('refreshZoneBtn').disabled = true;
    $('refreshZoneBtn').dataset.busy = 'true';
    setDnsError('');
    loadZoneData(activeZoneId)
      .catch((err) => setDnsError(err?.message || t.err.unknown))
      .finally(() => {
        $('refreshZoneBtn').disabled = false;
        $('refreshZoneBtn').dataset.busy = 'false';
      });
  } else {
    void loadZonesAndRecords();
  }
};

$('addRecordBtn').onclick = () => openRecordEditor(null);
$('cancelRecordBtn').onclick = () => { editingRecordId = ''; $('dnsEditor').hidden = true; };
$('recType').onchange = () => syncEditorTypeControls();

$('saveRecordBtn').onclick = async () => {
  if (!activeZoneId) return;
  const type = $('recType').value;
  const record = {
    ...(editingRecordId ? { id: editingRecordId } : {}),
    type,
    name: $('recName').value.trim(),
    content: $('recContent').value.trim(),
    ttl: Number($('recTtl').value) || 1,
    ...(PROXIABLE.has(type) ? { proxied: $('recProxied').checked } : {}),
    ...(type === 'MX' ? { priority: Number($('recPriority').value) || 10 } : {}),
  };
  $('saveRecordBtn').disabled = true;
  setDnsError('');
  try {
    const res = await call('saveDnsRecord', { zoneId: activeZoneId, record });
    if (res?.record) {
      const idx = dnsRecords.findIndex((r) => r.id === res.record.id);
      if (idx >= 0) dnsRecords[idx] = res.record;
      else dnsRecords.unshift(res.record);
    }
    editingRecordId = '';
    $('dnsEditor').hidden = true;
    reconcileDnsRows();
    showDnsToast(t.recordSaved);
  } catch (err) {
    setDnsError(err?.message || t.err.unknown);
  } finally {
    $('saveRecordBtn').disabled = false;
  }
};

for (const pill of document.querySelectorAll('#typePills .type-pill')) {
  pill.onclick = () => {
    dnsTypeFilter = pill.dataset.type || 'ALL';
    for (const p of document.querySelectorAll('#typePills .type-pill')) {
      p.setAttribute('aria-pressed', p === pill ? 'true' : 'false');
    }
    reconcileDnsRows();
  };
}

$('dnsSearch').oninput = () => {
  dnsSearchQuery = $('dnsSearch').value.trim();
  reconcileDnsRows();
};

window.addEventListener('message', (event) => {
  if (event.source !== window.parent || !event.data || event.data.channel !== CHANNEL) return;
  if (parentOrigin && event.origin !== parentOrigin) return;
  if (event.data.kind === 'presentation') {
    applyPresentation(event.data.presentation, event.data.theme);
    applyStrings();
    renderTunnel();
    return;
  }
  if (event.data.kind === 'init') {
    parentOrigin = event.origin;
    bridgeReady = true;
    applyPresentation(event.data.presentation, event.data.theme);
    applyStrings();
    switchTab(activeTab);
    void refreshStatus();
    return;
  }
  if (event.data.kind === 'response') {
    const slot = pending.get(event.data.id);
    if (!slot) return;
    pending.delete(event.data.id);
    if (event.data.ok) slot.resolve(event.data.result);
    else slot.reject(new Error(event.data.error || t.err.unknown));
  }
});

applyStrings();
switchTab(activeTab);
$('stat').textContent = t.readingState;
})();
</script>
</body>
</html>
