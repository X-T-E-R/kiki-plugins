<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Computer Preview</title>

    position: fixed;
    left: -9999px;
    top: -9999px;
    width: 1px;
    height: 1px;
    opacity: 0;
    padding: 0;
    border: 0;
    pointer-events: none;
  }

    position: absolute;
    top: 10px;
    left: 50%;

    height: 28px;
    padding: 0 11px;

    border: 1px solid var(--accent);

    color: var(--ink);

    font-size: 11.5px;
    font-weight: 500;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

  .kiki-remote-clip-pill:hover {
    background: var(--accent-soft);
  }

  .kiki-remote-clip-pill-label {
    color: var(--accent);
    font-weight: 600;
  }

  .kiki-remote-clip-pill-preview {
    color: var(--ink-soft);

  }

  .kiki-remote-drop-title {

  }

  .kiki-remote-drop-sub {

    overflow: hidden;
    pointer-events: none;
  }

  .kiki-remote-magnifier-canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .kiki-remote-magnifier-meta {
    position: absolute;
    left: 6px;
    bottom: 5px;
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(20, 20, 19, 0.82);
    color: #fcfbf8;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: -0.01em;
  }

  .kiki-pinch-dot {
    position: absolute;
    width: 18px;
    height: 18px;

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  button, select { font: inherit; color: inherit; }
  .shell {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 42px;
    padding: 0 12px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .picker-group {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
    flex: 1;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: var(--ink-faint);
    flex-shrink: 0;
    transition: background 140ms ease;
  }
  .status-dot.online { background: var(--ok); }
  .status-dot.takeover { background: var(--amber); }
  .status-dot.offline { background: var(--danger); }
  .target-select-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    min-width: 0;
  }
  .target-select {
    appearance: none;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 7px;
    height: 27px;
    padding: 0 25px 0 9px;
    font-size: 12px;
    font-weight: 500;
    max-width: 280px;
    min-width: 128px;
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
    cursor: pointer;
    outline: none;
  }
  .target-select:focus-visible { border-color: var(--accent); }
  .chevron {
    pointer-events: none;
    margin-left: -20px;
    margin-right: 6px;
    color: var(--ink-faint);
    display: flex;
  }
  .res-pill {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 7px;
    border-radius: 5px;
    background: var(--panel);
    color: var(--ink-soft);
    border: 1px solid var(--line);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 27px;
    padding: 0 9px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .pill-btn:hover { background: var(--panel); color: var(--ink); }
  .pill-btn:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 1px; }
  .pill-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .pill-btn.takeover-locked {
    background: var(--amber-soft);
    border-color: var(--amber);
    color: var(--amber);
  }
  .icon-btn {
    width: 27px;
    padding: 0;
    justify-content: center;
  }
  .stage {
    position: relative;
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .monitor-frame {
    position: relative;
    background: var(--bezel);
    border: 1.5px solid var(--bezel-edge);
    border-radius: 10px;
    padding: 4px;
    box-shadow: var(--shadow);
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }
  .monitor-frame.takeover-ring {
    border-color: var(--amber);
    box-shadow: 0 0 0 2px var(--amber), 0 0 0 5px var(--amber-soft), var(--shadow);
  }
  .screen-surface {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 6px;
    overflow: hidden;
    background: #0d0d0f;
    cursor: default;
    outline: none;
    touch-action: none;
  }
  .screen-surface.interactive {
    cursor: crosshair;
  }
  .screen-surface canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
  }
  .overlay-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .click-pulse {
    position: absolute;
    width: 22px;
    height: 22px;
    margin-left: -11px;
    margin-top: -11px;
    border-radius: 999px;
    border: 1.8px solid rgba(255, 255, 255, 0.92);
    background: rgba(88, 168, 143, 0.32);
    pointer-events: none;
    animation: pulseOut 380ms ease-out forwards;
  }
  .click-pulse.human {
    border-color: rgba(255, 248, 238, 0.95);
    background: rgba(229, 147, 74, 0.36);
  }
  @keyframes pulseOut {
    0% { transform: scale(0.38); opacity: 1; }
    100% { transform: scale(1.55); opacity: 0; }
  }
  .coord-badge {
    position: absolute;
    left: 8px;
    bottom: 8px;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(18, 18, 16, 0.78);
    color: #fcfbf8;
    font-family: var(--mono);
    font-size: 10.5px;
    line-height: 1.35;
    pointer-events: none;
    backdrop-filter: blur(4px);
  }
  .statusbar {
    height: 25px;
    padding: 0 12px;
    border-top: 1px solid var(--line);
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--ink-faint);
    flex-shrink: 0;
    gap: 10px;
  }
  .status-msg {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .status-msg.amber { color: var(--amber); font-weight: 500; }
  .status-msg.err { color: var(--danger); }
  .coord-readout {
    font-family: var(--mono);
    white-space: nowrap;
    background: transparent;
    border: none;
    padding: 0;
    color: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .coord-readout:hover { color: var(--ink); }
  @media (max-width: 580px) {
    .topbar { gap: 5px; padding: 0 8px; }
    .res-pill { display: none; }
    .target-select-wrap { flex: 1 1 0; width: 100%; max-width: 100%; }
    .target-select { flex: 1 1 0; min-width: 0; width: 100%; max-width: 100%; padding: 0 22px 0 7px; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="picker-group">
      <span id="statusDot" class="status-dot"></span>
      <div class="target-select-wrap">
        <select id="targetSelect" class="target-select" aria-label="Target surface">
          <option value="local:primary">Primary Display</option>
        </select>
        <span class="chevron" aria-hidden="true">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M4.5 6.5L8 10l3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </div>
      <span id="resPill" class="res-pill">--</span>
    </div>

    <button id="takeoverBtn" type="button" class="pill-btn" aria-pressed="false" title="Lock Human Takeover for direct click, drag, wheel, keyboard & paste control (Alt+T)">
      <svg id="lockIcon" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.2" y="7.2" width="9.6" height="6.6" rx="1.6"/>
        <path id="lockShackle" d="M5.4 7.2V5.1a2.6 2.6 0 0 1 5.0-0.9"/>
      </svg>
      <span id="takeoverLabel">Takeover Control</span>
    </button>

    <button id="gridBtn" type="button" class="pill-btn" title="Toggle 0..1000 coordinate grid">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="1.5"/><path d="M6 2v12M10 2v12M2 6h12M2 10h12"/></svg>
      <span>Grid</span>
    </button>

    <button id="magnifierBtn" type="button" class="pill-btn icon-btn" aria-pressed="false" title="3x pixel magnifier (toggle or hold Alt)" aria-label="3x pixel magnifier">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/></svg>
    </button>

    <button id="liveBtn" type="button" class="pill-btn active" title="Toggle live stream">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3.2" fill="currentColor"/></svg>
      <span>Live</span>
    </button>

    <button id="refreshBtn" type="button" class="pill-btn icon-btn" title="Capture fresh frame" aria-label="Refresh frame">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3.6H9.9"/></svg>
    </button>
  </header>

  <main id="stage" class="stage">
    <div id="monitorFrame" class="monitor-frame" style="width:640px;height:360px">
      <div id="screenSurface" class="screen-surface" tabindex="0" aria-label="Target desktop canvas">
        <canvas id="screenCanvas" width="1280" height="720"></canvas>
        <svg id="gridSvg" class="overlay-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none" hidden></svg>
        <svg id="actionSvg" class="overlay-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
          <defs>
            <marker id="dragHead" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M1 1L9 5L1 9z" fill="#e5934a"/>
            </marker>
          </defs>
          <line id="dragVector" x1="0" y1="0" x2="0" y2="0" stroke="#e5934a" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#dragHead)" hidden/>
          <g id="reticleGroup" hidden>
            <line id="retH" x1="0" y1="0" x2="0" y2="0" stroke="#58a88f" stroke-width="1.6"/>
            <line id="retV" x1="0" y1="0" x2="0" y2="0" stroke="#58a88f" stroke-width="1.6"/>
            <circle id="retDot" cx="0" cy="0" r="6.5" fill="none" stroke="#58a88f" stroke-width="2"/>
          </g>
        </svg>
      </div>
    </div>
  </main>

  <footer class="statusbar">
    <span id="statusMsg" class="status-msg">Ready</span>
    <button id="coordReadout" type="button" class="coord-readout" title="Click to copy target coordinates">--</button>
  </footer>
</div>

<script>
(() => {
  /* @kiki-panel-kit:runtime:start */
  // GENERATED from shared/panel-kit/{storage,theme,rpc}.mjs — run `npm run sync:panels`; do not edit this block.
  const KikiPanelKit = (() => {
    /**
     * Opaque ('null'-origin) sandbox-safe storage, clipboard copy, and ID helpers
     * for Kiki plugin panels running inside <iframe sandbox="allow-scripts">.
     */

    function createSafeStorage(targetWindow) {
      const mem = new Map();
      const resolveStorage = () => {
        const win = targetWindow !== undefined ? targetWindow : (typeof window !== 'undefined' ? window : null);

        try {
          return win.localStorage || null;
        } catch {
          return null;
        }

        get(key) {
          const k = String(key);

            const s = resolveStorage();

            }
          } catch {}
          return mem.has(k) ? mem.get(k) : null;

        set(key, value) {
          const k = String(key);
          const str = String(value);
          mem.set(k, str);
          try {
            const s = resolveStorage();
            if (s) s.setItem(k, str);
          } catch {}

        remove(key) {
          const k = String(key);
          mem.delete(k);
          try {
            const s = resolveStorage();
            if (s) s.removeItem(k);
          } catch {}
        },
      };
    }

    const safeStorage = createSafeStorage();

    async function copyTextSafe(text, options = {}) {
      const str = String(text ?? '');
      const feedbackEl = options.labelEl || options.button || null;
      const copiedLabel = typeof options.copiedLabel === 'string' ? options.copiedLabel : '';
      const resetMs = Number.isFinite(options.resetMs) ? options.resetMs : 1200;
      const markCopied = () => {
        if (!feedbackEl || !copiedLabel) return;
        const prev = feedbackEl.textContent;
        feedbackEl.textContent = copiedLabel;
        if (typeof setTimeout === 'function') {
          setTimeout(() => {
            feedbackEl.textContent = prev;
          }, resetMs);
        }
      };

      try {

        } else if (moveRafId) {
          caf(moveRafId);
          moveRafId = 0;
          pendingMovePayload = null;
        }

        const pt = ev ? mapEvent(ev) : stateSnapshot.lastPt;
        if (stateSnapshot.moved) {
          lastClick = { time: 0, x: -999, y: -999, button: -1, count: 0 };
        }
        if (stateSnapshot.isPinch) {
          const pair = computeVirtualPinchPair(pt.normX, pt.normY, stateSnapshot.pinchAnchor.normX, stateSnapshot.pinchAnchor.normY);
          options.onPinch?.({ phase: cancelled ? 'cancel' : 'up', ...pair, point: pt });
          return;
        }

        const remainingMask = (!cancelled && ev && typeof ev.buttons === 'number')
          ? buttonMaskFromEvent(ev, -1)
          : 0;

        options.onPointerUp?.(pt, {
          cancelled: Boolean(cancelled),
          moved: stateSnapshot.moved,
          button: stateSnapshot.buttonName,
          buttonsMask: remainingMask,
          clickCount: stateSnapshot.clickCount,
          startPt: stateSnapshot.startPt,
          elapsedMs: Math.max(0, nowFn() - stateSnapshot.startedAt),
          ctrlKey: Boolean(ev?.ctrlKey),
          shiftKey: Boolean(ev?.shiftKey),
          altKey: Boolean(ev?.altKey),
          metaKey: Boolean(ev?.metaKey),
          originalEvent: ev,
        });
      };

      const onPointerUp = (ev) => finishPointer(ev, false);
      const onPointerCancel = (ev) => finishPointer(ev, true);
      const onPointerLeave = (ev) => {
        options.onMagnifierMove?.(null, ev);
        if (!activePointer) {
          options.onCursorLocal?.(null, { active: false, isPinch: false });
        }
      };

      const onWheel = (ev) => {
        if (disposed || isDisabled()) return;
        if (!isInteractive()) {
          ev.preventDefault?.();
          options.onReadOnlyAttempt?.(ev);
          return;
        }
        const pt = mapEvent(ev);
        if (!pt.inside) return;
        ev.preventDefault?.();
        wheelAccX += Number(ev.deltaX) || 0;
        wheelAccY += Number(ev.deltaY) || 0;
        wheelAnchor = pt;
        if (!wheelRafId) {
          wheelRafId = raf(flushWheelNow);
        }
      };

      const releaseActive = () => {
        if (activePointer) {
          finishPointer(null, true);
        }
        options.onReleaseAll?.();
      };

      const onVisibility = () => {
        if (doc && doc.hidden) releaseActive();
      };

      surfaceEl.addEventListener('contextmenu', onContextMenu);
      surfaceEl.addEventListener('pointerdown', onPointerDown);
      surfaceEl.addEventListener('pointermove', onPointerMove);
      surfaceEl.addEventListener('pointerup', onPointerUp);
      surfaceEl.addEventListener('pointercancel', onPointerCancel);
      surfaceEl.addEventListener('pointerleave', onPointerLeave);
      surfaceEl.addEventListener('wheel', onWheel, { passive: false });
      win?.addEventListener?.('blur', releaseActive);
      doc?.addEventListener?.('visibilitychange', onVisibility);

      return {
        mapEvent,
        releaseActive,
        isPinching: () => Boolean(activePointer?.isPinch),
        dispose() {
          if (disposed) return;
          disposed = true;
          if (moveRafId) caf(moveRafId);
          if (wheelRafId) caf(wheelRafId);
          surfaceEl.removeEventListener('contextmenu', onContextMenu);
          surfaceEl.removeEventListener('pointerdown', onPointerDown);
          surfaceEl.removeEventListener('pointermove', onPointerMove);
          surfaceEl.removeEventListener('pointerup', onPointerUp);
          surfaceEl.removeEventListener('pointercancel', onPointerCancel);
          surfaceEl.removeEventListener('pointerleave', onPointerLeave);
          surfaceEl.removeEventListener('wheel', onWheel);
          win?.removeEventListener?.('blur', releaseActive);
          doc?.removeEventListener?.('visibilitychange', onVisibility);
        },
      };
    }

    /**
     * Sandbox-safe ('null'-origin) bidirectional clipboard & IME bridge for Kiki panels.
     * Enforces Frame Audit Blocker 1:
     * - Never relies on navigator.clipboard (dead in allow-scripts opaque-origin iframes).
     * - Host -> Remote: intercepts Ctrl+V / Cmd+V with a 60ms pasteHold window so browser
     *   fires a trusted `paste` event on the hidden input / window, plus binds a toolbar paste input.
     * - Remote -> Host: surfaces a compact `[远端剪贴板已更新 · 点击复制]` pill and writes to host
     *   clipboard inside a synchronous user-gesture `copy` / `execCommand('copy')` handler.
     */

    const PASTE_HOLD_WINDOW_MS = 60;

    function copyTextSyncGesture(text, options = {}) {
      const str = String(text ?? '');
      const doc = options.documentObj || (typeof document !== 'undefined' ? document : null);
      if (!doc || !doc.body || typeof doc.createElement !== 'function' || typeof doc.execCommand !== 'function') {
        return false;
      }

      let copiedViaEvent = false;
      const onCopy = (ev) => {
        try {
          if (ev && ev.clipboardData && typeof ev.clipboardData.setData === 'function') {
            ev.clipboardData.setData('text/plain', str);
            ev.preventDefault?.();
            copiedViaEvent = true;
          }
        } catch {}
      };

      if (typeof doc.addEventListener === 'function') {
        doc.addEventListener('copy', onCopy, { once: true });
      }

      const ta = doc.createElement('textarea');
      ta.value = str;
      ta.setAttribute?.('readonly', '');
      ta.setAttribute?.('aria-hidden', 'true');
      if (ta.style) {
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        ta.style.top = '-9999px';
        ta.style.opacity = '0';
        ta.style.pointerEvents = 'none';
      }
      doc.body.append(ta);
      ta.focus?.({ preventScroll: true });
      ta.select?.();

      let ok = false;
      try {
        ok = Boolean(doc.execCommand('copy')) || copiedViaEvent;
      } catch {
        ok = copiedViaEvent;
      } finally {
        if (typeof doc.removeEventListener === 'function') {
          doc.removeEventListener('copy', onCopy);
        }
        ta.remove?.();
      }
      return ok;
    }

    const SANDBOX_CLIPBOARD_OPTION_KEYS = new Set([
      'windowObj',
      'documentObj',
      'isZh',
      'pasteHoldMs',
      'initialMode',
      'hiddenInputEl',
      'pillEl',
      'pillLabelEl',
      'pillPreviewEl',
      'pillMountEl',
      'surfaceEl',
      'isInteractive',
      'onHostPaste',
      'onCommittedText',
      'onFallbackPasteChord',
      'onRemoteCopied',
      'onHiddenKeyDown',
      'onHiddenKeyUp',
    ]);

    function attachSandboxClipboard(options = {}) {
      if (options && typeof options === 'object') {
        for (const key of Object.keys(options)) {
          if (!SANDBOX_CLIPBOARD_OPTION_KEYS.has(key)) {
            throw new TypeError(`attachSandboxClipboard received unknown option "${key}"`);
          }
        }
      }
      const win = options.windowObj || (typeof window !== 'undefined' ? window : null);
      const doc = options.documentObj || (typeof document !== 'undefined' ? document : null);
      const isZh = options.isZh !== undefined
        ? Boolean(options.isZh)
        : /^zh\b/i.test(String(win?.navigator?.language || ''));
      const holdMs = Number.isFinite(options.pasteHoldMs) ? options.pasteHoldMs : PASTE_HOLD_WINDOW_MS;

      let latestRemoteText = '';
      let pasteHoldTimer = null;
      let awaitingPasteHold = false;
      let composing = false;
      let mode = options.initialMode === 'raw' ? 'raw' : 'compose';
      let disposed = false;

      // Create offscreen 1x1 textarea for Host IME composition & trusted paste capture
      let hiddenInput = options.hiddenInputEl || null;
      let createdHiddenInput = false;
      if (!hiddenInput && doc && doc.body && typeof doc.createElement === 'function') {
        hiddenInput = doc.createElement('textarea');
        hiddenInput.className = 'kiki-remote-ime-trap';
        hiddenInput.setAttribute?.('autocapitalize', 'off');
        hiddenInput.setAttribute?.('autocomplete', 'off');
        hiddenInput.setAttribute?.('autocorrect', 'off');
        hiddenInput.setAttribute?.('spellcheck', 'false');
        hiddenInput.setAttribute?.('tabindex', '-1');
        hiddenInput.setAttribute?.('aria-label', 'Remote input capture');
        doc.body.append(hiddenInput);
        createdHiddenInput = true;
      }

      // Optional remote clipboard pill UI
      let pillEl = options.pillEl || null;
      let pillLabelEl = options.pillLabelEl || null;
      let pillPreviewEl = options.pillPreviewEl || null;
      let resetPillTimer = null;

      if (!pillEl && options.pillMountEl && doc && typeof doc.createElement === 'function') {
        pillEl = doc.createElement('button');
        pillEl.type = 'button';
        pillEl.className = 'kiki-remote-clip-pill';
        pillEl.hidden = true;
        pillLabelEl = doc.createElement('span');
        pillLabelEl.className = 'kiki-remote-clip-pill-label';
        pillPreviewEl = doc.createElement('span');
        pillPreviewEl.className = 'kiki-remote-clip-pill-preview';
        pillEl.append(pillLabelEl, pillPreviewEl);
        options.pillMountEl.appendChild(pillEl);
      }

      function renderPillIdle() {
        if (!pillEl) return;
        if (!latestRemoteText) {
          pillEl.hidden = true;
          return;
        }
        pillEl.hidden = false;
        const label = isZh ? '远端剪贴板已更新 · 点击复制' : 'Remote clipboard updated · Copy';
        const compact = latestRemoteText.replace(/\s+/g, ' ').trim().slice(0, 22);
        if (pillLabelEl) {
          pillLabelEl.textContent = label;
        } else {
          pillEl.textContent = compact ? `${label} (${compact})` : label;
        }
        if (pillPreviewEl) {
          pillPreviewEl.textContent = compact ? `「${compact}${latestRemoteText.length > 22 ? '...' : ''}」` : '';
        }
      }

      const onPillClick = (ev) => {
        ev?.stopPropagation?.();
        if (!latestRemoteText) return;
        const ok = copyTextSyncGesture(latestRemoteText, { documentObj: doc });
        if (resetPillTimer) clearTimeout(resetPillTimer);
        const doneMsg = ok
          ? (isZh ? '已复制到本机剪贴板' : 'Copied to host clipboard')
          : (isZh ? '复制受限 · 请在抽屉查看' : 'Copy blocked in sandbox');
        if (pillLabelEl) pillLabelEl.textContent = doneMsg;
        else if (pillEl) pillEl.textContent = doneMsg;
        options.onRemoteCopied?.(latestRemoteText, ok);
        resetPillTimer = setTimeout(() => {
          resetPillTimer = null;
          if (ok && pillEl) {
            pillEl.hidden = true;
          } else {
            renderPillIdle();
          }
        }, 1400);
      };

      if (pillEl && typeof pillEl.addEventListener === 'function') {
        pillEl.addEventListener('click', onPillClick);
      }

      function isEditableElement(target) {
        if (!target || target === hiddenInput) return false;
        const tag = String(target.tagName || '').toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || Boolean(target.isContentEditable);
      }

      function clearPasteHold() {
        if (pasteHoldTimer) {
          clearTimeout(pasteHoldTimer);
          pasteHoldTimer = null;
        }
        awaitingPasteHold = false;
      }

      /**
       * Call inside surface/hiddenInput keydown handler. Returns true when Ctrl+V / Cmd+V
       * was intercepted for the 60ms pasteHold window (caller must NOT preventDefault!).
       */
      function handleKeyDownForPasteHold(ev) {
        if (!ev || ev.altKey || ev.shiftKey) return false;
        const key = String(ev.key || '');
        if (!(ev.ctrlKey || ev.metaKey) || (key !== 'v' && key !== 'V')) return false;
        if (typeof options.isInteractive === 'function' && !options.isInteractive()) return false;

        clearPasteHold();
        awaitingPasteHold = true;
        // Focus hidden textarea right before browser dispatches native paste event so opaque
        // sandboxes reliably fire `paste` even when user focus was on a <canvas> or <div>.
        if (hiddenInput && doc?.activeElement !== hiddenInput && !isEditableElement(doc?.activeElement)) {
          try {
            hiddenInput.value = '';
            hiddenInput.focus?.({ preventScroll: true });
          } catch {}
        }
        pasteHoldTimer = setTimeout(() => {
          pasteHoldTimer = null;
          if (!awaitingPasteHold) return;
          awaitingPasteHold = false;
          restoreSurfaceFocusIfRaw();
          options.onFallbackPasteChord?.();
        }, holdMs);
        return true;
      }

      function restoreSurfaceFocusIfRaw() {
        if (mode === 'raw' && options.surfaceEl) {
          try {
            options.surfaceEl.focus?.({ preventScroll: true });
          } catch {}
        }
      }

      const onWindowPaste = (ev) => {
        if (disposed) return;
        if (typeof options.isInteractive === 'function' && !options.isInteractive()) return;
        if (isEditableElement(doc?.activeElement)) return;

        const text = ev?.clipboardData?.getData?.('text/plain') || '';
        const wasHolding = awaitingPasteHold;
        clearPasteHold();

        if (hiddenInput) hiddenInput.value = '';
        restoreSurfaceFocusIfRaw();

        if (text) {
          ev?.preventDefault?.();
          options.onHostPaste?.(text, { source: wasHolding ? 'paste_hold' : 'paste_event' });
        } else if (wasHolding) {
          options.onFallbackPasteChord?.();
        }
      };

      const onCompositionStart = () => {
        composing = true;
      };

      const onCompositionEnd = (ev) => {
        composing = false;
        const committed = String(ev?.data || hiddenInput?.value || '');
        if (hiddenInput) hiddenInput.value = '';
        if (!committed) return;
        if (typeof options.isInteractive === 'function' && !options.isInteractive()) return;
        options.onCommittedText?.(committed, { source: 'ime_composition' });
      };

      const onHiddenInput = () => {
        if (composing || awaitingPasteHold || !hiddenInput) return;
        const val = hiddenInput.value;
        if (!val) return;
        hiddenInput.value = '';
        if (typeof options.isInteractive === 'function' && !options.isInteractive()) return;
        options.onCommittedText?.(val, { source: 'input' });
      };

      if (hiddenInput && typeof hiddenInput.addEventListener === 'function') {
        hiddenInput.addEventListener('compositionstart', onCompositionStart);
        hiddenInput.addEventListener('compositionend', onCompositionEnd);
        hiddenInput.addEventListener('input', onHiddenInput);
        if (typeof options.onHiddenKeyDown === 'function') {
          hiddenInput.addEventListener('keydown', (ev) => {
            if (composing || ev.isComposing || ev.keyCode === 229) return;
            if (handleKeyDownForPasteHold(ev)) return;
            options.onHiddenKeyDown(ev);
          });
        }
        if (typeof options.onHiddenKeyUp === 'function') {
          hiddenInput.addEventListener('keyup', (ev) => {
            if (composing || ev.isComposing) return;
            options.onHiddenKeyUp(ev);
          });
        }
      }

      win?.addEventListener?.('paste', onWindowPaste);

      function focusInteractiveTarget() {
        if (mode === 'compose' && hiddenInput) {
          try {
            hiddenInput.focus?.({ preventScroll: true });
            return;
          } catch {}
        }
        try {
          options.surfaceEl?.focus?.({ preventScroll: true });
        } catch {}
      }

      function setMode(nextMode) {
        mode = nextMode === 'raw' ? 'raw' : 'compose';
        if (options.surfaceEl && typeof options.surfaceEl.setAttribute === 'function') {
          options.surfaceEl.setAttribute('inputmode', mode === 'raw' ? 'none' : 'text');
        }
        if (typeof options.isInteractive === 'function' && options.isInteractive()) {
          focusInteractiveTarget();
        }
        return mode;
      }

      function notifyRemoteClipboard(text) {
        const str = String(text ?? '');
        if (!str) return;
        latestRemoteText = str;
        renderPillIdle();
      }

      function bindToolbarPasteForm(formEl, inputEl, { clearOnSend = true } = {}) {
        if (!formEl || !inputEl || typeof formEl.addEventListener !== 'function') return;
        formEl.addEventListener('submit', (ev) => {
          ev.preventDefault?.();
          const val = String(inputEl.value || '');
          if (!val) return;
          options.onHostPaste?.(val, { source: 'toolbar_box', submit: false });
          if (clearOnSend) inputEl.value = '';
        });
      }

      return {
        getMode: () => mode,
        setMode,
        isComposing: () => composing,
        focusInteractiveTarget,
        handleKeyDownForPasteHold,
        notifyRemoteClipboard,
        getLatestRemoteClipboard: () => latestRemoteText,
        bindToolbarPasteForm,
        getHiddenInput: () => hiddenInput,
        dispose() {
          if (disposed) return;
          disposed = true;
          clearPasteHold();
          if (resetPillTimer) clearTimeout(resetPillTimer);
          win?.removeEventListener?.('paste', onWindowPaste);
          pillEl?.removeEventListener?.('click', onPillClick);
          if (createdHiddenInput) hiddenInput?.remove?.();
        },
      };
    }

    /**
     * Context-aware drag-and-drop file/APK overlay for Kiki remote panels.
     * Enforces Frame Audit Blocker 2:
     * - NEVER multiplexes bulk file bytes onto the interactive video/input stream.
     * - Routes uploads over chunked RPC (`uploadInit` -> `uploadChunk` -> `uploadFinish`)
     *   or a dedicated `'upload'` stream channel.
     */

    const WINDOWS_RESERVED_STEM = /^(con|prn|aux|nul|com[1-9]|lpt[1-9])$/i;
    const DEFAULT_UPLOAD_CHUNK_BYTES = 768 * 1024; // 768 KiB raw (~1 MiB base64, <=130 chunks for 100 MB)

    function sanitizeDropFileName(rawName, index = 0) {
      const base = String(rawName ?? '')
        .replace(/^.*[\\/]/, '')
        .replace(/[\x00-\x1f\x7f<>:"/\\|?*]+/g, '_')
        .replace(/^\.+/, '')
        .trim();
      const fallback = base || `dropped-file-${index + 1}`;
      const dotIdx = fallback.lastIndexOf('.');
      const stem = dotIdx > 0 ? fallback.slice(0, dotIdx) : fallback;
      const ext = dotIdx > 0 ? fallback.slice(dotIdx) : '';
      const safeStem = WINDOWS_RESERVED_STEM.test(stem) ? `_${stem}` : stem;
      return `${safeStem.slice(0, 120)}${ext.slice(0, 24)}`;
    }

    function uint8ToBase64(bytes) {
      if (bytes && typeof bytes.toBase64 === 'function') {
        return bytes.toBase64();
      }
      let binary = '';
      const step = 0x8000;
      for (let i = 0; i < bytes.length; i += step) {
        const slice = bytes.subarray(i, Math.min(bytes.length, i + step));
        binary += String.fromCharCode.apply(null, slice);
      }
      return btoa(binary);
    }

    function attachRemoteDropZone(stageEl, options = {}) {
      if (!stageEl || typeof stageEl.addEventListener !== 'function') {
        throw new Error('attachRemoteDropZone requires a stage element');
      }

      const doc = options.documentObj || (typeof document !== 'undefined' ? document : null);
      const isZh = options.isZh !== undefined
        ? Boolean(options.isZh)
        : /^zh\b/i.test(String(typeof navigator !== 'undefined' ? navigator.language : ''));
      const chunkBytes = Number.isFinite(options.chunkBytes) && options.chunkBytes > 0
        ? Math.floor(options.chunkBytes)
        : DEFAULT_UPLOAD_CHUNK_BYTES;

      let dragDepth = 0;
      let uploading = false;
      let disposed = false;

      let overlayEl = options.overlayEl || null;
      let titleEl = null;
      let subEl = null;
      let createdOverlay = false;

      if (!overlayEl && doc && typeof doc.createElement === 'function') {
        overlayEl = doc.createElement('div');
        overlayEl.className = 'kiki-remote-drop-overlay';
        overlayEl.hidden = true;
        const card = doc.createElement('div');
        card.className = 'kiki-remote-drop-card';
        titleEl = doc.createElement('div');
        titleEl.className = 'kiki-remote-drop-title';
        subEl = doc.createElement('div');
        subEl.className = 'kiki-remote-drop-sub';
        card.append(titleEl, subEl);
        overlayEl.appendChild(card);
        stageEl.appendChild(overlayEl);
        createdOverlay = true;
      }

      function showOverlay(title, subtitle = '') {
        if (!overlayEl) return;
        overlayEl.hidden = false;
        if (titleEl) titleEl.textContent = title;
        if (subEl) subEl.textContent = subtitle;
      }

      function hideOverlay() {
        if (overlayEl) overlayEl.hidden = true;
      }

      function hasFiles(ev) {
        const types = ev?.dataTransfer?.types;
        if (!types) return false;
        for (let i = 0; i < types.length; i += 1) {
          if (types[i] === 'Files') return true;
        }
        return false;
      }

      const onDragEnter = (ev) => {
        if (disposed || uploading || !hasFiles(ev)) return;
        if (typeof options.isEnabled === 'function' && !options.isEnabled()) return;
        ev.preventDefault?.();
        dragDepth += 1;
        showOverlay(
          options.dropTitle || (isZh ? '松开以投送文件至设备' : 'Drop files to send to device'),
          options.dropSubtitle || (isZh ? '.apk 自动安装 · 图片与文件推入 Download 并刷新媒体库' : '.apk installs automatically · files push to Download'),
        );
      };

      const onDragOver = (ev) => {
        if (disposed || uploading || !hasFiles(ev)) return;
        if (typeof options.isEnabled === 'function' && !options.isEnabled()) return;
        ev.preventDefault?.();
        if (ev.dataTransfer) ev.dataTransfer.dropEffect = 'copy';
      };

      const onDragLeave = (ev) => {
        if (disposed || uploading) return;
        ev.preventDefault?.();
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) hideOverlay();
      };

      async function uploadSingleFile(file, idx, total) {
        const safeName = sanitizeDropFileName(file.name, idx);
        const isApk = /\.apk$/i.test(safeName);
        const ab = await file.arrayBuffer();
        const bytes = new Uint8Array(ab);

        if (typeof options.uploadFile === 'function') {
          return options.uploadFile({
            fileName: safeName,
            byteLength: bytes.byteLength,
            isApk,
            bytes,
            chunkBytes,
            uint8ToBase64,
            onProgress(pct) {
              showOverlay(
                isZh ? `正在传输 ${safeName} (${pct}%)` : `Uploading ${safeName} (${pct}%)`,
                `${idx + 1} / ${total}`,
              );
            },
          });
        }

        if (typeof options.callRpc !== 'function') {
          throw new Error('DropZone requires uploadFile or callRpc handler');
        }

        const targetMeta = typeof options.getTargetMeta === 'function' ? options.getTargetMeta() : {};
        const initRes = await options.callRpc('uploadInit', {
          ...targetMeta,
          fileName: safeName,
          byteLength: bytes.byteLength,
          mode: isApk ? 'install_apk' : 'push_file',
        });
        if (!initRes || initRes.ok === false || !initRes.uploadId) {
          throw new Error(initRes?.error || 'Failed to initialize file transfer');
        }

        const uploadId = initRes.uploadId;
        let offset = 0;
        while (offset < bytes.byteLength) {
          const end = Math.min(bytes.byteLength, offset + chunkBytes);
          const chunkB64 = uint8ToBase64(bytes.subarray(offset, end));
          const chunkRes = await options.callRpc('uploadChunk', {
            uploadId,
            offset,
            dataBase64: chunkB64,
          });
          if (!chunkRes || chunkRes.ok === false) {
            throw new Error(chunkRes?.error || 'Chunk upload failed');
          }
          offset = end;
          const pct = bytes.byteLength > 0 ? Math.round((offset / bytes.byteLength) * 100) : 100;
          showOverlay(
            isZh
              ? (pct >= 100 && isApk ? `正在安装 ${safeName}...` : `正在传输 ${safeName} (${pct}%)`)
              : (pct >= 100 && isApk ? `Installing ${safeName}...` : `Sending ${safeName} (${pct}%)`),
            `${idx + 1} / ${total}`,
          );
        }

        const finishRes = await options.callRpc('uploadFinish', {
          ...targetMeta,
          uploadId,
        });
        if (!finishRes || finishRes.ok === false) {
          throw new Error(finishRes?.error || 'File finalize failed');
        }
        return finishRes;
      }

      const onDrop = async (ev) => {
        if (disposed) return;
        ev.preventDefault?.();
        dragDepth = 0;
        if (uploading) return;
        if (typeof options.isEnabled === 'function' && !options.isEnabled()) {
          hideOverlay();
          return;
        }

        const rawFiles = ev?.dataTransfer?.files ? Array.from(ev.dataTransfer.files) : [];
        if (rawFiles.length === 0) {
          hideOverlay();
          return;
        }

        uploading = true;
        const results = [];
        try {
          for (let i = 0; i < rawFiles.length; i += 1) {
            const file = rawFiles[i];
            showOverlay(
              isZh ? `准备传输 ${file.name}...` : `Preparing ${file.name}...`,
              `${i + 1} / ${rawFiles.length}`,
            );
            const res = await uploadSingleFile(file, i, rawFiles.length);
            results.push(res);
          }
          options.onComplete?.(results);
        } catch (err) {
          options.onError?.(err);
        } finally {
          uploading = false;
          hideOverlay();
        }
      };

      stageEl.addEventListener('dragenter', onDragEnter);
      stageEl.addEventListener('dragover', onDragOver);
      stageEl.addEventListener('dragleave', onDragLeave);
      stageEl.addEventListener('drop', onDrop);

      return {
        isUploading: () => uploading,
        sanitizeDropFileName,
        dispose() {
          if (disposed) return;
          disposed = true;

    const y = (act.normY / 1000) * vh;
    el.reticleGroup.removeAttribute('hidden');
    el.retH.setAttribute('x1', String(Math.max(0, x - 18)));
    el.retH.setAttribute('y1', String(y));
    el.retH.setAttribute('x2', String(Math.min(vw, x + 18)));
    el.retH.setAttribute('y2', String(y));
    el.retV.setAttribute('x1', String(x));
    el.retV.setAttribute('y1', String(Math.max(0, y - 18)));
    el.retV.setAttribute('x2', String(x));
    el.retV.setAttribute('y2', String(Math.min(vh, y + 18)));
    el.retDot.setAttribute('cx', String(x));
    el.retDot.setAttribute('cy', String(y));
    el.retDot.setAttribute('r', '7.5');

    if (typeof act.startNormX === 'number' && typeof act.startNormY === 'number') {
      const sx = (act.startNormX / 1000) * vw;
      const sy = (act.startNormY / 1000) * vh;
      el.dragVector.removeAttribute('hidden');
      el.dragVector.setAttribute('x1', String(sx));
      el.dragVector.setAttribute('y1', String(sy));
      el.dragVector.setAttribute('x2', String(x));
      el.dragVector.setAttribute('y2', String(y));
    } else {
      el.dragVector.setAttribute('hidden', '');
    }
  }

  function renderTargetSelect() {
    el.targetSelect.replaceChildren();
    const locals = state.targets.filter((t) => t.providerId === 'local');
    const remotes = state.targets.filter((t) => t.providerId !== 'local');

    const addGroup = (label, items) => {
      if (!items.length) return;
      const og = document.createElement('optgroup');
      og.label = label;
      for (const item of items) {
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = item.label || item.id;
        if (item.id === state.selectedTargetId) opt.selected = true;
        og.appendChild(opt);
      }
      el.targetSelect.appendChild(og);
    };

    addGroup(isZh ? '本机桌面' : 'Local Desktop', locals);
    addGroup(isZh ? '远控目标提供方' : 'Remote Providers', remotes);

    if (!locals.length && !remotes.length) {
      const opt = document.createElement('option');
      opt.value = 'local:primary';
      opt.textContent = 'Primary Display';
      el.targetSelect.appendChild(opt);
    }
  }

  async function drawBlobToCanvas(blob) {
    if (typeof createImageBitmap === 'function') {
      const bmp = await createImageBitmap(blob);
      try {
        if (el.screenCanvas.width !== bmp.width || el.screenCanvas.height !== bmp.height) {
          el.screenCanvas.width = bmp.width;
          el.screenCanvas.height = bmp.height;
        }
        ctx.drawImage(bmp, 0, 0);
      } finally {
        bmp.close();
      }
      magnifier.refresh();
      return;
    }
    const url = URL.createObjectURL(blob);
    try {
      await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          el.screenCanvas.width = img.naturalWidth || 1280;
          el.screenCanvas.height = img.naturalHeight || 720;
          ctx.drawImage(img, 0, 0);
          magnifier.refresh();
          resolve();
        };
        img.onerror = reject;
        img.src = url;
      });
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  async function drawDataUrl(dataUrl) {
    const comma = dataUrl.indexOf(',');
    if (comma === -1) return;
    const raw = atob(dataUrl.slice(comma + 1));
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i += 1) bytes[i] = raw.charCodeAt(i);
    await drawBlobToCanvas(new Blob([bytes], { type: 'image/png' }));
  }

  function stopStream(sendClose = true) {
    state.streamGen += 1;
    state.streamActive = false;
    if (state.streamPort) {
      const port = state.streamPort;
      state.streamPort = null;
      port.onmessage = null;
      try {
        if (sendClose) port.postMessage({ __kikiStreamControl: 'close' });
        port.close();
      } catch {}
    }
  }

  function clearPoll() {
    if (state.pollTimer) {
      clearTimeout(state.pollTimer);
      state.pollTimer = null;
    }
    if (state.immediateTimer) {
      clearTimeout(state.immediateTimer);
      state.immediateTimer = null;
    }
  }

  async function captureSingleFrame() {
    if (state.frameInFlight || isDisconnectedStandalone()) return;
    state.frameInFlight = true;
    try {
      const res = await panelCall('frame', { targetId: state.selectedTargetId, maxWidth: 1280 });
      const frameUrl = res?.dataUrl || (res?.imageBase64 ? `data:${res.mimeType || 'image/png'};base64,${res.imageBase64}` : '');
      if (res?.ok && frameUrl) {
        await drawDataUrl(frameUrl);
        if (res.logicalSize?.width && res.logicalSize?.height) {
          const changed = res.logicalSize.width !== state.logicalSize.width
            || res.logicalSize.height !== state.logicalSize.height;
          state.logicalSize = res.logicalSize;
          if (changed) layoutFrame();
        }
        state.takeoverActive = Boolean(res.takeoverActive);
        state.controlledBy = res.controlledBy || 'agent';
        if (res.lastAction) {
          state.lastAction = res.lastAction;
          renderActionOverlay(res.lastAction);
        }
        updateChrome();
      }
    } catch (err) {
      setStatus(err.message || 'Capture failed', 'error');
    } finally {
      state.frameInFlight = false;
    }
  }

  function requestImmediateFrame(delayMs = 45) {
    if (state.streamActive || isDisconnectedStandalone()) return;
    if (state.immediateTimer) clearTimeout(state.immediateTimer);
    state.immediateTimer = setTimeout(() => {
      state.immediateTimer = null;
      void captureSingleFrame();
    }, delayMs);
  }

  async function pollOnce() {
    if (!state.live || state.streamActive || document.hidden || isDisconnectedStandalone()) return;
    const t0 = performance.now();
    await captureSingleFrame();
    if (state.live && !state.streamActive && !document.hidden && !isDisconnectedStandalone()) {
      const wait = Math.max(40, POLL_INTERVAL_MS - (performance.now() - t0));
      state.pollTimer = setTimeout(() => { void pollOnce(); }, wait);
    }
  }

  async function connectTransport() {
    stopStream(true);
    clearPoll();
    if (!state.live || isDisconnectedStandalone()) {
      updateChrome();
      return;
    }
    const gen = ++state.streamGen;
    try {
      const { result, port } = await openStream('screen', {
        targetId: state.selectedTargetId,
        maxWidth: 1280,
        fps: 8,
      });
      if (gen !== state.streamGen || !port) {
        void pollOnce();
        return;
      }
      state.streamPort = port;
      state.streamActive = true;
      if (result?.width && result?.height) {
        state.logicalSize = { width: result.width, height: result.height };
        state.scaleFactor = result.scaleFactor || 1;
        layoutFrame();
      }
      if (result?.takeoverActive !== undefined) {
        state.takeoverActive = Boolean(result.takeoverActive);
      }
      updateChrome();

      port.onmessage = (ev) => {
        if (gen !== state.streamGen) return;
        const payload = ev.data;
        if (payload instanceof ArrayBuffer && payload.byteLength > 16) {
          const dv = new DataView(payload);
          if (dv.getUint8(0) === FRAME_MAGIC && dv.getUint8(1) === PNG_KIND) {
            const pngBytes = new Uint8Array(payload, 16);
            void drawBlobToCanvas(new Blob([pngBytes], { type: 'image/png' }));
          }
          return;
        }
        const msg = typeof payload === 'string' ? (() => { try { return JSON.parse(payload); } catch { return null; } })() : payload;
        if (!msg) return;
        if (msg.__kikiStreamEvent === 'close') {
          stopStream(false);
          if (state.live) void pollOnce();
          return;
        }
        if (msg.type === 'frameMeta') {
          if (msg.logicalSize?.width) state.logicalSize = msg.logicalSize;
          state.takeoverActive = Boolean(msg.takeoverActive);
          updateChrome();
        } else if (msg.type === 'takeover' && (!msg.targetId || msg.targetId === state.selectedTargetId)) {
          state.takeoverActive = Boolean(msg.takeoverActive);
          state.controlledBy = msg.controlledBy || 'agent';
          updateChrome();
        } else if (msg.type === 'action' && msg.lastAction) {
          state.lastAction = msg.lastAction;
          renderActionOverlay(msg.lastAction);
        } else if (msg.type === 'remoteClipboard' && typeof msg.text === 'string') {
          clipboardBridge.notifyRemoteClipboard(msg.text);
        }
      };
      if (typeof port.start === 'function') port.start();
    } catch {
      void pollOnce();
    }
  }

  async function loadTargets() {
    if (isDisconnectedStandalone()) {
      renderStandalonePlaceholder();
      return;
    }
    try {
      const res = await panelCall('state');
      if (res?.ok) {
        state.targets = res.targets || [];
        state.selectedTargetId = res.selectedTargetId || 'local:primary';
        state.takeoverActive = Boolean(res.takeoverActive);
        state.controlledBy = res.controlledBy || 'agent';
        state.lastAction = res.lastAction || null;
        renderTargetSelect();
        renderActionOverlay(state.lastAction);
        updateChrome();
      }
    } catch (err) {
      setStatus(err.message || 'Unavailable', 'error');
    }
  }

  function renderStandalonePlaceholder() {
    el.screenCanvas.width = 1280;
    el.screenCanvas.height = 720;
    ctx.fillStyle = '#141518';
    ctx.fillRect(0, 0, 1280, 720);
    ctx.strokeStyle = 'rgba(88, 168, 143, 0.28)';
    ctx.lineWidth = 2;
    ctx.strokeRect(48, 48, 1184, 624);
    renderTargetSelect();
    layoutFrame();
    updateChrome();
  }

  function updateCoordinateDisplay(pt) {
    if (!pt) {
      el.coordReadout.textContent = `${state.logicalSize.width}×${state.logicalSize.height}`;
      return;
    }
    el.coordReadout.textContent = `${pt.targetX}, ${pt.targetY} px · ${pt.normX}, ${pt.normY}`;
  }

  function spawnPulse(pctX, pctY, isHuman = true) {
    const dot = document.createElement('div');
    dot.className = 'click-pulse' + (isHuman ? ' human' : '');
    dot.style.left = `${pctX}%`;
    dot.style.top = `${pctY}%`;
    el.screenSurface.appendChild(dot);
    setTimeout(() => dot.remove(), 390);
  }

  async function toggleTakeover(explicitNext) {
    const nextActive = typeof explicitNext === 'boolean' ? explicitNext : !state.takeoverActive;
    state.takeoverActive = nextActive;
    state.controlledBy = nextActive ? 'human' : 'agent';
    if (nextActive) {
      el.screenSurface.focus({ preventScroll: true });
    }
    updateChrome();
    if (!isDisconnectedStandalone()) {
      const res = await panelCall('takeover', {
        targetId: state.selectedTargetId,
        active: nextActive,
      }).catch(() => null);
      if (res && typeof res.takeoverActive === 'boolean') {
        state.takeoverActive = res.takeoverActive;
        state.controlledBy = res.controlledBy || (res.takeoverActive ? 'human' : 'agent');
        updateChrome();
      }
    }
  }

  async function dispatchHumanInput(payload) {
    if (!state.takeoverActive) return;
    if (state.streamActive && state.streamPort) {
      try {
        state.streamPort.postMessage(JSON.stringify({ type: 'humanAction', ...payload }));
        return;
      } catch {}
    }
    if (!isDisconnectedStandalone()) {
      await panelCall('action', { targetId: state.selectedTargetId, ...payload }).catch((err) => {
        setStatus(err.message || 'Input failed', 'error');
      });
      requestImmediateFrame(40);
    }
  }

  const magnifier = attachRemoteMagnifier({
    stageEl: el.stage,
    sourceCanvas: el.screenCanvas,
    toggleBtn: el.magnifierBtn,
    zoomFactor: 3,
    lensSize: 168,
    enableAltHold: true,
    enableBackquoteHold: true,
    allowBackquoteHold: () => !state.takeoverActive,
  });

  function sendCuaTextToTarget(text) {
    if (!text) return;
    void dispatchHumanInput({ kind: 'paste', text });
    setStatus(isZh ? `已粘贴 ${text.length} 字符到远端焦点` : `Pasted ${text.length} chars to target`, 'amber');
  }

  const clipboardBridge = attachSandboxClipboard({
    surfaceEl: el.screenSurface,
    pillMountEl: el.stage,
    isZh,
    initialMode: 'raw',
    isInteractive: () => Boolean(state.takeoverActive),
    onHostPaste: (text) => {
      sendCuaTextToTarget(text);
    },
    onCommittedText: (text) => {
      sendCuaTextToTarget(text);
    },
    onFallbackPasteChord: () => {
      void dispatchHumanInput({ kind: 'key', key: 'Ctrl+V' });
    },
    onRemoteCopied: (text, ok) => {
      if (ok) {
        setStatus(isZh ? `已复制远端剪贴板 (${text.length} 字符)` : `Copied ${text.length} remote chars`, state.takeoverActive ? 'amber' : 'normal');
      }
    },
    onHiddenKeyDown: handleCuaKeyDown,
  });

  el.screenSurface.addEventListener('contextmenu', (ev) => ev.preventDefault());

  el.screenSurface.addEventListener('pointerleave', (ev) => {
    magnifier.updateFromPointer(null, ev);
    if (!state.pointerDown) updateCoordinateDisplay(null);
  });

  el.screenSurface.addEventListener('pointermove', (ev) => {
    const pt = mapSurfaceEvent(ev);
    magnifier.updateFromPointer({
      inside: pt.inside,
      normX: pt.normX / 1000,
      normY: pt.normY / 1000,
      targetX: pt.targetX,
      targetY: pt.targetY,
    }, ev);
    if ((state.takeoverActive && pt.inside) || state.pointerDown) {
      updateCoordinateDisplay(pt);
    } else if (!state.pointerDown) {
      updateCoordinateDisplay(null);
    }
    if (state.pointerDown && state.pointerDown.pointerId === ev.pointerId) {
      const dist = Math.hypot(pt.pxX - state.pointerDown.pxX, pt.pxY - state.pointerDown.pxY);
      if (dist > 8) {
        renderActionOverlay({
          startNormX: state.pointerDown.normX,
          startNormY: state.pointerDown.normY,
          normX: pt.normX,
          normY: pt.normY,
        });
      }
    }
  });

  el.screenSurface.addEventListener('pointerdown', (ev) => {
    if (!state.takeoverActive) {
      setStatus(isZh ? '只读观察中 · 点击顶栏「接管操控」或按 Alt+T 后直接点击画面' : 'Read-only · click Takeover Control (Alt+T) to interact', 'amber');
      return;
    }
    const pt = mapSurfaceEvent(ev);
    if (!pt.inside) return;

    el.screenSurface.focus({ preventScroll: true });
    el.screenSurface.setPointerCapture(ev.pointerId);
    const button = ev.button === 2 ? 'right' : ev.button === 1 ? 'middle' : 'left';
    const modifiers = [];
    if (ev.ctrlKey) modifiers.push('ctrl');
    if (ev.shiftKey) modifiers.push('shift');
    if (ev.altKey) modifiers.push('alt');
    if (ev.metaKey) modifiers.push('meta');

    state.pointerDown = { ...pt, button, modifiers, pointerId: ev.pointerId, at: Date.now() };
    updateCoordinateDisplay(pt);
    spawnPulse(pt.pctX, pt.pctY, true);
  });

  el.screenSurface.addEventListener('pointerup', (ev) => {
    if (!state.pointerDown || state.pointerDown.pointerId !== ev.pointerId) return;
    const start = state.pointerDown;
    state.pointerDown = null;
    const end = mapSurfaceEvent(ev);
    const dist = Math.hypot(end.pxX - start.pxX, end.pxY - start.pxY);

    if (dist > 10) {
      spawnPulse(end.pctX, end.pctY, true);
      renderActionOverlay({ startNormX: start.normX, startNormY: start.normY, normX: end.normX, normY: end.normY });
      void dispatchHumanInput({
        kind: 'drag',
        startNormX: start.normX,
        startNormY: start.normY,
        endNormX: end.normX,
        endNormY: end.normY,
        button: start.button,
        durationMs: Math.min(800, Math.max(120, Date.now() - start.at)),
      });
    } else {
      renderActionOverlay({ normX: end.normX, normY: end.normY });
      void dispatchHumanInput({
        kind: 'click',
        normX: end.normX,
        normY: end.normY,
        button: start.button,
        count: ev.detail >= 2 ? 2 : 1,
        ...(start.modifiers.length > 0 ? { modifiers: start.modifiers } : {}),
      });
    }
  });

  el.screenSurface.addEventListener('pointercancel', () => {
    state.pointerDown = null;
  });

  el.screenSurface.addEventListener('wheel', (ev) => {
    if (!state.takeoverActive) return;
    const pt = mapSurfaceEvent(ev);
    if (!pt.inside) return;
    ev.preventDefault();
    const deltaY = Math.max(-6, Math.min(6, ev.deltaY / 100));
    const deltaX = Math.max(-6, Math.min(6, ev.deltaX / 100));
    if (deltaX === 0 && deltaY === 0) return;
    void dispatchHumanInput({ kind: 'scroll', normX: pt.normX, normY: pt.normY, deltaX, deltaY });
  }, { passive: false });

  function handleCuaKeyDown(ev) {
    if (!state.takeoverActive || ev.isComposing) return;
    if (ev.key === 'Shift' || ev.key === 'Control' || ev.key === 'Alt' || ev.key === 'Meta') return;
    if (ev.altKey && !ev.ctrlKey && !ev.metaKey && ev.key.toLowerCase() === 't') return;

    if (clipboardBridge.handleKeyDownForPasteHold(ev)) {
      return;
    }

    ev.preventDefault();
    const mods = [];
    if (ev.ctrlKey) mods.push('Ctrl');
    if (ev.altKey) mods.push('Alt');
    if (ev.shiftKey && (ev.key.length > 1 || ev.ctrlKey || ev.altKey || ev.metaKey)) mods.push('Shift');
    if (ev.metaKey) mods.push('Meta');

    if (mods.length === 0 && ev.key.length === 1) {
      void dispatchHumanInput({ kind: 'type', text: ev.key });
      return;
    }
    const keyMap = {
      ArrowUp: 'Up',
      ArrowDown: 'Down',
      ArrowLeft: 'Left',
      ArrowRight: 'Right',
      ' ': 'Space',
    };
    const main = keyMap[ev.key] || (ev.key.length === 1 ? ev.key.toUpperCase() : ev.key);
    void dispatchHumanInput({ kind: 'key', key: [...mods, main].join('+') });
  }

  el.screenSurface.addEventListener('keydown', handleCuaKeyDown);

  window.addEventListener('keydown', (ev) => {
    if (ev.altKey && !ev.ctrlKey && !ev.metaKey && ev.key.toLowerCase() === 't') {
      ev.preventDefault();
      void toggleTakeover();
    }
  });

  el.coordReadout.addEventListener('click', async () => {
    const ok = await copyTextSafe(el.coordReadout.textContent);
    if (ok) {
      setStatus(isZh ? '已复制坐标' : 'Copied coordinates', state.takeoverActive ? 'amber' : 'normal');
    }
  });

  el.targetSelect.addEventListener('change', async () => {
    state.selectedTargetId = el.targetSelect.value;
    if (!isDisconnectedStandalone()) {
      const res = await panelCall('select', { targetId: state.selectedTargetId }).catch(() => null);
      if (res?.target) {
        state.takeoverActive = Boolean(res.target.takeoverActive);
        state.controlledBy = res.target.controlledBy || 'agent';
      }
      if (state.streamActive && state.streamPort) {
        state.streamPort.postMessage(JSON.stringify({ type: 'selectTarget', targetId: state.selectedTargetId }));
      } else {
        await connectTransport();
      }
    }
    updateChrome();
  });

  el.liveBtn.addEventListener('click', () => {
    state.live = !state.live;
    el.liveBtn.classList.toggle('active', state.live);
    if (state.live) void connectTransport();
    else {
      stopStream(true);
      clearPoll();
      updateChrome();
    }
  });

  el.refreshBtn.addEventListener('click', async () => {
    await loadTargets();
    if (!state.streamActive) await captureSingleFrame();
  });

  el.gridBtn.addEventListener('click', () => {
    state.grid = !state.grid;
    safeStorage.set('kiki.cua.grid', state.grid ? '1' : '0');
    el.gridBtn.classList.toggle('active', state.grid);
    el.gridSvg.toggleAttribute('hidden', !state.grid);
  });

  el.takeoverBtn.addEventListener('click', () => {
    void toggleTakeover();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearPoll();
    else if (state.live && !state.streamActive) void pollOnce();
  });

  window.addEventListener('pagehide', () => stopStream(true));

  async function boot() {
    if (booted) return;
    booted = true;
    el.gridBtn.classList.toggle('active', state.grid);
    el.gridSvg.toggleAttribute('hidden', !state.grid);
    buildGridRulerSvg();
    layoutFrame();
    await loadTargets();
    await connectTransport();
  }

  setTimeout(() => { if (!booted) void boot(); }, 180);
})();
</script>
</body>
</html>
