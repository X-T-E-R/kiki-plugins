<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Computer Preview</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f4ef;
    --paper: #fcfbf8;
    --panel: #efece4;
    --ink: #1b1a17;
    --ink-soft: #5c5850;
    --ink-faint: #8c867b;
    --line: rgba(27, 26, 23, 0.11);
    --line-strong: rgba(27, 26, 23, 0.22);
    --accent: #2c5e4f;
    --accent-soft: rgba(44, 94, 79, 0.12);
    --amber: #b85d19;
    --amber-soft: rgba(184, 93, 25, 0.15);
    --danger: #b53d2e;
    --ok: #297a54;
    --bezel: #18181a;
    --bezel-edge: rgba(27, 26, 23, 0.24);
    --shadow: 0 20px 46px -20px rgba(18, 17, 15, 0.26), 0 2px 8px rgba(18, 17, 15, 0.07);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413;
      --paper: #1c1b19;
      --panel: #252320;
      --ink: #edeae2;
      --ink-soft: #b2aca0;
      --ink-faint: #7b766c;
      --line: rgba(237, 234, 226, 0.11);
      --line-strong: rgba(237, 234, 226, 0.24);
      --accent: #58a88f;
      --accent-soft: rgba(88, 168, 143, 0.16);
      --amber: #e5934a;
      --amber-soft: rgba(229, 147, 74, 0.19);
      --danger: #e26c5c;
      --ok: #4cb782;
      --bezel: #0c0c0e;
      --bezel-edge: rgba(255, 255, 255, 0.12);
      --shadow: 0 24px 52px -18px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413;
    --paper: #1c1b19;
    --panel: #252320;
    --ink: #edeae2;
    --ink-soft: #b2aca0;
    --ink-faint: #7b766c;
    --line: rgba(237, 234, 226, 0.11);
    --line-strong: rgba(237, 234, 226, 0.24);
    --accent: #58a88f;
    --accent-soft: rgba(88, 168, 143, 0.16);
    --amber: #e5934a;
    --amber-soft: rgba(229, 147, 74, 0.19);
    --danger: #e26c5c;
    --ok: #4cb782;
    --bezel: #0c0c0e;
    --bezel-edge: rgba(255, 255, 255, 0.12);
    --shadow: 0 24px 52px -18px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(255, 255, 255, 0.05);
  }
  :root[data-theme="light"] {
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  button, select { font: inherit; color: inherit; }
  .shell {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 42px;
    padding: 0 12px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .picker-group {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
    flex: 1;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: var(--ink-faint);
    flex-shrink: 0;
    transition: background 140ms ease;
  }
  .status-dot.online { background: var(--ok); }
  .status-dot.takeover { background: var(--amber); }
  .status-dot.offline { background: var(--danger); }
  .target-select-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    min-width: 0;
  }
  .target-select {
    appearance: none;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 7px;
    height: 27px;
    padding: 0 25px 0 9px;
    font-size: 12px;
    font-weight: 500;
    max-width: 280px;
    min-width: 128px;
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
    cursor: pointer;
    outline: none;
  }
  .target-select:focus-visible { border-color: var(--accent); }
  .chevron {
    pointer-events: none;
    margin-left: -20px;
    margin-right: 6px;
    color: var(--ink-faint);
    display: flex;
  }
  .res-pill {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 7px;
    border-radius: 5px;
    background: var(--panel);
    color: var(--ink-soft);
    border: 1px solid var(--line);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 27px;
    padding: 0 9px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .pill-btn:hover { background: var(--panel); color: var(--ink); }
  .pill-btn:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 1px; }
  .pill-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .pill-btn.takeover-locked {
    background: var(--amber-soft);
    border-color: var(--amber);
    color: var(--amber);
  }
  .icon-btn {
    width: 27px;
    padding: 0;
    justify-content: center;
  }
  .stage {
    position: relative;
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .monitor-frame {
    position: relative;
    background: var(--bezel);
    border: 1.5px solid var(--bezel-edge);
    border-radius: 10px;
    padding: 4px;
    box-shadow: var(--shadow);
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }
  .monitor-frame.takeover-ring {
    border-color: var(--amber);
    box-shadow: 0 0 0 2px var(--amber), 0 0 0 5px var(--amber-soft), var(--shadow);
  }
  .screen-surface {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 6px;
    overflow: hidden;
    background: #0d0d0f;
    cursor: default;
    outline: none;
    touch-action: none;
  }
  .screen-surface.interactive {
    cursor: crosshair;
  }
  .screen-surface canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
  }
  .overlay-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .click-pulse {
    position: absolute;
    width: 22px;
    height: 22px;
    margin-left: -11px;
    margin-top: -11px;
    border-radius: 999px;
    border: 1.8px solid rgba(255, 255, 255, 0.92);
    background: rgba(88, 168, 143, 0.32);
    pointer-events: none;
    animation: pulseOut 380ms ease-out forwards;
  }
  .click-pulse.human {
    border-color: rgba(255, 248, 238, 0.95);
    background: rgba(229, 147, 74, 0.36);
  }
  @keyframes pulseOut {
    0% { transform: scale(0.38); opacity: 1; }
    100% { transform: scale(1.55); opacity: 0; }
  }
  .coord-badge {
    position: absolute;
    left: 8px;
    bottom: 8px;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(18, 18, 16, 0.78);
    color: #fcfbf8;
    font-family: var(--mono);
    font-size: 10.5px;
    line-height: 1.35;
    pointer-events: none;
    backdrop-filter: blur(4px);
  }
  .statusbar {
    height: 25px;
    padding: 0 12px;
    border-top: 1px solid var(--line);
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--ink-faint);
    flex-shrink: 0;
    gap: 10px;
  }
  .status-msg {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .status-msg.amber { color: var(--amber); font-weight: 500; }
  .status-msg.err { color: var(--danger); }
  .coord-readout {
    font-family: var(--mono);
    white-space: nowrap;
    background: transparent;
    border: none;
    padding: 0;
    color: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .coord-readout:hover { color: var(--ink); }
  @media (max-width: 580px) {
    .topbar { gap: 5px; padding: 0 8px; }
    .res-pill { display: none; }
    .target-select-wrap { flex: 1 1 0; width: 100%; max-width: 100%; }
    .target-select { flex: 1 1 0; min-width: 0; width: 100%; max-width: 100%; padding: 0 22px 0 7px; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="picker-group">
      <span id="statusDot" class="status-dot"></span>
      <div class="target-select-wrap">
        <select id="targetSelect" class="target-select" aria-label="Target surface">
          <option value="local:primary">Primary Display</option>
        </select>
        <span class="chevron" aria-hidden="true">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M4.5 6.5L8 10l3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </div>
      <span id="resPill" class="res-pill">--</span>
    </div>

    <button id="takeoverBtn" type="button" class="pill-btn" aria-pressed="false" title="Lock Human Takeover for direct click, drag, wheel, keyboard & paste control (Alt+T)">
      <svg id="lockIcon" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.2" y="7.2" width="9.6" height="6.6" rx="1.6"/>
        <path id="lockShackle" d="M5.4 7.2V5.1a2.6 2.6 0 0 1 5.0-0.9"/>
      </svg>
      <span id="takeoverLabel">Takeover Control</span>
    </button>

    <button id="gridBtn" type="button" class="pill-btn" title="Toggle 0..1000 coordinate grid">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="1.5"/><path d="M6 2v12M10 2v12M2 6h12M2 10h12"/></svg>
      <span>Grid</span>
    </button>

    <button id="liveBtn" type="button" class="pill-btn active" title="Toggle live stream">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3.2" fill="currentColor"/></svg>
      <span>Live</span>
    </button>

    <button id="refreshBtn" type="button" class="pill-btn icon-btn" title="Capture fresh frame" aria-label="Refresh frame">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3.6H9.9"/></svg>
    </button>
  </header>

  <main id="stage" class="stage">
    <div id="monitorFrame" class="monitor-frame" style="width:640px;height:360px">
      <div id="screenSurface" class="screen-surface" tabindex="0" aria-label="Target desktop canvas">
        <canvas id="screenCanvas" width="1280" height="720"></canvas>
        <svg id="gridSvg" class="overlay-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none" hidden></svg>
        <svg id="actionSvg" class="overlay-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
          <defs>
            <marker id="dragHead" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M1 1L9 5L1 9z" fill="#e5934a"/>
            </marker>
          </defs>
          <line id="dragVector" x1="0" y1="0" x2="0" y2="0" stroke="#e5934a" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#dragHead)" hidden/>
          <g id="reticleGroup" hidden>
            <line id="retH" x1="0" y1="0" x2="0" y2="0" stroke="#58a88f" stroke-width="1.6"/>
            <line id="retV" x1="0" y1="0" x2="0" y2="0" stroke="#58a88f" stroke-width="1.6"/>
            <circle id="retDot" cx="0" cy="0" r="6.5" fill="none" stroke="#58a88f" stroke-width="2"/>
          </g>
        </svg>
      </div>
    </div>
  </main>

  <footer class="statusbar">
    <span id="statusMsg" class="status-msg">Ready</span>
    <button id="coordReadout" type="button" class="coord-readout" title="Click to copy target coordinates">--</button>
  </footer>
</div>

<script>
(() => {
  const CHANNEL = 'kiki.panel.v1';
  const FRAME_MAGIC = 0x4b;
  const PNG_KIND = 0x02;
  const POLL_INTERVAL_MS = 180;
  const isZh = /^zh\b/i.test(navigator.language || '');

  const memoryStore = new Map();
  const safeStorage = {
    get(key) {
      try {
        const val = window['local' + 'Storage'].getItem(key);
        return val !== null ? val : (memoryStore.get(key) ?? null);
      } catch {
        return memoryStore.get(key) ?? null;
      }
    },
    set(key, value) {
      const str = String(value);
      memoryStore.set(key, str);
      try {
        window['local' + 'Storage'].setItem(key, str);
      } catch {}
    },
    remove(key) {
      memoryStore.delete(key);
      try {
        window['local' + 'Storage'].removeItem(key);
      } catch {}
    },
  };

  async function copyTextSafe(text) {
    const str = String(text ?? '');
    if (!str) return false;
    try {
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        await navigator.clipboard.writeText(str);
        return true;
      }
    } catch {}
    try {
      const ta = document.createElement('textarea');
      ta.value = str;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none;';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return Boolean(ok);
    } catch {
      return false;
    }
  }

  function applyThemeName(theme) {
    if (theme === 'dark' || theme === 'light') {
      document.documentElement.setAttribute('data-theme', theme);
    } else if (theme === 'auto' || theme === 'system') {
      document.documentElement.removeAttribute('data-theme');
    }
  }

  try {
    const urlTheme = new URLSearchParams(window.location.search).get('theme');
    if (urlTheme === 'dark' || urlTheme === 'light') {
      applyThemeName(urlTheme);
    }
  } catch {}

  let reqSeq = 0;
  let booted = false;
  const pending = new Map();

  const state = {
    targets: [],
    selectedTargetId: 'local:primary',
    logicalSize: { width: 1920, height: 1080 },
    scaleFactor: 1,
    live: true,
    grid: safeStorage.get('kiki.cua.grid') === '1',
    takeoverActive: false,
    controlledBy: 'agent',
    lastAction: null,
    streamActive: false,
    streamPort: null,
    streamGen: 0,
    pollTimer: null,
    immediateTimer: null,
    frameInFlight: false,
    pointerDown: null,
    pasteHandledAt: 0,
    standaloneMode: window.parent === window,
  };

  const el = {
    statusDot: document.getElementById('statusDot'),
    targetSelect: document.getElementById('targetSelect'),
    resPill: document.getElementById('resPill'),
    liveBtn: document.getElementById('liveBtn'),
    refreshBtn: document.getElementById('refreshBtn'),
    gridBtn: document.getElementById('gridBtn'),
    takeoverBtn: document.getElementById('takeoverBtn'),
    takeoverLabel: document.getElementById('takeoverLabel'),
    lockShackle: document.getElementById('lockShackle'),
    stage: document.getElementById('stage'),
    monitorFrame: document.getElementById('monitorFrame'),
    screenSurface: document.getElementById('screenSurface'),
    screenCanvas: document.getElementById('screenCanvas'),
    gridSvg: document.getElementById('gridSvg'),
    dragVector: document.getElementById('dragVector'),
    reticleGroup: document.getElementById('reticleGroup'),
    retH: document.getElementById('retH'),
    retV: document.getElementById('retV'),
    retDot: document.getElementById('retDot'),
    statusMsg: document.getElementById('statusMsg'),
    coordReadout: document.getElementById('coordReadout'),
  };

  const ctx = el.screenCanvas.getContext('2d', { alpha: false });

  function applyTheme(pres) {
    if (!pres || typeof pres !== 'object') return;
    applyThemeName(pres.theme || pres.colorScheme);
  }

  window.addEventListener('message', (event) => {
    if (event.source !== window.parent) return;
    const data = event.data;
    if (!data || data.channel !== CHANNEL) return;
    if (data.kind === 'presentation' || data.kind === 'theme') {
      applyTheme(data.presentation || data);
      return;
    }
    if (data.kind === 'init') {
      state.standaloneMode = false;
      applyTheme(data.presentation || data);
      void boot();
      return;
    }
    if (data.kind !== 'response') return;
    const entry = pending.get(data.id);
    if (!entry) return;
    pending.delete(data.id);
    clearTimeout(entry.timer);
    if (data.ok) {
      entry.resolve(entry.withPort ? { result: data.result, port: (event.ports && event.ports[0]) || null } : data.result);
    } else {
      entry.reject(new Error((typeof data.error === 'string' ? data.error : data.error?.message) || 'Bridge error'));
    }
  });

  const isDisconnectedStandalone = () => state.standaloneMode && typeof window.__kikiCuaTestBridge !== 'function';

  function bridgeRequest(method, payload = {}, timeoutMs = 15000, withPort = false) {
    if (typeof window.__kikiCuaTestBridge === 'function') {
      return Promise.resolve(window.__kikiCuaTestBridge(method, payload, withPort));
    }
    if (isDisconnectedStandalone()) {
      return Promise.reject(new Error('Standalone preview mode'));
    }
    const id = ++reqSeq;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error('Request timed out'));
      }, timeoutMs);
      pending.set(id, { resolve, reject, timer, withPort });
      window.parent.postMessage({ channel: CHANNEL, kind: 'request', id, method, ...payload }, '*');
    });
  }

  const panelCall = (action, args = {}, timeoutMs = 15000) =>
    bridgeRequest('plugin.call', { action, args }, timeoutMs, false);

  const openStream = (stream, args = {}, timeoutMs = 2500) =>
    bridgeRequest('plugin.openStream', { stream, args }, timeoutMs, true);

  function computeContainedRect(boxWidth, boxHeight, contentWidth, contentHeight) {
    const cw = Math.max(1, boxWidth);
    const ch = Math.max(1, boxHeight);
    const iw = Math.max(1, contentWidth || cw);
    const ih = Math.max(1, contentHeight || ch);
    const scale = Math.min(cw / iw, ch / ih);
    const width = iw * scale;
    const height = ih * scale;
    return {
      x: (cw - width) / 2,
      y: (ch - height) / 2,
      width: Math.max(1, width),
      height: Math.max(1, height),
    };
  }

  function mapSurfaceEvent(ev) {
    const r = el.screenSurface.getBoundingClientRect();
    const lw = Math.max(1, state.logicalSize.width || 1920);
    const lh = Math.max(1, state.logicalSize.height || 1080);
    const drawn = computeContainedRect(r.width, r.height, lw, lh);
    const offX = ev.clientX - r.left;
    const offY = ev.clientY - r.top;
    const inside = offX >= drawn.x - 2 && offX <= drawn.x + drawn.width + 2
      && offY >= drawn.y - 2 && offY <= drawn.y + drawn.height + 2;
    const u = Math.min(1, Math.max(0, (offX - drawn.x) / drawn.width));
    const v = Math.min(1, Math.max(0, (offY - drawn.y) / drawn.height));
    const targetX = lw <= 1 ? 0 : Math.round(u * (lw - 1));
    const targetY = lh <= 1 ? 0 : Math.round(v * (lh - 1));
    const normX = lw <= 1 ? 0 : Math.round((targetX / (lw - 1)) * 1000);
    const normY = lh <= 1 ? 0 : Math.round((targetY / (lh - 1)) * 1000);
    const clampedOffX = drawn.x + u * drawn.width;
    const clampedOffY = drawn.y + v * drawn.height;
    return {
      inside,
      targetX,
      targetY,
      normX,
      normY,
      pctX: (clampedOffX / Math.max(1, r.width)) * 100,
      pctY: (clampedOffY / Math.max(1, r.height)) * 100,
      pxX: offX,
      pxY: offY,
    };
  }

  function currentSvgSize() {
    const sw = Math.max(1, state.logicalSize.width || 1920);
    const sh = Math.max(1, state.logicalSize.height || 1080);
    return { vw: Math.round((sw / sh) * 1000), vh: 1000 };
  }

  function buildGridRulerSvg() {
    const { vw, vh } = currentSvgSize();
    el.gridSvg.setAttribute('viewBox', `0 0 ${vw} ${vh}`);
    el.gridSvg.removeAttribute('preserveAspectRatio');
    const parts = [];
    for (let step = 100; step <= 900; step += 100) {
      const gx = Math.round((step / 1000) * vw);
      const gy = Math.round((step / 1000) * vh);
      const op = step === 500 ? '0.52' : '0.28';
      parts.push(`<line x1="${gx}" y1="0" x2="${gx}" y2="${vh}" stroke="#2c5e4f" stroke-opacity="${op}" stroke-width="1.3" vector-effect="non-scaling-stroke"/>`);
      parts.push(`<line x1="0" y1="${gy}" x2="${vw}" y2="${gy}" stroke="#2c5e4f" stroke-opacity="${op}" stroke-width="1.3" vector-effect="non-scaling-stroke"/>`);
      parts.push(`<rect x="${gx + 4}" y="6" width="38" height="21" rx="4" fill="rgba(24,24,22,0.82)"/>`);
      parts.push(`<text x="${gx + 23}" y="20.5" fill="#fcfbf8" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle">${step}</text>`);
      parts.push(`<rect x="6" y="${gy + 4}" width="38" height="21" rx="4" fill="rgba(24,24,22,0.82)"/>`);
      parts.push(`<text x="25" y="${gy + 18.5}" fill="#fcfbf8" font-family="monospace" font-size="13" font-weight="600" text-anchor="middle">${step}</text>`);
    }
    el.gridSvg.innerHTML = parts.join('');
  }

  function layoutFrame() {
    const rect = el.stage.getBoundingClientRect();
    const availW = Math.max(180, rect.width - 40);
    const availH = Math.max(120, rect.height - 40);
    const sw = Math.max(1, state.logicalSize.width || 1920);
    const sh = Math.max(1, state.logicalSize.height || 1080);
    const aspect = sw / sh;
    let fitW = availH * aspect;
    let fitH = availH;
    if (fitW > availW) {
      fitW = availW;
      fitH = availW / aspect;
    }
    el.monitorFrame.style.width = `${Math.round(fitW) + 8}px`;
    el.monitorFrame.style.height = `${Math.round(fitH) + 8}px`;
    buildGridRulerSvg();
    if (state.lastAction) renderActionOverlay(state.lastAction);
  }

  new ResizeObserver(layoutFrame).observe(el.stage);

  function setStatus(text, tone = 'normal') {
    el.statusMsg.textContent = text;
    el.statusMsg.classList.toggle('amber', tone === 'amber');
    el.statusMsg.classList.toggle('err', tone === 'error');
  }

  function updateChrome() {
    const active = state.targets.find((t) => t.id === state.selectedTargetId);
    if (active?.dimensions) {
      const w = active.dimensions.width;
      const h = active.dimensions.height;
      const sc = active.dimensions.scaleFactor || 1;
      if (w && h && (w !== state.logicalSize.width || h !== state.logicalSize.height)) {
        state.logicalSize = { width: w, height: h };
        layoutFrame();
      }
      state.scaleFactor = sc;
    }

    const scalePct = Math.round((state.scaleFactor || 1) * 100);
    el.resPill.textContent = scalePct !== 100
      ? `${state.logicalSize.width}×${state.logicalSize.height} · ${scalePct}%`
      : `${state.logicalSize.width}×${state.logicalSize.height}`;

    const locked = Boolean(state.takeoverActive);
    el.statusDot.className = 'status-dot ' + (locked ? 'takeover' : (active || state.standaloneMode ? 'online' : 'offline'));
    el.takeoverBtn.classList.toggle('takeover-locked', locked);
    el.takeoverBtn.setAttribute('aria-pressed', locked ? 'true' : 'false');
    el.monitorFrame.classList.toggle('takeover-ring', locked);
    el.screenSurface.classList.toggle('interactive', locked);
    if (!locked && !state.pointerDown) {
      el.coordReadout.textContent = `${state.logicalSize.width}×${state.logicalSize.height}`;
    }
    el.lockShackle.setAttribute('d', locked
      ? 'M5.4 7.2V5.1a2.6 2.6 0 0 1 5.2 0v2.1'
      : 'M5.4 7.2V5.1a2.6 2.6 0 0 1 5.0-0.9');

    if (isZh) {
      el.takeoverLabel.textContent = locked ? '接管中 · 释放' : '接管操控';
    } else {
      el.takeoverLabel.textContent = locked ? 'Takeover · Release' : 'Takeover Control';
    }

    if (locked) {
      setStatus(isZh ? '人工接管已锁定 · 画布直连点击/拖拽/滚轮/键入/粘贴' : 'Takeover active · click, drag, wheel, keys & paste enabled', 'amber');
    } else {
      setStatus(state.live
        ? (state.streamActive ? (isZh ? '实时画面 · 只读观察' : 'Live stream · Read-only') : (isZh ? '实时预览 · 只读观察' : 'Live · Read-only'))
        : (isZh ? '已暂停' : 'Paused'));
    }
  }

  function renderActionOverlay(act) {
    const actionSvg = document.getElementById('actionSvg');
    const { vw, vh } = currentSvgSize();
    actionSvg.setAttribute('viewBox', `0 0 ${vw} ${vh}`);
    actionSvg.removeAttribute('preserveAspectRatio');
    if (!act || typeof act.normX !== 'number' || typeof act.normY !== 'number') {
      el.reticleGroup.setAttribute('hidden', '');
      el.dragVector.setAttribute('hidden', '');
      return;
    }
    const x = (act.normX / 1000) * vw;
    const y = (act.normY / 1000) * vh;
    el.reticleGroup.removeAttribute('hidden');
    el.retH.setAttribute('x1', String(Math.max(0, x - 18)));
    el.retH.setAttribute('y1', String(y));
    el.retH.setAttribute('x2', String(Math.min(vw, x + 18)));
    el.retH.setAttribute('y2', String(y));
    el.retV.setAttribute('x1', String(x));
    el.retV.setAttribute('y1', String(Math.max(0, y - 18)));
    el.retV.setAttribute('x2', String(x));
    el.retV.setAttribute('y2', String(Math.min(vh, y + 18)));
    el.retDot.setAttribute('cx', String(x));
    el.retDot.setAttribute('cy', String(y));
    el.retDot.setAttribute('r', '7.5');

    if (typeof act.startNormX === 'number' && typeof act.startNormY === 'number') {
      const sx = (act.startNormX / 1000) * vw;
      const sy = (act.startNormY / 1000) * vh;
      el.dragVector.removeAttribute('hidden');
      el.dragVector.setAttribute('x1', String(sx));
      el.dragVector.setAttribute('y1', String(sy));
      el.dragVector.setAttribute('x2', String(x));
      el.dragVector.setAttribute('y2', String(y));
    } else {
      el.dragVector.setAttribute('hidden', '');
    }
  }

  function renderTargetSelect() {
    el.targetSelect.replaceChildren();
    const locals = state.targets.filter((t) => t.providerId === 'local');
    const remotes = state.targets.filter((t) => t.providerId !== 'local');

    const addGroup = (label, items) => {
      if (!items.length) return;
      const og = document.createElement('optgroup');
      og.label = label;
      for (const item of items) {
        const opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = item.label || item.id;
        if (item.id === state.selectedTargetId) opt.selected = true;
        og.appendChild(opt);
      }
      el.targetSelect.appendChild(og);
    };

    addGroup(isZh ? '本机桌面' : 'Local Desktop', locals);
    addGroup(isZh ? '远控目标提供方' : 'Remote Providers', remotes);

    if (!locals.length && !remotes.length) {
      const opt = document.createElement('option');
      opt.value = 'local:primary';
      opt.textContent = 'Primary Display';
      el.targetSelect.appendChild(opt);
    }
  }

  async function drawBlobToCanvas(blob) {
    if (typeof createImageBitmap === 'function') {
      const bmp = await createImageBitmap(blob);
      try {
        if (el.screenCanvas.width !== bmp.width || el.screenCanvas.height !== bmp.height) {
          el.screenCanvas.width = bmp.width;
          el.screenCanvas.height = bmp.height;
        }
        ctx.drawImage(bmp, 0, 0);
      } finally {
        bmp.close();
      }
      return;
    }
    const url = URL.createObjectURL(blob);
    try {
      await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          el.screenCanvas.width = img.naturalWidth || 1280;
          el.screenCanvas.height = img.naturalHeight || 720;
          ctx.drawImage(img, 0, 0);
          resolve();
        };
        img.onerror = reject;
        img.src = url;
      });
    } finally {
      URL.revokeObjectURL(url);
    }
  }

  async function drawDataUrl(dataUrl) {
    const comma = dataUrl.indexOf(',');
    if (comma === -1) return;
    const raw = atob(dataUrl.slice(comma + 1));
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i += 1) bytes[i] = raw.charCodeAt(i);
    await drawBlobToCanvas(new Blob([bytes], { type: 'image/png' }));
  }

  function stopStream(sendClose = true) {
    state.streamGen += 1;
    state.streamActive = false;
    if (state.streamPort) {
      const port = state.streamPort;
      state.streamPort = null;
      port.onmessage = null;
      try {
        if (sendClose) port.postMessage({ __kikiStreamControl: 'close' });
        port.close();
      } catch {}
    }
  }

  function clearPoll() {
    if (state.pollTimer) {
      clearTimeout(state.pollTimer);
      state.pollTimer = null;
    }
    if (state.immediateTimer) {
      clearTimeout(state.immediateTimer);
      state.immediateTimer = null;
    }
  }

  async function captureSingleFrame() {
    if (state.frameInFlight || isDisconnectedStandalone()) return;
    state.frameInFlight = true;
    try {
      const res = await panelCall('frame', { targetId: state.selectedTargetId, maxWidth: 1280 });
      const frameUrl = res?.dataUrl || (res?.imageBase64 ? `data:${res.mimeType || 'image/png'};base64,${res.imageBase64}` : '');
      if (res?.ok && frameUrl) {
        await drawDataUrl(frameUrl);
        if (res.logicalSize?.width && res.logicalSize?.height) {
          const changed = res.logicalSize.width !== state.logicalSize.width
            || res.logicalSize.height !== state.logicalSize.height;
          state.logicalSize = res.logicalSize;
          if (changed) layoutFrame();
        }
        state.takeoverActive = Boolean(res.takeoverActive);
        state.controlledBy = res.controlledBy || 'agent';
        if (res.lastAction) {
          state.lastAction = res.lastAction;
          renderActionOverlay(res.lastAction);
        }
        updateChrome();
      }
    } catch (err) {
      setStatus(err.message || 'Capture failed', 'error');
    } finally {
      state.frameInFlight = false;
    }
  }

  function requestImmediateFrame(delayMs = 45) {
    if (state.streamActive || isDisconnectedStandalone()) return;
    if (state.immediateTimer) clearTimeout(state.immediateTimer);
    state.immediateTimer = setTimeout(() => {
      state.immediateTimer = null;
      void captureSingleFrame();
    }, delayMs);
  }

  async function pollOnce() {
    if (!state.live || state.streamActive || document.hidden || isDisconnectedStandalone()) return;
    const t0 = performance.now();
    await captureSingleFrame();
    if (state.live && !state.streamActive && !document.hidden && !isDisconnectedStandalone()) {
      const wait = Math.max(40, POLL_INTERVAL_MS - (performance.now() - t0));
      state.pollTimer = setTimeout(() => { void pollOnce(); }, wait);
    }
  }

  async function connectTransport() {
    stopStream(true);
    clearPoll();
    if (!state.live || isDisconnectedStandalone()) {
      updateChrome();
      return;
    }
    const gen = ++state.streamGen;
    try {
      const { result, port } = await openStream('screen', {
        targetId: state.selectedTargetId,
        maxWidth: 1280,
        fps: 8,
      });
      if (gen !== state.streamGen || !port) {
        void pollOnce();
        return;
      }
      state.streamPort = port;
      state.streamActive = true;
      if (result?.width && result?.height) {
        state.logicalSize = { width: result.width, height: result.height };
        state.scaleFactor = result.scaleFactor || 1;
        layoutFrame();
      }
      if (result?.takeoverActive !== undefined) {
        state.takeoverActive = Boolean(result.takeoverActive);
      }
      updateChrome();

      port.onmessage = (ev) => {
        if (gen !== state.streamGen) return;
        const payload = ev.data;
        if (payload instanceof ArrayBuffer && payload.byteLength > 16) {
          const dv = new DataView(payload);
          if (dv.getUint8(0) === FRAME_MAGIC && dv.getUint8(1) === PNG_KIND) {
            const pngBytes = new Uint8Array(payload, 16);
            void drawBlobToCanvas(new Blob([pngBytes], { type: 'image/png' }));
          }
          return;
        }
        const msg = typeof payload === 'string' ? (() => { try { return JSON.parse(payload); } catch { return null; } })() : payload;
        if (!msg) return;
        if (msg.__kikiStreamEvent === 'close') {
          stopStream(false);
          if (state.live) void pollOnce();
          return;
        }
        if (msg.type === 'frameMeta') {
          if (msg.logicalSize?.width) state.logicalSize = msg.logicalSize;
          state.takeoverActive = Boolean(msg.takeoverActive);
          updateChrome();
        } else if (msg.type === 'takeover' && (!msg.targetId || msg.targetId === state.selectedTargetId)) {
          state.takeoverActive = Boolean(msg.takeoverActive);
          state.controlledBy = msg.controlledBy || 'agent';
          updateChrome();
        } else if (msg.type === 'action' && msg.lastAction) {
          state.lastAction = msg.lastAction;
          renderActionOverlay(msg.lastAction);
        }
      };
      if (typeof port.start === 'function') port.start();
    } catch {
      void pollOnce();
    }
  }

  async function loadTargets() {
    if (isDisconnectedStandalone()) {
      renderStandalonePlaceholder();
      return;
    }
    try {
      const res = await panelCall('state');
      if (res?.ok) {
        state.targets = res.targets || [];
        state.selectedTargetId = res.selectedTargetId || 'local:primary';
        state.takeoverActive = Boolean(res.takeoverActive);
        state.controlledBy = res.controlledBy || 'agent';
        state.lastAction = res.lastAction || null;
        renderTargetSelect();
        renderActionOverlay(state.lastAction);
        updateChrome();
      }
    } catch (err) {
      setStatus(err.message || 'Unavailable', 'error');
    }
  }

  function renderStandalonePlaceholder() {
    el.screenCanvas.width = 1280;
    el.screenCanvas.height = 720;
    ctx.fillStyle = '#141518';
    ctx.fillRect(0, 0, 1280, 720);
    ctx.strokeStyle = 'rgba(88, 168, 143, 0.28)';
    ctx.lineWidth = 2;
    ctx.strokeRect(48, 48, 1184, 624);
    renderTargetSelect();
    layoutFrame();
    updateChrome();
  }

  function updateCoordinateDisplay(pt) {
    if (!pt) {
      el.coordReadout.textContent = `${state.logicalSize.width}×${state.logicalSize.height}`;
      return;
    }
    el.coordReadout.textContent = `${pt.targetX}, ${pt.targetY} px · ${pt.normX}, ${pt.normY}`;
  }

  function spawnPulse(pctX, pctY, isHuman = true) {
    const dot = document.createElement('div');
    dot.className = 'click-pulse' + (isHuman ? ' human' : '');
    dot.style.left = `${pctX}%`;
    dot.style.top = `${pctY}%`;
    el.screenSurface.appendChild(dot);
    setTimeout(() => dot.remove(), 390);
  }

  async function toggleTakeover(explicitNext) {
    const nextActive = typeof explicitNext === 'boolean' ? explicitNext : !state.takeoverActive;
    state.takeoverActive = nextActive;
    state.controlledBy = nextActive ? 'human' : 'agent';
    if (nextActive) {
      el.screenSurface.focus({ preventScroll: true });
    }
    updateChrome();
    if (!isDisconnectedStandalone()) {
      const res = await panelCall('takeover', {
        targetId: state.selectedTargetId,
        active: nextActive,
      }).catch(() => null);
      if (res && typeof res.takeoverActive === 'boolean') {
        state.takeoverActive = res.takeoverActive;
        state.controlledBy = res.controlledBy || (res.takeoverActive ? 'human' : 'agent');
        updateChrome();
      }
    }
  }

  async function dispatchHumanInput(payload) {
    if (!state.takeoverActive) return;
    if (state.streamActive && state.streamPort) {
      try {
        state.streamPort.postMessage(JSON.stringify({ type: 'humanAction', ...payload }));
        return;
      } catch {}
    }
    if (!isDisconnectedStandalone()) {
      await panelCall('action', { targetId: state.selectedTargetId, ...payload }).catch((err) => {
        setStatus(err.message || 'Input failed', 'error');
      });
      requestImmediateFrame(40);
    }
  }

  el.screenSurface.addEventListener('contextmenu', (ev) => ev.preventDefault());

  el.screenSurface.addEventListener('pointerleave', () => {
    if (!state.pointerDown) updateCoordinateDisplay(null);
  });

  el.screenSurface.addEventListener('pointermove', (ev) => {
    const pt = mapSurfaceEvent(ev);
    if ((state.takeoverActive && pt.inside) || state.pointerDown) {
      updateCoordinateDisplay(pt);
    } else if (!state.pointerDown) {
      updateCoordinateDisplay(null);
    }
    if (state.pointerDown && state.pointerDown.pointerId === ev.pointerId) {
      const dist = Math.hypot(pt.pxX - state.pointerDown.pxX, pt.pxY - state.pointerDown.pxY);
      if (dist > 8) {
        renderActionOverlay({
          startNormX: state.pointerDown.normX,
          startNormY: state.pointerDown.normY,
          normX: pt.normX,
          normY: pt.normY,
        });
      }
    }
  });

  el.screenSurface.addEventListener('pointerdown', (ev) => {
    if (!state.takeoverActive) {
      setStatus(isZh ? '只读观察中 · 点击顶栏「接管操控」或按 Alt+T 后直接点击画面' : 'Read-only · click Takeover Control (Alt+T) to interact', 'amber');
      return;
    }
    const pt = mapSurfaceEvent(ev);
    if (!pt.inside) return;

    el.screenSurface.focus({ preventScroll: true });
    el.screenSurface.setPointerCapture(ev.pointerId);
    const button = ev.button === 2 ? 'right' : ev.button === 1 ? 'middle' : 'left';
    const modifiers = [];
    if (ev.ctrlKey) modifiers.push('ctrl');
    if (ev.shiftKey) modifiers.push('shift');
    if (ev.altKey) modifiers.push('alt');
    if (ev.metaKey) modifiers.push('meta');

    state.pointerDown = { ...pt, button, modifiers, pointerId: ev.pointerId, at: Date.now() };
    updateCoordinateDisplay(pt);
    spawnPulse(pt.pctX, pt.pctY, true);
  });

  el.screenSurface.addEventListener('pointerup', (ev) => {
    if (!state.pointerDown || state.pointerDown.pointerId !== ev.pointerId) return;
    const start = state.pointerDown;
    state.pointerDown = null;
    const end = mapSurfaceEvent(ev);
    const dist = Math.hypot(end.pxX - start.pxX, end.pxY - start.pxY);

    if (dist > 10) {
      spawnPulse(end.pctX, end.pctY, true);
      renderActionOverlay({ startNormX: start.normX, startNormY: start.normY, normX: end.normX, normY: end.normY });
      void dispatchHumanInput({
        kind: 'drag',
        startNormX: start.normX,
        startNormY: start.normY,
        endNormX: end.normX,
        endNormY: end.normY,
        button: start.button,
        durationMs: Math.min(800, Math.max(120, Date.now() - start.at)),
      });
    } else {
      renderActionOverlay({ normX: end.normX, normY: end.normY });
      void dispatchHumanInput({
        kind: 'click',
        normX: end.normX,
        normY: end.normY,
        button: start.button,
        count: ev.detail >= 2 ? 2 : 1,
        ...(start.modifiers.length > 0 ? { modifiers: start.modifiers } : {}),
      });
    }
  });

  el.screenSurface.addEventListener('pointercancel', () => {
    state.pointerDown = null;
  });

  el.screenSurface.addEventListener('wheel', (ev) => {
    if (!state.takeoverActive) return;
    const pt = mapSurfaceEvent(ev);
    if (!pt.inside) return;
    ev.preventDefault();
    const deltaY = Math.max(-6, Math.min(6, ev.deltaY / 100));
    const deltaX = Math.max(-6, Math.min(6, ev.deltaX / 100));
    if (deltaX === 0 && deltaY === 0) return;
    void dispatchHumanInput({ kind: 'scroll', normX: pt.normX, normY: pt.normY, deltaX, deltaY });
  }, { passive: false });

  el.screenSurface.addEventListener('keydown', (ev) => {
    if (!state.takeoverActive) return;
    if (ev.key === 'Shift' || ev.key === 'Control' || ev.key === 'Alt' || ev.key === 'Meta') return;
    if (ev.altKey && !ev.ctrlKey && !ev.metaKey && ev.key.toLowerCase() === 't') return;

    // Allow Ctrl+V / Cmd+V to trigger browser paste event first; fall back to remote Ctrl+V if non-text
    if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && ev.key.toLowerCase() === 'v') {
      const stamp = Date.now();
      setTimeout(() => {
        if (state.pasteHandledAt < stamp) {
          void dispatchHumanInput({ kind: 'key', key: ev.metaKey ? 'Meta+V' : 'Ctrl+V' });
        }
      }, 45);
      return;
    }

    ev.preventDefault();
    const mods = [];
    if (ev.ctrlKey) mods.push('Ctrl');
    if (ev.altKey) mods.push('Alt');
    if (ev.shiftKey && (ev.key.length > 1 || ev.ctrlKey || ev.altKey || ev.metaKey)) mods.push('Shift');
    if (ev.metaKey) mods.push('Meta');

    if (mods.length === 0 && ev.key.length === 1) {
      void dispatchHumanInput({ kind: 'type', text: ev.key });
      return;
    }
    const keyMap = {
      ArrowUp: 'Up',
      ArrowDown: 'Down',
      ArrowLeft: 'Left',
      ArrowRight: 'Right',
      ' ': 'Space',
    };
    const main = keyMap[ev.key] || (ev.key.length === 1 ? ev.key.toUpperCase() : ev.key);
    void dispatchHumanInput({ kind: 'key', key: [...mods, main].join('+') });
  });

  window.addEventListener('paste', (ev) => {
    if (!state.takeoverActive) return;
    if (document.activeElement !== el.screenSurface) return;
    const text = ev.clipboardData?.getData('text/plain');
    if (!text) return;
    ev.preventDefault();
    state.pasteHandledAt = Date.now();
    void dispatchHumanInput({ kind: 'paste', text });
    setStatus(isZh ? `已粘贴 ${text.length} 字符到远端焦点` : `Pasted ${text.length} chars to target`, 'amber');
  });

  window.addEventListener('keydown', (ev) => {
    if (ev.altKey && !ev.ctrlKey && !ev.metaKey && ev.key.toLowerCase() === 't') {
      ev.preventDefault();
      void toggleTakeover();
    }
  });

  el.coordReadout.addEventListener('click', async () => {
    const ok = await copyTextSafe(el.coordReadout.textContent);
    if (ok) {
      setStatus(isZh ? '已复制坐标' : 'Copied coordinates', state.takeoverActive ? 'amber' : 'normal');
    }
  });

  el.targetSelect.addEventListener('change', async () => {
    state.selectedTargetId = el.targetSelect.value;
    if (!isDisconnectedStandalone()) {
      const res = await panelCall('select', { targetId: state.selectedTargetId }).catch(() => null);
      if (res?.target) {
        state.takeoverActive = Boolean(res.target.takeoverActive);
        state.controlledBy = res.target.controlledBy || 'agent';
      }
      if (state.streamActive && state.streamPort) {
        state.streamPort.postMessage(JSON.stringify({ type: 'selectTarget', targetId: state.selectedTargetId }));
      } else {
        await connectTransport();
      }
    }
    updateChrome();
  });

  el.liveBtn.addEventListener('click', () => {
    state.live = !state.live;
    el.liveBtn.classList.toggle('active', state.live);
    if (state.live) void connectTransport();
    else {
      stopStream(true);
      clearPoll();
      updateChrome();
    }
  });

  el.refreshBtn.addEventListener('click', async () => {
    await loadTargets();
    if (!state.streamActive) await captureSingleFrame();
  });

  el.gridBtn.addEventListener('click', () => {
    state.grid = !state.grid;
    safeStorage.set('kiki.cua.grid', state.grid ? '1' : '0');
    el.gridBtn.classList.toggle('active', state.grid);
    el.gridSvg.toggleAttribute('hidden', !state.grid);
  });

  el.takeoverBtn.addEventListener('click', () => {
    void toggleTakeover();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearPoll();
    else if (state.live && !state.streamActive) void pollOnce();
  });

  window.addEventListener('pagehide', () => stopStream(true));

  async function boot() {
    if (booted) return;
    booted = true;
    el.gridBtn.classList.toggle('active', state.grid);
    el.gridSvg.toggleAttribute('hidden', !state.grid);
    buildGridRulerSvg();
    layoutFrame();
    await loadTargets();
    await connectTransport();
  }

  setTimeout(() => { if (!booted) void boot(); }, 180);
})();
</script>
</body>
</html>
