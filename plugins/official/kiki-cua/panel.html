<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Computer Preview</title>
<style>

  :root {
    --accent-soft: rgba(44, 94, 79, 0.12);
    --amber: #b85d19;
    --amber-soft: rgba(184, 93, 25, 0.15);
    --bezel: #18181a;
    --bezel-edge: rgba(27, 26, 23, 0.24);

    --font: var(--sans);
  }
  @media (prefers-color-scheme: dark) {

      --accent-soft: rgba(88, 168, 143, 0.16);
      --amber: #e5934a;
      --amber-soft: rgba(229, 147, 74, 0.19);
      --bezel: #0c0c0e;
      --bezel-edge: rgba(255, 255, 255, 0.12);

  }
  :root[data-theme="dark"] {
    --accent-soft: rgba(88, 168, 143, 0.16);
    --amber: #e5934a;
    --amber-soft: rgba(229, 147, 74, 0.19);
    --bezel: #0c0c0e;
    --bezel-edge: rgba(255, 255, 255, 0.12);

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  button, select { font: inherit; color: inherit; }
  .shell {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 42px;
    padding: 0 12px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .picker-group {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
    flex: 1;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: var(--ink-faint);
    flex-shrink: 0;
    transition: background 140ms ease;
  }
  .status-dot.online { background: var(--ok); }
  .status-dot.takeover { background: var(--amber); }
  .status-dot.offline { background: var(--danger); }
  .target-select-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    min-width: 0;
  }
  .target-select {
    appearance: none;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 7px;
    height: 27px;
    padding: 0 25px 0 9px;
    font-size: 12px;
    font-weight: 500;
    max-width: 280px;
    min-width: 128px;
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
    cursor: pointer;
    outline: none;
  }
  .target-select:focus-visible { border-color: var(--accent); }
  .chevron {
    pointer-events: none;
    margin-left: -20px;
    margin-right: 6px;
    color: var(--ink-faint);
    display: flex;
  }
  .res-pill {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 7px;
    border-radius: 5px;
    background: var(--panel);
    color: var(--ink-soft);
    border: 1px solid var(--line);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 27px;
    padding: 0 9px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .pill-btn:hover { background: var(--panel); color: var(--ink); }
  .pill-btn:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 1px; }
  .pill-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .pill-btn.takeover-locked {
    background: var(--amber-soft);
    border-color: var(--amber);
    color: var(--amber);
  }
  .icon-btn {
    width: 27px;
    padding: 0;
    justify-content: center;
  }
  .stage {
    position: relative;
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .monitor-frame {
    position: relative;
    background: var(--bezel);
    border: 1.5px solid var(--bezel-edge);
    border-radius: 10px;
    padding: 4px;
    box-shadow: var(--shadow);
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }
  .monitor-frame.takeover-ring {
    border-color: var(--amber);
    box-shadow: 0 0 0 2px var(--amber), 0 0 0 5px var(--amber-soft), var(--shadow);
  }
  .screen-surface {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 6px;
    overflow: hidden;
    background: #0d0d0f;
    cursor: default;
    outline: none;
    touch-action: none;
  }
  .screen-surface.interactive {
    cursor: crosshair;
  }
  .screen-surface canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
  }
  .overlay-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .click-pulse {
    position: absolute;
    width: 22px;
    height: 22px;
    margin-left: -11px;
    margin-top: -11px;
    border-radius: 999px;
    border: 1.8px solid rgba(255, 255, 255, 0.92);
    background: rgba(88, 168, 143, 0.32);
    pointer-events: none;
    animation: pulseOut 380ms ease-out forwards;
  }
  .click-pulse.human {
    border-color: rgba(255, 248, 238, 0.95);
    background: rgba(229, 147, 74, 0.36);
  }
  @keyframes pulseOut {
    0% { transform: scale(0.38); opacity: 1; }
    100% { transform: scale(1.55); opacity: 0; }
  }
  .coord-badge {
    position: absolute;
    left: 8px;
    bottom: 8px;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(18, 18, 16, 0.78);
    color: #fcfbf8;
    font-family: var(--mono);
    font-size: 10.5px;
    line-height: 1.35;
    pointer-events: none;
    backdrop-filter: blur(4px);
  }
  .statusbar {
    height: 25px;
    padding: 0 12px;
    border-top: 1px solid var(--line);
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--ink-faint);
    flex-shrink: 0;
    gap: 10px;
  }
  .status-msg {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .status-msg.amber { color: var(--amber); font-weight: 500; }
  .status-msg.err { color: var(--danger); }
  .coord-readout {
    font-family: var(--mono);
    white-space: nowrap;
    background: transparent;
    border: none;
    padding: 0;
    color: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .coord-readout:hover { color: var(--ink); }
  @media (max-width: 580px) {
    .topbar { gap: 5px; padding: 0 8px; }
    .res-pill { display: none; }
    .target-select-wrap { flex: 1 1 0; width: 100%; max-width: 100%; }
    .target-select { flex: 1 1 0; min-width: 0; width: 100%; max-width: 100%; padding: 0 22px 0 7px; }
  }

</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="picker-group">
      <span id="statusDot" class="status-dot"></span>
      <div class="target-select-wrap">
        <select id="targetSelect" class="target-select" aria-label="Target surface">
          <option value="local:primary">Primary Display</option>
        </select>
        <span class="chevron" aria-hidden="true">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M4.5 6.5L8 10l3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </div>
      <span id="resPill" class="res-pill">--</span>
    </div>

    <button id="takeoverBtn" type="button" class="pill-btn" aria-pressed="false" title="Lock Human Takeover for direct click, drag, wheel, keyboard & paste control (Alt+T)">
      <svg id="lockIcon" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.2" y="7.2" width="9.6" height="6.6" rx="1.6"/>
        <path id="lockShackle" d="M5.4 7.2V5.1a2.6 2.6 0 0 1 5.0-0.9"/>
      </svg>
      <span id="takeoverLabel">Takeover Control</span>
    </button>

    <button id="gridBtn" type="button" class="pill-btn" title="Toggle 0..1000 coordinate grid">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="1.5"/><path d="M6 2v12M10 2v12M2 6h12M2 10h12"/></svg>
      <span>Grid</span>
    </button>

    <button id="liveBtn" type="button" class="pill-btn active" title="Toggle live stream">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3.2" fill="currentColor"/></svg>
      <span>Live</span>
    </button>

    <button id="refreshBtn" type="button" class="pill-btn icon-btn" title="Capture fresh frame" aria-label="Refresh frame">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3.6H9.9"/></svg>
    </button>
  </header>

  <main id="stage" class="stage">
    <div id="monitorFrame" class="monitor-frame" style="width:640px;height:360px">
      <div id="screenSurface" class="screen-surface" tabindex="0" aria-label="Target desktop canvas">
        <canvas id="screenCanvas" width="1280" height="720"></canvas>
        <svg id="gridSvg" class="overlay-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none" hidden></svg>
        <svg id="actionSvg" class="overlay-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
          <defs>
            <marker id="dragHead" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M1 1L9 5L1 9z" fill="#e5934a"/>
            </marker>
          </defs>
          <line id="dragVector" x1="0" y1="0" x2="0" y2="0" stroke="#e5934a" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#dragHead)" hidden/>
          <g id="reticleGroup" hidden>
            <line id="retH" x1="0" y1="0" x2="0" y2="0" stroke="#58a88f" stroke-width="1.6"/>
            <line id="retV" x1="0" y1="0" x2="0" y2="0" stroke="#58a88f" stroke-width="1.6"/>
            <circle id="retDot" cx="0" cy="0" r="6.5" fill="none" stroke="#58a88f" stroke-width="2"/>
          </g>
        </svg>
      </div>
    </div>
  </main>

  <footer class="statusbar">
    <span id="statusMsg" class="status-msg">Ready</span>
    <button id="coordReadout" type="button" class="coord-readout" title="Click to copy target coordinates">--</button>
  </footer>
</div>

<script>
(() => {

    const safeStorage = createSafeStorage();

    async function copyTextSafe(text, options = {}) {

      const feedbackEl = options.labelEl || options.button || null;
      const copiedLabel = typeof options.copiedLabel === 'string' ? options.copiedLabel : '';
      const resetMs = Number.isFinite(options.resetMs) ? options.resetMs : 1200;
      const markCopied = () => {
        if (!feedbackEl || !copiedLabel) return;
        const prev = feedbackEl.textContent;
        feedbackEl.textContent = copiedLabel;
        if (typeof setTimeout === 'function') {
          setTimeout(() => {
            feedbackEl.textContent = prev;
          }, resetMs);

      try {

          ? options.navigatorObj

          ta.style.top = '-9999px';
          ta.style.opacity = '0';
          ta.style.pointerEvents = 'none';

        if (typeof ta.select === 'function') ta.select();
        let ok = false;

          ok = Boolean(doc.execCommand('copy'));
          if (ok) markCopied();
        } catch {}
        if (typeof ta.remove === 'function') ta.remove();

      } catch {

      }

    function randomId(prefix = '') {
      const c = typeof crypto !== 'undefined' ? crypto : null;
      let core = '';

        c.getRandomValues(bytes);
        core = Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');

        core = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
      }

    /**
     * Unified 4-way presentation and theme synchronization for Kiki plugin panels:
     * 1) URL ?theme=dark|light initial hydration
     * 2) Host theme / colorScheme switching (dark / light / auto)

      const el = root || (typeof document !== 'undefined' ? document.documentElement : null);

        return theme;

        if (el.dataset) delete el.dataset.theme;
        return 'auto';
      }
      return null;
    }

    function initThemeFromUrl(options = {}) {

        if (typeof URLSearchParams !== 'function') return null;
        let urlTheme = null;
        if (options.search !== undefined) {
          urlTheme = new URLSearchParams(options.search).get('theme');
        } else if (typeof window !== 'undefined' && window.location && typeof window.location.search === 'string') {

        (pres && (pres.theme || pres.colorScheme)) || opts.fallbackTheme,
        el,
      );

    }, delayMs);
  }

  async function pollOnce() {
    if (!state.live || state.streamActive || document.hidden || isDisconnectedStandalone()) return;
    const t0 = performance.now();
    await captureSingleFrame();
    if (state.live && !state.streamActive && !document.hidden && !isDisconnectedStandalone()) {
      const wait = Math.max(40, POLL_INTERVAL_MS - (performance.now() - t0));
      state.pollTimer = setTimeout(() => { void pollOnce(); }, wait);
    }
  }

  async function connectTransport() {
    stopStream(true);
    clearPoll();
    if (!state.live || isDisconnectedStandalone()) {
      updateChrome();
      return;
    }
    const gen = ++state.streamGen;
    try {
      const { result, port } = await openStream('screen', {
        targetId: state.selectedTargetId,
        maxWidth: 1280,
        fps: 8,
      });
      if (gen !== state.streamGen || !port) {
        void pollOnce();
        return;
      }
      state.streamPort = port;
      state.streamActive = true;
      if (result?.width && result?.height) {
        state.logicalSize = { width: result.width, height: result.height };
        state.scaleFactor = result.scaleFactor || 1;
        layoutFrame();
      }
      if (result?.takeoverActive !== undefined) {
        state.takeoverActive = Boolean(result.takeoverActive);
      }
      updateChrome();

      port.onmessage = (ev) => {
        if (gen !== state.streamGen) return;
        const payload = ev.data;
        if (payload instanceof ArrayBuffer && payload.byteLength > 16) {
          const dv = new DataView(payload);
          if (dv.getUint8(0) === FRAME_MAGIC && dv.getUint8(1) === PNG_KIND) {
            const pngBytes = new Uint8Array(payload, 16);
            void drawBlobToCanvas(new Blob([pngBytes], { type: 'image/png' }));
          }
          return;
        }
        const msg = typeof payload === 'string' ? (() => { try { return JSON.parse(payload); } catch { return null; } })() : payload;
        if (!msg) return;
        if (msg.__kikiStreamEvent === 'close') {
          stopStream(false);
          if (state.live) void pollOnce();
          return;
        }
        if (msg.type === 'frameMeta') {
          if (msg.logicalSize?.width) state.logicalSize = msg.logicalSize;
          state.takeoverActive = Boolean(msg.takeoverActive);
          updateChrome();
        } else if (msg.type === 'takeover' && (!msg.targetId || msg.targetId === state.selectedTargetId)) {
          state.takeoverActive = Boolean(msg.takeoverActive);
          state.controlledBy = msg.controlledBy || 'agent';
          updateChrome();
        } else if (msg.type === 'action' && msg.lastAction) {
          state.lastAction = msg.lastAction;
          renderActionOverlay(msg.lastAction);
        }
      };
      if (typeof port.start === 'function') port.start();
    } catch {
      void pollOnce();
    }
  }

  async function loadTargets() {
    if (isDisconnectedStandalone()) {
      renderStandalonePlaceholder();
      return;
    }
    try {
      const res = await panelCall('state');
      if (res?.ok) {
        state.targets = res.targets || [];
        state.selectedTargetId = res.selectedTargetId || 'local:primary';
        state.takeoverActive = Boolean(res.takeoverActive);
        state.controlledBy = res.controlledBy || 'agent';
        state.lastAction = res.lastAction || null;
        renderTargetSelect();
        renderActionOverlay(state.lastAction);
        updateChrome();
      }
    } catch (err) {
      setStatus(err.message || 'Unavailable', 'error');
    }
  }

  function renderStandalonePlaceholder() {
    el.screenCanvas.width = 1280;
    el.screenCanvas.height = 720;
    ctx.fillStyle = '#141518';
    ctx.fillRect(0, 0, 1280, 720);
    ctx.strokeStyle = 'rgba(88, 168, 143, 0.28)';
    ctx.lineWidth = 2;
    ctx.strokeRect(48, 48, 1184, 624);
    renderTargetSelect();
    layoutFrame();
    updateChrome();
  }

  function updateCoordinateDisplay(pt) {
    if (!pt) {
      el.coordReadout.textContent = `${state.logicalSize.width}×${state.logicalSize.height}`;
      return;
    }
    el.coordReadout.textContent = `${pt.targetX}, ${pt.targetY} px · ${pt.normX}, ${pt.normY}`;
  }

  function spawnPulse(pctX, pctY, isHuman = true) {
    const dot = document.createElement('div');
    dot.className = 'click-pulse' + (isHuman ? ' human' : '');
    dot.style.left = `${pctX}%`;
    dot.style.top = `${pctY}%`;
    el.screenSurface.appendChild(dot);
    setTimeout(() => dot.remove(), 390);
  }

  async function toggleTakeover(explicitNext) {
    const nextActive = typeof explicitNext === 'boolean' ? explicitNext : !state.takeoverActive;
    state.takeoverActive = nextActive;
    state.controlledBy = nextActive ? 'human' : 'agent';
    if (nextActive) {
      el.screenSurface.focus({ preventScroll: true });
    }
    updateChrome();
    if (!isDisconnectedStandalone()) {
      const res = await panelCall('takeover', {
        targetId: state.selectedTargetId,
        active: nextActive,
      }).catch(() => null);
      if (res && typeof res.takeoverActive === 'boolean') {
        state.takeoverActive = res.takeoverActive;
        state.controlledBy = res.controlledBy || (res.takeoverActive ? 'human' : 'agent');
        updateChrome();
      }
    }
  }

  async function dispatchHumanInput(payload) {
    if (!state.takeoverActive) return;
    if (state.streamActive && state.streamPort) {
      try {
        state.streamPort.postMessage(JSON.stringify({ type: 'humanAction', ...payload }));
        return;
      } catch {}
    }
    if (!isDisconnectedStandalone()) {
      await panelCall('action', { targetId: state.selectedTargetId, ...payload }).catch((err) => {
        setStatus(err.message || 'Input failed', 'error');
      });
      requestImmediateFrame(40);
    }
  }

  el.screenSurface.addEventListener('contextmenu', (ev) => ev.preventDefault());

  el.screenSurface.addEventListener('pointerleave', () => {
    if (!state.pointerDown) updateCoordinateDisplay(null);
  });

  el.screenSurface.addEventListener('pointermove', (ev) => {
    const pt = mapSurfaceEvent(ev);
    if ((state.takeoverActive && pt.inside) || state.pointerDown) {
      updateCoordinateDisplay(pt);
    } else if (!state.pointerDown) {
      updateCoordinateDisplay(null);
    }
    if (state.pointerDown && state.pointerDown.pointerId === ev.pointerId) {
      const dist = Math.hypot(pt.pxX - state.pointerDown.pxX, pt.pxY - state.pointerDown.pxY);
      if (dist > 8) {
        renderActionOverlay({
          startNormX: state.pointerDown.normX,
          startNormY: state.pointerDown.normY,
          normX: pt.normX,
          normY: pt.normY,
        });
      }
    }
  });

  el.screenSurface.addEventListener('pointerdown', (ev) => {
    if (!state.takeoverActive) {
      setStatus(isZh ? '只读观察中 · 点击顶栏「接管操控」或按 Alt+T 后直接点击画面' : 'Read-only · click Takeover Control (Alt+T) to interact', 'amber');
      return;
    }
    const pt = mapSurfaceEvent(ev);
    if (!pt.inside) return;

    el.screenSurface.focus({ preventScroll: true });
    el.screenSurface.setPointerCapture(ev.pointerId);
    const button = ev.button === 2 ? 'right' : ev.button === 1 ? 'middle' : 'left';
    const modifiers = [];
    if (ev.ctrlKey) modifiers.push('ctrl');
    if (ev.shiftKey) modifiers.push('shift');
    if (ev.altKey) modifiers.push('alt');
    if (ev.metaKey) modifiers.push('meta');

    state.pointerDown = { ...pt, button, modifiers, pointerId: ev.pointerId, at: Date.now() };
    updateCoordinateDisplay(pt);
    spawnPulse(pt.pctX, pt.pctY, true);
  });

  el.screenSurface.addEventListener('pointerup', (ev) => {
    if (!state.pointerDown || state.pointerDown.pointerId !== ev.pointerId) return;
    const start = state.pointerDown;
    state.pointerDown = null;
    const end = mapSurfaceEvent(ev);
    const dist = Math.hypot(end.pxX - start.pxX, end.pxY - start.pxY);

    if (dist > 10) {
      spawnPulse(end.pctX, end.pctY, true);
      renderActionOverlay({ startNormX: start.normX, startNormY: start.normY, normX: end.normX, normY: end.normY });
      void dispatchHumanInput({
        kind: 'drag',
        startNormX: start.normX,
        startNormY: start.normY,
        endNormX: end.normX,
        endNormY: end.normY,
        button: start.button,
        durationMs: Math.min(800, Math.max(120, Date.now() - start.at)),
      });
    } else {
      renderActionOverlay({ normX: end.normX, normY: end.normY });
      void dispatchHumanInput({
        kind: 'click',
        normX: end.normX,
        normY: end.normY,
        button: start.button,
        count: ev.detail >= 2 ? 2 : 1,
        ...(start.modifiers.length > 0 ? { modifiers: start.modifiers } : {}),
      });
    }
  });

  el.screenSurface.addEventListener('pointercancel', () => {
    state.pointerDown = null;
  });

  el.screenSurface.addEventListener('wheel', (ev) => {
    if (!state.takeoverActive) return;
    const pt = mapSurfaceEvent(ev);
    if (!pt.inside) return;
    ev.preventDefault();
    const deltaY = Math.max(-6, Math.min(6, ev.deltaY / 100));
    const deltaX = Math.max(-6, Math.min(6, ev.deltaX / 100));
    if (deltaX === 0 && deltaY === 0) return;
    void dispatchHumanInput({ kind: 'scroll', normX: pt.normX, normY: pt.normY, deltaX, deltaY });
  }, { passive: false });

  el.screenSurface.addEventListener('keydown', (ev) => {
    if (!state.takeoverActive) return;
    if (ev.key === 'Shift' || ev.key === 'Control' || ev.key === 'Alt' || ev.key === 'Meta') return;
    if (ev.altKey && !ev.ctrlKey && !ev.metaKey && ev.key.toLowerCase() === 't') return;

    // Allow Ctrl+V / Cmd+V to trigger browser paste event first; fall back to remote Ctrl+V if non-text
    if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && ev.key.toLowerCase() === 'v') {
      const stamp = Date.now();
      setTimeout(() => {
        if (state.pasteHandledAt < stamp) {
          void dispatchHumanInput({ kind: 'key', key: ev.metaKey ? 'Meta+V' : 'Ctrl+V' });
        }
      }, 45);
      return;
    }

    ev.preventDefault();
    const mods = [];
    if (ev.ctrlKey) mods.push('Ctrl');
    if (ev.altKey) mods.push('Alt');
    if (ev.shiftKey && (ev.key.length > 1 || ev.ctrlKey || ev.altKey || ev.metaKey)) mods.push('Shift');
    if (ev.metaKey) mods.push('Meta');

    if (mods.length === 0 && ev.key.length === 1) {
      void dispatchHumanInput({ kind: 'type', text: ev.key });
      return;
    }
    const keyMap = {
      ArrowUp: 'Up',
      ArrowDown: 'Down',
      ArrowLeft: 'Left',
      ArrowRight: 'Right',
      ' ': 'Space',
    };
    const main = keyMap[ev.key] || (ev.key.length === 1 ? ev.key.toUpperCase() : ev.key);
    void dispatchHumanInput({ kind: 'key', key: [...mods, main].join('+') });
  });

  window.addEventListener('paste', (ev) => {
    if (!state.takeoverActive) return;
    if (document.activeElement !== el.screenSurface) return;
    const text = ev.clipboardData?.getData('text/plain');
    if (!text) return;
    ev.preventDefault();
    state.pasteHandledAt = Date.now();
    void dispatchHumanInput({ kind: 'paste', text });
    setStatus(isZh ? `已粘贴 ${text.length} 字符到远端焦点` : `Pasted ${text.length} chars to target`, 'amber');
  });

  window.addEventListener('keydown', (ev) => {
    if (ev.altKey && !ev.ctrlKey && !ev.metaKey && ev.key.toLowerCase() === 't') {
      ev.preventDefault();
      void toggleTakeover();
    }
  });

  el.coordReadout.addEventListener('click', async () => {
    const ok = await copyTextSafe(el.coordReadout.textContent);
    if (ok) {
      setStatus(isZh ? '已复制坐标' : 'Copied coordinates', state.takeoverActive ? 'amber' : 'normal');
    }
  });

  el.targetSelect.addEventListener('change', async () => {
    state.selectedTargetId = el.targetSelect.value;
    if (!isDisconnectedStandalone()) {
      const res = await panelCall('select', { targetId: state.selectedTargetId }).catch(() => null);
      if (res?.target) {
        state.takeoverActive = Boolean(res.target.takeoverActive);
        state.controlledBy = res.target.controlledBy || 'agent';
      }
      if (state.streamActive && state.streamPort) {
        state.streamPort.postMessage(JSON.stringify({ type: 'selectTarget', targetId: state.selectedTargetId }));
      } else {
        await connectTransport();
      }
    }
    updateChrome();
  });

  el.liveBtn.addEventListener('click', () => {
    state.live = !state.live;
    el.liveBtn.classList.toggle('active', state.live);
    if (state.live) void connectTransport();
    else {
      stopStream(true);
      clearPoll();
      updateChrome();
    }
  });

  el.refreshBtn.addEventListener('click', async () => {
    await loadTargets();
    if (!state.streamActive) await captureSingleFrame();
  });

  el.gridBtn.addEventListener('click', () => {
    state.grid = !state.grid;
    safeStorage.set('kiki.cua.grid', state.grid ? '1' : '0');
    el.gridBtn.classList.toggle('active', state.grid);
    el.gridSvg.toggleAttribute('hidden', !state.grid);
  });

  el.takeoverBtn.addEventListener('click', () => {
    void toggleTakeover();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearPoll();
    else if (state.live && !state.streamActive) void pollOnce();
  });

  window.addEventListener('pagehide', () => stopStream(true));

  async function boot() {
    if (booted) return;
    booted = true;
    el.gridBtn.classList.toggle('active', state.grid);
    el.gridSvg.toggleAttribute('hidden', !state.grid);
    buildGridRulerSvg();
    layoutFrame();
    await loadTargets();
    await connectTransport();
  }

  setTimeout(() => { if (!booted) void boot(); }, 180);
})();
</script>
</body>
</html>
