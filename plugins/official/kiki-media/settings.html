<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media settings</title>
<style>
  :root {
    font-synthesis: none;
    --bg: #f6f4ef;
    --paper: #fcfbf8;
    --panel: #efece4;
    --ink: #1b1a17;
    --ink-soft: #5c5850;
    --ink-faint: #8c867b;
    --line: rgba(27, 26, 23, 0.10);
    --line-strong: rgba(27, 26, 23, 0.20);
    --accent: #2c5e4f;
    --accent-soft: rgba(44, 94, 79, 0.11);

    --color-paper: var(--bg);
    --color-panel: var(--paper);
    --color-hairline: var(--line);
    --color-hairline-strong: var(--line-strong);
    --color-ink: var(--ink);
    --color-ink-soft: var(--ink-soft);
    --color-ink-faint: var(--ink-faint);
    --color-accent: var(--accent);
    --color-accent-deep: #21493d;
    --color-on-accent: #fcfbf8;
    --color-selected: rgba(44, 94, 79, 0.13);
    --color-selected-ink: #2c5e4f;
    --color-success: #2c5e4f;
    --color-warn: #8c581c;
    --color-danger: #a1352b;
    --motion-quick: 150ms;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: #141413;
      --paper: #1c1b19;
      --panel: #252320;
      --ink: #edeae2;
      --ink-soft: #b2aca0;
      --ink-faint: #7b766c;
      --line: rgba(237, 234, 226, 0.10);
      --line-strong: rgba(237, 234, 226, 0.22);
      --accent: #58a88f;
      --accent-soft: rgba(88, 168, 143, 0.15);
      --color-accent-deep: #6ec0a7;
      --color-on-accent: #141413;
      --color-selected: rgba(88, 168, 143, 0.18);
      --color-selected-ink: #58a88f;
      --color-success: #58a88f;
      --color-warn: #deb068;
      --color-danger: #e28379;
      color-scheme: dark;
    }
  }
  [data-theme='dark'] {
    --bg: #141413;
    --paper: #1c1b19;
    --panel: #252320;
    --ink: #edeae2;
    --ink-soft: #b2aca0;
    --ink-faint: #7b766c;
    --line: rgba(237, 234, 226, 0.10);
    --line-strong: rgba(237, 234, 226, 0.22);
    --accent: #58a88f;
    --accent-soft: rgba(88, 168, 143, 0.15);
    --color-accent-deep: #6ec0a7;
    --color-on-accent: #141413;
    --color-selected: rgba(88, 168, 143, 0.18);
    --color-selected-ink: #58a88f;
    --color-success: #58a88f;
    --color-warn: #deb068;
    --color-danger: #e28379;
    color-scheme: dark;
  }
  [data-theme='light'] { color-scheme: light; }
  * { box-sizing: border-box; }
  html { scroll-padding-bottom: 76px; }
  body {
    margin: 0;
    overflow-x: clip;
    background: var(--color-paper);
    color: var(--color-ink);
    font-family: 'Instrument Sans Variable', 'Instrument Sans', ui-sans-serif, system-ui, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px;
    padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  main { max-width: 760px; margin: 0 auto; min-width: 0; padding: 14px 16px 28px; }
  main > section + section { margin-top: 24px; }
  .section-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .section-label {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--color-ink-soft);
  }
  .summary-meta {
    font-size: 11.5px;
    color: var(--color-ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .defaults {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr));
    gap: 12px;
    min-width: 0;
    padding: 14px;
    background: var(--color-panel);
    border: 1px solid var(--color-hairline);
    border-radius: 10px;
  }
  .defaults .field { margin: 0; max-width: none; }
  .field { margin: 0 0 14px; min-width: 0; max-width: 40rem; }
  .field:last-child { margin-bottom: 0; }
  label.f-label {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--color-ink);
    margin-bottom: 5px;
  }
  input[type='text'], input[type='password'], input[type='url'], select, textarea {
    width: 100%; max-width: 100%; min-width: 0;
    height: 34px; padding: 0 11px;
    font: inherit; font-size: 12.5px; color: var(--color-ink);
    background: var(--color-panel);
    border: 1px solid var(--color-hairline);
    border-radius: 8px;
    outline: none;
    transition: border-color var(--motion-quick) ease-out, background-color var(--motion-quick) ease-out;
  }
  .defaults select { background-color: var(--color-paper); }
  input:hover, select:hover, textarea:hover { border-color: var(--color-hairline-strong); }
  input:focus, select:focus, textarea:focus { border-color: var(--color-accent); }
  input::placeholder, textarea::placeholder { color: var(--color-ink-faint); }
  input.mono, textarea.mono {
    font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, 'PingFang SC', 'Noto Sans SC', monospace;
    font-feature-settings: 'liga' 0, 'calt' 0;
    font-variant-numeric: tabular-nums;
  }
  select {
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2.5 4.5 6 8l3.5-3.5' fill='none' stroke='%238c867b' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 11px;
    padding-right: 28px;
  }
  textarea { min-height: 5rem; height: auto; padding: 8px 11px; resize: vertical; line-height: 1.5; }
  .help { margin: 5px 0 0; max-width: 60ch; font-size: 12px; line-height: 1.45; color: var(--color-ink-faint); }

  /* Source chips with subtle status dots */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; margin-bottom: 16px; }
  .chip {
    position: relative;
    height: 30px; padding: 0 10px 0 21px;
    font: inherit; font-size: 12px;
    color: var(--color-ink-soft);
    background: var(--color-panel);
    border: 1px solid var(--color-hairline);
    border-radius: 7px;
    cursor: pointer;
    transition: color var(--motion-quick) ease-out, border-color var(--motion-quick) ease-out, background-color var(--motion-quick) ease-out;
  }
  .chip::before {
    content: '';
    position: absolute;
    left: 9px;
    top: 50%;
    width: 6px;
    height: 6px;
    margin-top: -3px;
    border-radius: 50%;
    background: var(--color-ink-faint);
    opacity: 0.45;
  }
  .chip[data-state='ready']::before { background: var(--color-success); opacity: 1; }
  .chip[data-state='partial']::before { background: var(--color-warn); opacity: 0.9; }
  .chip:hover { color: var(--color-ink); border-color: var(--color-hairline-strong); }
  .chip[aria-selected='true'] {
    color: var(--color-ink);
    border-color: var(--color-accent);
    background: var(--accent-soft);
    font-weight: 500;
  }

  /* Source Sheet */
  .source-sheet {
    background: var(--color-panel);
    border: 1px solid var(--color-hairline);
    border-radius: 10px;
    padding: 16px;
    min-width: 0;
  }
  .source-topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 14px;
    padding-bottom: 12px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--color-hairline);
  }
  .source-topbar .switch { margin-bottom: 0; width: auto; gap: 10px; font-weight: 500; }
  .source-bar-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .state-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--color-paper);
    border: 1px solid var(--color-hairline);
    color: var(--color-ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .state-pill[data-tone='ok'] { color: var(--color-success); border-color: color-mix(in srgb, var(--color-success) 35%, transparent); }
  .state-pill[data-tone='warn'] { color: var(--color-warn); }

  /* Breathing subgroups */
  .subgroup {
    padding-top: 14px;
    margin-top: 14px;
    border-top: 1px solid var(--color-hairline);
  }
  .subgroup:first-of-type {
    padding-top: 0;
    margin-top: 0;
    border-top: 0;
  }
  .subgroup-title {
    margin: 0 0 10px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--color-ink-faint);
  }
  .model-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr));
    gap: 12px;
  }
  .model-grid .field { margin: 0; }

  details.adv-details {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--color-hairline);
  }
  details.adv-details > summary {
    cursor: pointer;
    list-style: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--color-ink-soft);
    padding: 2px 0;
    user-select: none;
  }
  details.adv-details > summary::-webkit-details-marker { display: none; }
  details.adv-details > summary::before {
    content: '';
    width: 6px;
    height: 6px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(-45deg);
    transition: transform var(--motion-quick) ease;
  }
  details.adv-details[open] > summary::before { transform: rotate(45deg); }
  details.adv-details[open] > summary { margin-bottom: 12px; color: var(--color-ink); }

  /* Inline probe & voice preview panel */
  .probe-panel {
    margin-bottom: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--color-paper);
    border: 1px solid var(--color-hairline);
    display: grid;
    gap: 8px;
  }
  .probe-panel[hidden] { display: none; }
  .probe-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 12px;
  }
  .probe-verdict { font-weight: 500; color: var(--color-ink); }
  .probe-verdict[data-tone='ok'] { color: var(--color-success); }
  .probe-verdict[data-tone='err'] { color: var(--color-danger); }
  .cap-row, .voice-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .cap-tag {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 5px;
    background: var(--panel);
    color: var(--color-ink-soft);
    font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  }
  .voice-chip {
    height: 24px;
    padding: 0 8px;
    border-radius: 999px;
    border: 1px solid var(--color-hairline);
    background: var(--color-panel);
    color: var(--color-ink-soft);
    font-size: 11.5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .voice-chip:hover { border-color: var(--color-accent); color: var(--color-ink); }

  /* Secret row: input + eye reveal + paste + clear/undo */
  .secret-row { display: flex; gap: 6px; align-items: center; min-width: 0; flex-wrap: wrap; }
  .secret-input-wrap {
    position: relative;
    flex: 1 1 180px;
    min-width: 0;
    display: flex;
    align-items: center;
  }
  .secret-input-wrap input { padding-right: 34px; }
  .icon-btn {
    position: absolute;
    right: 4px;
    width: 26px;
    height: 26px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--color-ink-faint);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .icon-btn:hover:not(:disabled) { color: var(--color-ink); background: var(--panel); }
  .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .secret-row .btn { flex-shrink: 0; }
  input:disabled, select:disabled, textarea:disabled { opacity: 0.55; cursor: not-allowed; }

  /* Kiki switch */
  .switch {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 28px; max-width: 40rem; margin-bottom: 12px;
    font-size: 13px; color: var(--color-ink);
    cursor: pointer;
  }
  .switch input { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .switch .track {
    position: relative; flex-shrink: 0;
    width: 32px; height: 18px; border-radius: 999px;
    background: var(--panel);
    box-shadow: 0 0 0 1px var(--color-hairline-strong);
    transition: background-color var(--motion-quick) ease-out, box-shadow var(--motion-quick) ease-out;
  }
  .switch .knob {
    position: absolute; top: 3px; left: 3px;
    width: 12px; height: 12px; border-radius: 999px;
    background: var(--color-ink-faint);
    transition: transform var(--motion-quick) ease-out, background-color var(--motion-quick) ease-out;
  }
  .switch input:checked + .track { background: var(--color-selected); box-shadow: 0 0 0 1px color-mix(in srgb, var(--color-selected-ink) 50%, transparent); }
  .switch input:checked + .track .knob { transform: translateX(14px); background: var(--color-selected-ink); }
  .switch input:focus-visible + .track { outline: 2px solid var(--color-selected-ink); outline-offset: 2px; }

  .restore-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; max-width: 40rem; }
  .restore-row[hidden] { display: none; }
  .restore-row p { margin: 0; min-width: 0; flex: 1; font-size: 13px; color: var(--color-ink); }

  .btn {
    height: 32px; padding: 0 11px;
    font: inherit; font-size: 12px;
    border: 1px solid transparent; border-radius: 7px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    white-space: nowrap;
    transition: background-color var(--motion-quick) ease-out, border-color var(--motion-quick) ease-out, color var(--motion-quick) ease-out;
  }
  .btn-primary { background: var(--color-accent); color: var(--color-on-accent); font-weight: 600; }
  .btn-primary:hover:not(:disabled) { background: var(--color-accent-deep); }
  .btn-primary:disabled { background: var(--panel); color: var(--color-ink-faint); cursor: not-allowed; }
  .btn-secondary { background: var(--color-paper); border-color: var(--color-hairline); color: var(--color-ink-soft); }
  .btn-secondary:hover:not(:disabled) { border-color: var(--color-hairline-strong); color: var(--color-ink); }
  .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Sticky dirty transaction dock */
  .dock {
    position: sticky; bottom: 0;
    margin-top: 16px; padding: 10px 12px;
    background: var(--color-panel);
    border: 1px solid var(--color-hairline-strong);
    border-radius: 10px;
  }
  .dock[hidden] { display: none; }
  .savebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .savebar[hidden] { display: none; }
  .status { font-size: 12px; color: var(--color-ink-soft); margin-right: auto; }
  .kbd-hint {
    font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    font-size: 11px;
    color: var(--color-ink-faint);
    padding: 1px 5px;
    border: 1px solid var(--color-hairline);
    border-radius: 4px;
  }
  .saved-line { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--color-success); }
  .saved-line[hidden] { display: none; }
  .error { margin: 0 0 8px; font-size: 12px; line-height: 1.4; color: var(--color-danger); }
  .error[hidden] { display: none; }
  .loading { margin: 0; font-size: 12px; color: var(--color-ink-faint); }
  button:focus-visible, .chip:focus-visible, summary:focus-visible { outline: 2px solid var(--color-selected-ink); outline-offset: 2px; }
  @keyframes kiki-enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .anim-enter { animation: kiki-enter 180ms ease-out both; }
  @media (max-width: 480px) {
    main { padding: 10px 10px 24px; }
    .source-sheet { padding: 12px; }
    .defaults { padding: 12px; }
  }
  @media (pointer: coarse) {
    .btn, .chip, input, select, textarea { min-height: 42px; }
    .switch { min-height: 42px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .anim-enter { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <h1 class="sr-only" id="title">Media settings</h1>
  <p class="loading" id="loading" role="status"></p>
  <div id="boot-error" class="restore-row" hidden style="margin-bottom: 16px;">
    <p id="boot-error-text" class="error" role="alert" style="margin: 0;"></p>
    <button id="boot-retry" class="btn btn-secondary" type="button"></button>
  </div>
  <div id="content" hidden>
    <section aria-labelledby="defaults-label">
      <div class="section-head">
        <h2 class="section-label" id="defaults-label"></h2>
        <span class="summary-meta" id="sources-summary"></span>
      </div>
      <div id="defaults" class="defaults"></div>
    </section>
    <section aria-labelledby="sources-heading">
      <div class="section-head">
        <h2 class="section-label" id="sources-heading"></h2>
      </div>
      <div id="chips" class="chips" role="tablist"></div>
      <div id="source" class="source-sheet"></div>
    </section>
    <section id="global-advanced-wrap" hidden>
      <details id="global-advanced" class="adv-details">
        <summary id="global-advanced-summary"></summary>
        <div id="global-advanced-body"></div>
      </details>
    </section>
    <div class="dock" id="dock" hidden>
      <p id="error" class="error" role="alert" hidden></p>
      <div class="savebar" id="savebar" hidden>
        <span id="status" class="status" role="status"></span>
        <span class="kbd-hint" aria-hidden="true">Ctrl+S</span>
        <button id="discard" class="btn btn-secondary" type="button"></button>
        <button id="save" class="btn btn-primary" type="button"></button>
      </div>
      <span id="saved" class="saved-line" role="status" hidden>
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5 4.8 9 10 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="saved-text"></span>
      </span>
    </div>
  </div>
</main>
<script>
/* @kiki-panel-kit:runtime:start */

const KikiPanelKit = (() => {
  /**
   * Opaque ('null'-origin) sandbox-safe storage, clipboard copy, and ID helpers
   * for Kiki plugin panels running inside <iframe sandbox="allow-scripts">.
   */

  function createSafeStorage(targetWindow) {
    const mem = new Map();
    const resolveStorage = () => {
      const win = targetWindow !== undefined ? targetWindow : (typeof window !== 'undefined' ? window : null);

      } catch {
        return null;
      }

      get(key) {

        try {
          const s = resolveStorage();
          if (s) {
            const v = s.getItem(k);
            if (v !== null) return v;
          }
        } catch {}
        return mem.has(k) ? mem.get(k) : null;
      },
      set(key, value) {
        const k = String(key);
        const str = String(value);
        mem.set(k, str);

          if (s) s.setItem(k, str);
        } catch {}

      remove(key) {

        mem.delete(k);
        try {
          const s = resolveStorage();
          if (s) s.removeItem(k);
        } catch {}
      },
    };
  }

  const safeStorage = createSafeStorage();

  async function copyTextSafe(text, options = {}) {
    const str = String(text ?? '');
    const feedbackEl = options.labelEl || options.button || null;
    const copiedLabel = typeof options.copiedLabel === 'string' ? options.copiedLabel : '';
    const resetMs = Number.isFinite(options.resetMs) ? options.resetMs : 1200;
    const markCopied = () => {
      if (!feedbackEl || !copiedLabel) return;
      const prev = feedbackEl.textContent;
      feedbackEl.textContent = copiedLabel;
      if (typeof setTimeout === 'function') {
        setTimeout(() => {
          feedbackEl.textContent = prev;
        }, resetMs);
      }
    };

    try {
      const nav = options.navigatorObj !== undefined
        ? options.navigatorObj
        : (typeof navigator !== 'undefined' ? navigator : null);
      if (nav && nav.clipboard && typeof nav.clipboard.writeText === 'function') {
        await nav.clipboard.writeText(str);
        markCopied();
        return true;
      }
    } catch {}

    try {
      const doc = options.documentObj !== undefined
        ? options.documentObj
        : (typeof document !== 'undefined' ? document : null);
      if (!doc || !doc.body || typeof doc.createElement !== 'function' || typeof doc.execCommand !== 'function') {
        return false;
      }
      const ta = doc.createElement('textarea');
      ta.value = str;
      if (typeof ta.setAttribute === 'function') ta.setAttribute('readonly', '');
      if (ta.style) {
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.opacity = '0';
        ta.style.pointerEvents = 'none';
      }
      doc.body.append(ta);
      if (typeof ta.select === 'function') ta.select();
      let ok = false;

    status.id = key + '-error';
    status.setAttribute('role', 'alert');
    status.textContent = connectionError || t('connectionLoadError');
    const retry = document.createElement('button');
    retry.type = 'button';
    retry.id = key + '-retry';
    retry.className = 'btn btn-secondary';
    retry.textContent = t('retryConnections');
    retry.onclick = () => void loadConnections();
    wrap.append(status, retry);
  }
  return wrap;
}
async function loadConnections() {
  if (connectionState === 'loading') return;
  connectionState = 'loading';
  connectionError = '';
  if (booted) render();
  try {
    connectionCatalog = await ask('plugin.models.list');
    connectionState = 'ready';
  } catch (error) {
    connectionCatalog = { models: [], connections: [] };
    connectionError = error.message || t('connectionLoadError');
    connectionState = 'error';
  }
  if (booted) render();
}
async function runInspect(source) {
  if (!source || probingSource) return;
  probingSource = source.id;
  render();
  const overrides = {};
  for (const [k, v] of Object.entries(draft)) {
    if (k.startsWith(source.prefix) && properties()[k]?.secret !== true) overrides[k] = v;
  }
  try {
    const res = await ask('plugin.call', {
      action: 'inspect',
      args: { sourceId: source.id, probeNetwork: true, overrides },
    }, 8000);
    probeResults.set(source.id, res);
  } catch (err) {
    probeResults.set(source.id, {
      sourceId: source.id,
      probe: { state: 'failed', detail: err.message || t('timeoutError') },
      capabilities: [],
      voices: [],
    });
  } finally {
    probingSource = '';
    render();
  }
}

function modelDatalist(source, key) {
  const kind = key.endsWith('imageModel') ? 'image' : key.endsWith('videoModel') ? 'video' : key.endsWith('speechModel') ? 'tts' : '';
  if (!kind) return undefined;
  const ids = new Set();
  for (const provider of catalog.providers) {
    if (!source.providerIds.includes(provider.id)) continue;
    for (const model of provider.models ?? []) if (model.kind === kind && model.id) ids.add(model.id);
  }
  if (ids.size === 0) return undefined;
  const list = document.createElement('datalist');
  list.id = key + '-models';
  for (const id of ids) {
    const option = document.createElement('option');
    option.value = id;
    list.append(option);
  }
  return list;
}

function switchRow(key, labelText, checked) {
  const wrap = document.createElement('label');
  wrap.className = 'switch';
  const text = document.createElement('span');
  text.textContent = labelText;
  const input = document.createElement('input');
  input.id = key;
  input.type = 'checkbox';
  input.checked = checked;
  input.onchange = () => { draft[key] = input.checked; mark(true); render(); };
  const track = document.createElement('span');
  track.className = 'track';
  const knob = document.createElement('span');
  knob.className = 'knob';
  track.append(knob);
  wrap.append(text, input, track);
  return wrap;
}

function buildField(key, property, source) {
  const field = document.createElement('div');
  field.className = 'field';
  const name = document.createElement('label');
  name.className = 'f-label';
  name.htmlFor = key;
  name.textContent = localizedText(property, 'title') ?? (source ? key.slice(source.prefix.length) : key);
  field.append(name);

  if (source && key === source.prefix + 'connectionId') {
    field.append(connectionControl(key));
  } else if (property.secret === true) {
    const configured = (view.secretsConfigured ?? []).includes(key);
    const pending = Object.prototype.hasOwnProperty.call(secrets, key) ? secrets[key] : undefined;
    const clearing = pending === null;
    const revealed = revealedSecrets.has(key);
    const lockedByConn = source ? connectionLocked(key, source) : false;

    const row = document.createElement('div');
    row.className = 'secret-row';
    const inputWrap = document.createElement('div');
    inputWrap.className = 'secret-input-wrap';

    const input = document.createElement('input');
    input.id = key;
    input.type = revealed ? 'text' : 'password';
    input.autocomplete = 'off';
    input.placeholder = clearing ? t('secretClearPending') : configured ? t('secretReplace') : t('secretNew');
    if (clearing) input.dataset.locked = '1';
    if (lockedByConn) input.dataset.connectionLocked = '1';
    if (typeof pending === 'string') input.value = pending;
    input.oninput = () => {
      if (input.value === '') delete secrets[key]; else secrets[key] = input.value;
      mark(true);
    };

    const eyeBtn = document.createElement('button');
    eyeBtn.type = 'button';
    eyeBtn.className = 'icon-btn';
    eyeBtn.dataset.secretToggle = key;
    eyeBtn.setAttribute('aria-label', revealed ? t('hideSecret') : t('revealSecret'));
    eyeBtn.setAttribute('title', revealed ? t('hideSecret') : t('revealSecret'));
    if (clearing) eyeBtn.dataset.locked = '1';
    if (lockedByConn) eyeBtn.dataset.connectionLocked = '1';
    eyeBtn.append(revealed
      ? makeSvg(['M2 2l12 12', 'M6.5 6.5a2 2 0 0 0 2.8 2.8', 'M1.5 8s2.5-4.5 6.5-4.5c1.3 0 2.5.5 3.5 1.2M14.5 8s-1.2 2.2-3.2 3.5'])
      : makeSvg(['M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8s-2.5 4.5-6.5 4.5S1.5 8 1.5 8Z', 'M8 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z']));
    eyeBtn.onclick = () => {
      if (revealedSecrets.has(key)) revealedSecrets.delete(key);
      else revealedSecrets.add(key);
      render();
    };
    inputWrap.append(input, eyeBtn);
    row.append(inputWrap);

    if (!clearing && !lockedByConn) {
      const pasteBtn = document.createElement('button');
      pasteBtn.type = 'button';
      pasteBtn.className = 'btn btn-secondary';
      pasteBtn.dataset.secretPaste = key;
      pasteBtn.textContent = t('pasteSecret');
      pasteBtn.onclick = async () => {
        try {
          if (typeof navigator === 'object' && navigator.clipboard && typeof navigator.clipboard.readText === 'function') {
            const clip = (await navigator.clipboard.readText()).trim();
            if (clip) {
              secrets[key] = clip;
              mark(true);
              render();
              return;
            }
          }
        } catch {}
        if (typeof input.focus === 'function') input.focus();
      };
      row.append(pasteBtn);
    }

    if (clearing) {
      const undo = document.createElement('button');
      undo.type = 'button';
      undo.className = 'btn btn-secondary';
      undo.textContent = t('secretUndo');
      if (lockedByConn) undo.dataset.connectionLocked = '1';
      undo.onclick = () => { delete secrets[key]; mark(true); render(); };
      row.append(undo);
    } else if (configured) {
      const clear = document.createElement('button');
      clear.type = 'button';
      clear.className = 'btn btn-secondary';
      clear.dataset.secretClear = key;
      clear.textContent = t('secretClear');
      if (lockedByConn) clear.dataset.connectionLocked = '1';
      clear.onclick = () => { secrets[key] = null; mark(true); render(); };
      row.append(clear);
    } else if (typeof pending === 'string' && pending !== '') {
      const drop = document.createElement('button');
      drop.type = 'button';
      drop.className = 'btn btn-secondary';
      drop.textContent = t('clearInput');
      if (lockedByConn) drop.dataset.connectionLocked = '1';
      drop.onclick = () => { delete secrets[key]; mark(Object.keys(patchOf()).length > 0); render(); };
      row.append(drop);
    }
    field.append(row);
    const state = document.createElement('p');
    state.className = 'help';
    state.textContent = (configured ? t('secretSet') : t('secretUnset')) + (clearing ? ' · ' + t('secretClearPending') : '');
    field.append(state);
  } else if (property.type === 'boolean') {
    field.replaceChildren();
    field.append(switchRow(key, localizedText(property, 'title') ?? (source ? key.slice(source.prefix.length) : key), valueOf(key, property) === true));
  } else if (Array.isArray(property.enum) && property.enum.length > 0) {
    const select = document.createElement('select');
    select.id = key;
    const empty = document.createElement('option');
    empty.value = '';
    empty.textContent = t('notSet');
    select.append(empty);
    for (const choice of property.enum) {
      const option = document.createElement('option');
      option.value = choice;
      option.textContent = choice;
      select.append(option);
    }
    select.value = valueOf(key, property);
    select.onchange = () => { draft[key] = select.value; mark(true); };
    field.append(select);
  } else if (property.multiline === true) {
    const input = document.createElement('textarea');
    input.id = key;
    input.className = 'mono';
    input.value = valueOf(key, property);
    input.oninput = () => { draft[key] = input.value; mark(true); };
    field.append(input);
  } else {
    const input = document.createElement('input');
    input.id = key;
    input.type = 'text';
    if (property.type === 'number' || key.endsWith('Model') || key.endsWith('Url')) input.className = 'mono';
    input.value = valueOf(key, property);
    input.placeholder = property.default === undefined ? '' : String(property.default);
    input.oninput = () => { draft[key] = input.value; mark(true); };
    if (source && connectionLocked(key, source)) input.dataset.connectionLocked = '1';
    const models = source ? modelDatalist(source, key) : undefined;
    if (models) input.setAttribute('list', models.id);
    field.append(input);
    if (models) field.append(models);
  }
  if (localizedText(property, 'description') !== undefined) {
    const help = document.createElement('p');
    help.className = 'help';
    help.textContent = localizedText(property, 'description');
    field.append(help);
  }
  return field;
}

function renderDefaults() {
  const root = document.getElementById('defaults');
  root.replaceChildren();
  for (const [key, labelKey, kind] of [['defaultImageProvider', 'image', 'image'], ['defaultVideoProvider', 'video', 'video'], ['defaultTtsProvider', 'speech', 'tts']]) {
    const wrap = document.createElement('div');
    wrap.className = 'field';
    const name = document.createElement('label');
    name.className = 'f-label';
    name.textContent = t(labelKey);
    name.htmlFor = key;
    const select = document.createElement('select');
    select.id = key;
    const empty = document.createElement('option');
    empty.value = '';
    empty.textContent = t('notSet');
    select.append(empty);
    for (const provider of providersFor(kind)) {
      const option = document.createElement('option');
      option.value = provider.id;
      option.textContent = provider.label || provider.id;
      select.append(option);
    }
    select.value = valueOf(key) || '';
    if (select.value === '' && valueOf(key)) {
      const option = document.createElement('option');
      option.value = valueOf(key);
      option.textContent = valueOf(key);
      select.append(option);
      select.value = valueOf(key);
    }
    select.onchange = () => { draft[key] = select.value; mark(true); };
    wrap.append(name, select);
    root.append(wrap);
  }
}

function renderProbeBox(source) {
  const data = probeResults.get(source.id);
  if (!data) return null;
  const panel = document.createElement('div');
  panel.className = 'probe-panel';
  panel.id = 'probe-box';

  const head = document.createElement('div');
  head.className = 'probe-head';
  const verdict = document.createElement('span');
  verdict.className = 'probe-verdict';
  const p = data.probe || {};
  if (p.state === 'ok') {
    verdict.dataset.tone = 'ok';
    verdict.textContent = t('probeOk')(p.latencyMs ?? 0);
  } else if (p.state === 'connection_managed') {
    verdict.dataset.tone = 'ok';
    verdict.textContent = t('probeConnManaged')(p.connectionId || '');
  } else if (p.state === 'unconfigured') {
    verdict.textContent = t('probeUnconfigured');
  } else {
    verdict.dataset.tone = 'err';
    verdict.textContent = t('probeFailed')(p.detail || 'Error');
  }
  head.append(verdict);
  panel.append(head);

  if (Array.isArray(data.capabilities) && data.capabilities.length > 0) {
    const capRow = document.createElement('div');
    capRow.className = 'cap-row';
    for (const cap of data.capabilities) {
      const modelIds = (cap.models ?? []).map((m) => m.id).slice(0, 4).join(', ');
      const tag = document.createElement('span');
      tag.className = 'cap-tag';
      tag.textContent = `${cap.id}${modelIds ? ' · ' + modelIds : ''}`;
      capRow.append(tag);
    }
    panel.append(capRow);
  }

  if (Array.isArray(data.voices) && data.voices.length > 0) {
    const vRow = document.createElement('div');
    vRow.className = 'voice-row';
    const label = document.createElement('span');
    label.className = 'help';
    label.style.margin = '0';
    label.textContent = t('voicesLabel');
    vRow.append(label);
    for (const voice of data.voices) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'voice-chip';
      chip.dataset.voiceId = voice.id;
      chip.textContent = voice.label && voice.label !== voice.id ? `${voice.label} (${voice.id})` : voice.id;
      chip.onclick = async () => {
        const ok = await copyText(voice.id);
        if (ok) {
          verdict.dataset.tone = 'ok';
          verdict.textContent = t('voiceCopied')(voice.id);
        }
      };
      vRow.append(chip);
    }
    panel.append(vRow);
  }
  return panel;
}

function renderGlobalAdvanced() {
  const wrap = document.getElementById('global-advanced-wrap');
  const summary = document.getElementById('global-advanced-summary');
  const body = document.getElementById('global-advanced-body');
  if (!wrap || !summary || !body) return;
  const scriptProp = properties().scriptSources;
  if (!scriptProp) { wrap.hidden = true; return; }
  wrap.hidden = false;
  summary.textContent = localizedText(scriptProp, 'title') ?? t('globalScripts');
  body.replaceChildren(buildField('scriptSources', scriptProp, null));
}

function render() {
  document.getElementById('title').textContent = t('title');
  document.getElementById('defaults-label').textContent = t('defaults');
  const sourcesHeading = document.getElementById('sources-heading');
  if (sourcesHeading) sourcesHeading.textContent = t('sources');
  document.getElementById('chips').setAttribute('aria-label', t('sources'));
  document.getElementById('save').textContent = saving ? t('saving') : t('save');
  document.getElementById('discard').textContent = t('discard');
  document.getElementById('saved-text').textContent = t('saved');

  renderDefaults();
  renderGlobalAdvanced();

  const source = selectedSource();
  sourceId = source?.id ?? '';
  if (sourceId) safeStorage.set('kiki.media.sourceId', sourceId);

  const summaryEl = document.getElementById('sources-summary');
  if (summaryEl && catalog.sources.length > 0) {
    const readyCnt = catalog.sources.filter((s) => ['ready', 'connection'].includes(sourceReadiness(s))).length;
    summaryEl.textContent = t('readyCount')(readyCnt, catalog.sources.length);
  }

  const chips = document.getElementById('chips');
  chips.replaceChildren();
  for (const item of catalog.sources) {
    const button = document.createElement('button');
    button.type = 'button';
    button.role = 'tab';
    button.className = 'chip';
    const state = sourceReadiness(item);
    button.dataset.state = state === 'connection' ? 'ready' : state;
    button.textContent = sourceLabel(item);
    button.setAttribute('aria-selected', item.id === sourceId ? 'true' : 'false');
    button.onclick = () => {
      sourceId = item.id;
      safeStorage.set('kiki.media.sourceId', sourceId);
      render();
    };
    chips.append(button);
  }

  const body = document.getElementById('source');
  body.replaceChildren();
  renderSaveBar();
  if (!source) { applyBusy(); return; }

  const removedKey = source.prefix + 'removed';
  if (valueOf(removedKey, { type: 'boolean' }) === true) {
    const row = document.createElement('div');
    row.className = 'restore-row';
    const name = document.createElement('p');
    name.textContent = sourceLabel(source);
    const restore = document.createElement('button');
    restore.type = 'button';
    restore.className = 'btn btn-secondary';
    restore.textContent = t('restore') + ' ' + sourceLabel(source);
    restore.onclick = () => { draft[removedKey] = false; mark(true); render(); };
    row.append(name, restore);
    body.append(row);
    applyBusy();
    return;
  }

  const enabledKey = source.prefix + 'enabled';
  const isEnabled = valueOf(enabledKey, properties()[enabledKey]) !== false;
  const readiness = sourceReadiness(source);

  const topbar = document.createElement('div');
  topbar.className = 'source-topbar';
  topbar.append(switchRow(enabledKey, t('enabled'), isEnabled));

  const barActions = document.createElement('div');
  barActions.className = 'source-bar-actions';
  const pill = document.createElement('span');
  pill.className = 'state-pill';
  if (!isEnabled) {
    pill.textContent = t('stateDisabled');
  } else if (readiness === 'connection') {
    pill.dataset.tone = 'ok';
    pill.textContent = t('stateConnection');
  } else if (readiness === 'ready') {
    pill.dataset.tone = 'ok';
    pill.textContent = t('stateReady');
  } else {
    pill.dataset.tone = 'warn';
    pill.textContent = t('stateMissing');
  }
  const probeBtn = document.createElement('button');
  probeBtn.type = 'button';
  probeBtn.id = 'probe-btn';
  probeBtn.className = 'btn btn-secondary';
  probeBtn.textContent = probingSource === source.id ? t('probing') : t('probeBtn');
  if (probingSource === source.id) probeBtn.dataset.locked = '1';
  probeBtn.onclick = () => void runInspect(source);
  barActions.append(pill, probeBtn);
  topbar.append(barActions);
  body.append(topbar);

  const probeBox = renderProbeBox(source);
  if (probeBox) body.append(probeBox);

  const coreFields = [];
  const modelFields = [];
  const advFields = [];

  for (const [key, property] of Object.entries(properties())) {
    if (!key.startsWith(source.prefix) || lifecycle.has(key.slice(source.prefix.length)) || property.hidden === true) continue;
    const local = key.slice(source.prefix.length);
    const node = buildField(key, property, source);
    if (['connectionId', 'apiKey', 'baseUrl'].includes(local) || property.secret === true) {
      coreFields.push(node);
    } else if (local.endsWith('Model')) {
      modelFields.push(node);
    } else {
      advFields.push(node);
    }
  }

  if (coreFields.length > 0) {
    const sec = document.createElement('div');
    sec.className = 'subgroup';
    const h = document.createElement('h3');
    h.className = 'subgroup-title';
    h.textContent = t('groupCore');
    sec.append(h, ...coreFields);
    body.append(sec);
  }
  if (modelFields.length > 0) {
    const sec = document.createElement('div');
    sec.className = 'subgroup';
    const h = document.createElement('h3');
    h.className = 'subgroup-title';
    h.textContent = t('groupModels');
    const grid = document.createElement('div');
    grid.className = 'model-grid';
    grid.append(...modelFields);
    sec.append(h, grid);
    body.append(sec);
  }
  if (advFields.length > 0) {
    const details = document.createElement('details');
    details.className = 'adv-details';
    const maxKey = source.prefix + 'maxConcurrentRequests';
    if (Object.prototype.hasOwnProperty.call(draft, maxKey)) details.open = true;
    const sum = document.createElement('summary');
    sum.textContent = t('groupAdvanced');
    const advBody = document.createElement('div');
    advBody.append(...advFields);
    details.append(sum, advBody);
    body.append(details);
  }

  applyBusy();
}

function applyBusy() {
  const controls = document.querySelectorAll('#content input, #content select, #content textarea, #content button');
  for (const control of controls) control.disabled = saving || control.dataset.locked === '1' || control.dataset.connectionLocked === '1';
}

function renderSaveBar() {
  const shown = dirty || saving;
  const bar = document.getElementById('savebar');
  if (shown && bar.hidden) bar.classList.add('anim-enter');
  if (!shown) bar.classList.remove('anim-enter');
  bar.hidden = !shown;
  document.getElementById('save').disabled = !dirty || saving;
  document.getElementById('discard').disabled = !dirty || saving;
  document.getElementById('status').textContent = dirty && !saving ? t('unsaved') : '';
  updateDock();
}

function updateDock() {
  const dock = document.getElementById('dock');
  const visible = !document.getElementById('savebar').hidden
    || !document.getElementById('saved').hidden
    || !document.getElementById('error').hidden;
  if (visible && dock.hidden) dock.classList.add('anim-enter');
  if (!visible) dock.classList.remove('anim-enter');
  dock.hidden = !visible;
}

function showSaved() {
  const line = document.getElementById('saved');
  line.hidden = false;
  line.classList.remove('anim-enter');
  void line.offsetWidth;
  line.classList.add('anim-enter');
  updateDock();
  clearTimeout(savedTimer);
  savedTimer = setTimeout(() => { line.hidden = true; updateDock(); }, 2400);
}

function setError(message) {
  const node = document.getElementById('error');
  node.textContent = message ?? '';
  node.hidden = message === null || message === undefined;
  updateDock();
}

function patchOf() {
  const values = {};
  const props = properties();
  for (const [key, next] of Object.entries(draft)) {
    const property = props[key];
    const current = view.values[key];
    if (property?.type === 'boolean' || typeof next === 'boolean') {
      if (next !== (typeof current === 'boolean' ? current : property?.default === true)) values[key] = next;
      continue;
    }
    const text = String(next).trim();
    const before = current === undefined || current === null ? '' : String(current);
    if (text === before) continue;
    if (text === '') values[key] = null;
    else if (property?.type === 'number') values[key] = Number(text);
    else values[key] = text;
  }
  for (const [key, text] of Object.entries(secrets)) {
    if (text === null) values[key] = null;
    else if (text !== '') values[key] = text;
  }
  return values;
}

async function boot() {
  setError(null);
  const bootErrorEl = document.getElementById('boot-error');
  if (bootErrorEl) bootErrorEl.hidden = true;
  const loadingEl = document.getElementById('loading');
  loadingEl.textContent = t('loading');
  loadingEl.hidden = false;
  try {
    const [nextCatalog, nextView] = await Promise.all([
      ask('plugin.call', { action: 'catalog', args: {} }),
      ask('plugin.settings.get'),
    ]);
    catalog = nextCatalog;
    view = nextView;
    draft = {};
    secrets = {};
    saving = false;
    booted = true;
    dirty = false;
    loadingEl.hidden = true;
    document.getElementById('content').hidden = false;
    void ask('plugin.dirty', { dirty: false }).catch(() => undefined);
    render();
    void loadConnections();
  } catch (error) {
    loadingEl.hidden = true;
    document.getElementById('content').hidden = true;
    const msg = error.message || t('loadError');
    setError(msg);
    if (bootErrorEl) {
      bootErrorEl.hidden = false;
      const text = document.getElementById('boot-error-text');
      if (text) text.textContent = msg;
      const retry = document.getElementById('boot-retry');
      if (retry) {
        retry.textContent = t('retry');
        retry.onclick = () => void boot();
      }
    }
  }
}

async function performSave() {
  const values = patchOf();
  setError(null);
  if (Object.keys(values).length === 0) { mark(false); return; }
  saving = true;
  renderSaveBar();
  render();
  try {
    view = await ask('plugin.settings.patch', { values });
    draft = {};
    secrets = {};
    saving = false;
    mark(false);
    render();
    showSaved();
  } catch (error) {
    saving = false;
    setError(error.message || t('saveError'));
    render();
  }
}

document.getElementById('save').onclick = () => performSave();
document.getElementById('discard').onclick = () => {
  draft = {};
  secrets = {};
  revealedSecrets.clear();
  setError(null);
  mark(false);
  render();
};

if (typeof window.addEventListener === 'function') {
  window.addEventListener('keydown', (event) => {
    if ((event.ctrlKey || event.metaKey) && String(event.key).toLowerCase() === 's') {
      event.preventDefault();
      if (dirty && !saving) void performSave();
    }
  });
}

document.getElementById('loading').textContent = t('loading');
</script>
