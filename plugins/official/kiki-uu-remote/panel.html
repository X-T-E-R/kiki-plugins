<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UU Remote</title>
<style>
  /* @kiki-panel-kit:theme:start */
  /* GENERATED from shared/panel-kit/theme.css — run `npm run sync:panels`; do not edit this block. */
  :root {
    color-scheme: light dark;
    font-synthesis: none;
    --bg: var(--color-canvas, #f6f4ef);
    --paper: var(--color-paper, #fcfbf8);
    --panel: var(--color-panel, #efece4);
    --ink: var(--color-ink, #1b1a17);
    --ink-soft: var(--color-ink-soft, #5c5850);
    --ink-faint: var(--color-ink-faint, #8c867b);
    --line: var(--color-hairline, rgba(27, 26, 23, 0.10));
    --line-strong: var(--color-hairline-strong, rgba(27, 26, 23, 0.18));
    --accent: var(--color-accent, #2c5e4f);
    --accent-deep: var(--color-accent-deep, #22493d);
    --accent-soft: rgba(44, 94, 79, 0.10);
    --on-accent: var(--color-on-accent, #fcfbf8);
    --ok: var(--color-success, #2c6e49);
    --warn: var(--color-amber-ink, #8a5a19);
    --warn-bg: var(--color-amber-card, rgba(138, 90, 25, 0.11));
    --danger: var(--color-danger, #a63429);
    --danger-bg: rgba(166, 52, 41, 0.09);
    --wash: rgba(27, 26, 23, 0.04);
    --sans: "Instrument Sans", ui-sans-serif, system-ui, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --display: "Newsreader", Georgia, "Songti SC", "Noto Serif SC", serif;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --radius: 6px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-canvas, #141413);
      --paper: var(--color-paper, #1c1b19);
      --panel: var(--color-panel, #252320);
      --ink: var(--color-ink, #edeae2);
      --ink-soft: var(--color-ink-soft, #b2aca0);
      --ink-faint: var(--color-ink-faint, #7b766c);
      --line: var(--color-hairline, rgba(237, 234, 226, 0.10));
      --line-strong: var(--color-hairline-strong, rgba(237, 234, 226, 0.18));
      --accent: var(--color-accent, #58a88f);
      --accent-deep: var(--color-accent-deep, #6ebe9f);
      --accent-soft: rgba(88, 168, 143, 0.15);
      --on-accent: var(--color-on-accent, #141413);
      --ok: var(--color-success, #6bbf8e);
      --warn: var(--color-amber-ink, #dca056);
      --warn-bg: var(--color-amber-card, rgba(220, 160, 86, 0.14));
      --danger: var(--color-danger, #e27a6e);
      --danger-bg: rgba(226, 122, 110, 0.14);
      --wash: rgba(237, 234, 226, 0.05);
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: var(--color-canvas, #141413);
    --paper: var(--color-paper, #1c1b19);
    --panel: var(--color-panel, #252320);
    --ink: var(--color-ink, #edeae2);
    --ink-soft: var(--color-ink-soft, #b2aca0);
    --ink-faint: var(--color-ink-faint, #7b766c);
    --line: var(--color-hairline, rgba(237, 234, 226, 0.10));
    --line-strong: var(--color-hairline-strong, rgba(237, 234, 226, 0.18));
    --accent: var(--color-accent, #58a88f);
    --accent-deep: var(--color-accent-deep, #6ebe9f);
    --accent-soft: rgba(88, 168, 143, 0.15);
    --on-accent: var(--color-on-accent, #141413);
    --ok: var(--color-success, #6bbf8e);
    --warn: var(--color-amber-ink, #dca056);
    --warn-bg: var(--color-amber-card, rgba(220, 160, 86, 0.14));
    --danger: var(--color-danger, #e27a6e);
    --danger-bg: rgba(226, 122, 110, 0.14);
    --wash: rgba(237, 234, 226, 0.05);
  }

  :root[data-theme="light"] {
    color-scheme: light;
  }
  /* @kiki-panel-kit:theme:end */
  :root,
  :root[data-theme="light"] {
    --accent-soft: rgba(44, 94, 79, 0.12);
    --lock: #a85520;
    --lock-soft: rgba(168, 85, 32, 0.13);
    --bezel: #161618;
    --bezel-edge: #2f2f35;
    --shadow: 0 20px 44px -18px rgba(18, 17, 15, 0.26), 0 2px 6px rgba(18, 17, 15, 0.08);
    --font: var(--sans);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --accent-soft: rgba(88, 168, 143, 0.16);
      --lock: #e08b4f;
      --lock-soft: rgba(224, 139, 79, 0.17);
      --bezel: #0b0b0c;
      --bezel-edge: #38383f;
      --shadow: 0 24px 52px -18px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }
  }
  :root[data-theme="dark"] {
    --accent-soft: rgba(88, 168, 143, 0.16);
    --lock: #e08b4f;
    --lock-soft: rgba(224, 139, 79, 0.17);
    --bezel: #0b0b0c;
    --bezel-edge: #38383f;
    --shadow: 0 24px 52px -18px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(255, 255, 255, 0.05);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  button, input, select {
    font: inherit;
    color: inherit;
  }
  .shell {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 44px;
    padding: 0 14px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .picker-group {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
    flex: 1;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: var(--ink-faint);
    flex-shrink: 0;
  }
  .status-dot.online { background: var(--ok); }
  .status-dot.warn { background: var(--lock); }
  .session-select {
    appearance: none;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 4px 26px 4px 9px;
    font-size: 12.5px;
    font-weight: 500;
    max-width: 260px;
    min-width: 128px;
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
    cursor: pointer;
    outline: none;
  }
  .session-select:focus-visible { border-color: var(--accent); }
  .select-chevron {
    pointer-events: none;
    margin-left: -22px;
    margin-right: 4px;
    color: var(--ink-faint);
    display: flex;
  }
  .aspect-pill {
    font-family: var(--mono);
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 5px;
    background: var(--panel);
    color: var(--ink-soft);
    border: 1px solid var(--line);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 28px;
    padding: 0 9px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease, box-shadow 140ms ease;
    flex-shrink: 0;
    white-space: nowrap;
    outline: none;
  }
  .pill-btn:hover { background: var(--panel); color: var(--ink); }
  .pill-btn:focus-visible { border-color: var(--accent); }
  .pill-btn:disabled { opacity: 0.42; cursor: default; pointer-events: none; }
  .pill-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .pill-btn.takeover-locked {
    background: var(--lock-soft);
    border-color: var(--lock);
    color: var(--lock);
  }
  .pill-btn.gate-pulse {
    border-color: var(--lock);
    box-shadow: 0 0 0 3px var(--lock-soft);
    color: var(--lock);
  }
  .pill-btn.rescue {
    border-color: var(--lock);
    color: var(--lock);
  }
  .icon-btn {
    width: 28px;
    padding: 0;
    justify-content: center;
  }
  .workspace {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    overflow: hidden;
  }
  .stage {
    position: relative;
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 56px 18px 18px;
  }
  .monitor-frame {
    position: relative;
    background: var(--bezel);
    border: 1.5px solid var(--bezel-edge);
    border-radius: 12px;
    padding: 6px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: width 120ms ease, height 120ms ease, border-color 140ms ease;
  }
  .monitor-frame.takeover-ring {
    border-color: var(--lock);
  }
  .screen-surface {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 7px;
    overflow: hidden;
    background: #09090b;
    cursor: default;
    touch-action: none;
    outline: none;
  }
  .screen-surface.interactive {
    cursor: crosshair;
  }
  .screen-surface.interactive:focus-visible {
    box-shadow: inset 0 0 0 1.5px var(--lock);
  }
  .screen-surface canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
    user-select: none;
  }
  .click-ripple {
    position: absolute;
    width: 22px;
    height: 22px;
    margin-left: -11px;
    margin-top: -11px;
    border-radius: 999px;
    border: 1.6px solid rgba(255, 255, 255, 0.92);
    background: rgba(88, 168, 143, 0.32);
    pointer-events: none;
    animation: ripple 320ms ease-out forwards;
  }
  .click-ripple.alt {
    border-color: rgba(255, 214, 170, 0.96);
    background: rgba(224, 139, 79, 0.36);
  }
  @keyframes ripple {
    0% { transform: scale(0.35); opacity: 1; }
    100% { transform: scale(1.55); opacity: 0; }
  }
  .drag-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .center-card {
    width: 100%;
    max-width: 340px;
    padding: 20px;
    border-radius: 12px;
    background: var(--paper);
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card-title {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
  }
  .card-meta {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 0;
    line-height: 1.45;
  }
  .device-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 200px;
    overflow-y: auto;
  }
  .device-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 9px;
    border-radius: 7px;
    background: var(--bg);
    border: 1px solid var(--line);
    font-size: 12px;
  }
  .device-row-left {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }
  .device-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 500;
  }
  .rail {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 5px;
    border-radius: 12px;
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 8px 24px -10px rgba(0, 0, 0, 0.18);
    z-index: 10;
  }
  .rail-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 110ms ease, color 110ms ease;
    outline: none;
  }
  .rail-btn:hover { background: var(--panel); color: var(--ink); }
  .rail-btn:focus-visible { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .rail-btn.active { background: var(--accent-soft); color: var(--accent); }
  .rail-btn:disabled { opacity: 0.36; cursor: default; pointer-events: none; }
  .rail-sep {
    height: 1px;
    margin: 2px 4px;
    background: var(--line);
  }
  .drawer {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 276px;
    max-width: calc(100% - 52px);
    border-left: 1px solid var(--line);
    background: var(--paper);
    box-shadow: -12px 0 28px -12px rgba(0, 0, 0, 0.22);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 14px 58px 14px 14px;
    gap: 16px;
    z-index: 8;
  }
  .section-label {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 6px 0;
  }
  .field-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .input {
    flex: 1;
    min-width: 0;
    height: 28px;
    padding: 0 8px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-size: 12px;
    outline: none;
    user-select: text;
  }
  .input:focus { border-color: var(--accent); }
  .statusbar {
    height: 26px;
    padding: 0 14px;
    border-top: 1px solid var(--line);
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--ink-faint);
    flex-shrink: 0;
    gap: 8px;
  }
  .statusbar-msg {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    flex: 1;
  }
  .statusbar-msg.err { color: var(--danger); }
  .statusbar-msg.locked { color: var(--lock); }
  .statusbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    font-family: var(--mono);
  }
  .coord-badge {
    border: none;
    background: transparent;
    padding: 1px 5px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 110ms ease, color 110ms ease;
  }
  .coord-badge:hover {
    background: var(--panel);
    color: var(--ink);
  }
  @media (max-width: 580px) {
    .topbar { gap: 5px; padding: 0 8px; }
    .aspect-pill { display: none; }
    .session-select { flex: 1 1 0; min-width: 0; width: 100%; max-width: 100%; padding: 4px 22px 4px 7px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="picker-group">
      <span id="statusDot" class="status-dot"></span>
      <select id="sessionSelect" class="session-select" aria-label="Select UU Remote session">
        <option value="">Scanning sessions...</option>
      </select>
      <span class="select-chevron" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M4.5 6.5L8 10l3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span id="aspectPill" class="aspect-pill" hidden>--</span>
    </div>

    <button id="rescueBtn" type="button" class="pill-btn rescue" hidden title="Move off-screen UU Remote windows onto primary display">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3M9 11l3-3 3 3"/></svg>
      <span>Rescue Off-screen</span>
    </button>

    <button id="takeoverBtn" type="button" class="pill-btn" aria-pressed="false" title="Toggle Takeover Control for direct mouse, keyboard, and clipboard paste (Alt+T)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l12 6.5-5.2 1.6L9.8 17.5 5 4z"/><path d="M13 13l4.5 4.5"/></svg>
      <span id="takeoverLabel">Takeover Control</span>
    </button>

    <button id="liveBtn" type="button" class="pill-btn active" title="Toggle live stream">Live</button>

    <button id="refreshBtn" type="button" class="pill-btn icon-btn" title="Refresh sessions" aria-label="Refresh sessions">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <div class="workspace">
    <main id="stage" class="stage">
      <section id="emptyCard" class="center-card" hidden>
        <p id="emptyTitle" class="card-title">No active session</p>
        <p id="emptyMeta" class="card-meta">Connect a paired workstation or launch UU Remote.</p>
        <div id="pairedList" class="device-list" hidden></div>
        <div class="field-row">
          <button id="openClientBtn" type="button" class="pill-btn">Open UU Remote</button>
          <button id="emptyRescueBtn" type="button" class="pill-btn rescue" hidden>Rescue Off-screen</button>
          <button id="rescanBtn" type="button" class="pill-btn">Scan</button>
        </div>
      </section>

      <section id="recoveryCard" class="center-card" hidden>
        <p id="recoveryTitle" class="card-title">Window minimized</p>
        <p id="recoveryMeta" class="card-meta">Restore the session window to resume background capture.</p>
        <div class="field-row">
          <button id="recoveryActionBtn" type="button" class="pill-btn active">Restore Window</button>
        </div>
      </section>

      <div id="monitorFrame" class="monitor-frame" style="width:640px;height:400px" hidden>
        <div id="screenSurface" class="screen-surface" tabindex="0" role="application" aria-label="UU Remote interactive desktop canvas">
          <canvas id="screenCanvas" width="1280" height="800"></canvas>
          <svg id="dragSvg" class="drag-overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none" hidden>
            <defs>
              <marker id="dragArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="rgba(88,168,143,0.95)" />
              </marker>
            </defs>
            <line id="dragLine" x1="0" y1="0" x2="0" y2="0" stroke="rgba(88,168,143,0.92)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#dragArrow)" />
          </svg>
        </div>
      </div>

      <aside class="rail" aria-label="Session tools">
        <button id="focusWindowBtn" type="button" class="rail-btn" title="Bring UU Remote window to front" aria-label="Bring UU Remote window to front">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
        </button>
        <button id="drawerToggleBtn" type="button" class="rail-btn" title="Keyboard input and paired workstations" aria-label="Keyboard input and paired workstations">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg>
        </button>
        <div class="rail-sep"></div>
        <button id="downloadShotBtn" type="button" class="rail-btn" title="Save PNG frame" aria-label="Save PNG frame">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        </button>
      </aside>
    </main>

    <aside id="drawer" class="drawer" hidden>
      <div>
        <p class="section-label">Text Input</p>
        <form id="textForm" class="field-row">
          <input id="textInput" class="input" type="text" placeholder="Type or paste onto remote focus..." />
          <button type="submit" class="pill-btn">Send</button>
        </form>
      </div>

      <div>
        <p class="section-label">Remote Keys</p>
        <div class="field-row">
          <button type="button" class="pill-btn" data-key="Escape">Esc</button>
          <button type="button" class="pill-btn" data-key="Tab">Tab</button>
          <button type="button" class="pill-btn" data-key="Enter">Enter</button>
          <button type="button" class="pill-btn" data-key="Win+D">Win+D</button>
          <button type="button" class="pill-btn" data-key="Ctrl+C">Ctrl+C</button>
          <button type="button" class="pill-btn" data-key="Ctrl+V">Ctrl+V</button>
        </div>
      </div>

      <div>

    el.monitorFrame.classList.toggle('takeover-ring', state.takeoverActive);
    el.screenSurface.classList.toggle('interactive', state.takeoverActive);
    if (sel && sel.state === 'active') {
      el.statusDot.className = state.takeoverActive ? 'status-dot warn' : 'status-dot online';
    }
    if (isZh) {
      el.takeoverLabel.textContent = state.takeoverActive ? '操控中 · 释放' : '接管操控';
    } else {
      el.takeoverLabel.textContent = state.takeoverActive ? 'Controlling · Release' : 'Takeover Control';
    }
    if (!state.takeoverActive) {
      updateCoordReadout(null);
    }
    if (state.takeoverActive) {
      setStatus(isZh ? '接管操控已开启 · 点击/滚轮/按键/粘贴直发远端' : 'Takeover active · Direct canvas & keyboard ready', 'locked');
      if (focusCanvas && !el.monitorFrame.hidden) {
        try { el.screenSurface.focus({ preventScroll: true }); } catch {}
      }
    } else if (sel?.state === 'active') {
      setStatus(state.live ? (isZh ? '实时画面 · 观察模式' : 'Live · Watch mode') : (isZh ? '已暂停' : 'Paused'));
    }
  }

  function renderPairedDevices(container, devices) {
    container.replaceChildren();
    if (!Array.isArray(devices) || devices.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'card-meta';
      empty.textContent = isZh ? '未检测到已配对设备' : 'No paired devices reported by uuyc-cli.';
      container.appendChild(empty);
      return;
    }
    for (const dev of devices) {
      const row = document.createElement('div');
      row.className = 'device-row';

      const left = document.createElement('div');
      left.className = 'device-row-left';

      const dot = document.createElement('span');
      dot.className = 'status-dot' + (dev.online ? ' online' : '');

      const name = document.createElement('span');
      name.className = 'device-name';
      name.textContent = dev.name || dev.deviceId;

      left.append(dot, name);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pill-btn';
      btn.textContent = dev.connected ? (isZh ? '断开' : 'Disconnect') : (isZh ? '连接' : 'Connect');
      btn.disabled = !dev.online && !dev.connected;
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          setStatus(dev.connected ? `Disconnecting ${dev.name}...` : `Connecting ${dev.name}...`);
          await panelCall('action', {
            action: dev.connected ? 'disconnectDevice' : 'connectDevice',
            deviceId: dev.deviceId,
          });
          await refreshState();
        } catch (err) {
          setStatus(err.message || 'Device operation failed', 'error');
        } finally {
          btn.disabled = false;
        }
      });

      row.append(left, btn);
      container.appendChild(row);
    }
  }

  function stopLiveTransport() {
    state.streamGen += 1;
    state.streamActive = false;
    if (state.pollTimer) {
      clearTimeout(state.pollTimer);
      state.pollTimer = null;
    }
    if (immediateRefreshTimer) {
      clearTimeout(immediateRefreshTimer);
      immediateRefreshTimer = null;
    }
    if (state.streamPort) {
      const port = state.streamPort;
      state.streamPort = null;
      port.onmessage = null;
      try {
        port.postMessage({ __kikiStreamControl: 'close' });
        port.close();
      } catch {}
    }
  }

  async function captureSingleFrame(sessionId) {
    if (state.pollInFlight || !sessionId) return true;
    state.pollInFlight = true;
    try {
      const frame = await panelCall('frame', { sessionId, maxWidth: 1280, maxHeight: 800 });
      if (frame?.ok && frame.dataUrl) {
        state.pollErrorStreak = 0;
        if (frame.logicalSize?.width && frame.logicalSize?.height) {
          const changed = frame.logicalSize.width !== state.logicalSize.width ||
            frame.logicalSize.height !== state.logicalSize.height;
          state.logicalSize = frame.logicalSize;
          state.contentTrimmed = Boolean(frame.contentTrimmed);
          if (changed) layoutMonitorFrame();
        }
        applyTakeoverUi(frame.takeoverActive);
        await paintPngBytes(decodeBase64DataUrl(frame.dataUrl));
        return true;
      }
      state.pollErrorStreak = Math.min(POLL_BACKOFF_MS.length - 1, state.pollErrorStreak + 1);
      if (frame?.error) setStatus(frame.error, 'error');
      return false;
    } catch (err) {
      state.pollErrorStreak = Math.min(POLL_BACKOFF_MS.length - 1, state.pollErrorStreak + 1);
      setStatus(err.message || 'Frame capture failed', 'error');
      return false;
    } finally {
      state.pollInFlight = false;
    }
  }

  function scheduleImmediateFrame(delayMs = 45) {
    const sel = currentSession();
    if (!sel || sel.state !== 'active') return;
    if (state.streamActive && state.streamPort && state.live) {
      try {
        state.streamPort.postMessage(JSON.stringify({ type: 'nudge', sessionId: sel.id }));
        return;
      } catch {}
    }
    if (immediateRefreshTimer) clearTimeout(immediateRefreshTimer);
    immediateRefreshTimer = setTimeout(() => {
      immediateRefreshTimer = null;
      void captureSingleFrame(sel.id);
    }, delayMs);
  }

  async function startPollingFallback(gen, sessionId) {
    if (gen !== state.streamGen || !state.live) return;
    if (!document.hidden) {
      await captureSingleFrame(sessionId);
    }
    if (gen === state.streamGen && state.live && !document.hidden) {
      const delayMs = POLL_BACKOFF_MS[Math.min(POLL_BACKOFF_MS.length - 1, state.pollErrorStreak)] || POLL_INTERVAL_MS;
      state.pollTimer = setTimeout(() => {
        void startPollingFallback(gen, sessionId);
      }, delayMs);
    }
  }

  async function startLiveForSession(session) {
    stopLiveTransport();
    if (!session || session.state !== 'active') return;
    const gen = state.streamGen;

    if (!state.live) {
      void captureSingleFrame(session.id);
      return;
    }

    if (!state.streamUnsupported) {
      try {
        const { port } = await openStream('screen', {
          sessionId: session.id,
          maxWidth: 1280,
          maxHeight: 820,
          fps: 10,
        });
        if (gen !== state.streamGen) {
          port?.close?.();
          return;
        }
        if (port) {
          state.streamPort = port;
          state.streamActive = true;
          port.onmessage = (ev) => {
            if (gen !== state.streamGen) return;
            const d = ev.data;
            if (d instanceof ArrayBuffer && d.byteLength > 16) {
              const dv = new DataView(d);
              if (dv.getUint8(0) !== STREAM_MAGIC_0 || dv.getUint8(1) !== STREAM_MAGIC_1) return;
              const flags = dv.getUint8(2);
              const lw = dv.getUint16(8, false);
              const lh = dv.getUint16(10, false);
              state.contentTrimmed = (flags & 1) !== 0;
              applyTakeoverUi((flags & 2) !== 0);
              if (lw && lh) {
                const changed = lw !== state.logicalSize.width || lh !== state.logicalSize.height;
                state.logicalSize = { width: lw, height: lh };
                if (changed) layoutMonitorFrame();
              }
              void paintPngBytes(new Uint8Array(d, 16));
              return;
            }
            if (d && typeof d === 'object' && d.__kikiStreamEvent === 'close') {
              state.streamActive = false;
              void startPollingFallback(gen, session.id);
            }
          };
          return;
        }
      } catch {
        state.streamUnsupported = true;
      }
    }

    void startPollingFallback(gen, session.id);
  }

  function renderUi() {
    const sessions = state.sessions;
    el.sessionSelect.replaceChildren();

    if (sessions.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = isZh ? '暂无打开的远控窗口' : 'No open session';
      el.sessionSelect.appendChild(opt);
    } else {
      for (const s of sessions) {
        const opt = document.createElement('option');
        opt.value = s.id;
        const suffix = s.state && s.state !== 'active' ? ` (${s.state})` : '';
        const primary = s.label || s.name || s.deviceName || s.id;
        opt.textContent = primary && primary !== s.id ? `${primary} · ${s.id}${suffix}` : `${s.id}${suffix}`;
        opt.selected = s.id === state.selectedSessionId;
        el.sessionSelect.appendChild(opt);
      }
    }

    const hasOffscreen = state.offscreenCount > 0;
    const sel = currentSession();
    el.rescueBtn.hidden = !hasOffscreen;
    el.emptyRescueBtn.hidden = Boolean(sel) || !hasOffscreen || !el.rescueBtn.hidden;
    el.takeoverBtn.disabled = !sel;
    el.liveBtn.disabled = !sel || sel.state !== 'active';
    el.focusWindowBtn.disabled = !sel;
    el.downloadShotBtn.disabled = !sel || sel.state !== 'active';

    renderPairedDevices(el.drawerDevices, state.pairedDevices);

    if (!sel) {
      stopLiveTransport();
      el.statusDot.className = 'status-dot';
      el.aspectPill.hidden = true;
      el.monitorFrame.hidden = true;
      el.recoveryCard.hidden = true;
      el.emptyCard.hidden = false;
      el.pairedList.hidden = state.pairedDevices.length === 0;
      updateCoordReadout(null);
      if (state.pairedDevices.length > 0) {
        renderPairedDevices(el.pairedList, state.pairedDevices);
      }
      setStatus(state.offscreenCount > 0 ? 'Off-screen window detected' : 'Waiting for UU Remote session');
      return;
    }

    el.emptyCard.hidden = true;
    applyTakeoverUi(sel.takeoverActive);

    if (sel.state === 'minimized' || sel.state === 'offscreen') {
      stopLiveTransport();
      el.statusDot.className = 'status-dot warn';
      el.monitorFrame.hidden = true;
      el.recoveryCard.hidden = false;
      updateCoordReadout(null);
      if (sel.state === 'minimized') {
        el.recoveryTitle.textContent = `${sel.label} is minimized`;
        el.recoveryMeta.textContent = 'Restore the session window to resume background capture.';
        el.recoveryActionBtn.textContent = 'Restore Window';
        el.recoveryActionBtn.dataset.mode = 'restore';
      } else {
        el.recoveryTitle.textContent = `${sel.label} is off-screen`;
        el.recoveryMeta.textContent = 'Move the stranded window back onto the primary display.';
        el.recoveryActionBtn.textContent = 'Rescue Off-screen';
        el.recoveryActionBtn.dataset.mode = 'rescue';
      }
      return;
    }

    el.statusDot.className = sel.takeoverActive ? 'status-dot warn' : 'status-dot online';
    el.recoveryCard.hidden = true;
    el.monitorFrame.hidden = false;

    const w = sel.contentRect?.width || sel.canvasBounds?.width || 1920;
    const h = sel.contentRect?.height || sel.canvasBounds?.height || 1080;
    state.logicalSize = { width: w, height: h };
    state.contentTrimmed = Boolean(sel.contentTrimmed);
    layoutMonitorFrame();
    updateTelemetry();
    void startLiveForSession(sel);
  }

  async function refreshState() {
    try {
      const res = await panelCall('state', { includeDevices: true });
      if (res && res.ok) {
        state.sessions = Array.isArray(res.sessions) ? res.sessions : [];
        state.selectedSessionId = res.selectedSessionId || (state.sessions[0]?.id ?? null);
        state.pairedDevices = Array.isArray(res.pairedDevices) ? res.pairedDevices : [];
        state.offscreenCount = Number(res.offscreenCount) || 0;
        renderUi();
      }
    } catch (err) {
      setStatus(err.message || 'Failed to read UU Remote state', 'error');
    }
  }

  function computeContainedRect(cw, ch, iw, ih) {
    const safeCw = Math.max(1, cw);
    const safeCh = Math.max(1, ch);
    const safeIw = Math.max(1, iw);
    const safeIh = Math.max(1, ih);
    const scale = Math.min(safeCw / safeIw, safeCh / safeIh);
    const width = safeIw * scale;
    const height = safeIh * scale;
    return {
      x: (safeCw - width) / 2,
      y: (safeCh - height) / 2,
      width,
      height,
    };
  }

  function mapClientPoint(ev) {
    const surfaceRect = el.screenSurface.getBoundingClientRect();
    const cw = Math.max(1, surfaceRect.width);
    const ch = Math.max(1, surfaceRect.height);
    const lw = Math.max(1, state.logicalSize.width || el.screenCanvas.width || 1920);
    const lh = Math.max(1, state.logicalSize.height || el.screenCanvas.height || 1080);
    const box = computeContainedRect(cw, ch, lw, lh);
    const offX = ev.clientX - surfaceRect.left;
    const offY = ev.clientY - surfaceRect.top;
    const inside =
      offX >= box.x - 0.5 &&
      offX <= box.x + box.width + 0.5 &&
      offY >= box.y - 0.5 &&
      offY <= box.y + box.height + 0.5;
    const rx = Math.max(0, Math.min(1, (offX - box.x) / Math.max(1e-6, box.width)));
    const ry = Math.max(0, Math.min(1, (offY - box.y) / Math.max(1e-6, box.height)));
    return {
      inside,
      normX: Math.round(rx * 1000),
      normY: Math.round(ry * 1000),
      targetX: lw <= 1 ? 0 : Math.round(rx * (lw - 1)),
      targetY: lh <= 1 ? 0 : Math.round(ry * (lh - 1)),
      localX: Math.max(box.x, Math.min(box.x + box.width, offX)),
      localY: Math.max(box.y, Math.min(box.y + box.height, offY)),
      svgX: Math.round((Math.max(box.x, Math.min(box.x + box.width, offX)) / cw) * 1000),
      svgY: Math.round((Math.max(box.y, Math.min(box.y + box.height, offY)) / ch) * 1000),
    };
  }

  function pointerModifiers(ev) {
    const mods = [];
    if (ev.ctrlKey) mods.push('Ctrl');
    if (ev.shiftKey) mods.push('Shift');
    if (ev.altKey) mods.push('Alt');
    if (ev.metaKey) mods.push('Win');
    return mods;
  }

  function sendInteractiveInput(payload) {
    const sel = currentSession();
    if (!sel) return;
    if (!state.takeoverActive) {
      applyTakeoverUi(true);
    }
    if (state.streamActive && state.streamPort) {
      try {
        state.streamPort.postMessage(JSON.stringify({
          type: 'input',
          sessionId: sel.id,
          payload,
        }));
        if (!state.live) scheduleImmediateFrame(45);
        return;
      } catch {}
    }
    void panelCall('action', {
      action: 'input',
      sessionId: sel.id,
      ...payload,
      fromHumanPanel: true,
    })
      .then(() => {
        scheduleImmediateFrame(40);
      })
      .catch((err) => setStatus(err.message || 'Input failed', 'error'));
  }

  function spawnRipple(localX, localY, alt = false) {
    const dot = document.createElement('span');
    dot.className = alt ? 'click-ripple alt' : 'click-ripple';
    dot.style.left = `${localX}px`;
    dot.style.top = `${localY}px`;
    el.screenSurface.appendChild(dot);
    setTimeout(() => dot.remove(), 340);
  }

  async function toggleTakeover(forceValue) {
    const sel = currentSession();
    if (!sel) return;
    const nextActive = typeof forceValue === 'boolean' ? forceValue : !state.takeoverActive;
    try {
      const res = await panelCall('action', {
        action: 'takeover',
        sessionId: sel.id,
        active: nextActive,
      });
      if (res?.ok) {
        applyTakeoverUi(Boolean(res.takeoverActive), { focusCanvas: Boolean(res.takeoverActive) });
      }
    } catch (err) {
      setStatus(err.message || 'Takeover toggle failed', 'error');
    }
  }

  el.screenSurface.addEventListener('contextmenu', (ev) => ev.preventDefault());

  el.screenSurface.addEventListener('pointerleave', () => {
    if (!state.dragStart) updateCoordReadout(null);
  });

  el.screenSurface.addEventListener('pointerdown', (ev) => {
    if (!currentSession()) return;
    if (!state.takeoverActive) {
      pulseTakeoverGate();
      return;
    }
    const pt = mapClientPoint(ev);
    if (!pt.inside) return;
    try { el.screenSurface.focus({ preventScroll: true }); } catch {}
    try { el.screenSurface.setPointerCapture(ev.pointerId); } catch {}
    updateCoordReadout(pt);
    state.dragStart = {
      pointerId: ev.pointerId,
      button: ev.button === 2 ? 'right' : ev.button === 1 ? 'middle' : 'left',
      modifiers: pointerModifiers(ev),
      startX: pt.normX,
      startY: pt.normY,
      svgStartX: pt.svgX,
      svgStartY: pt.svgY,
      localX: pt.localX,
      localY: pt.localY,
      clientX: ev.clientX,
      clientY: ev.clientY,
      dragging: false,
    };
  });

  el.screenSurface.addEventListener('pointermove', (ev) => {
    if (!state.takeoverActive || !currentSession()) return;
    const pt = mapClientPoint(ev);
    if (pt.inside || state.dragStart) {
      updateCoordReadout(pt);
    } else {
      updateCoordReadout(null);
    }
    const ds = state.dragStart;
    if (!ds || ds.pointerId !== ev.pointerId) return;
    const dist = Math.hypot(ev.clientX - ds.clientX, ev.clientY - ds.clientY);
    if (dist >= 6) {
      ds.dragging = true;
      el.dragSvg.hidden = false;
      el.dragLine.setAttribute('x1', String(ds.svgStartX));
      el.dragLine.setAttribute('y1', String(ds.svgStartY));
      el.dragLine.setAttribute('x2', String(pt.svgX));
      el.dragLine.setAttribute('y2', String(pt.svgY));
    }
  });

  function cancelDragGesture(ev) {
    if (state.dragStart && (!ev || state.dragStart.pointerId === ev.pointerId)) {
      state.dragStart = null;
      el.dragSvg.hidden = true;
    }
  }

  el.screenSurface.addEventListener('pointercancel', cancelDragGesture);

  el.screenSurface.addEventListener('pointerup', (ev) => {
    const ds = state.dragStart;
    if (!ds || ds.pointerId !== ev.pointerId) return;
    state.dragStart = null;
    el.dragSvg.hidden = true;
    const pt = mapClientPoint(ev);
    updateCoordReadout(pt);
    if (ds.dragging) {
      spawnRipple(pt.localX, pt.localY, true);
      sendInteractiveInput({
        subAction: 'drag',
        coordinateMode: 'normalized_1000',
        startX: ds.startX,
        startY: ds.startY,
        endX: pt.normX,
        endY: pt.normY,
        button: ds.button,
        durationMs: 210,
      });
    } else {
      const clickCount = ev.detail >= 2 ? 2 : 1;
      spawnRipple(pt.localX, pt.localY, ds.button !== 'left' || clickCount >= 2);
      sendInteractiveInput({
        subAction: 'click',
        coordinateMode: 'normalized_1000',
        x: pt.normX,
        y: pt.normY,
        button: ds.button,
        count: clickCount,
        modifiers: ds.modifiers.length > 0 ? ds.modifiers : undefined,
      });
    }
  });

  el.screenSurface.addEventListener('wheel', (ev) => {
    if (!currentSession()) return;
    if (!state.takeoverActive) {
      ev.preventDefault();
      pulseTakeoverGate();
      return;
    }
    const pt = mapClientPoint(ev);
    if (!pt.inside) return;
    ev.preventDefault();
    updateCoordReadout(pt);
    sendInteractiveInput({
      subAction: 'scroll',
      coordinateMode: 'normalized_1000',
      x: pt.normX,
      y: pt.normY,
      deltaX: Math.round(ev.deltaX),
      deltaY: Math.round(ev.deltaY),
    });
  }, { passive: false });

  const SPECIAL_KEY_NAMES = {
    Enter: 'Enter',
    Tab: 'Tab',
    Escape: 'Escape',
    Backspace: 'Backspace',
    Delete: 'Delete',
    Insert: 'Insert',
    Home: 'Home',
    End: 'End',
    PageUp: 'PageUp',
    PageDown: 'PageDown',
    ArrowUp: 'Up',
    ArrowDown: 'Down',
    ArrowLeft: 'Left',
    ArrowRight: 'Right',
    ' ': 'Space',
  };

  let composing = false;
  el.screenSurface.addEventListener('compositionstart', () => { composing = true; });
  el.screenSurface.addEventListener('compositionend', (ev) => {
    composing = false;
    if (!state.takeoverActive || !currentSession()) return;
    const text = ev.data || '';
    if (text) {
      sendInteractiveInput({ subAction: 'paste', text });
    }
  });

  el.screenSurface.addEventListener('keydown', (ev) => {
    if (!state.takeoverActive || !currentSession() || composing || ev.isComposing) return;
    if (ev.altKey && !ev.ctrlKey && !ev.metaKey && (ev.key === 't' || ev.key === 'T')) {
      ev.preventDefault();
      void toggleTakeover(false);
      return;
    }
    const key = ev.key;
    if (key === 'Control' || key === 'Shift' || key === 'Alt' || key === 'Meta') return;

    // Allow native paste event to carry local clipboard text when pressing Ctrl+V / Cmd+V
    if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && !ev.shiftKey && (key === 'v' || key === 'V')) {
      return;
    }

    if (ev.ctrlKey && ev.altKey) {
      ev.preventDefault();
      setStatus(
        isZh ? '已拦截 Ctrl+Alt 组合键（避免触发本地 UU 客户端快捷键）' : 'Blocked Ctrl+Alt chord (reserved by local UU Remote overlay)',
        'error',
      );
      return;
    }

    const mappedSpecial = SPECIAL_KEY_NAMES[key] || (/^F(?:[1-9]|1[0-2])$/.test(key) ? key : null);
    const hasChordMod = ev.ctrlKey || ev.altKey || ev.metaKey;

    if (mappedSpecial || hasChordMod) {
      ev.preventDefault();
      const keys = [];
      if (ev.ctrlKey) keys.push('Ctrl');
      if (ev.altKey) keys.push('Alt');
      if (ev.shiftKey) keys.push('Shift');
      if (ev.metaKey) keys.push('Win');
      keys.push(mappedSpecial || (key.length === 1 ? key.toUpperCase() : key));
      sendInteractiveInput({ subAction: 'key', keys });
      return;
    }

    if (key.length === 1) {
      ev.preventDefault();
      sendInteractiveInput({ subAction: 'type', text: key, mode: 'auto' });
    }
  });

  el.screenSurface.addEventListener('paste', (ev) => {
    if (!state.takeoverActive || !currentSession()) return;
    ev.preventDefault();
    const text = ev.clipboardData?.getData('text/plain') || '';
    if (text) {
      sendInteractiveInput({ subAction: 'paste', text });
      setStatus(
        isZh ? `已粘贴 ${text.length} 个字符至远端` : `Pasted ${text.length} chars to remote`,
        'locked',
      );
    } else {
      sendInteractiveInput({ subAction: 'key', keys: ['Ctrl', 'V'] });
    }
  });

  window.addEventListener('keydown', (ev) => {
    const tag = document.activeElement?.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (ev.altKey && !ev.ctrlKey && !ev.metaKey && (ev.key === 't' || ev.key === 'T')) {
      ev.preventDefault();
      void toggleTakeover();
    }
  });

  el.sessionSelect.addEventListener('change', async () => {
    const nextId = el.sessionSelect.value;
    if (!nextId) return;
    state.selectedSessionId = nextId;
    await panelCall('action', { action: 'select', sessionId: nextId }).catch(() => {});
    await refreshState();
  });

  el.takeoverBtn.addEventListener('click', () => {
    void toggleTakeover();
  });

  async function runRescueOffscreen() {
    try {
      setStatus('Rescuing off-screen windows...');
      await panelCall('action', { action: 'rescueOffscreen' });
      await refreshState();
    } catch (err) {
      setStatus(err.message || 'Rescue failed', 'error');
    }
  }

  el.rescueBtn.addEventListener('click', runRescueOffscreen);
  el.emptyRescueBtn.addEventListener('click', runRescueOffscreen);

  el.recoveryActionBtn.addEventListener('click', async () => {
    const sel = currentSession();
    if (!sel) return;
    if (el.recoveryActionBtn.dataset.mode === 'rescue') {
      await runRescueOffscreen();
      return;
    }
    await panelCall('action', { action: 'restore', sessionId: sel.id }).catch(() => {});
    await refreshState();
  });

  el.liveBtn.addEventListener('click', () => {
    state.live = !state.live;
    el.liveBtn.classList.toggle('active', state.live);
    if (state.streamActive && state.streamPort) {
      try {
        state.streamPort.postMessage(JSON.stringify({ type: 'configure', paused: !state.live }));
      } catch {}
    } else if (state.live && currentSession()) {
      void startLiveForSession(currentSession());
    }
    setStatus(state.live ? 'Streaming' : 'Paused', state.takeoverActive ? 'locked' : 'normal');
  });

  el.refreshBtn.addEventListener('click', () => void refreshState());
  el.rescanBtn.addEventListener('click', () => void refreshState());

  el.openClientBtn.addEventListener('click', async () => {
    try {
      setStatus('Opening UU Remote...');
      await panelCall('action', { action: 'openClient' });
      await refreshState();
    } catch (err) {
      setStatus(err.message || 'Could not launch UU Remote', 'error');
    }
  });

  el.focusWindowBtn.addEventListener('click', async () => {
    const sel = currentSession();
    if (!sel) return;
    await panelCall('action', { action: 'focus', sessionId: sel.id }).catch(() => {});
  });

  el.drawerToggleBtn.addEventListener('click', () => {
    const nextHidden = !el.drawer.hidden;
    el.drawer.hidden = nextHidden;
    el.drawerToggleBtn.classList.toggle('active', !nextHidden);
    safeStorage.set('uu.drawerOpen', nextHidden ? '0' : '1');
  });

  el.downloadShotBtn.addEventListener('click', () => {
    const url = el.screenCanvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url;
    a.download = `uu-remote-${Date.now()}.png`;
    a.click();
  });

  el.textForm.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const text = el.textInput.value;
    if (!text) return;
    sendInteractiveInput({ subAction: 'paste', text, submit: true });
    el.textInput.value = '';
  });

  for (const btn of document.querySelectorAll('[data-key]')) {
    btn.addEventListener('click', () => {
      sendInteractiveInput({ subAction: 'key', key: btn.dataset.key });
    });
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (state.streamActive && state.streamPort) {
        try {
          state.streamPort.postMessage(JSON.stringify({ type: 'configure', paused: true }));
        } catch {}
      }
      if (state.pollTimer) {
        clearTimeout(state.pollTimer);
        state.pollTimer = null;
      }
    } else if (state.live) {
      if (state.streamActive && state.streamPort) {
        try {
          state.streamPort.postMessage(JSON.stringify({ type: 'configure', paused: false }));
        } catch {}
      } else {
        const sel = currentSession();
        if (sel && sel.state === 'active') {
          state.pollErrorStreak = 0;
          void startLiveForSession(sel);
        }
      }
    }
  });

  window.addEventListener('pagehide', () => {
    stopLiveTransport();
  });

  setTimeout(() => {
    if (!booted) {
      booted = true;
      void refreshState();
    }
  }, 120);
})();
</script>
</body>
</html>
