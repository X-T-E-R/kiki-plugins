    align-items: center;

    height: 28px;
    padding: 0 11px;
    border-radius: 999px;
    border: 1px solid var(--accent);
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 11.5px;
    font-weight: 500;
    box-shadow: 0 8px 22px -10px rgba(18, 17, 15, 0.28);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .kiki-remote-clip-pill:hover {
    background: var(--accent-soft);
  }

  .kiki-remote-clip-pill-label {
    color: var(--accent);
    font-weight: 600;
  }

  .kiki-remote-clip-pill-preview {
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 10.5px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  * { box-sizing: border-box; }

    width: 100%;
    height: 100%;

    border-color: var(--accent);

  }

  }

  }

    user-select: none;
  }
  .click-ripple {
    position: absolute;
    width: 22px;
    height: 22px;
    margin-left: -11px;
    margin-top: -11px;

  }
  .overlay-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;

<body>
<div class="shell">
  <header class="topbar">
    <div class="picker-group">
      <span id="statusDot" class="status-dot"></span>
      <select id="sessionSelect" class="session-select" aria-label="Select UU Remote session">
        <option value="">Scanning sessions...</option>
      </select>
      <span class="select-chevron" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M4.5 6.5L8 10l3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span id="aspectPill" class="aspect-pill" hidden>--</span>
    </div>

    <button id="rescueBtn" type="button" class="pill-btn rescue" hidden title="Move off-screen UU Remote windows onto primary display">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3M9 11l3-3 3 3"/></svg>
      <span>Rescue Off-screen</span>
    </button>

    <button id="takeoverBtn" type="button" class="pill-btn" aria-pressed="false" title="Toggle Takeover Control for direct mouse, keyboard, and clipboard paste (Alt+T)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l12 6.5-5.2 1.6L9.8 17.5 5 4z"/><path d="M13 13l4.5 4.5"/></svg>
      <span id="takeoverLabel">Takeover Control</span>
    </button>

    <button id="keyModeBtn" type="button" class="pill-btn" aria-pressed="false" title="Switch keyboard routing between Host IME (compose &amp; paste) and Raw Keys (physical XT scancodes for Guest IME)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M7 15h10"/></svg>
      <span id="keyModeLabel">Host IME</span>
    </button>

    <button id="gridBtn" type="button" class="pill-btn" aria-pressed="false" title="Toggle 0..1000 coordinate grid" aria-label="Toggle 0..1000 coordinate grid">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="1.5"/><path d="M6 2v12M10 2v12M2 6h12M2 10h12"/></svg>
      <span class="grid-label">Grid</span>
    </button>

    <button id="liveBtn" type="button" class="pill-btn active" title="Toggle live stream">
      <svg width="11" height="11" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3.2" fill="currentColor"/></svg>
      <span>Live</span>
    </button>

    <button id="refreshBtn" type="button" class="pill-btn icon-btn" title="Refresh sessions" aria-label="Refresh sessions">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <div class="workspace">
    <main id="stage" class="stage">
      <section id="emptyCard" class="center-card" hidden>
        <p id="emptyTitle" class="card-title">No active session</p>
        <p id="emptyMeta" class="card-meta">Connect a remote target or launch UU Remote.</p>
        <div id="pairedList" class="device-list" hidden></div>
        <div class="field-row">
          <button id="openClientBtn" type="button" class="pill-btn">Open UU Remote</button>
          <button id="openTargetsBtn" type="button" class="pill-btn active">Add PVE / VNC</button>
          <button id="emptyRescueBtn" type="button" class="pill-btn rescue" hidden>Rescue Off-screen</button>
          <button id="rescanBtn" type="button" class="pill-btn">Scan</button>
        </div>
      </section>

      <section id="recoveryCard" class="center-card" hidden>
        <p id="recoveryTitle" class="card-title">Window minimized</p>
        <p id="recoveryMeta" class="card-meta">Restore the session window to resume background capture.</p>
        <div class="field-row">
          <button id="recoveryActionBtn" type="button" class="pill-btn active">Restore Window</button>
        </div>
      </section>

      <div id="monitorFrame" class="monitor-frame" style="width:640px;height:400px" hidden>
        <div id="screenSurface" class="screen-surface" tabindex="0" role="application" aria-label="UU Remote interactive desktop canvas">
          <canvas id="screenCanvas" width="1280" height="800"></canvas>
          <svg id="gridSvg" class="overlay-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none" hidden></svg>
          <svg id="dragSvg" class="drag-overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none" hidden>
            <defs>
              <marker id="dragArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="rgba(88,168,143,0.95)" />
              </marker>

            <line id="dragLine" x1="0" y1="0" x2="0" y2="0" stroke="rgba(88,168,143,0.92)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#dragArrow)" />

        </div>
      </div>

      <aside class="rail" aria-label="Session tools">
        <button id="focusWindowBtn" type="button" class="rail-btn" title="Bring UU Remote window to front" aria-label="Bring UU Remote window to front">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>

        <button id="drawerToggleBtn" type="button" class="rail-btn" title="Input, clipboard and remote targets" aria-label="Input, clipboard and remote targets">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg>

        </button>
        <div class="rail-sep"></div>
        <button id="downloadShotBtn" type="button" class="rail-btn" title="Save PNG frame" aria-label="Save PNG frame">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        </button>
      </aside>
    </main>

    <aside id="drawer" class="drawer" hidden>
      <div class="drawer-section">
        <p class="section-label">Text &amp; Clipboard</p>

          <input id="textInput" class="input" type="text" placeholder="Type or paste to remote..." />
          <button type="submit" class="pill-btn">Send</button>
        </form>
        <div class="clip-row">
          <span class="clip-label">Clipboard</span>
          <div class="clip-actions">
            <button id="clipPullBtn" type="button" class="pill-btn compact" title="Read remote clipboard">Pull</button>
            <button id="clipPushBtn" type="button" class="pill-btn compact" title="Send text or local clipboard to remote">Push</button>
          </div>
        </div>
        <p id="clipNotice" class="inline-note" hidden></p>
      </div>

        <p class="section-label">Remote Keys</p>
        <div class="field-row">
          <button type="button" class="pill-btn key-btn" data-key="Escape">Esc</button>
          <button type="button" class="pill-btn key-btn" data-key="Tab">Tab</button>
          <button type="button" class="pill-btn key-btn" data-key="Enter">Enter</button>
          <button type="button" class="pill-btn key-btn" data-key="Win+D">Win+D</button>
          <button type="button" class="pill-btn key-btn" data-key="Alt+Tab">Alt+Tab</button>

  </footer>
</div>

        if (resetPillTimer) clearTimeout(resetPillTimer);
        const doneMsg = ok
          ? (isZh ? '已复制到本机剪贴板' : 'Copied to host clipboard')
          : (isZh ? '复制受限 · 请在抽屉查看' : 'Copy blocked in sandbox');
        if (pillLabelEl) pillLabelEl.textContent = doneMsg;
        else if (pillEl) pillEl.textContent = doneMsg;
        options.onRemoteCopied?.(latestRemoteText, ok);
        resetPillTimer = setTimeout(() => {
          resetPillTimer = null;
          if (ok && pillEl) {
            pillEl.hidden = true;
          } else {
            renderPillIdle();
          }
        }, 1400);
      };

      if (pillEl && typeof pillEl.addEventListener === 'function') {
        pillEl.addEventListener('click', onPillClick);
      }

      function isEditableElement(target) {
        if (!target || target === hiddenInput) return false;
        const tag = String(target.tagName || '').toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || Boolean(target.isContentEditable);
      }

      function clearPasteHold() {
        if (pasteHoldTimer) {
          clearTimeout(pasteHoldTimer);
          pasteHoldTimer = null;
        }
        awaitingPasteHold = false;
      }

      /**
       * Call inside surface/hiddenInput keydown handler. Returns true when Ctrl+V / Cmd+V
       * was intercepted for the 60ms pasteHold window (caller must NOT preventDefault!).
       */
      function handleKeyDownForPasteHold(ev) {
        if (!ev || ev.altKey || ev.shiftKey) return false;
        const key = String(ev.key || '');
        if (!(ev.ctrlKey || ev.metaKey) || (key !== 'v' && key !== 'V')) return false;
        if (typeof options.isInteractive === 'function' && !options.isInteractive()) return false;

        clearPasteHold();
        awaitingPasteHold = true;
        // Focus hidden textarea right before browser dispatches native paste event so opaque
        // sandboxes reliably fire `paste` even when user focus was on a <canvas> or <div>.
        if (hiddenInput && doc?.activeElement !== hiddenInput && !isEditableElement(doc?.activeElement)) {
          try {
            hiddenInput.value = '';
            hiddenInput.focus?.({ preventScroll: true });
          } catch {}
        }
        pasteHoldTimer = setTimeout(() => {
          pasteHoldTimer = null;
          if (!awaitingPasteHold) return;
          awaitingPasteHold = false;
          restoreSurfaceFocusIfRaw();
          options.onFallbackPasteChord?.();
        }, holdMs);
        return true;
      }

      function restoreSurfaceFocusIfRaw() {
        if (mode === 'raw' && options.surfaceEl) {
          try {
            options.surfaceEl.focus?.({ preventScroll: true });
          } catch {}
        }
      }

      const onWindowPaste = (ev) => {
        if (disposed) return;
        if (typeof options.isInteractive === 'function' && !options.isInteractive()) return;
        if (isEditableElement(doc?.activeElement)) return;

        const text = ev?.clipboardData?.getData?.('text/plain') || '';
        const wasHolding = awaitingPasteHold;
        clearPasteHold();

        if (hiddenInput) hiddenInput.value = '';
        restoreSurfaceFocusIfRaw();

        if (text) {
          ev?.preventDefault?.();
          options.onHostPaste?.(text, { source: wasHolding ? 'paste_hold' : 'paste_event' });
        } else if (wasHolding) {
          options.onFallbackPasteChord?.();
        }
      };

      const onCompositionStart = () => {
        composing = true;
      };

      const onCompositionEnd = (ev) => {
        composing = false;
        const committed = String(ev?.data || hiddenInput?.value || '');
        if (hiddenInput) hiddenInput.value = '';
        if (!committed) return;
        if (typeof options.isInteractive === 'function' && !options.isInteractive()) return;
        options.onCommittedText?.(committed, { source: 'ime_composition' });
      };

      const onHiddenInput = () => {
        if (composing || awaitingPasteHold || !hiddenInput) return;
        const val = hiddenInput.value;
        if (!val) return;
        hiddenInput.value = '';
        if (typeof options.isInteractive === 'function' && !options.isInteractive()) return;
        options.onCommittedText?.(val, { source: 'input' });
      };

      if (hiddenInput && typeof hiddenInput.addEventListener === 'function') {
        hiddenInput.addEventListener('compositionstart', onCompositionStart);
        hiddenInput.addEventListener('compositionend', onCompositionEnd);
        hiddenInput.addEventListener('input', onHiddenInput);
        if (typeof options.onHiddenKeyDown === 'function') {
          hiddenInput.addEventListener('keydown', (ev) => {
            if (composing || ev.isComposing || ev.keyCode === 229) return;
            if (handleKeyDownForPasteHold(ev)) return;
            options.onHiddenKeyDown(ev);
          });
        }
        if (typeof options.onHiddenKeyUp === 'function') {
          hiddenInput.addEventListener('keyup', (ev) => {
            if (composing || ev.isComposing) return;
            options.onHiddenKeyUp(ev);
          });
        }
      }

      win?.addEventListener?.('paste', onWindowPaste);

      function focusInteractiveTarget() {
        if (mode === 'compose' && hiddenInput) {
          try {
            hiddenInput.focus?.({ preventScroll: true });
            return;
          } catch {}
        }
        try {
          options.surfaceEl?.focus?.({ preventScroll: true });
        } catch {}
      }

      function setMode(nextMode) {
        mode = nextMode === 'raw' ? 'raw' : 'compose';
        if (options.surfaceEl && typeof options.surfaceEl.setAttribute === 'function') {
          options.surfaceEl.setAttribute('inputmode', mode === 'raw' ? 'none' : 'text');
        }
        if (typeof options.isInteractive === 'function' && options.isInteractive()) {
          focusInteractiveTarget();
        }
        return mode;
      }

      function notifyRemoteClipboard(text) {
        const str = String(text ?? '');
        if (!str) return;
        latestRemoteText = str;
        renderPillIdle();
      }

      function bindToolbarPasteForm(formEl, inputEl, { clearOnSend = true } = {}) {
        if (!formEl || !inputEl || typeof formEl.addEventListener !== 'function') return;
        formEl.addEventListener('submit', (ev) => {
          ev.preventDefault?.();
          const val = String(inputEl.value || '');
          if (!val) return;
          options.onHostPaste?.(val, { source: 'toolbar_box', submit: false });
          if (clearOnSend) inputEl.value = '';
        });
      }

      return {
        getMode: () => mode,
        setMode,
        isComposing: () => composing,
        focusInteractiveTarget,
        handleKeyDownForPasteHold,
        notifyRemoteClipboard,
        getLatestRemoteClipboard: () => latestRemoteText,
        bindToolbarPasteForm,
        getHiddenInput: () => hiddenInput,
        dispose() {
          if (disposed) return;
          disposed = true;
          clearPasteHold();
          if (resetPillTimer) clearTimeout(resetPillTimer);
          win?.removeEventListener?.('paste', onWindowPaste);
          pillEl?.removeEventListener?.('click', onPillClick);
          if (createdHiddenInput) hiddenInput?.remove?.();
        },
      };
    }

    /**
     * Context-aware drag-and-drop file/APK overlay for Kiki remote panels.
     * Enforces Frame Audit Blocker 2:
     * - NEVER multiplexes bulk file bytes onto the interactive video/input stream.
     * - Routes uploads over chunked RPC (`uploadInit` -> `uploadChunk` -> `uploadFinish`)
     *   or a dedicated `'upload'` stream channel.
     */

    const WINDOWS_RESERVED_STEM = /^(con|prn|aux|nul|com[1-9]|lpt[1-9])$/i;
    const DEFAULT_UPLOAD_CHUNK_BYTES = 768 * 1024; // 768 KiB raw (~1 MiB base64, <=130 chunks for 100 MB)

    function sanitizeDropFileName(rawName, index = 0) {
      const base = String(rawName ?? '')
        .replace(/^.*[\\/]/, '')
        .replace(/[\x00-\x1f\x7f<>:"/\\|?*]+/g, '_')
        .replace(/^\.+/, '')
        .trim();
      const fallback = base || `dropped-file-${index + 1}`;
      const dotIdx = fallback.lastIndexOf('.');
      const stem = dotIdx > 0 ? fallback.slice(0, dotIdx) : fallback;
      const ext = dotIdx > 0 ? fallback.slice(dotIdx) : '';
      const safeStem = WINDOWS_RESERVED_STEM.test(stem) ? `_${stem}` : stem;
      return `${safeStem.slice(0, 120)}${ext.slice(0, 24)}`;
    }

    function uint8ToBase64(bytes) {
      if (bytes && typeof bytes.toBase64 === 'function') {
        return bytes.toBase64();
      }
      let binary = '';
      const step = 0x8000;
      for (let i = 0; i < bytes.length; i += step) {
        const slice = bytes.subarray(i, Math.min(bytes.length, i + step));
        binary += String.fromCharCode.apply(null, slice);
      }
      return btoa(binary);
    }

    function attachRemoteDropZone(stageEl, options = {}) {
      if (!stageEl || typeof stageEl.addEventListener !== 'function') {
        throw new Error('attachRemoteDropZone requires a stage element');
      }

      const doc = options.documentObj || (typeof document !== 'undefined' ? document : null);
      const isZh = options.isZh !== undefined
        ? Boolean(options.isZh)
        : /^zh\b/i.test(String(typeof navigator !== 'undefined' ? navigator.language : ''));
      const chunkBytes = Number.isFinite(options.chunkBytes) && options.chunkBytes > 0
        ? Math.floor(options.chunkBytes)
        : DEFAULT_UPLOAD_CHUNK_BYTES;

      let dragDepth = 0;
      let uploading = false;
      let disposed = false;

      let overlayEl = options.overlayEl || null;
      let titleEl = null;
      let subEl = null;
      let createdOverlay = false;

      if (!overlayEl && doc && typeof doc.createElement === 'function') {
        overlayEl = doc.createElement('div');
        overlayEl.className = 'kiki-remote-drop-overlay';
        overlayEl.hidden = true;
        const card = doc.createElement('div');
        card.className = 'kiki-remote-drop-card';
        titleEl = doc.createElement('div');
        titleEl.className = 'kiki-remote-drop-title';
        subEl = doc.createElement('div');
        subEl.className = 'kiki-remote-drop-sub';
        card.append(titleEl, subEl);
        overlayEl.appendChild(card);
        stageEl.appendChild(overlayEl);
        createdOverlay = true;
      }

      function showOverlay(title, subtitle = '') {
        if (!overlayEl) return;
        overlayEl.hidden = false;
        if (titleEl) titleEl.textContent = title;
        if (subEl) subEl.textContent = subtitle;
      }

      function hideOverlay() {
        if (overlayEl) overlayEl.hidden = true;
      }

      function hasFiles(ev) {
        const types = ev?.dataTransfer?.types;
        if (!types) return false;
        for (let i = 0; i < types.length; i += 1) {
          if (types[i] === 'Files') return true;
        }
        return false;
      }

      const onDragEnter = (ev) => {
        if (disposed || uploading || !hasFiles(ev)) return;
        if (typeof options.isEnabled === 'function' && !options.isEnabled()) return;
        ev.preventDefault?.();
        dragDepth += 1;
        showOverlay(
          options.dropTitle || (isZh ? '松开以投送文件至设备' : 'Drop files to send to device'),
          options.dropSubtitle || (isZh ? '.apk 自动安装 · 图片与文件推入 Download 并刷新媒体库' : '.apk installs automatically · files push to Download'),
        );
      };

      const onDragOver = (ev) => {
        if (disposed || uploading || !hasFiles(ev)) return;
        if (typeof options.isEnabled === 'function' && !options.isEnabled()) return;
        ev.preventDefault?.();
        if (ev.dataTransfer) ev.dataTransfer.dropEffect = 'copy';
      };

      const onDragLeave = (ev) => {
        if (disposed || uploading) return;
        ev.preventDefault?.();
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) hideOverlay();
      };

      async function uploadSingleFile(file, idx, total) {
        const safeName = sanitizeDropFileName(file.name, idx);
        const isApk = /\.apk$/i.test(safeName);
        const ab = await file.arrayBuffer();
        const bytes = new Uint8Array(ab);

        if (typeof options.uploadFile === 'function') {
          return options.uploadFile({
            fileName: safeName,
            byteLength: bytes.byteLength,
            isApk,
            bytes,
            chunkBytes,
            uint8ToBase64,
            onProgress(pct) {
              showOverlay(
                isZh ? `正在传输 ${safeName} (${pct}%)` : `Uploading ${safeName} (${pct}%)`,
                `${idx + 1} / ${total}`,
              );
            },
          });
        }

        if (typeof options.callRpc !== 'function') {
          throw new Error('DropZone requires uploadFile or callRpc handler');
        }

        const targetMeta = typeof options.getTargetMeta === 'function' ? options.getTargetMeta() : {};
        const initRes = await options.callRpc('uploadInit', {
          ...targetMeta,
          fileName: safeName,
          byteLength: bytes.byteLength,
          mode: isApk ? 'install_apk' : 'push_file',
        });
        if (!initRes || initRes.ok === false || !initRes.uploadId) {
          throw new Error(initRes?.error || 'Failed to initialize file transfer');
        }

        const uploadId = initRes.uploadId;
        let offset = 0;
        while (offset < bytes.byteLength) {
          const end = Math.min(bytes.byteLength, offset + chunkBytes);
          const chunkB64 = uint8ToBase64(bytes.subarray(offset, end));
          const chunkRes = await options.callRpc('uploadChunk', {
            uploadId,
            offset,
            dataBase64: chunkB64,
          });
          if (!chunkRes || chunkRes.ok === false) {
            throw new Error(chunkRes?.error || 'Chunk upload failed');
          }
          offset = end;
          const pct = bytes.byteLength > 0 ? Math.round((offset / bytes.byteLength) * 100) : 100;
          showOverlay(
            isZh
              ? (pct >= 100 && isApk ? `正在安装 ${safeName}...` : `正在传输 ${safeName} (${pct}%)`)
              : (pct >= 100 && isApk ? `Installing ${safeName}...` : `Sending ${safeName} (${pct}%)`),
            `${idx + 1} / ${total}`,
          );
        }

        const finishRes = await options.callRpc('uploadFinish', {
          ...targetMeta,
          uploadId,
        });
        if (!finishRes || finishRes.ok === false) {
          throw new Error(finishRes?.error || 'File finalize failed');
        }
        return finishRes;
      }

      const onDrop = async (ev) => {
        if (disposed) return;
        ev.preventDefault?.();
        dragDepth = 0;
        if (uploading) return;
        if (typeof options.isEnabled === 'function' && !options.isEnabled()) {
          hideOverlay();
          return;
        }

        const rawFiles = ev?.dataTransfer?.files ? Array.from(ev.dataTransfer.files) : [];
        if (rawFiles.length === 0) {
          hideOverlay();
          return;
        }

        uploading = true;
        const results = [];
        try {
          for (let i = 0; i < rawFiles.length; i += 1) {
            const file = rawFiles[i];
            showOverlay(
              isZh ? `准备传输 ${file.name}...` : `Preparing ${file.name}...`,
              `${i + 1} / ${rawFiles.length}`,
            );
            const res = await uploadSingleFile(file, i, rawFiles.length);
            results.push(res);
          }
          options.onComplete?.(results);
        } catch (err) {
          options.onError?.(err);
        } finally {
          uploading = false;
          hideOverlay();
        }
      };

      stageEl.addEventListener('dragenter', onDragEnter);
      stageEl.addEventListener('dragover', onDragOver);
      stageEl.addEventListener('dragleave', onDragLeave);
      stageEl.addEventListener('drop', onDrop);

      return {
        isUploading: () => uploading,
        sanitizeDropFileName,
        dispose() {
          if (disposed) return;
          disposed = true;
          stageEl.removeEventListener('dragenter', onDragEnter);
          stageEl.removeEventListener('dragover', onDragOver);
          stageEl.removeEventListener('dragleave', onDragLeave);
          stageEl.removeEventListener('drop', onDrop);
          if (createdOverlay) overlayEl?.remove?.();
        },
      };
    }

    /**
     * Per-target Lease & Human Takeover status bar controller for Kiki remote panels.
     * Synchronizes `AI 控制中 · 接管` <-> `人工接管中 · 交还 AI` per target without blocking
     * sibling devices/VMs.
     */

    function createRemoteLeaseBar(options = {}) {
      const win = options.windowObj || (typeof window !== 'undefined' ? window : null);
      const doc = options.documentObj || (typeof document !== 'undefined' ? document : null);
      const buttonEl = options.buttonEl || null;
      const labelEl = options.labelEl || null;
      const dotEl = options.dotEl || null;
      const shortcutKey = String(options.shortcutKey || 'i').toLowerCase();
      const isZh = options.isZh !== undefined
        ? Boolean(options.isZh)
        : /^zh\b/i.test(String(win?.navigator?.language || ''));

      const stateByTarget = new Map();
      let currentTargetKey = options.initialTargetKey || '';
      let online = true;
      let disposed = false;

      function getEntry(targetKey = currentTargetKey) {
        const key = String(targetKey || '');
        if (!key) return { active: false, controlledBy: 'agent', reason: null };
        return stateByTarget.get(key) || { active: false, controlledBy: 'agent', reason: null };
      }

      function formatLabel(active) {
        if (options.labels) {
          return active ? options.labels.active : options.labels.idle;
        }
        if (isZh) {
          return active ? '人工接管中 · 交还 AI' : 'AI 控制中 · 接管';
        }
        return active ? 'Human Takeover · Hand back' : 'AI Ready · Take over';
      }

      function render() {
        const entry = getEntry(currentTargetKey);
        const active = Boolean(entry.active);
        if (buttonEl) {
          buttonEl.disabled = !online || !currentTargetKey;
          buttonEl.classList?.toggle?.('takeover-locked', active);
          buttonEl.classList?.toggle?.('interactive-on', active);
          buttonEl.setAttribute?.('aria-pressed', active ? 'true' : 'false');
        }
        if (labelEl) {
          labelEl.textContent = formatLabel(active);
        }
        if (dotEl) {
          dotEl.className = 'status-dot ' + (!online ? 'warn' : (active ? 'warn' : 'online'));
        }
        options.onRender?.({
          targetKey: currentTargetKey,
          takeoverActive: active,
          controlledBy: active ? 'human' : 'agent',
          online,
        });
      }

      async function setTakeover(nextActive, { targetKey = currentTargetKey, syncBackend = true, reason } = {}) {
        const key = String(targetKey || '');
        if (!key) return { active: false, targetKey: '' };
        const active = Boolean(nextActive);
        stateByTarget.set(key, {
          active,
          controlledBy: active ? 'human' : 'agent',
          reason: reason || null,
        });
        if (key === currentTargetKey) {
          render();
        }
        if (syncBackend && typeof options.onToggleBackend === 'function') {
          const res = await options.onToggleBackend({ targetKey: key, active, reason });
          if (res && typeof res.takeoverActive === 'boolean') {
            stateByTarget.set(key, {
              active: Boolean(res.takeoverActive),
              controlledBy: res.takeoverActive ? 'human' : 'agent',
              reason: res.reason || null,
            });
            if (key === currentTargetKey) render();
          }
        }
        return getEntry(key);
      }

      function syncFromBackend(targetKey, takeoverActive, extra = {}) {
        const key = String(targetKey || currentTargetKey || '');
        if (!key) return;
        stateByTarget.set(key, {
          active: Boolean(takeoverActive),
          controlledBy: takeoverActive ? 'human' : (extra.controlledBy || 'agent'),
          reason: extra.reason || null,
        });
        if (key === currentTargetKey) render();
      }

      function setTarget(targetKey, { isOnline = true, initialActive } = {}) {
        currentTargetKey = String(targetKey || '');
        online = Boolean(isOnline);
        if (currentTargetKey && typeof initialActive === 'boolean' && !stateByTarget.has(currentTargetKey)) {
          stateByTarget.set(currentTargetKey, {
            active: initialActive,
            controlledBy: initialActive ? 'human' : 'agent',
            reason: null,
          });
        }
        render();
      }

      const onButtonClick = () => {
        if (disposed || !online || !currentTargetKey) return;
        const cur = getEntry(currentTargetKey);
        void setTakeover(!cur.active, { targetKey: currentTargetKey, syncBackend: true });
      };

      const onWindowKeyDown = (ev) => {
        if (disposed || !ev || !ev.altKey || ev.ctrlKey || ev.metaKey) return;
        const tag = String(doc?.activeElement?.tagName || '').toUpperCase();
        if (tag === 'INPUT' || tag === 'SELECT') return;
        if (String(ev.key || '').toLowerCase() === shortcutKey) {
          ev.preventDefault?.();
          onButtonClick();
        }
      };

      buttonEl?.addEventListener?.('click', onButtonClick);
      win?.addEventListener?.('keydown', onWindowKeyDown);

      return {
        getTarget: () => currentTargetKey,
        setTarget,
        isTakeoverActive: (targetKey = currentTargetKey) => Boolean(getEntry(targetKey).active),
        setTakeover,
        syncFromBackend,
        render,
        dispose() {
          if (disposed) return;
          disposed = true;
          buttonEl?.removeEventListener?.('click', onButtonClick);
          win?.removeEventListener?.('keydown', onWindowKeyDown);
        },
      };
    }

    /**
     * Crisp nearest-neighbor pixel magnifier (2x-4x, default 3x) for dense 1024x768
     * CAD/PDM and desktop UIs inside narrow Kiki workspace side panels.
     * Activated via toolbar toggle button OR while holding `Alt` / Backquote (`).
     */

    function attachRemoteMagnifier(options = {}) {
      const stageEl = options.stageEl;
      const sourceCanvas = options.sourceCanvas;
      if (!stageEl || !sourceCanvas) {
        throw new Error('attachRemoteMagnifier requires stageEl and sourceCanvas');
      }

      const win = options.windowObj || (typeof window !== 'undefined' ? window : null);
      const doc = options.documentObj || (typeof document !== 'undefined' ? document : null);
      const zoomFactor = Math.min(4, Math.max(2, Number(options.zoomFactor) || 3));
      const lensSize = Number.isFinite(options.lensSize) ? options.lensSize : 168;
      const toggleBtn = options.toggleBtn || null;
      const enableAltHold = options.enableAltHold !== false;
      const enableBackquoteHold = options.enableBackquoteHold !== false;

      let pinned = false;
      let holdActive = false;
      let lastPointer = null;
      let disposed = false;

      let lensEl = options.lensEl || null;
      let lensCanvas = null;
      let lensCtx = null;
      let coordEl = null;
      let createdDom = false;

      if (!lensEl && doc && typeof doc.createElement === 'function') {
        lensEl = doc.createElement('div');
        lensEl.className = 'kiki-remote-magnifier';
        lensEl.hidden = true;
        if (lensEl.style) {
          lensEl.style.width = `${lensSize}px`;
          lensEl.style.height = `${lensSize}px`;
        }

        lensCanvas = doc.createElement('canvas');
        lensCanvas.width = lensSize;
        lensCanvas.height = lensSize;
        lensCanvas.className = 'kiki-remote-magnifier-canvas';
        lensCtx = lensCanvas.getContext?.('2d', { alpha: false }) || null;

        coordEl = doc.createElement('div');
        coordEl.className = 'kiki-remote-magnifier-meta';

        lensEl.append(lensCanvas, coordEl);
        stageEl.appendChild(lensEl);
        createdDom = true;
      }

      function isActive() {
        return pinned || holdActive;
      }

      function syncButtonState() {
        if (!toggleBtn) return;
        const on = isActive();
        toggleBtn.classList?.toggle?.('active', on);
        toggleBtn.setAttribute?.('aria-pressed', on ? 'true' : 'false');
      }

      function hideLens() {
        if (lensEl) lensEl.hidden = true;
      }

      function renderAt(projectedPt, clientEvent) {
        if (!lensEl || !lensCtx || !isActive() || !projectedPt || !projectedPt.inside) {
          hideLens();
          return;
        }
        const srcW = Number(sourceCanvas.width) || 0;
        const srcH = Number(sourceCanvas.height) || 0;
        if (srcW <= 0 || srcH <= 0) {
          hideLens();
          return;
        }

        const stageRect = stageEl.getBoundingClientRect();
        const cx = (Number(clientEvent?.clientX) || 0) - (Number(stageRect?.left) || 0);
        const cy = (Number(clientEvent?.clientY) || 0) - (Number(stageRect?.top) || 0);
        const margin = 10;
        const offset = 22;

        let left = cx + offset;
        let top = cy - lensSize - offset;
        if (left + lensSize + margin > stageRect.width) {
          left = Math.max(margin, cx - lensSize - offset);
        }
        if (top < margin) {
          top = Math.min(Math.max(margin, stageRect.height - lensSize - margin), cy + offset);
        }

        lensEl.hidden = false;
        if (lensEl.style) {
          lensEl.style.left = `${Math.round(left)}px`;
          lensEl.style.top = `${Math.round(top)}px`;
        }

        const sampleW = Math.max(8, Math.round(lensSize / zoomFactor));
        const sampleH = Math.max(8, Math.round(lensSize / zoomFactor));
        const centerSrcX = Math.round(projectedPt.normX * (srcW - 1));
        const centerSrcY = Math.round(projectedPt.normY * (srcH - 1));
        const sx = centerSrcX - Math.floor(sampleW / 2);
        const sy = centerSrcY - Math.floor(sampleH / 2);

        lensCtx.imageSmoothingEnabled = false;
        lensCtx.fillStyle = '#141413';
        lensCtx.fillRect(0, 0, lensSize, lensSize);

        const clampSx = Math.max(0, sx);
        const clampSy = Math.max(0, sy);

    const writer = ds.writable.getWriter();
    const writeTask = writer.write(compressed).then(() => writer.close());
    const reader = ds.readable.getReader();
    const chunks = [];
    let total = 0;
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      if (value && value.byteLength) {
        chunks.push(value);
        total += value.byteLength;
      }
    }
    await writeTask;
    const out = new Uint8ClampedArray(expectedByteLength > 0 && total === expectedByteLength ? expectedByteLength : total);
    let pos = 0;
    for (const chunk of chunks) {
      out.set(chunk, pos);
      pos += chunk.byteLength;
    }
    return out;

          requestStreamKeyframe(sessionId);
          return;
        }
        state.expectedFrameSeq = (frameSeq + 1) >>> 0;
      }

      let off = 12;
      for (let i = 0; i < rectCount; i += 1) {
        if (off >= arrayBuffer.byteLength) break;
        const enc = dv.getUint8(off);
        if (enc === RECT_COPYRECT) {
          if (off + 13 > arrayBuffer.byteLength) break;
          const x = dv.getUint16(off + 1, false);
          const y = dv.getUint16(off + 3, false);
          const w = dv.getUint16(off + 5, false);
          const h = dv.getUint16(off + 7, false);
          const srcX = dv.getUint16(off + 9, false);
          const srcY = dv.getUint16(off + 11, false);
          off += 13;
          if (w > 0 && h > 0) {
            ctx.drawImage(el.screenCanvas, srcX, srcY, w, h, x, y, w, h);
          }
        } else {
          if (off + 13 > arrayBuffer.byteLength) break;
          const x = dv.getUint16(off + 1, false);
          const y = dv.getUint16(off + 3, false);
          const w = dv.getUint16(off + 5, false);
          const h = dv.getUint16(off + 7, false);
          const dataLen = dv.getUint32(off + 9, false);
          off += 13;
          if (off + dataLen > arrayBuffer.byteLength) break;
          const slice = new Uint8Array(arrayBuffer, off, dataLen);
          off += dataLen;
          if (w > 0 && h > 0) {
            const expectedBytes = w * h * 4;
            const rgba = enc === RECT_DEFLATE_RGBA
              ? await inflateZlibBytes(slice, expectedBytes)
              : new Uint8ClampedArray(slice.buffer, slice.byteOffset, slice.byteLength);
            if (rgba.byteLength === expectedBytes) {
              ctx.putImageData(new ImageData(rgba, w, h), x, y);
            }
          }
        }
      }

      state.streamIdle = false;
      state.lastDeltaBytes = keyFrame ? null : arrayBuffer.byteLength;
      magnifier.refresh();
      recordFps();
    }).catch(() => {
      requestStreamKeyframe(sessionId);
    });
  }

  function decodeBase64DataUrl(dataUrl) {
    const idx = dataUrl.indexOf(',');
    const raw = atob(idx === -1 ? dataUrl : dataUrl.slice(idx + 1));
    const out = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i += 1) out[i] = raw.charCodeAt(i);
    return out;
  }

  function applyTakeoverUi(active, { focusCanvas = false, forceStatus = false, silentStatus = false } = {}) {
    const nextActive = Boolean(active);
    const sel = currentSession();
    const sid = sel?.id || null;
    const changed = !state.takeoverInitialized
      || state.takeoverSessionId !== sid
      || state.takeoverActive !== nextActive;
    if (!changed && !forceStatus) {
      if (focusCanvas && nextActive && !el.monitorFrame.hidden) {
        try { el.screenSurface.focus({ preventScroll: true }); } catch {}
      }
      return;
    }

    state.takeoverInitialized = true;
    state.takeoverSessionId = sid;
    state.takeoverActive = nextActive;
    if (sel) sel.takeoverActive = state.takeoverActive;
    el.takeoverBtn.classList.toggle('takeover-locked', state.takeoverActive);
    el.takeoverBtn.setAttribute('aria-pressed', state.takeoverActive ? 'true' : 'false');
    el.monitorFrame.classList.toggle('takeover-ring', state.takeoverActive);
    el.screenSurface.classList.toggle('interactive', state.takeoverActive);
    if (sel && sel.state === 'active') {
      el.statusDot.className = state.takeoverActive ? 'status-dot warn' : 'status-dot online';
    }
    if (isZh) {
      el.takeoverLabel.textContent = state.takeoverActive ? '操控中 · 释放' : '接管操控';
    } else {
      el.takeoverLabel.textContent = state.takeoverActive ? 'Controlling · Release' : 'Takeover Control';
    }
    if (!state.takeoverActive) {
      releaseHeldRawKeys();
      updateCoordReadout(null);
    }
    if (focusCanvas && state.takeoverActive && !el.monitorFrame.hidden) {
      focusActiveInputTarget();
    }
    if (silentStatus) return;
    if (state.takeoverActive) {
      setStatus(isZh ? '接管操控已开启 · 点击/滚轮/按键/粘贴直发远端' : 'Takeover active · Direct canvas & keyboard ready', 'locked');
    } else if (sel?.state === 'active') {
      setStatus(state.live ? (isZh ? '实时画面 · 观察模式' : 'Live · Watch mode') : (isZh ? '已暂停' : 'Paused'));
    }
  }

  function renderRemoteTargets(sessions) {
    const targets = (Array.isArray(sessions) ? sessions : []).filter((s) => isRemoteProtocolSession(s));
    el.remoteTargetList.replaceChildren();
    el.remoteTargetList.hidden = targets.length === 0;
    if (targets.length === 0) return;

    for (const target of targets) {

      mainBtn.type = 'button';
      mainBtn.className = 'device-row-main';
      mainBtn.title = target.id;
      mainBtn.addEventListener('click', async () => {
        if (state.selectedSessionId === target.id) return;
        state.selectedSessionId = target.id;
        await panelCall('action', { action: 'select', sessionId: target.id }).catch(() => {});
        await refreshState();
      });

      const dot = document.createElement('span');
      dot.className = 'status-dot' + (target.state === 'active' ? ' online' : ' warn');

      const name = document.createElement('span');
      name.className = 'device-name';
      name.textContent = target.label || target.id;

      mainBtn.append(dot, name);

      const tLabel = formatTransportLabel(target.transport);
      if (tLabel) {
        const badge = document.createElement('span');
        badge.className = 'transport-tag';
        badge.textContent = tLabel;
        mainBtn.append(badge);
      }

      const disconnectBtn = document.createElement('button');
      disconnectBtn.type = 'button';
      disconnectBtn.className = 'pill-btn compact';
      disconnectBtn.textContent = isZh ? '断开' : 'Disconnect';
      disconnectBtn.addEventListener('click', async () => {
        disconnectBtn.disabled = true;
        try {
          setStatus(isZh ? `正在断开 ${target.label || target.id}...` : `Disconnecting ${target.label || target.id}...`);
          const res = await panelCall('action', { action: 'disconnectTarget', sessionId: target.id });
          if (res && res.ok === false) {
            setStatus(res.error || 'Disconnect failed', 'error');
          } else {
            await refreshState();
            setStatus(isZh ? `已断开 ${target.label || target.id}` : `Disconnected ${target.label || target.id}`);
          }
        } catch (err) {
          setStatus(err.message || 'Disconnect failed', 'error');
        } finally {
          disconnectBtn.disabled = false;
        }
      });

      row.append(mainBtn, disconnectBtn);
      el.remoteTargetList.appendChild(row);

  function renderPairedDevices(container, devices) {
    container.replaceChildren();
    if (!Array.isArray(devices) || devices.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'card-meta';
      empty.textContent = isZh ? '未检测到已配对设备' : 'No paired devices reported by uuyc-cli.';
      container.appendChild(empty);
      return;
    }
    for (const dev of devices) {
      const row = document.createElement('div');
      row.className = 'device-row';

      const left = document.createElement('div');
      left.className = 'device-row-left';

      const dot = document.createElement('span');
      dot.className = 'status-dot' + (dev.online ? ' online' : '');

      const name = document.createElement('span');
      name.className = 'device-name';
      name.textContent = dev.name || dev.deviceId;

      left.append(dot, name);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pill-btn';
      btn.textContent = dev.connected ? (isZh ? '断开' : 'Disconnect') : (isZh ? '连接' : 'Connect');
      btn.disabled = !dev.online && !dev.connected;
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          setStatus(dev.connected ? `Disconnecting ${dev.name}...` : `Connecting ${dev.name}...`);
          await panelCall('action', {
            action: dev.connected ? 'disconnectDevice' : 'connectDevice',
            deviceId: dev.deviceId,
          });
          await refreshState();
        } catch (err) {
          setStatus(err.message || 'Device operation failed', 'error');
        } finally {
          btn.disabled = false;
        }
      });

      row.append(left, btn);
      container.appendChild(row);
    }
  }

  function stopLiveTransport() {
    releaseHeldRawKeys();
    state.streamGen += 1;
    state.streamActive = false;
    state.expectedFrameSeq = null;
    state.awaitingKeyframe = false;
    state.lastDeltaBytes = null;
    if (state.pollTimer) {
      clearTimeout(state.pollTimer);
      state.pollTimer = null;
    }
    if (immediateRefreshTimer) {
      clearTimeout(immediateRefreshTimer);
      immediateRefreshTimer = null;
    }
    if (state.streamPort) {
      const port = state.streamPort;
      state.streamPort = null;
      port.onmessage = null;
      try {
        port.postMessage({ __kikiStreamControl: 'close' });
        port.close();
      } catch {}
    }
  }

  async function captureSingleFrame(sessionId) {
    if (state.pollInFlight || !sessionId) return true;
    state.pollInFlight = true;
    try {
      const frame = await panelCall('frame', { sessionId, maxWidth: 1280, maxHeight: 800 });
      if (frame?.ok && frame.dataUrl) {
        state.pollErrorStreak = 0;
        state.streamIdle = false;
        if (frame.transport) state.transport = frame.transport;
        if (Number.isFinite(frame.captureMs)) state.captureMs = frame.captureMs;
        if (frame.capabilities && typeof frame.capabilities === 'object') {
          state.capabilities = frame.capabilities;
          updateCapabilitiesUi();
        }
        if (frame.logicalSize?.width && frame.logicalSize?.height) {
          const changed = frame.logicalSize.width !== state.logicalSize.width ||
            frame.logicalSize.height !== state.logicalSize.height;
          state.logicalSize = frame.logicalSize;
          state.contentTrimmed = Boolean(frame.contentTrimmed);
          if (changed) layoutMonitorFrame();
        }
        if (typeof frame.takeoverActive === 'boolean') {
          applyTakeoverUi(frame.takeoverActive);
        }
        await paintPngBytes(decodeBase64DataUrl(frame.dataUrl));
        return true;
      }
      state.pollErrorStreak = Math.min(POLL_BACKOFF_MS.length - 1, state.pollErrorStreak + 1);
      if (frame?.error) setStatus(frame.error, 'error');
      return false;
    } catch (err) {
      state.pollErrorStreak = Math.min(POLL_BACKOFF_MS.length - 1, state.pollErrorStreak + 1);
      setStatus(err.message || 'Frame capture failed', 'error');
      return false;
    } finally {
      state.pollInFlight = false;
    }
  }

  function scheduleImmediateFrame(delayMs = 45) {
    const sel = currentSession();
    if (!sel || sel.state !== 'active') return;
    if (state.streamActive && state.streamPort && state.live) {
      try {
        state.streamPort.postMessage(JSON.stringify({ type: 'nudge', sessionId: sel.id }));
        return;
      } catch {}
    }
    if (immediateRefreshTimer) clearTimeout(immediateRefreshTimer);
    immediateRefreshTimer = setTimeout(() => {
      immediateRefreshTimer = null;
      void captureSingleFrame(sel.id);
    }, delayMs);
  }

  async function startPollingFallback(gen, sessionId) {
    if (gen !== state.streamGen || !state.live) return;
    if (!document.hidden) {
      await captureSingleFrame(sessionId);
    }
    if (gen === state.streamGen && state.live && !document.hidden) {
      const delayMs = POLL_BACKOFF_MS[Math.min(POLL_BACKOFF_MS.length - 1, state.pollErrorStreak)] || POLL_INTERVAL_MS;
      state.pollTimer = setTimeout(() => {
        void startPollingFallback(gen, sessionId);
      }, delayMs);
    }
  }

  async function startLiveForSession(session) {
    stopLiveTransport();
    if (!session || session.state !== 'active') return;
    const gen = state.streamGen;

    if (!state.live) {
      void captureSingleFrame(session.id);
      return;
    }

    if (!state.streamUnsupported) {
      try {
        const { result, port } = await openStream('screen', {
          sessionId: session.id,
          maxWidth: 1280,
          maxHeight: 820,
          fps: 30,
        });
        if (gen !== state.streamGen) {
          port?.close?.();
          return;
        }
        if (port) {
          state.streamPort = port;
          state.streamActive = true;
          state.expectedFrameSeq = null;
          state.awaitingKeyframe = false;
          if (result?.transport) {
            state.transport = result.transport;
            updateTelemetry();
          }
          port.onmessage = (ev) => {
            if (gen !== state.streamGen) return;
            const d = ev.data;
            if (d instanceof ArrayBuffer && d.byteLength >= 12) {
              const dv = new DataView(d);
              const magic0 = dv.getUint8(0);
              if (magic0 === DIRTY_FRAME_MAGIC) {
                enqueueDirtyRectFrame(d, gen, session.id);
                return;
              }
              if (d.byteLength > 16 && magic0 === STREAM_MAGIC_0 && dv.getUint8(1) === STREAM_MAGIC_1) {
                const flags = dv.getUint8(2);
                const lw = dv.getUint16(8, false);
                const lh = dv.getUint16(10, false);
                state.streamIdle = false;
                state.lastDeltaBytes = null;
                state.contentTrimmed = (flags & 1) !== 0;
                applyTakeoverUi((flags & 2) !== 0);
                if (lw && lh) {
                  const changed = lw !== state.logicalSize.width || lh !== state.logicalSize.height;
                  state.logicalSize = { width: lw, height: lh };
                  if (changed) layoutMonitorFrame();
                }
                void paintPngBytes(new Uint8Array(d, 16));
              }
              return;
            }
            const msg = typeof d === 'string'
              ? (() => { try { return JSON.parse(d); } catch { return null; } })()
              : d;
            if (!msg || typeof msg !== 'object') return;
            if (msg.__kikiStreamEvent === 'close') {
              state.streamActive = false;
              void startPollingFallback(gen, session.id);
              return;
            }
            if (msg.type === 'remoteClipboard' && typeof msg.text === 'string') {
              if (!msg.sessionId || msg.sessionId === session.id) {
                el.textInput.value = msg.text;
                clipboardBridge.notifyRemoteClipboard(msg.text);
              }
              return;
            }
            if (msg.type === 'telemetry') {
              if (msg.sessionId && session.id && msg.sessionId !== session.id) return;
              if (msg.transport) state.transport = msg.transport;
              if (msg.capabilities && typeof msg.capabilities === 'object') {
                state.capabilities = msg.capabilities;
              }
              state.streamIdle = Boolean(msg.unchanged);
              if (msg.unchanged) {
                state.fpsSamples = [];
              } else if (Number.isFinite(msg.captureMs)) {
                state.captureMs = msg.captureMs;
              }
              if (msg.width > 0 && msg.height > 0) {
                const changed = msg.width !== state.logicalSize.width || msg.height !== state.logicalSize.height;
                state.logicalSize = { width: msg.width, height: msg.height };
                if (changed) layoutMonitorFrame();
              }
              if (typeof msg.takeoverActive === 'boolean') {
                applyTakeoverUi(msg.takeoverActive);
              }
              updateCapabilitiesUi();
              updateTelemetry();
              return;
            }
            if (msg.type === 'sessionState') {
              if (msg.state && msg.state !== 'active') {
                void refreshState();
              }
              return;
            }
            if (msg.type === 'streamWarning' && msg.message) {
              setStatus(msg.message, 'error');
            }
          };
          if (typeof port.start === 'function') port.start();
          return;
        }
      } catch {
        state.streamUnsupported = true;
      }
    }

    void startPollingFallback(gen, session.id);
  }

  function renderUi() {
    const sessions = state.sessions;
    el.sessionSelect.replaceChildren();

    if (sessions.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = isZh ? '暂无打开的远控窗口' : 'No open session';
      el.sessionSelect.appendChild(opt);
    } else {
      for (const s of sessions) {
        const opt = document.createElement('option');
        opt.value = s.id;
        const suffix = s.state && s.state !== 'active' ? ` (${s.state})` : '';
        const primary = s.label || s.name || s.deviceName || s.id;
        opt.textContent = primary && primary !== s.id ? `${primary} · ${s.id}${suffix}` : `${s.id}${suffix}`;
        opt.selected = s.id === state.selectedSessionId;
        el.sessionSelect.appendChild(opt);
      }
    }

    const hasOffscreen = state.offscreenCount > 0;
    const sel = currentSession();
    const sessionChanged = (sel?.id ?? null) !== state.lastRenderedSessionId;
    if (sessionChanged) {
      state.lastRenderedSessionId = sel?.id ?? null;
      state.transport = sel?.transport || null;
      state.captureMs = null;
      state.capabilities = null;
      state.streamIdle = false;
      state.clipboardUnsupportedError = false;
      state.fpsSamples = [];
      state.takeoverInitialized = false;
      state.takeoverSessionId = null;
    } else if (sel?.transport && !state.transport) {
      state.transport = sel.transport;
    }

    el.rescueBtn.hidden = !hasOffscreen;
    el.emptyRescueBtn.hidden = Boolean(sel) || !hasOffscreen || !el.rescueBtn.hidden;
    el.takeoverBtn.disabled = !sel;
    el.gridBtn.disabled = !sel || sel.state !== 'active';
    el.liveBtn.disabled = !sel || sel.state !== 'active';
    el.focusWindowBtn.disabled = !sel || isRemoteProtocolSession(sel);
    el.downloadShotBtn.disabled = !sel || sel.state !== 'active';

    renderRemoteTargets(sessions);
    renderPairedDevices(el.drawerDevices, state.pairedDevices);
    updateCapabilitiesUi();

    if (!sel) {
      stopLiveTransport();
      applyTakeoverUi(false, { forceStatus: true, silentStatus: true });
      el.statusDot.className = 'status-dot';
      el.aspectPill.hidden = true;
      el.telemetryText.textContent = '--';
      el.monitorFrame.hidden = true;
      el.recoveryCard.hidden = true;
      el.emptyCard.hidden = false;
      el.pairedList.hidden = state.pairedDevices.length === 0;
      updateCoordReadout(null);
      if (state.pairedDevices.length > 0) {
        renderPairedDevices(el.pairedList, state.pairedDevices);
      }
      if (sessionChanged) {
        setStatus(state.offscreenCount > 0 ? 'Off-screen window detected' : 'Waiting for remote session');
      }
      return;
    }

    el.emptyCard.hidden = true;
    applyTakeoverUi(sel.takeoverActive, { forceStatus: sessionChanged });

    if (sel.state === 'minimized' || sel.state === 'offscreen' || sel.state === 'stopped' || sel.state === 'disconnected') {
      stopLiveTransport();
      el.statusDot.className = 'status-dot warn';
      el.monitorFrame.hidden = true;
      el.recoveryCard.hidden = false;
      updateCoordReadout(null);
      updateTelemetry();
      if (sel.state === 'minimized') {
        el.recoveryTitle.textContent = `${sel.label} is minimized`;
        el.recoveryMeta.textContent = 'Restore the session window to resume background capture.';
        el.recoveryActionBtn.textContent = 'Restore Window';
        el.recoveryActionBtn.dataset.mode = 'restore';
      } else if (sel.state === 'offscreen') {
        el.recoveryTitle.textContent = `${sel.label} is off-screen`;
        el.recoveryMeta.textContent = 'Move the stranded window back onto the primary display.';
        el.recoveryActionBtn.textContent = 'Rescue Off-screen';
        el.recoveryActionBtn.dataset.mode = 'rescue';
      } else {
        el.recoveryTitle.textContent = `${sel.label} is ${sel.vmStatus || sel.state}`;
        el.recoveryMeta.textContent = sel.error || (
          sel.provider === 'rfb'
            ? 'Check VNC target reachability, then refresh.'
            : 'Start the Proxmox VE VM or check SSH connectivity, then refresh.'
        );
        el.recoveryActionBtn.textContent = 'Refresh';
        el.recoveryActionBtn.dataset.mode = 'refresh';
      }
      return;
    }

    el.statusDot.className = sel.takeoverActive ? 'status-dot warn' : 'status-dot online';
    el.recoveryCard.hidden = true;
    el.monitorFrame.hidden = false;

    const w = sel.contentRect?.width || sel.canvasBounds?.width || 1920;
    const h = sel.contentRect?.height || sel.canvasBounds?.height || 1080;
    state.logicalSize = { width: w, height: h };
    state.contentTrimmed = Boolean(sel.contentTrimmed);
    layoutMonitorFrame();
    updateTelemetry();
    if (sessionChanged || !state.streamActive) {
      void startLiveForSession(sel);
    }
  }

  async function refreshState() {
    try {
      const res = await panelCall('state', { includeDevices: true });
      if (res && res.ok) {
        state.sessions = Array.isArray(res.sessions) ? res.sessions : [];
        state.selectedSessionId = res.selectedSessionId || (state.sessions[0]?.id ?? null);
        state.pairedDevices = Array.isArray(res.pairedDevices) ? res.pairedDevices : [];
        state.offscreenCount = Number(res.offscreenCount) || 0;
        renderUi();
      }
    } catch (err) {
      setStatus(err.message || 'Failed to read UU Remote state', 'error');
    }
  }

  function computeContainedRect(cw, ch, iw, ih) {
    const safeCw = Math.max(1, cw);
    const safeCh = Math.max(1, ch);
    const safeIw = Math.max(1, iw);
    const safeIh = Math.max(1, ih);
    const scale = Math.min(safeCw / safeIw, safeCh / safeIh);
    const width = safeIw * scale;
    const height = safeIh * scale;
    return {
      x: (safeCw - width) / 2,
      y: (safeCh - height) / 2,
      width,
      height,
    };
  }

  function mapClientPoint(ev) {
    const surfaceRect = el.screenSurface.getBoundingClientRect();
    const cw = Math.max(1, surfaceRect.width);
    const ch = Math.max(1, surfaceRect.height);
    const lw = Math.max(1, state.logicalSize.width || el.screenCanvas.width || 1920);
    const lh = Math.max(1, state.logicalSize.height || el.screenCanvas.height || 1080);
    const box = computeContainedRect(cw, ch, lw, lh);
    const offX = ev.clientX - surfaceRect.left;
    const offY = ev.clientY - surfaceRect.top;
    const inside =
      offX >= box.x - 0.5 &&
      offX <= box.x + box.width + 0.5 &&
      offY >= box.y - 0.5 &&
      offY <= box.y + box.height + 0.5;
    const rx = Math.max(0, Math.min(1, (offX - box.x) / Math.max(1e-6, box.width)));
    const ry = Math.max(0, Math.min(1, (offY - box.y) / Math.max(1e-6, box.height)));
    return {
      inside,
      normX: Math.round(rx * 1000),
      normY: Math.round(ry * 1000),
      targetX: lw <= 1 ? 0 : Math.round(rx * (lw - 1)),
      targetY: lh <= 1 ? 0 : Math.round(ry * (lh - 1)),
      localX: Math.max(box.x, Math.min(box.x + box.width, offX)),
      localY: Math.max(box.y, Math.min(box.y + box.height, offY)),
      svgX: Math.round((Math.max(box.x, Math.min(box.x + box.width, offX)) / cw) * 1000),
      svgY: Math.round((Math.max(box.y, Math.min(box.y + box.height, offY)) / ch) * 1000),
    };
  }

  function pointerModifiers(ev) {
    const mods = [];
    if (ev.ctrlKey) mods.push('Ctrl');
    if (ev.shiftKey) mods.push('Shift');
    if (ev.altKey) mods.push('Alt');
    if (ev.metaKey) mods.push('Win');
    return mods;
  }

  async function sendRpcInput(payload, { silentTakeover = false } = {}) {
    const sel = currentSession();
    if (!sel) return { ok: false };
    if (!state.takeoverActive) {
      applyTakeoverUi(true, { silentStatus: silentTakeover });
    }
    try {
      const res = await panelCall('action', {
        action: 'input',
        sessionId: sel.id,
        ...payload,
        fromHumanPanel: true,
      });
      if (res && res.ok === false) {
        handleActionFailure(res, isZh ? '输入发送失败' : 'Input failed');
        return { ok: false, res };
      }
      scheduleImmediateFrame(40);
      return { ok: true, res };
    } catch (err) {
      setStatus(err.message || 'Input failed', 'error');
      return { ok: false, err };
    }
  }

  function sendInteractiveInput(payload) {
    const sel = currentSession();
    if (!sel) return;
    if (!state.takeoverActive) {
      applyTakeoverUi(true);
    }
    if (state.streamActive && state.streamPort) {
      try {
        state.streamPort.postMessage(JSON.stringify({
          type: 'input',
          sessionId: sel.id,
          payload,
        }));
        if (!state.live) scheduleImmediateFrame(45);
        return;
      } catch {}
    }
    void sendRpcInput(payload, { silentTakeover: true });
  }

  function spawnRipple(localX, localY, alt = false) {
    const dot = document.createElement('span');
    dot.className = alt ? 'click-ripple alt' : 'click-ripple';
    dot.style.left = `${localX}px`;
    dot.style.top = `${localY}px`;
    el.screenSurface.appendChild(dot);
    setTimeout(() => dot.remove(), 340);
  }

  async function toggleTakeover(forceValue) {
    const sel = currentSession();
    if (!sel) return;
    const nextActive = typeof forceValue === 'boolean' ? forceValue : !state.takeoverActive;
    try {
      const res = await panelCall('action', {
        action: 'takeover',
        sessionId: sel.id,
        active: nextActive,
      });
      if (res?.ok) {
        applyTakeoverUi(Boolean(res.takeoverActive), {
          focusCanvas: Boolean(res.takeoverActive),
          forceStatus: true,
        });
      }
    } catch (err) {
      setStatus(err.message || 'Takeover toggle failed', 'error');
    }
  }

  function sendStreamBinary(buf) {
    if (!state.streamActive || !state.streamPort) return false;
    try {
      state.streamPort.postMessage(buf, [buf]);
      return true;
    } catch {
      return false;
    }
  }

  function sendBinaryPointer(op, buttonsMask, clickCount, norm1000X, norm1000Y) {
    const buf = new ArrayBuffer(8);
    const dv = new DataView(buf);
    dv.setUint8(0, CLIENT_POINTER_MAGIC);
    dv.setUint8(1, op & 0xff);
    dv.setUint8(2, buttonsMask & 0xff);
    dv.setUint8(3, Math.max(0, Math.min(3, clickCount | 0)));
    dv.setUint16(4, Math.max(0, Math.min(1000, Math.round(norm1000X))), false);
    dv.setUint16(6, Math.max(0, Math.min(1000, Math.round(norm1000Y))), false);
    return sendStreamBinary(buf);
  }

  function sendBinaryWheel(norm1000X, norm1000Y, deltaX, deltaY) {
    const buf = new ArrayBuffer(10);
    const dv = new DataView(buf);
    dv.setUint8(0, CLIENT_WHEEL_MAGIC);
    dv.setUint8(1, 0);
    dv.setUint16(2, Math.max(0, Math.min(1000, Math.round(norm1000X))), false);
    dv.setUint16(4, Math.max(0, Math.min(1000, Math.round(norm1000Y))), false);
    dv.setInt16(6, Math.max(-32768, Math.min(32767, Math.round(deltaX))), false);
    dv.setInt16(8, Math.max(-32768, Math.min(32767, Math.round(deltaY))), false);
    return sendStreamBinary(buf);
  }

  function sendBinaryRawKey(downFlag, code, key, shiftKey = false) {
    const codeBytes = textEncoder.encode(String(code || '').slice(0, 64));
    const keyBytes = textEncoder.encode(String(key || '').slice(0, 64));
    const buf = new ArrayBuffer(5 + codeBytes.byteLength + keyBytes.byteLength);
    const u8 = new Uint8Array(buf);
    u8[0] = CLIENT_RAW_KEY_MAGIC;
    u8[1] = downFlag & 0xff;
    u8[2] = shiftKey ? 1 : 0;
    u8[3] = codeBytes.byteLength;
    u8.set(codeBytes, 4);
    u8[4 + codeBytes.byteLength] = keyBytes.byteLength;
    u8.set(keyBytes, 5 + codeBytes.byteLength);
    return sendStreamBinary(buf);
  }

  function releaseHeldRawKeys() {
    if (state.pressedRawCodes.size === 0) return;
    for (const code of state.pressedRawCodes) {
      sendBinaryRawKey(0, code, '', false);
    }
    state.pressedRawCodes.clear();
  }

  const magnifier = attachRemoteMagnifier({

      }
      if (state.streamActive && state.streamPort) {
        sendBinaryPointer(0, meta.buttonsMask || 0, 0, pt.norm1000X, pt.norm1000Y);
      }
    },
    onPointerUp: (pt, meta) => {
      state.dragStart = null;
      el.dragSvg.hidden = true;
      if (meta.cancelled) {
        if (state.streamActive && state.streamPort) {
          sendBinaryPointer(2, 0, 0, pt.norm1000X, pt.norm1000Y);
        }
        return;
      }
      spawnRipple(pt.localX, pt.localY, meta.moved || meta.button !== 'left' || meta.clickCount >= 2);
      if (state.streamActive && state.streamPort) {
        sendBinaryPointer(2, meta.buttonsMask || 0, meta.clickCount || 1, pt.norm1000X, pt.norm1000Y);
        if (!state.live) scheduleImmediateFrame(45);
        return;
      }
      if (meta.moved && meta.startPt) {
        void sendRpcInput({
          subAction: 'drag',
          coordinateMode: 'normalized_1000',
          startX: meta.startPt.norm1000X,
          startY: meta.startPt.norm1000Y,
          endX: pt.norm1000X,
          endY: pt.norm1000Y,
          button: meta.button,
          durationMs: Math.min(800, Math.max(120, meta.elapsedMs || 210)),
        }, { silentTakeover: true });
      } else {
        const mods = [];
        if (meta.ctrlKey) mods.push('Ctrl');
        if (meta.shiftKey) mods.push('Shift');
        if (meta.altKey) mods.push('Alt');
        if (meta.metaKey) mods.push('Win');
        void sendRpcInput({
          subAction: 'click',
          coordinateMode: 'normalized_1000',
          x: pt.norm1000X,
          y: pt.norm1000Y,
          button: meta.button,
          count: meta.clickCount,
          modifiers: mods.length > 0 ? mods : undefined,
        }, { silentTakeover: true });
      }
    },
    onWheel: (pt, delta) => {
      if (state.streamActive && state.streamPort) {
        sendBinaryWheel(pt.norm1000X, pt.norm1000Y, delta.deltaX, delta.deltaY);
        return;
      }
      sendInteractiveInput({
        subAction: 'scroll',
        coordinateMode: 'normalized_1000',
        x: pt.norm1000X,
        y: pt.norm1000Y,
        deltaX: Math.round(delta.deltaX),
        deltaY: Math.round(delta.deltaY),
      });
    },
    onReleaseAll: () => {
      el.dragSvg.hidden = true;
      releaseHeldRawKeys();
    },
  });

  const SPECIAL_KEY_NAMES = {
    Enter: 'Enter',
    Tab: 'Tab',
    Escape: 'Escape',
    Backspace: 'Backspace',
    Delete: 'Delete',
    Insert: 'Insert',
    Home: 'Home',
    End: 'End',
    PageUp: 'PageUp',
    PageDown: 'PageDown',
    ArrowUp: 'Up',
    ArrowDown: 'Down',
    ArrowLeft: 'Left',
    ArrowRight: 'Right',
    ' ': 'Space',
  };

  function handleRemoteKeyDown(ev) {
    if (!state.takeoverActive || !currentSession() || ev.isComposing) return;
    if (ev.altKey && !ev.ctrlKey && !ev.metaKey && (ev.key === 't' || ev.key === 'T')) {
      ev.preventDefault();
      void toggleTakeover(false);
      return;
    }

    if (ev.ctrlKey && ev.altKey && !isRemoteProtocolSession(currentSession())) {
      ev.preventDefault();
      setStatus(
        isZh ? '已拦截 Ctrl+Alt 组合键（避免触发本地 UU 客户端快捷键）' : 'Blocked Ctrl+Alt chord (reserved by local UU Remote overlay)',
        'error',
      );
      return;
    }

    const hostClipboardCapable = !(state.capabilities && state.capabilities.clipboard === false);
    if (hostClipboardCapable && clipboardBridge.handleKeyDownForPasteHold(ev)) {
      return;
    }

    if (effectiveKeyMode() === 'raw' && state.streamActive && state.streamPort && isRemoteProtocolSession(currentSession())) {
      ev.preventDefault();
      const code = ev.code || '';
      if (ev.repeat && code && state.pressedRawCodes.has(code)) return;
      if (code) state.pressedRawCodes.add(code);
      sendBinaryRawKey(1, code, ev.key || '', Boolean(ev.shiftKey));
      return;
    }

    const key = ev.key;
    if (key === 'Control' || key === 'Shift' || key === 'Alt' || key === 'Meta') return;

    const mappedSpecial = SPECIAL_KEY_NAMES[key] || (/^F(?:[1-9]|1[0-2])$/.test(key) ? key : null);
    const hasChordMod = ev.ctrlKey || ev.altKey || ev.metaKey;

    if (mappedSpecial || hasChordMod) {
      ev.preventDefault();
      const keys = [];
      if (ev.ctrlKey) keys.push('Ctrl');
      if (ev.altKey) keys.push('Alt');
      if (ev.shiftKey) keys.push('Shift');
      if (ev.metaKey) keys.push('Win');
      keys.push(mappedSpecial || (key.length === 1 ? key.toUpperCase() : key));
      sendInteractiveInput({ subAction: 'key', keys });
      return;
    }

    if (key.length === 1) {
      ev.preventDefault();
      if (hasNonAscii(key)) {
        void sendRpcInput({ subAction: 'type', text: key, mode: 'auto' }, { silentTakeover: true });
      } else {
        sendInteractiveInput({ subAction: 'type', text: key, mode: 'auto' });
      }
    }
  }

  function handleRemoteKeyUp(ev) {
    const code = ev.code || '';
    if (code && state.pressedRawCodes.has(code)) {
      ev.preventDefault();
      state.pressedRawCodes.delete(code);
      sendBinaryRawKey(0, code, ev.key || '', Boolean(ev.shiftKey));
    }
  }

  for (const btn of document.querySelectorAll('[data-key]')) {
    btn.addEventListener('click', () => {
      void sendRpcInput({ subAction: 'key', key: btn.dataset.key }, { silentTakeover: true });
    });
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (state.streamActive && state.streamPort) {
        try {
          state.streamPort.postMessage(JSON.stringify({ type: 'configure', paused: true }));
        } catch {}
      }
      if (state.pollTimer) {
        clearTimeout(state.pollTimer);
        state.pollTimer = null;
      }
    } else if (state.live) {
      if (state.streamActive && state.streamPort) {
        try {
          state.streamPort.postMessage(JSON.stringify({ type: 'configure', paused: false }));
        } catch {}
      } else {
        const sel = currentSession();
        if (sel && sel.state === 'active') {
          state.pollErrorStreak = 0;
          void startLiveForSession(sel);
        }
      }
    }
  });

  window.addEventListener('pagehide', () => {
    stopLiveTransport();
  });

  setTimeout(() => {
    if (!booted) {
      booted = true;
      void refreshState();
    }
  }, 120);
})();
</script>
</body>
</html>
