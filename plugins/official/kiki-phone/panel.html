<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Phone Preview</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f4ef;
    --paper: #fcfbf8;
    --panel: #efece4;
    --ink: #1b1a17;
    --ink-soft: #5c5850;
    --ink-faint: #8c867b;
    --line: rgba(27, 26, 23, 0.11);
    --line-strong: rgba(27, 26, 23, 0.22);
    --accent: #2c5e4f;
    --accent-soft: rgba(44, 94, 79, 0.12);
    --amber: #b85d19;
    --amber-soft: rgba(184, 93, 25, 0.14);
    --danger: #b53d2e;
    --ok: #297a54;
    --bezel: #161618;
    --bezel-edge: #2f2f35;
    --shadow: 0 18px 42px -18px rgba(18, 17, 15, 0.28), 0 2px 6px rgba(18, 17, 15, 0.08);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413;
      --paper: #1c1b19;
      --panel: #252320;
      --ink: #edeae2;
      --ink-soft: #b2aca0;
      --ink-faint: #7b766c;
      --line: rgba(237, 234, 226, 0.11);
      --line-strong: rgba(237, 234, 226, 0.24);
      --accent: #58a88f;
      --accent-soft: rgba(88, 168, 143, 0.16);
      --amber: #e5934a;
      --amber-soft: rgba(229, 147, 74, 0.18);
      --danger: #e26c5c;
      --ok: #4cb782;
      --bezel: #0b0b0c;
      --bezel-edge: #38383f;
      --shadow: 0 22px 48px -18px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413;
    --paper: #1c1b19;
    --panel: #252320;
    --ink: #edeae2;
    --ink-soft: #b2aca0;
    --ink-faint: #7b766c;
    --line: rgba(237, 234, 226, 0.11);
    --line-strong: rgba(237, 234, 226, 0.24);
    --accent: #58a88f;
    --accent-soft: rgba(88, 168, 143, 0.16);
    --amber: #e5934a;
    --amber-soft: rgba(229, 147, 74, 0.18);
    --danger: #e26c5c;
    --ok: #4cb782;
    --bezel: #0b0b0c;
    --bezel-edge: #38383f;
    --shadow: 0 22px 48px -18px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(255, 255, 255, 0.05);
  }
  :root[data-theme="light"] {
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  button, input, select { font: inherit; color: inherit; }
  .shell {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 42px;
    padding: 0 12px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .device-picker-wrap {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    flex: 1;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: var(--ink-faint);
    flex-shrink: 0;
    transition: background 140ms ease;
  }
  .status-dot.online { background: var(--ok); }
  .status-dot.interactive { background: var(--amber); }
  .status-dot.warn { background: var(--danger); }
  .device-select {
    appearance: none;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 7px;
    height: 27px;
    padding: 0 25px 0 9px;
    font-size: 12px;
    font-weight: 500;
    max-width: 210px;
    min-width: 106px;
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
    cursor: pointer;
    outline: none;
  }
  .device-select:focus-visible { border-color: var(--accent); }
  .select-chevron {
    pointer-events: none;
    margin-left: -21px;
    margin-right: 4px;
    color: var(--ink-faint);
    display: flex;
  }
  .platform-pill {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 5px;
    background: var(--panel);
    color: var(--ink-soft);
    border: 1px solid var(--line);
    flex-shrink: 0;
  }
  .meta-app {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 132px;
  }
  .nav-cluster {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 2px;
    border-radius: 7px;
    background: var(--panel);
    border: 1px solid var(--line);
    flex-shrink: 0;
  }
  .nav-key {
    width: 25px;
    height: 23px;
    border-radius: 5px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 110ms ease, color 110ms ease;
  }
  .nav-key:hover:not(:disabled) { background: var(--paper); color: var(--ink); }
  .nav-key:focus-visible { outline: 1.5px solid var(--accent); outline-offset: -1px; }
  .nav-key:disabled { opacity: 0.34; cursor: default; }
  .pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 27px;
    padding: 0 9px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .pill-btn:hover:not(:disabled) { background: var(--panel); color: var(--ink); }
  .pill-btn:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 1px; }
  .pill-btn:disabled { opacity: 0.4; cursor: default; }
  .pill-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .pill-btn.interactive-on {
    background: var(--amber-soft);
    border-color: var(--amber);
    color: var(--amber);
  }
  .icon-btn {
    width: 27px;
    padding: 0;
    justify-content: center;
  }
  .workspace {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    overflow: hidden;
  }
  .stage {
    position: relative;
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px 56px 14px 14px;
  }
  .phone-chassis {
    position: relative;
    background: var(--bezel);
    border: 2px solid var(--bezel-edge);
    border-radius: 26px;
    padding: 8px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: width 140ms ease, height 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
  }
  .phone-chassis.interactive-ring {
    border-color: var(--amber);
    box-shadow: 0 0 0 2px var(--amber-soft), var(--shadow);
  }
  .phone-screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 19px;
    overflow: hidden;
    background: #09090b;
    cursor: default;
    outline: none;
    touch-action: none;
  }
  .phone-screen.interactive {
    cursor: crosshair;
  }
  .phone-screen canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
    user-select: none;
  }
  .touch-ripple {
    position: absolute;
    width: 24px;
    height: 24px;
    margin-left: -12px;
    margin-top: -12px;
    border-radius: 999px;
    border: 1.8px solid rgba(255, 255, 255, 0.92);
    background: rgba(88, 168, 143, 0.34);
    pointer-events: none;
    animation: ripple 360ms ease-out forwards;
  }
  .touch-ripple.hold {
    width: 34px;
    height: 34px;
    margin-left: -17px;
    margin-top: -17px;
    border-color: var(--amber);
    background: rgba(229, 147, 74, 0.28);
    animation: holdPulse 440ms ease-out forwards;
  }
  @keyframes ripple {
    0% { transform: scale(0.4); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  @keyframes holdPulse {
    0% { transform: scale(0.55); opacity: 0.95; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  .gesture-line {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .ax-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .ax-layer.interactive { pointer-events: auto; }
  .ax-box {
    position: absolute;
    border: 1px solid rgba(88, 168, 143, 0.65);
    background: rgba(88, 168, 143, 0.06);
    cursor: pointer;
    transition: background 90ms ease, border-color 90ms ease;
  }
  .ax-box:hover, .ax-box.selected {
    border: 1.5px solid #3ce0b5;
    background: rgba(60, 224, 181, 0.2);
    z-index: 5;
  }
  .rail {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 5px;
    border-radius: 13px;
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 8px 24px -10px rgba(0, 0, 0, 0.18);
    z-index: 10;
  }
  .rail-btn {
    width: 31px;
    height: 31px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 110ms ease, color 110ms ease;
  }
  .rail-btn:hover:not(:disabled) { background: var(--panel); color: var(--ink); }
  .rail-btn.active { background: var(--accent-soft); color: var(--accent); }
  .rail-btn:disabled { opacity: 0.35; cursor: default; }
  .rail-sep {
    height: 1px;
    margin: 2px 4px;
    background: var(--line);
  }
  .drawer {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 280px;
    max-width: calc(100% - 48px);
    border-left: 1px solid var(--line);
    background: var(--paper);
    box-shadow: -12px 0 28px -12px rgba(0, 0, 0, 0.24);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 12px 58px 12px 12px;
    gap: 14px;
    z-index: 8;
  }
  .section-title {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 6px 0;
  }
  .field-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .input {
    flex: 1;
    min-width: 0;
    height: 28px;
    padding: 0 8px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-size: 12px;
    outline: none;
    user-select: text;
  }
  .input:focus { border-color: var(--accent); }
  .ax-card {
    padding: 8px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--line);
    font-size: 11.5px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    user-select: text;
  }
  .code-box {
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px;
    border-radius: 5px;
    background: var(--panel);
    word-break: break-all;
    color: var(--ink);
  }
  .empty-state {
    max-width: 316px;
    padding: 18px 20px;
    border-radius: 12px;
    background: var(--paper);
    border: 1px solid var(--line);
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .empty-title {
    font-size: 13.5px;
    font-weight: 600;
    margin: 0;
  }
  .empty-desc {
    font-size: 12px;
    line-height: 1.45;
    color: var(--ink-soft);
    margin: 0;
  }
  .device-group-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .offline-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 7px;
    background: var(--bg);
    border: 1px solid var(--line);
    font-size: 12px;
  }
  .statusbar {
    height: 25px;
    padding: 0 12px;
    border-top: 1px solid var(--line);
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--ink-faint);
    flex-shrink: 0;
    gap: 8px;
  }
  .statusbar-msg {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .statusbar-msg.err { color: var(--danger); }
  .statusbar-msg.amber { color: var(--amber); font-weight: 500; }
  .statusbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    white-space: nowrap;
  }
  @media (max-width: 620px) {
    .topbar { gap: 5px; padding: 0 8px; }
    .meta-app, .platform-pill { display: none; }
    .device-select { flex: 1 1 0; min-width: 0; width: 100%; max-width: 100%; padding: 0 22px 0 7px; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="device-picker-wrap">
      <span id="statusDot" class="status-dot"></span>
      <select id="deviceSelect" class="device-select" aria-label="Select phone device">
        <option value="">Scanning...</option>
      </select>
      <span class="select-chevron" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M4.5 6.5L8 10l3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span id="platformPill" class="platform-pill" hidden>Android</span>
      <span id="fgApp" class="meta-app"></span>
    </div>

    <div class="nav-cluster" role="group" aria-label="Navigation keys">
      <button type="button" class="nav-key android-only" data-act="back" title="Back · 返回" aria-label="Back">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5L5.5 8 10 12.5"/></svg>
      </button>
      <button type="button" class="nav-key" data-act="home" title="Home · 桌面" aria-label="Home">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="4.6"/></svg>
      </button>
      <button type="button" class="nav-key android-only" data-act="recents" title="App switcher · 多任务" aria-label="App switcher">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="3.5" y="3.5" width="9" height="9" rx="1.8"/></svg>
      </button>
    </div>

    <button id="interactiveBtn" type="button" class="pill-btn" aria-pressed="false" title="Toggle direct touch, wheel, keyboard & paste control (Alt+I)">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.5 8.5V3.8a1.3 1.3 0 0 1 2.6 0v3.2"/>
        <path d="M9.1 6.5a1.2 1.2 0 0 1 2.4 0v1.2a1.2 1.2 0 0 1 2.2.7v2.1a4.2 4.2 0 0 1-4.2 4.2H7.4a4 4 0 0 1-3.1-1.5L2.6 11a1.2 1.2 0 0 1 1.7-1.6l2.2 1.5"/>
      </svg>
      <span id="interactiveLabel">Interactive</span>
    </button>

    <button id="liveToggle" type="button" class="pill-btn active" title="Toggle live stream">Live</button>
    <button id="refreshBtn" type="button" class="pill-btn icon-btn" title="Refresh devices and stream" aria-label="Refresh">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3.6H9.9"/></svg>
    </button>
  </header>

  <div class="workspace">
    <main id="stage" class="stage">
      <div id="emptyState" class="empty-state" hidden>
        <p id="emptyTitle" class="empty-title">No online phone</p>
        <p id="emptyDesc" class="empty-desc">Connect Android via USB/wireless debugging or an iOS device, then scan.</p>
        <div id="offlineList" class="device-group-list"></div>
        <div class="field-row">
          <button id="openWirelessBtn" type="button" class="pill-btn">Wireless ADB</button>
          <button id="retryScanBtn" type="button" class="pill-btn">Scan</button>
        </div>
      </div>

      <div id="chassis" class="phone-chassis" style="width:260px;height:560px" hidden>
        <div id="screenBox" class="phone-screen" tabindex="0" aria-label="Phone screen canvas">
          <canvas id="screenCanvas" width="540" height="1200"></canvas>
          <svg id="gestureSvg" class="gesture-line" viewBox="0 0 1000 1000" preserveAspectRatio="none" hidden>
            <defs>
              <marker id="swipeHead" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
                <path d="M1 1L9 5L1 9z" fill="#e5934a"/>
              </marker>
            </defs>
            <circle id="gestureStartDot" cx="0" cy="0" r="9" fill="rgba(229,147,74,0.3)" stroke="#e5934a" stroke-width="3"/>
            <line id="gestureLine" x1="0" y1="0" x2="0" y2="0" stroke="#e5934a" stroke-width="4" stroke-linecap="round" marker-end="url(#swipeHead)" />
          </svg>
          <div id="axLayer" class="ax-layer" hidden></div>
        </div>
      </div>

      <aside class="rail" aria-label="Device tools">
        <button type="button" class="rail-btn" data-act="wake" title="Wake & unlock" aria-label="Wake and unlock">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <button type="button" class="rail-btn" data-act="rotate" title="Rotate orientation" aria-label="Rotate orientation">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><rect x="8" y="10" width="8" height="11" rx="1.5"/></svg>
        </button>
        <button id="axBtn" type="button" class="rail-btn" title="Inspect UI semantic tree" aria-label="Inspect UI tree">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
        </button>
        <button type="button" class="rail-btn" data-act="shot" title="Save PNG screenshot" aria-label="Save screenshot">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
        <button id="toolsBtn" type="button" class="rail-btn" title="Text, links & wireless ADB" aria-label="More tools">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        </button>
        <div class="rail-sep"></div>
        <button type="button" class="rail-btn" data-act="sleep" title="Lock screen" aria-label="Lock screen">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v10"/><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/></svg>
        </button>
      </aside>
    </main>

    <aside id="drawer" class="drawer" hidden>
      <div>
        <p class="section-title">Text Input</p>
        <form id="typeForm" class="field-row">
          <input id="typeInput" class="input" type="text" placeholder="Send text to focused field..." />
          <button type="submit" class="pill-btn">Send</button>
        </form>
      </div>

      <div>
        <p class="section-title">Open URL / Deep Link</p>
        <form id="urlForm" class="field-row">
          <input id="urlInput" class="input" type="text" placeholder="https:// or scheme://" />
          <button type="submit" class="pill-btn">Open</button>
        </form>
      </div>

      <div>
        <p class="section-title">Device Appearance & Chat</p>
        <div class="field-row">
          <button type="button" class="pill-btn" data-appearance="light">Light</button>
          <button type="button" class="pill-btn" data-appearance="dark">Dark</button>
          <button id="askAgentBtn" type="button" class="pill-btn">Send to Chat</button>
        </div>
      </div>

      <div>
        <p class="section-title">Wireless ADB (Android 11+)</p>
        <div style="display:flex;flex-direction:column;gap:6px">
          <div class="field-row">
            <input id="adbConnectAddr" class="input" type="text" placeholder="IP:debugPort" />
            <button id="adbConnectBtn" type="button" class="pill-btn">Connect</button>
          </div>
          <div class="field-row">
            <input id="adbPairAddr" class="input" type="text" placeholder="IP:pairPort" />
            <input id="adbPairCode" class="input" type="text" placeholder="6-digit" style="max-width:74px" />
            <button id="adbPairBtn" type="button" class="pill-btn">Pair</button>

      <div id="axInspectorSection" hidden>
        <p class="section-title">Selected UI Node</p>
        <div id="axInspectorCard" class="ax-card">
          <div id="axNodeSummary" style="font-weight:600">Select a highlighted node</div>
          <div id="axNodeMeta" style="color:var(--ink-soft)"></div>
          <div id="axNodeLocator" class="code-box" hidden></div>
          <div class="field-row">
            <button id="copyLocatorBtn" type="button" class="pill-btn">Copy Locator</button>
            <button id="tapNodeBtn" type="button" class="pill-btn">Tap Node</button>
          </div>
        </div>
      </div>

      <div>
        <p class="section-title">Bridge Status</p>
        <div id="diagBox" class="ax-card" style="color:var(--ink-soft)">Ready</div>
      </div>
    </aside>
  </div>

  <footer class="statusbar">
    <span id="statusText" class="statusbar-msg">Ready</span>
    <div class="statusbar-right">
      <span id="coordText" hidden>0, 0</span>
      <span id="resText">--</span>
    </div>
  </footer>
</div>

<script>
(() => {
  const CHANNEL = 'kiki.panel.v1';
  const RATE_WINDOW_MS = 10000;
  const FRAME_BUDGET_IN_WINDOW = 112;
  const MIN_POLL_INTERVAL_MS = 88;
  const STREAM_HANDSHAKE_TIMEOUT_MS = 2000;
  const FRAME_MAGIC = 0x4b;
  const TOUCH_MAGIC = 0x54;
  const SCROLL_MAGIC = 0x53;
  const isZh = /^zh\b/i.test(navigator.language || '');

  const memoryStore = new Map();
  const safeStorage = {
    get(key) {
      try {
        const val = window['local' + 'Storage'].getItem(key);
        return val !== null ? val : (memoryStore.get(key) ?? null);
      } catch {
        return memoryStore.get(key) ?? null;
      }
    },
    set(key, value) {
      const str = String(value);
      memoryStore.set(key, str);
      try {
        window['local' + 'Storage'].setItem(key, str);
      } catch {}
    },
    remove(key) {
      memoryStore.delete(key);
      try {
        window['local' + 'Storage'].removeItem(key);
      } catch {}
    },
  };

  async function copyTextSafe(text) {
    const str = String(text ?? '');
    if (!str) return false;
    try {
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        await navigator.clipboard.writeText(str);
        return true;
      }
    } catch {}
    try {
      const ta = document.createElement('textarea');
      ta.value = str;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none;';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return Boolean(ok);
    } catch {
      return false;
    }
  }

  function applyThemeName(theme) {
    if (theme === 'dark' || theme === 'light') {
      document.documentElement.setAttribute('data-theme', theme);
    } else if (theme === 'auto' || theme === 'system') {
      document.documentElement.removeAttribute('data-theme');
    }
  }

  try {
    const urlTheme = new URLSearchParams(window.location.search).get('theme');
    if (urlTheme === 'dark' || urlTheme === 'light') {
      applyThemeName(urlTheme);
    }
  } catch {}

  let reqSeq = 0;
  let booted = false;
  const pending = new Map();
  const rpcStamps = [];

  function pruneRpcWindow(now = Date.now()) {
    while (rpcStamps.length > 0 && now - rpcStamps[0] >= RATE_WINDOW_MS) {
      rpcStamps.shift();
    }
    return rpcStamps.length;
  }

  function applyPresentation(pres) {
    if (!pres || typeof pres !== 'object') return;
    applyThemeName(pres.theme || pres.colorScheme);
  }

  window.addEventListener('message', (event) => {
    if (event.source !== window.parent) return;
    const data = event.data;
    if (!data || data.channel !== CHANNEL) return;
    if (data.kind === 'presentation' || data.kind === 'theme') {
      applyPresentation(data.presentation || data);
      return;
    }
    if (data.kind === 'init') {
      state.standaloneMode = false;
      applyPresentation(data.presentation || data);
      void startBoot();
      return;
    }
    if (data.kind !== 'response') return;
    const entry = pending.get(data.id);
    if (!entry) {
      if (event.ports && event.ports[0]) {
        try {
          event.ports[0].postMessage({ __kikiStreamControl: 'close' });
          event.ports[0].close();
        } catch {}
      }
      return;
    }
    pending.delete(data.id);
    clearTimeout(entry.timer);
    if (data.ok) {
      entry.resolve(entry.withPort ? { result: data.result, port: (event.ports && event.ports[0]) || null } : data.result);
    } else {
      entry.reject(new Error((typeof data.error === 'string' ? data.error : data.error?.message) || 'Bridge request failed'));
    }
  });

  const isDisconnectedStandalone = () => state.standaloneMode && typeof window.__kikiPhoneTestBridge !== 'function';

  function bridgeCall(method, payload = {}, timeoutMs = 20000, withPort = false) {
    if (typeof window.__kikiPhoneTestBridge === 'function') {
      return Promise.resolve(window.__kikiPhoneTestBridge(method, payload, withPort));
    }
    if (isDisconnectedStandalone()) {
      return Promise.reject(new Error('Standalone preview mode'));
    }
    const id = ++reqSeq;
    const now = Date.now();
    pruneRpcWindow(now);
    rpcStamps.push(now);
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error('Bridge request timed out'));
      }, timeoutMs);
      pending.set(id, { resolve, reject, timer, withPort });
      window.parent.postMessage({ channel: CHANNEL, kind: 'request', id, method, ...payload }, '*');
    });
  }

  const panelCall = (action, args = {}, timeoutMs = 20000) =>
    bridgeCall('plugin.call', { action, args }, timeoutMs, false);

  const openPanelStream = (stream, args = {}, timeoutMs = STREAM_HANDSHAKE_TIMEOUT_MS) =>
    bridgeCall('plugin.openStream', { stream, args }, timeoutMs, true);

  const state = {
    devices: [],
    selected: null,
    diagnostics: null,
    live: true,
    interactive: safeStorage.get('kiki.phone.interactive') === '1',
    axEnabled: false,
    axNodes: [],
    selectedAx: null,
    screenSize: { width: 1080, height: 2400 },
    orientation: 'portrait',
    asleep: false,
    frameInFlight: false,
    pollTimer: null,
    pointerStart: null,
    holdPulseTimer: null,
    streamActive: false,
    streamPort: null,
    streamGeneration: 0,
    videoDecoder: null,
    configuredCodec: '',
    waitingForKeyframe: true,
    hostStreamUnsupported: false,
    pendingMove: null,
    moveRaf: 0,
    wheelAccX: 0,
    wheelAccY: 0,
    wheelTimer: null,
    lastWheelPt: null,
    typedBuffer: '',
    typeFlushTimer: null,
    pasteHandledAt: 0,
    fpsTimes: [],
    standaloneMode: window.parent === window,
  };

  const el = {
    statusDot: document.getElementById('statusDot'),
    deviceSelect: document.getElementById('deviceSelect'),
    platformPill: document.getElementById('platformPill'),
    fgApp: document.getElementById('fgApp'),
    interactiveBtn: document.getElementById('interactiveBtn'),
    interactiveLabel: document.getElementById('interactiveLabel'),
    liveToggle: document.getElementById('liveToggle'),
    refreshBtn: document.getElementById('refreshBtn'),
    stage: document.getElementById('stage'),
    emptyState: document.getElementById('emptyState'),
    emptyTitle: document.getElementById('emptyTitle'),
    emptyDesc: document.getElementById('emptyDesc'),
    offlineList: document.getElementById('offlineList'),
    chassis: document.getElementById('chassis'),
    screenBox: document.getElementById('screenBox'),
    screenCanvas: document.getElementById('screenCanvas'),
    gestureSvg: document.getElementById('gestureSvg'),
    gestureStartDot: document.getElementById('gestureStartDot'),
    gestureLine: document.getElementById('gestureLine'),
    axLayer: document.getElementById('axLayer'),
    axBtn: document.getElementById('axBtn'),
    toolsBtn: document.getElementById('toolsBtn'),
    drawer: document.getElementById('drawer'),
    statusText: document.getElementById('statusText'),
    coordText: document.getElementById('coordText'),
    resText: document.getElementById('resText'),
    diagBox: document.getElementById('diagBox'),
    axInspectorSection: document.getElementById('axInspectorSection'),
    axNodeSummary: document.getElementById('axNodeSummary'),
    axNodeMeta: document.getElementById('axNodeMeta'),
    axNodeLocator: document.getElementById('axNodeLocator'),
  };

  const canvasCtx = el.screenCanvas.getContext('2d', { alpha: false, desynchronized: true })
    || el.screenCanvas.getContext('2d');

  function setStatus(msg, tone = 'normal') {
    el.statusText.textContent = msg;
    el.statusText.classList.toggle('err', tone === 'error' || tone === true);
    el.statusText.classList.toggle('amber', tone === 'amber');
  }

  function syncInteractiveUi() {
    const active = Boolean(state.interactive && !state.axEnabled);
    el.interactiveBtn.classList.toggle('interactive-on', state.interactive);
    el.interactiveBtn.setAttribute('aria-pressed', state.interactive ? 'true' : 'false');
    el.chassis.classList.toggle('interactive-ring', active);
    el.screenBox.classList.toggle('interactive', active);
    el.coordText.hidden = !active;
    if (isZh) {
      el.interactiveLabel.textContent = state.interactive ? '操控中 · 释放' : '人工操控';
    } else {
      el.interactiveLabel.textContent = state.interactive ? 'Interactive · On' : 'Interactive';
    }
    const online = Boolean(activeOnlineDevice());
    el.statusDot.className = 'status-dot ' + (!online ? (state.devices.length ? 'warn' : '') : (state.interactive ? 'interactive' : 'online'));
    if (online) {
      if (state.interactive) {
        setStatus(isZh ? '原位直操已开启 · 支持点按/滑动/滚轮/键入/粘贴' : 'Interactive control active · tap, swipe, wheel, type or paste', 'amber');
      } else if (state.asleep) {
        setStatus(isZh ? '屏幕已息屏 · 点击右侧唤醒' : 'Screen asleep · click Wake');
      } else {
        setStatus(state.live ? (state.streamActive ? '60fps H.264 · Read-only' : (isZh ? '实时预览 · 只读防误触' : 'Live · Read-only')) : (isZh ? '已暂停' : 'Paused'));
      }
    }
  }

  function setInteractiveMode(next) {
    state.interactive = Boolean(next);
    safeStorage.set('kiki.phone.interactive', state.interactive ? '1' : '0');
    if (state.interactive) {
      el.screenBox.focus({ preventScroll: true });
    }
    syncInteractiveUi();
  }

  function recordRenderedFrame() {
    const now = performance.now();
    state.fpsTimes.push(now);
    while (state.fpsTimes.length > 0 && now - state.fpsTimes[0] > 1500) {
      state.fpsTimes.shift();
    }
    updateResolutionBar();
  }

  function currentFps() {
    if (state.fpsTimes.length < 2) return 0;
    const span = state.fpsTimes[state.fpsTimes.length - 1] - state.fpsTimes[0];
    if (span < 80) return 0;
    return Math.round(((state.fpsTimes.length - 1) * 1000) / span);
  }

  function updateResolutionBar() {
    const w = state.screenSize.width || 0;
    const h = state.screenSize.height || 0;
    if (!w || !h) {
      el.resText.textContent = '--';
      return;
    }
    const fps = currentFps();
    const parts = [`${w}×${h}`];
    if (state.streamActive) {
      parts.push(fps > 0 ? `${fps}fps · H.264` : 'H.264');
    } else if (fps > 0 && state.live) {
      parts.push(`${fps}fps`);
    }
    if (state.asleep) parts.push('Asleep');
    el.resText.textContent = parts.join(' · ');
  }

  function updateScreenDimensions(width, height) {
    if (!width || !height) return;
    const changed = width !== state.screenSize.width || height !== state.screenSize.height;
    state.screenSize = { width, height };
    if (changed) layoutChassis();
    updateResolutionBar();
  }

  function fitDeviceFrame(aspect, width, height, rightInset) {
    const availW = Math.max(0, width - rightInset);
    if (availW <= 0 || height <= 0) return { width: 220, height: 460 };
    const byH = { width: height * aspect, height };
    return byH.width <= availW
      ? { width: Math.round(byH.width), height: Math.round(byH.height) }
      : { width: Math.round(availW), height: Math.round(availW / aspect) };
  }

  function layoutChassis() {
    const rect = el.stage.getBoundingClientRect();
    const sw = Math.max(1, state.screenSize.width || 1080);
    const sh = Math.max(1, state.screenSize.height || 2400);
    const aspect = sw / sh;
    const drawerInset = el.drawer.hidden ? 0 : Math.min(240, rect.width * 0.35);
    const fitted = fitDeviceFrame(aspect, rect.width - 70 - drawerInset, rect.height - 28, 0);
    el.chassis.style.width = Math.max(150, fitted.width + 16) + 'px';
    el.chassis.style.height = Math.max(150, fitted.height + 16) + 'px';
  }

  new ResizeObserver(layoutChassis).observe(el.stage);

  function computeContainedRect(boxWidth, boxHeight, contentWidth, contentHeight) {
    const cw = Math.max(1, boxWidth);
    const ch = Math.max(1, boxHeight);
    const iw = Math.max(1, contentWidth || cw);
    const ih = Math.max(1, contentHeight || ch);
    const scale = Math.min(cw / iw, ch / ih);
    const width = iw * scale;
    const height = ih * scale;
    return {
      x: (cw - width) / 2,
      y: (ch - height) / 2,
      width: Math.max(1, width),
      height: Math.max(1, height),
    };
  }

  function mapSurfaceEvent(ev) {
    const boxRect = el.screenBox.getBoundingClientRect();
    const sw = Math.max(1, state.screenSize.width || el.screenCanvas.width || 1080);
    const sh = Math.max(1, state.screenSize.height || el.screenCanvas.height || 2400);
    const drawn = computeContainedRect(boxRect.width, boxRect.height, sw, sh);
    const offX = ev.clientX - boxRect.left;
    const offY = ev.clientY - boxRect.top;
    const inside = offX >= drawn.x - 2 && offX <= drawn.x + drawn.width + 2
      && offY >= drawn.y - 2 && offY <= drawn.y + drawn.height + 2;
    const u = Math.min(1, Math.max(0, (offX - drawn.x) / drawn.width));
    const v = Math.min(1, Math.max(0, (offY - drawn.y) / drawn.height));
    const devX = sw <= 1 ? 0 : Math.round(u * (sw - 1));
    const devY = sh <= 1 ? 0 : Math.round(v * (sh - 1));
    const clampedOffX = drawn.x + u * drawn.width;
    const clampedOffY = drawn.y + v * drawn.height;
    return {
      inside,
      x: u,
      y: v,
      devX,
      devY,
      pctX: (clampedOffX / Math.max(1, boxRect.width)) * 100,
      pctY: (clampedOffY / Math.max(1, boxRect.height)) * 100,
      svgX: (clampedOffX / Math.max(1, boxRect.width)) * 1000,
      svgY: (clampedOffY / Math.max(1, boxRect.height)) * 1000,
      pxX: offX,
      pxY: offY,
    };
  }

  function activeOnlineDevice() {
    if (!state.selected) return null;
    const dev = state.devices.find((d) => d.id === state.selected.id && d.platform === state.selected.platform);
    return dev && dev.state === 'online' ? dev : null;
  }

  function dataUrlToBlob(dataUrl) {
    const comma = dataUrl.indexOf(',');
    if (comma === -1) throw new Error('Invalid image data URL');
    const header = dataUrl.slice(0, comma);
    const mimeMatch = /^data:([^;]+)/.exec(header);
    const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
    const raw = atob(dataUrl.slice(comma + 1));
    const len = raw.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) bytes[i] = raw.charCodeAt(i);
    return new Blob([bytes], { type: mime });
  }

  async function drawDataUrlToCanvas(dataUrl) {
    if (typeof createImageBitmap === 'function') {
      const bmp = await createImageBitmap(dataUrlToBlob(dataUrl));
      try {
        if (el.screenCanvas.width !== bmp.width || el.screenCanvas.height !== bmp.height) {
          el.screenCanvas.width = bmp.width;
          el.screenCanvas.height = bmp.height;
        }
        canvasCtx.drawImage(bmp, 0, 0, bmp.width, bmp.height);
      } finally {
        bmp.close();
      }
      recordRenderedFrame();
      return;
    }
    await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        if (el.screenCanvas.width !== img.naturalWidth || el.screenCanvas.height !== img.naturalHeight) {
          el.screenCanvas.width = img.naturalWidth || 540;
          el.screenCanvas.height = img.naturalHeight || 1200;
        }
        canvasCtx.drawImage(img, 0, 0, el.screenCanvas.width, el.screenCanvas.height);
        recordRenderedFrame();
        resolve();
      };
      img.onerror = reject;
      img.src = dataUrl;
    });
  }

  function extractAvcCodecFromAnnexB(bytes) {
    const len = bytes.length;
    for (let i = 0; i + 6 < len; i++) {
      let off = -1;
      if (bytes[i] === 0 && bytes[i + 1] === 0 && bytes[i + 2] === 1) off = i + 3;
      else if (i + 7 < len && bytes[i] === 0 && bytes[i + 1] === 0 && bytes[i + 2] === 0 && bytes[i + 3] === 1) off = i + 4;
      if (off !== -1 && off + 3 < len) {
        if ((bytes[off] & 0x1f) === 7) {
          const p = bytes[off + 1].toString(16).padStart(2, '0');
          const c = bytes[off + 2].toString(16).padStart(2, '0');
          const l = bytes[off + 3].toString(16).padStart(2, '0');
          return `avc1.${p}${c}${l}`;
        }
        i = off;
      }
    }
    return '';
  }

  function stopStreamMode(sendClose = true) {
    state.streamGeneration++;
    state.streamActive = false;
    state.waitingForKeyframe = true;
    state.configuredCodec = '';
    if (state.moveRaf) {
      cancelAnimationFrame(state.moveRaf);
      state.moveRaf = 0;
    }
    state.pendingMove = null;
    if (state.videoDecoder) {
      try {
        if (state.videoDecoder.state !== 'closed') state.videoDecoder.close();
      } catch {}
      state.videoDecoder = null;
    }
    if (state.streamPort) {
      const port = state.streamPort;
      state.streamPort = null;
      port.onmessage = null;
      try {
        if (sendClose) port.postMessage({ __kikiStreamControl: 'close' });
        port.close();
      } catch {}
    }
  }

  async function ensureVideoDecoder(codecString) {
    const codec = codecString || 'avc1.640020';
    if (state.videoDecoder && state.videoDecoder.state === 'configured' && state.configuredCodec === codec) {
      return state.videoDecoder;
    }
    if (!state.videoDecoder || state.videoDecoder.state === 'closed') {
      state.videoDecoder = new VideoDecoder({
        output(videoFrame) {
          try {
            const w = videoFrame.displayWidth || videoFrame.codedWidth;
            const h = videoFrame.displayHeight || videoFrame.codedHeight;
            if (w && h) {
              if (el.screenCanvas.width !== w || el.screenCanvas.height !== h) {
                el.screenCanvas.width = w;
                el.screenCanvas.height = h;
              }
              updateScreenDimensions(w, h);
              canvasCtx.drawImage(videoFrame, 0, 0, w, h);
              recordRenderedFrame();
            }
          } finally {
            videoFrame.close();
          }
        },
        error() {
          state.waitingForKeyframe = true;
          sendStreamJson({ type: 'resetVideo' });
        },
      });
    }
    let config = { codec, optimizeForLatency: true, hardwareAcceleration: 'prefer-hardware' };
    try {
      const sup = await VideoDecoder.isConfigSupported(config);
      if (!sup?.supported) {
        config = { codec, optimizeForLatency: true, hardwareAcceleration: 'no-preference' };
      }
    } catch {
      config = { codec, optimizeForLatency: true, hardwareAcceleration: 'no-preference' };
    }
    state.videoDecoder.configure(config);
    state.configuredCodec = codec;
    state.waitingForKeyframe = true;
    return state.videoDecoder;
  }

  function handleStreamBinaryFrame(arrayBuffer, gen) {
    if (gen !== state.streamGeneration || !(arrayBuffer instanceof ArrayBuffer) || arrayBuffer.byteLength <= 16) return;
    const dv = new DataView(arrayBuffer);
    if (dv.getUint8(0) !== FRAME_MAGIC) return;
    const isKey = dv.getUint8(1) === 1;
    const w = dv.getUint16(2, false);
    const h = dv.getUint16(4, false);
    const ptsUs = dv.getFloat64(8, false);
    const nalu = new Uint8Array(arrayBuffer, 16);

    if (w && h) updateScreenDimensions(w, h);
    if (document.hidden) {
      state.waitingForKeyframe = true;
      return;
    }

    if (isKey) {
      const detectedCodec = extractAvcCodecFromAnnexB(nalu) || state.configuredCodec || 'avc1.640020';
      if (!state.videoDecoder || state.videoDecoder.state !== 'configured' || state.configuredCodec !== detectedCodec) {
        void ensureVideoDecoder(detectedCodec).then((dec) => {
          if (gen !== state.streamGeneration || dec.state !== 'configured') return;
          state.waitingForKeyframe = false;
          dec.decode(new EncodedVideoChunk({ type: 'key', timestamp: ptsUs, data: nalu }));
        }).catch(() => {});
        return;
      }
      state.waitingForKeyframe = false;
    } else if (state.waitingForKeyframe || !state.videoDecoder || state.videoDecoder.state !== 'configured') {
      return;
    } else if (state.videoDecoder.decodeQueueSize > 8) {
      state.waitingForKeyframe = true;
      sendStreamJson({ type: 'resetVideo' });
      return;
    }

    try {
      state.videoDecoder.decode(new EncodedVideoChunk({
        type: isKey ? 'key' : 'delta',
        timestamp: ptsUs,
        data: nalu,
      }));
    } catch {
      state.waitingForKeyframe = true;
      sendStreamJson({ type: 'resetVideo' });
    }
  }

  function sendStreamTouch(action, buttons, normX, normY, slot = 0) {
    if (!state.streamActive || !state.streamPort) return false;
    const buf = new ArrayBuffer(12);
    const dv = new DataView(buf);
    dv.setUint8(0, TOUCH_MAGIC);
    dv.setUint8(1, action & 0xff);
    dv.setUint8(2, buttons & 0xff);
    dv.setUint8(3, slot & 0xff);
    dv.setFloat32(4, normX, false);
    dv.setFloat32(8, normY, false);
    try {
      state.streamPort.postMessage(buf, [buf]);
      return true;
    } catch {
      return false;
    }
  }

  function sendStreamScroll(normX, normY, hScroll, vScroll) {
    if (!state.streamActive || !state.streamPort) return false;
    const buf = new ArrayBuffer(16);
    const dv = new DataView(buf);
    const clampI16 = (v) => Math.max(-32768, Math.min(32767, Math.round(v * 2048)));
    dv.setUint8(0, SCROLL_MAGIC);
    dv.setFloat32(4, normX, false);
    dv.setFloat32(8, normY, false);
    dv.setInt16(12, clampI16(hScroll), false);
    dv.setInt16(14, clampI16(vScroll), false);
    try {
      state.streamPort.postMessage(buf, [buf]);
      return true;
    } catch {
      return false;
    }
  }

  function sendStreamJson(obj) {
    if (!state.streamActive || !state.streamPort) return false;
    try {
      state.streamPort.postMessage(JSON.stringify(obj));
      return true;
    } catch {
      return false;
    }
  }

  async function tryConnectHardwareStream(forceRetryHost = false) {
    const active = activeOnlineDevice();
    if (!active || !state.live || active.platform !== 'android' || isDisconnectedStandalone()) return false;
    if (typeof window.VideoDecoder !== 'function') return false;
    if (state.hostStreamUnsupported && !forceRetryHost) return false;

    stopStreamMode(true);
    const gen = ++state.streamGeneration;

    try {
      const { result, port } = await openPanelStream('screen', {
        deviceId: active.id,
        platform: active.platform,
        maxFps: 60,
        maxWidth: 1080,
        bitRate: 4000000,
      }, STREAM_HANDSHAKE_TIMEOUT_MS);

      if (gen !== state.streamGeneration || !state.live) {
        if (port) {
          try {
            port.postMessage({ __kikiStreamControl: 'close' });
            port.close();
          } catch {}
        }
        return false;
      }

      if (!port) {
        state.hostStreamUnsupported = true;
        return false;
      }

      state.hostStreamUnsupported = false;
      state.streamPort = port;
      state.streamActive = true;
      state.fpsTimes = [];
      clearPollTimer();

      if (result?.width && result?.height) {
        updateScreenDimensions(result.width, result.height);
      }
      if (result?.codecProfile) {
        await ensureVideoDecoder(result.codecProfile).catch(() => {});
      }

      port.onmessage = (ev) => {
        if (gen !== state.streamGeneration) return;
        const payload = ev.data;
        if (payload instanceof ArrayBuffer) {
          handleStreamBinaryFrame(payload, gen);
          return;
        }
        if (typeof payload === 'string') {
          try {
            const meta = JSON.parse(payload);
            if (meta?.type === 'meta' && meta.width && meta.height) {
              updateScreenDimensions(meta.width, meta.height);
            }
          } catch {}
          return;
        }
        if (payload && typeof payload === 'object' && payload.__kikiStreamEvent === 'close') {
          stopStreamMode(false);
          if (state.live && activeOnlineDevice()) {
            syncInteractiveUi();
            scheduleNextPoll(20);
          }
        }
      };
      if (typeof port.start === 'function') port.start();

      syncInteractiveUi();
      updateResolutionBar();
      return true;
    } catch (err) {
      const msg = String(err?.message || '');
      if (/unsupported method|timed out/i.test(msg)) {
        state.hostStreamUnsupported = true;
      }
      return false;
    }
  }

  function clearPollTimer() {
    if (state.pollTimer) {
      clearTimeout(state.pollTimer);
      state.pollTimer = null;
    }
  }

  function scheduleNextPoll(preferredDelayMs = MIN_POLL_INTERVAL_MS, allowWhenPaused = false) {
    clearPollTimer();
    if ((!state.live && !allowWhenPaused) || state.streamActive || document.hidden || !activeOnlineDevice() || isDisconnectedStandalone()) return;
    const now = Date.now();
    const count = pruneRpcWindow(now);
    let delay = Math.max(8, preferredDelayMs);
    if (count >= FRAME_BUDGET_IN_WINDOW) {
      const oldestInBudget = rpcStamps[count - FRAME_BUDGET_IN_WINDOW];
      delay = Math.max(delay, oldestInBudget + RATE_WINDOW_MS + 25 - now);
    }
    state.pollTimer = setTimeout(() => {
      state.pollTimer = null;
      void refreshFrame(allowWhenPaused);
    }, delay);
  }

  function renderDeviceOptions() {
    el.deviceSelect.replaceChildren();
    const groups = [
      { label: 'Android', list: state.devices.filter((d) => d.platform === 'android') },
      { label: 'iOS', list: state.devices.filter((d) => d.platform === 'ios') },
    ];
    let total = 0;
    for (const grp of groups) {
      if (!grp.list.length) continue;
      const optgroup = document.createElement('optgroup');
      optgroup.label = grp.label;
      for (const dev of grp.list) {
        total++;
        const opt = document.createElement('option');
        opt.value = dev.platform + ':' + dev.id;
        const devState = dev.state || dev.status || 'offline';
        const suffix = devState === 'online' ? '' : ` (${devState})`;
        opt.textContent = `${dev.name}${dev.version ? ' · ' + dev.version : ''}${suffix}`;
        if (state.selected && state.selected.id === dev.id && state.selected.platform === dev.platform) {
          opt.selected = true;
        }
        optgroup.appendChild(opt);
      }
      el.deviceSelect.appendChild(optgroup);
    }
    if (total === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = isZh ? '未检测到手机' : 'No devices';
      el.deviceSelect.appendChild(opt);
    }

    const active = state.selected
      ? state.devices.find((d) => d.id === state.selected.id && d.platform === state.selected.platform)
      : null;
    const isOnline = Boolean(active && (active.state || active.status) === 'online');

    if (active) {
      el.platformPill.hidden = false;
      el.platformPill.textContent = active.platform === 'ios' ? 'iOS' : 'Android';
      document.querySelectorAll('.android-only').forEach((btn) => {
        btn.disabled = !isOnline || active.platform !== 'android';
      });
    } else {
      el.platformPill.hidden = true;
      document.querySelectorAll('.android-only').forEach((btn) => { btn.disabled = true; });
    }
    document.querySelectorAll('[data-act="home"]').forEach((btn) => { btn.disabled = !isOnline; });
    el.interactiveBtn.disabled = !isOnline;

    if (isOnline) {
      el.emptyState.hidden = true;
      el.chassis.hidden = false;
      layoutChassis();
    } else {
      stopStreamMode(true);
      clearPollTimer();
      el.chassis.hidden = true;
      el.emptyState.hidden = false;
      renderOfflineList();
    }

    if (state.diagnostics) {
      const a = state.diagnostics.android;
      const i = state.diagnostics.ios;
      el.diagBox.replaceChildren();
      const rowA = document.createElement('div');
      rowA.textContent = `Android: ${a?.available ? 'ADB ready' : (a?.reason || 'Unavailable')}`;
      const rowI = document.createElement('div');
      rowI.textContent = `iOS: ${i?.simulatorsSupported ? 'Simulator & USB ready' : (i?.reason || 'USB bridge')}`;
      el.diagBox.append(rowA, rowI);
    }
    syncInteractiveUi();
  }

  function renderOfflineList() {
    el.offlineList.replaceChildren();
    const candidates = state.devices.filter((d) => (d.state || d.status) !== 'online');
    for (const dev of candidates.slice(0, 5)) {
      const row = document.createElement('div');
      row.className = 'offline-row';
      const info = document.createElement('span');
      const devState = dev.state || dev.status || 'offline';
      info.textContent = `${dev.platform === 'ios' ? 'iOS' : 'Android'} · ${dev.name} (${devState})`;
      row.appendChild(info);
      if (dev.type === 'simulator' || dev.type === 'emulator') {
        const bootBtn = document.createElement('button');
        bootBtn.type = 'button';
        bootBtn.className = 'pill-btn';
        bootBtn.textContent = 'Boot';
        bootBtn.onclick = async () => {
          setStatus(`Booting ${dev.name}...`);
          const res = await panelCall('action', { action: 'boot', deviceId: dev.id, platform: dev.platform }, 65000);
          if (res?.ok) {
            await loadState();
            await activateLiveTransport(false);
          } else {
            setStatus(res?.error || 'Boot failed', 'error');
          }
        };
        row.appendChild(bootBtn);
      }
      el.offlineList.appendChild(row);
    }
  }

  async function loadState() {
    if (isDisconnectedStandalone()) {
      renderDeviceOptions();
      return;
    }
    try {
      const res = await panelCall('state');
      if (res?.ok) {
        state.devices = res.devices || [];
        state.selected = res.selected || null;
        state.diagnostics = res.diagnostics || null;
        renderDeviceOptions();
      }
    } catch (err) {
      setStatus(err.message || 'Device discovery failed', 'error');
    }
  }

  async function refreshFrame(force = false) {
    if (state.streamActive && !force) return;
    if (state.frameInFlight || isDisconnectedStandalone()) return;
    if (!force && (!state.live || document.hidden)) return;
    const active = activeOnlineDevice();
    if (!active) return;

    if (!force && pruneRpcWindow() >= FRAME_BUDGET_IN_WINDOW) {
      scheduleNextPoll(MIN_POLL_INTERVAL_MS);
      return;
    }

    state.frameInFlight = true;
    const startedAt = performance.now();
    try {
      const res = await panelCall('frame', {
        deviceId: active.id,
        platform: active.platform,
        format: 'jpeg',
        quality: 72,
        maxWidth: 720,
        live: state.live && !state.streamActive,
      });
      if (state.streamActive && !force) return;
      if (res?.ok && res.dataUrl) {
        await drawDataUrlToCanvas(res.dataUrl);
        state.asleep = Boolean(res.powerState && !res.powerState.awake);
        if (res.screenSize?.width && res.screenSize?.height) {
          updateScreenDimensions(res.screenSize.width, res.screenSize.height);
        }
        el.fgApp.textContent = res.foregroundApp || '';
        syncInteractiveUi();
      } else if (res?.error) {
        setStatus(res.error, 'error');
      }
    } catch (err) {
      if (!/rate limited/i.test(String(err?.message || ''))) {
        setStatus(err.message || 'Frame capture failed', 'error');
      }
    } finally {
      state.frameInFlight = false;
      if (state.live && !state.streamActive && !document.hidden) {
        const elapsed = performance.now() - startedAt;
        scheduleNextPoll(Math.max(10, MIN_POLL_INTERVAL_MS - elapsed));
      }
    }
  }

  async function activateLiveTransport(forceRetryStream = false) {
    stopStreamMode(true);
    clearPollTimer();
    const active = activeOnlineDevice();
    if (!active || isDisconnectedStandalone()) return;

    void refreshFrame(true);
    if (state.live) {
      scheduleNextPoll(MIN_POLL_INTERVAL_MS);
    }
    if (state.live && active.platform === 'android') {
      await tryConnectHardwareStream(forceRetryStream);
    }
  }

  async function loadAxTree() {
    if (!state.selected || isDisconnectedStandalone()) return;
    setStatus(isZh ? '正在读取 UI 语义树...' : 'Inspecting UI hierarchy...');
    try {
      const res = await panelCall('tree', {
        deviceId: state.selected.id,
        platform: state.selected.platform,
      });
      if (res?.ok) {
        state.axNodes = res.nodes || [];
        renderAxOverlay();
        setStatus(`${state.axNodes.length} UI nodes`);
      } else {
        setStatus(res?.error || 'Failed to read UI hierarchy', 'error');
      }
    } catch (err) {
      setStatus(err.message || 'Hierarchy error', 'error');
    }
  }

  function renderAxOverlay() {
    el.axLayer.replaceChildren();
    syncInteractiveUi();
    if (!state.axEnabled) {
      el.axLayer.hidden = true;
      el.axLayer.classList.remove('interactive');
      return;
    }
    el.axLayer.hidden = false;
    el.axLayer.classList.add('interactive');
    const boxRect = el.screenBox.getBoundingClientRect();
    const drawn = computeContainedRect(boxRect.width, boxRect.height, state.screenSize.width, state.screenSize.height);
    const baseLeftPct = (drawn.x / Math.max(1, boxRect.width)) * 100;
    const baseTopPct = (drawn.y / Math.max(1, boxRect.height)) * 100;
    const widthScalePct = (drawn.width / Math.max(1, boxRect.width)) * 100;
    const heightScalePct = (drawn.height / Math.max(1, boxRect.height)) * 100;

    for (const node of state.axNodes) {
      const box = document.createElement('div');
      box.className = 'ax-box' + (state.selectedAx?.id === node.id ? ' selected' : '');
      box.style.left = (baseLeftPct + node.normBounds.x * widthScalePct) + '%';
      box.style.top = (baseTopPct + node.normBounds.y * heightScalePct) + '%';
      box.style.width = (node.normBounds.width * widthScalePct) + '%';
      box.style.height = (node.normBounds.height * heightScalePct) + '%';
      box.title = [node.text, node.label, node.identifier].filter(Boolean).join(' · ');
      box.onclick = (ev) => {
        ev.stopPropagation();
        state.selectedAx = node;
        el.drawer.hidden = false;
        el.toolsBtn.classList.add('active');
        el.axInspectorSection.hidden = false;
        el.axNodeSummary.textContent = node.text || node.label || node.role || 'Node';
        el.axNodeMeta.textContent = `${node.role || 'View'} · (${node.bounds.x}, ${node.bounds.y}, ${node.bounds.width}×${node.bounds.height})`;
        el.axNodeLocator.hidden = !node.locator;
        el.axNodeLocator.textContent = node.locator || '';
        layoutChassis();
        renderAxOverlay();
      };
      el.axLayer.appendChild(box);
    }
  }

  function showRipple(pctX, pctY, hold = false) {
    const dot = document.createElement('div');
    dot.className = 'touch-ripple' + (hold ? ' hold' : '');
    dot.style.left = pctX + '%';
    dot.style.top = pctY + '%';
    el.screenBox.appendChild(dot);
    setTimeout(() => dot.remove(), hold ? 460 : 380);
  }

  function clearHoldPulseTimer() {
    if (state.holdPulseTimer) {
      clearTimeout(state.holdPulseTimer);
      state.holdPulseTimer = null;
    }
  }

  el.screenBox.addEventListener('pointerdown', (ev) => {
    if (state.axEnabled || ev.button !== 0 || !activeOnlineDevice()) return;
    if (!state.interactive) {
      setStatus(isZh ? '只读预览中 · 点击顶栏「人工操控」或按 Alt+I 接管画面' : 'Read-only · click Interactive (Alt+I) to touch screen', 'amber');
      return;
    }
    const pt = mapSurfaceEvent(ev);
    if (!pt.inside) return;

    el.screenBox.focus({ preventScroll: true });
    el.screenBox.setPointerCapture(ev.pointerId);
    showRipple(pt.pctX, pt.pctY, false);
    el.coordText.textContent = `${pt.devX}, ${pt.devY}`;

    clearHoldPulseTimer();
    state.holdPulseTimer = setTimeout(() => {
      state.holdPulseTimer = null;
      if (state.pointerStart && !state.pointerStart.moved) {
        showRipple(state.pointerStart.pctX, state.pointerStart.pctY, true);
      }
    }, 500);

    el.gestureStartDot.setAttribute('cx', String(pt.svgX));
    el.gestureStartDot.setAttribute('cy', String(pt.svgY));
    el.gestureLine.setAttribute('x1', String(pt.svgX));
    el.gestureLine.setAttribute('y1', String(pt.svgY));
    el.gestureLine.setAttribute('x2', String(pt.svgX));
    el.gestureLine.setAttribute('y2', String(pt.svgY));

    const streamed = Boolean(state.streamActive && sendStreamTouch(0, 1, pt.x, pt.y));
    state.pointerStart = { ...pt, time: Date.now(), pointerId: ev.pointerId, streamed, moved: false };
  });

  el.screenBox.addEventListener('pointermove', (ev) => {
    if (state.interactive && !state.axEnabled && activeOnlineDevice()) {
      const hoverPt = mapSurfaceEvent(ev);
      if (hoverPt.inside || state.pointerStart) {
        el.coordText.textContent = `${hoverPt.devX}, ${hoverPt.devY}`;
      }
    }
    if (!state.pointerStart || state.pointerStart.pointerId !== ev.pointerId) return;
    const pt = mapSurfaceEvent(ev);
    const dist = Math.hypot(pt.pxX - state.pointerStart.pxX, pt.pxY - state.pointerStart.pxY);

    if (dist > 10) {
      state.pointerStart.moved = true;
      clearHoldPulseTimer();
      el.gestureSvg.hidden = false;
      el.gestureLine.setAttribute('x2', String(pt.svgX));
      el.gestureLine.setAttribute('y2', String(pt.svgY));
    }

    if (state.pointerStart.streamed && state.streamActive) {
      state.pendingMove = pt;
      if (!state.moveRaf) {
        state.moveRaf = requestAnimationFrame(() => {
          state.moveRaf = 0;
          if (state.pendingMove && state.pointerStart?.streamed) {
            sendStreamTouch(2, 1, state.pendingMove.x, state.pendingMove.y);
            state.pendingMove = null;
          }
        });
      }
    }
  });

  async function finishPointerGesture(ev, cancelled = false) {
    if (!state.pointerStart || state.pointerStart.pointerId !== ev.pointerId) return;
    const start = state.pointerStart;
    state.pointerStart = null;
    clearHoldPulseTimer();
    el.gestureSvg.hidden = true;
    const end = mapSurfaceEvent(ev);

    if (start.streamed) {
      if (state.moveRaf) {
        cancelAnimationFrame(state.moveRaf);
        state.moveRaf = 0;
      }
      if (state.pendingMove && !cancelled) {
        sendStreamTouch(2, 1, state.pendingMove.x, state.pendingMove.y);
      }
      state.pendingMove = null;
      sendStreamTouch(cancelled ? 3 : 1, 0, end.x, end.y);
      if (!cancelled && start.moved) showRipple(end.pctX, end.pctY, false);
      return;
    }

    if (cancelled || !state.selected) return;
    const dist = Math.hypot(end.pxX - start.pxX, end.pxY - start.pxY);
    const elapsed = Date.now() - start.time;

    if (dist > 14) {
      showRipple(end.pctX, end.pctY, false);
      await panelCall('action', {
        action: 'swipe',
        deviceId: state.selected.id,
        platform: state.selected.platform,
        startNormX: start.x,
        startNormY: start.y,
        endNormX: end.x,
        endNormY: end.y,
        durationMs: Math.min(900, Math.max(140, elapsed)),
      }).catch((err) => setStatus(err.message || 'Swipe failed', 'error'));
    } else if (elapsed >= 500) {
      await panelCall('action', {
        action: 'longPress',
        deviceId: state.selected.id,
        platform: state.selected.platform,
        normX: end.x,
        normY: end.y,
        durationMs: Math.min(2000, elapsed),
      }).catch((err) => setStatus(err.message || 'Long press failed', 'error'));
    } else if (ev.detail >= 2) {
      await panelCall('action', {
        action: 'doubleTap',
        deviceId: state.selected.id,
        platform: state.selected.platform,
        normX: end.x,
        normY: end.y,
      }).catch((err) => setStatus(err.message || 'Double tap failed', 'error'));
    } else {
      await panelCall('action', {
        action: 'tap',
        deviceId: state.selected.id,
        platform: state.selected.platform,
        normX: end.x,
        normY: end.y,
      }).catch((err) => setStatus(err.message || 'Tap failed', 'error'));
    }
    scheduleNextPoll(35, true);
  }

  el.screenBox.addEventListener('pointerup', (ev) => { void finishPointerGesture(ev, false); });
  el.screenBox.addEventListener('pointercancel', (ev) => { void finishPointerGesture(ev, true); });

  el.screenBox.addEventListener('wheel', (ev) => {
    if (!state.interactive || state.axEnabled || !activeOnlineDevice()) return;
    const pt = mapSurfaceEvent(ev);
    if (!pt.inside) return;
    ev.preventDefault();

    if (state.streamActive) {
      const vx = Math.max(-4, Math.min(4, -ev.deltaX / 80));
      const vy = Math.max(-4, Math.min(4, -ev.deltaY / 80));
      if (vx !== 0 || vy !== 0) sendStreamScroll(pt.x, pt.y, vx, vy);
      return;
    }

    state.wheelAccX += ev.deltaX;
    state.wheelAccY += ev.deltaY;
    state.lastWheelPt = pt;
    if (!state.wheelTimer) {
      state.wheelTimer = setTimeout(async () => {
        state.wheelTimer = null;
        const dx = state.wheelAccX;
        const dy = state.wheelAccY;
        const anchor = state.lastWheelPt;
        state.wheelAccX = 0;
        state.wheelAccY = 0;
        if (!state.selected || !anchor || (dx === 0 && dy === 0)) return;
        await panelCall('action', {
          action: 'scroll',
          deviceId: state.selected.id,
          platform: state.selected.platform,
          normX: anchor.x,
          normY: anchor.y,
          deltaX: Math.round(dx),
          deltaY: Math.round(dy),
        }).catch(() => {});
        scheduleNextPoll(45, true);
      }, 110);
    }
  }, { passive: false });

  async function sendPastedTextToPhone(rawText) {
    const text = String(rawText ?? '');
    if (!text || !state.selected) return;
    if (state.streamActive && sendStreamJson({ type: 'paste', text })) {
      setStatus(isZh ? `已粘贴 ${text.length} 字符到手机` : `Pasted ${text.length} chars to phone`);
      return;
    }
    const res = await panelCall('action', {
      action: 'pasteText',
      deviceId: state.selected.id,
      platform: state.selected.platform,
      text,
    }).catch((err) => ({ ok: false, error: err.message }));
    if (res?.ok) {
      setStatus(isZh ? `已发送 ${text.length} 字符` : `Sent ${text.length} chars`);
      scheduleNextPoll(65, true);
    } else if (res?.error) {
      setStatus(res.error, 'error');
    }
  }

  function flushTypedChars() {
    if (state.typeFlushTimer) {
      clearTimeout(state.typeFlushTimer);
      state.typeFlushTimer = null;
    }
    const text = state.typedBuffer;
    state.typedBuffer = '';
    if (!text || !state.selected) return;
    if (state.streamActive && sendStreamJson({ type: 'text', text })) {
      return;
    }
    void panelCall('action', {
      action: 'typeText',
      deviceId: state.selected.id,
      platform: state.selected.platform,
      text,
      submit: false,
    }).then(() => scheduleNextPoll(65, true)).catch((err) => setStatus(err.message || 'Type failed', 'error'));
  }

  async function dispatchKeyToPhone(keyName) {
    flushTypedChars();
    if (!state.selected) return;
    if (state.streamActive && sendStreamJson({ type: 'key', key: keyName })) {
      return;
    }
    await panelCall('action', {
      action: 'key',
      deviceId: state.selected.id,
      platform: state.selected.platform,
      key: keyName,
    }).catch((err) => setStatus(err.message || 'Key action failed', 'error'));
    scheduleNextPoll(65, true);
  }

  el.screenBox.addEventListener('keydown', (ev) => {
    if (!state.interactive || state.axEnabled || !activeOnlineDevice()) return;
    if (ev.key === 'Shift' || ev.key === 'Control' || ev.key === 'Alt' || ev.key === 'Meta') return;

    if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && ev.key.toLowerCase() === 'v') {
      const stamp = Date.now();
      setTimeout(async () => {
        if (state.pasteHandledAt >= stamp) return;
        try {
          if (navigator.clipboard && typeof navigator.clipboard.readText === 'function') {
            const clip = await navigator.clipboard.readText();
            if (clip) await sendPastedTextToPhone(clip);
          }
        } catch {}
      }, 45);
      return;
    }
    if (ev.ctrlKey || ev.altKey || ev.metaKey) return;

    const specialMap = {
      Enter: 'ENTER',
      Backspace: 'BACKSPACE',
      Delete: 'DELETE',
      Tab: 'TAB',
      Escape: 'BACK',
      ArrowUp: 'UP',
      ArrowDown: 'DOWN',
      ArrowLeft: 'LEFT',
      ArrowRight: 'RIGHT',
      Home: 'MOVE_HOME',
      End: 'MOVE_END',
      PageUp: 'PAGE_UP',
      PageDown: 'PAGE_DOWN',
    };

    if (specialMap[ev.key]) {
      ev.preventDefault();
      void dispatchKeyToPhone(specialMap[ev.key]);
      return;
    }

    if (ev.key.length === 1) {
      ev.preventDefault();
      state.typedBuffer += ev.key;
      if (!state.typeFlushTimer) {
        state.typeFlushTimer = setTimeout(flushTypedChars, 38);
      }
    }
  });

  window.addEventListener('paste', (ev) => {
    if (!state.interactive || state.axEnabled || !activeOnlineDevice()) return;
    const tag = document.activeElement?.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    const text = ev.clipboardData?.getData('text/plain');
    if (!text) return;
    ev.preventDefault();
    state.pasteHandledAt = Date.now();
    void sendPastedTextToPhone(text);
  });

  window.addEventListener('keydown', (ev) => {
    if (ev.altKey && !ev.ctrlKey && !ev.metaKey && ev.key.toLowerCase() === 'i') {
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      ev.preventDefault();
      if (!el.interactiveBtn.disabled) setInteractiveMode(!state.interactive);
    }
  });

  el.interactiveBtn.addEventListener('click', () => {
    setInteractiveMode(!state.interactive);
  });

  el.deviceSelect.addEventListener('change', async () => {
    const val = el.deviceSelect.value;
    if (!val.includes(':')) return;
    const [platform, ...rest] = val.split(':');
    const id = rest.join(':');
    state.selected = { id, platform };
    state.fpsTimes = [];
    await panelCall('action', { action: 'select', deviceId: id, platform }).catch(() => {});
    renderDeviceOptions();
    await activateLiveTransport(false);
    if (state.axEnabled) await loadAxTree();
  });

  el.liveToggle.addEventListener('click', () => {
    state.live = !state.live;
    el.liveToggle.classList.toggle('active', state.live);
    el.liveToggle.textContent = state.live ? 'Live' : 'Paused';
    if (state.live) {
      void activateLiveTransport(false);
    } else {
      stopStreamMode(true);
      clearPollTimer();
      updateResolutionBar();
      syncInteractiveUi();
    }
  });

  el.refreshBtn.addEventListener('click', async () => {
    setStatus(isZh ? '正在刷新...' : 'Refreshing...');
    await loadState();
    await activateLiveTransport(true);
    if (state.axEnabled) await loadAxTree();
  });

  document.getElementById('retryScanBtn').addEventListener('click', () => el.refreshBtn.click());
  document.getElementById('openWirelessBtn').addEventListener('click', () => {
    el.drawer.hidden = false;
    el.toolsBtn.classList.add('active');
    layoutChassis();
    document.getElementById('adbConnectAddr').focus();
  });

  el.axBtn.addEventListener('click', async () => {
    state.axEnabled = !state.axEnabled;
    el.axBtn.classList.toggle('active', state.axEnabled);
    if (state.axEnabled) await loadAxTree();
    else renderAxOverlay();
  });

  el.toolsBtn.addEventListener('click', () => {
    const nextHidden = !el.drawer.hidden;
    el.drawer.hidden = nextHidden;
    el.toolsBtn.classList.toggle('active', !nextHidden);
    layoutChassis();
    if (state.axEnabled) renderAxOverlay();
  });

  document.querySelectorAll('[data-act]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const act = btn.getAttribute('data-act');
      if (!state.selected) return;
      if (act === 'shot') {
        setStatus(isZh ? '正在保存 PNG...' : 'Capturing PNG...');
        const res = await panelCall('frame', {
          deviceId: state.selected.id,
          platform: state.selected.platform,
          format: 'png',
        }, 25000).catch((err) => ({ ok: false, error: err.message }));
        if (res?.ok && res.dataUrl) {
          const a = document.createElement('a');
          a.href = res.dataUrl;
          a.download = `phone-${Date.now()}.png`;
          a.click();
          setStatus(isZh ? '已导出 PNG 截图' : 'Saved PNG screenshot');
        } else {
          setStatus(res?.error || 'Screenshot failed', 'error');
        }
        return;
      }
      const mapButton = { home: 'HOME', back: 'BACK', recents: 'RECENTS' };
      if (state.streamActive && mapButton[act] && sendStreamJson({ type: 'button', button: mapButton[act] })) {
        return;
      }
      if (state.streamActive && act === 'rotate' && sendStreamJson({ type: 'rotate' })) {
        return;
      }
      const payload = mapButton[act]
        ? { action: 'button', button: mapButton[act] }
        : { action: act };
      const res = await panelCall('action', {
        ...payload,
        deviceId: state.selected.id,
        platform: state.selected.platform,
      }).catch((err) => ({ ok: false, error: err.message }));
      if (!res?.ok && res?.error) setStatus(res.error, 'error');
      if (!state.streamActive) scheduleNextPoll(75, true);
    });
  });

  document.getElementById('typeForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const input = document.getElementById('typeInput');
    const text = input.value;
    if (!text || !state.selected) return;
    const res = await panelCall('action', {
      action: 'typeText',
      deviceId: state.selected.id,
      platform: state.selected.platform,
      text,
      submit: true,
    }).catch((err) => ({ ok: false, error: err.message }));
    if (res?.ok) {
      input.value = '';
      syncInteractiveUi();
      if (!state.streamActive) scheduleNextPoll(75, true);
    } else setStatus(res?.error || 'Text input failed', 'error');
  });

  document.getElementById('urlForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const input = document.getElementById('urlInput');
    const url = input.value.trim();
    if (!url || !state.selected) return;
    const res = await panelCall('action', {
      action: 'openUrl',
      deviceId: state.selected.id,
      platform: state.selected.platform,
      url,
    }).catch((err) => ({ ok: false, error: err.message }));
    if (res?.ok && !state.streamActive) scheduleNextPoll(160, true);
    else if (!res?.ok) setStatus(res?.error || 'Open URL failed', 'error');
  });

  document.querySelectorAll('[data-appearance]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      if (!state.selected) return;
      const mode = btn.getAttribute('data-appearance');
      const res = await panelCall('action', {
        action: 'appearance',
        deviceId: state.selected.id,
        platform: state.selected.platform,
        mode,
      }).catch((err) => ({ ok: false, error: err.message }));
      if (res?.ok && !state.streamActive) scheduleNextPoll(160, true);
      else if (!res?.ok) setStatus(res?.error || 'Appearance toggle unsupported', 'error');
    });
  });

  document.getElementById('askAgentBtn').addEventListener('click', async () => {
    if (!state.selected) return;
    const text = `Check my connected ${state.selected.platform} phone (${state.selected.id}) and help me operate the current screen.`;
    try {
      await bridgeCall('session.sendMessage', { text });
      setStatus(isZh ? '已发送到当前会话' : 'Sent to conversation');
    } catch (err) {
      setStatus(err.message || 'Active session required', 'error');
    }
  });

  document.getElementById('adbConnectBtn').addEventListener('click', async () => {
    const address = document.getElementById('adbConnectAddr').value.trim();
    if (!address) return;
    setStatus(`Connecting ${address}...`);
    const res = await panelCall('action', { action: 'adbConnection', subAction: 'connect', address }).catch((err) => ({ ok: false, error: err.message }));
    setStatus(res?.ok ? (res.stdout || 'Connected') : (res?.error || 'Connect failed'), res?.ok ? 'normal' : 'error');
    await loadState();
    await activateLiveTransport(false);
  });

  document.getElementById('adbPairBtn').addEventListener('click', async () => {
    const address = document.getElementById('adbPairAddr').value.trim();
    const code = document.getElementById('adbPairCode').value.trim();
    if (!address || !code) return;
    setStatus(`Pairing ${address}...`);
    const res = await panelCall('action', { action: 'adbConnection', subAction: 'pair', address, code }).catch((err) => ({ ok: false, error: err.message }));
    setStatus(res?.ok ? (res.stdout || 'Paired') : (res?.error || 'Pair failed'), res?.ok ? 'normal' : 'error');
  });

  document.getElementById('copyLocatorBtn').addEventListener('click', async () => {
    if (!state.selectedAx?.locator) return;
    const copied = await copyTextSafe(state.selectedAx.locator);
    setStatus(copied ? (isZh ? '已复制定位器' : 'Copied locator') : state.selectedAx.locator);
  });

  document.getElementById('tapNodeBtn').addEventListener('click', async () => {
    const node = state.selectedAx;
    if (!node || !state.selected) return;
    const nx = node.normBounds.x + node.normBounds.width / 2;
    const ny = node.normBounds.y + node.normBounds.height / 2;
    await panelCall('action', {
      action: 'tap',
      deviceId: state.selected.id,
      platform: state.selected.platform,
      normX: nx,
      normY: ny,
    }).catch(() => {});
    setTimeout(async () => {
      if (!state.streamActive) await refreshFrame(true);
      if (state.axEnabled) await loadAxTree();
    }, 220);
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      clearPollTimer();
    } else if (state.live) {
      if (state.streamActive) {
        state.waitingForKeyframe = true;
        sendStreamJson({ type: 'resetVideo' });
      } else {
        scheduleNextPoll(10);
      }
    }
  });

  window.addEventListener('pagehide', () => stopStreamMode(true));

  async function startBoot() {
    if (booted) {
      await loadState();
      if (!state.streamActive) await activateLiveTransport(false);
      return;
    }
    booted = true;
    await loadState();
    await activateLiveTransport(false);
  }

  setTimeout(() => { if (!booted) void startBoot(); }, 200);
})();
</script>
</body>
</html>
