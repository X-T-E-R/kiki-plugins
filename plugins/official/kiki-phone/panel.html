<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Phone Preview</title>
<style>
  /* @kiki-panel-kit:theme:start */

    --accent-soft: rgba(44, 94, 79, 0.10);
    --on-accent: var(--color-on-accent, #fcfbf8);
    --ok: var(--color-success, #2c6e49);
    --warn: var(--color-amber-ink, #8a5a19);
    --warn-bg: var(--color-amber-card, rgba(138, 90, 25, 0.11));

    --wash: rgba(27, 26, 23, 0.04);
    --sans: "Instrument Sans", ui-sans-serif, system-ui, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;

  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--color-canvas, #141413);
      --paper: var(--color-paper, #1c1b19);
      --panel: var(--color-panel, #252320);
      --ink: var(--color-ink, #edeae2);
      --ink-soft: var(--color-ink-soft, #b2aca0);
      --ink-faint: var(--color-ink-faint, #7b766c);
      --line: var(--color-hairline, rgba(237, 234, 226, 0.10));
      --line-strong: var(--color-hairline-strong, rgba(237, 234, 226, 0.18));
      --accent: var(--color-accent, #58a88f);
      --accent-deep: var(--color-accent-deep, #6ebe9f);
      --accent-soft: rgba(88, 168, 143, 0.15);
      --on-accent: var(--color-on-accent, #141413);
      --ok: var(--color-success, #6bbf8e);
      --warn: var(--color-amber-ink, #dca056);
      --warn-bg: var(--color-amber-card, rgba(220, 160, 86, 0.14));
      --danger: var(--color-danger, #e27a6e);
      --danger-bg: rgba(226, 122, 110, 0.14);
      --wash: rgba(237, 234, 226, 0.05);
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: var(--color-canvas, #141413);
    --paper: var(--color-paper, #1c1b19);
    --panel: var(--color-panel, #252320);
    --ink: var(--color-ink, #edeae2);
    --ink-soft: var(--color-ink-soft, #b2aca0);
    --ink-faint: var(--color-ink-faint, #7b766c);
    --line: var(--color-hairline, rgba(237, 234, 226, 0.10));
    --line-strong: var(--color-hairline-strong, rgba(237, 234, 226, 0.18));
    --accent: var(--color-accent, #58a88f);
    --accent-deep: var(--color-accent-deep, #6ebe9f);
    --accent-soft: rgba(88, 168, 143, 0.15);
    --on-accent: var(--color-on-accent, #141413);
    --ok: var(--color-success, #6bbf8e);
    --warn: var(--color-amber-ink, #dca056);
    --warn-bg: var(--color-amber-card, rgba(220, 160, 86, 0.14));
    --danger: var(--color-danger, #e27a6e);
    --danger-bg: rgba(226, 122, 110, 0.14);
    --wash: rgba(237, 234, 226, 0.05);
  }

  :root[data-theme="light"] {
    color-scheme: light;
  }
  /* @kiki-panel-kit:theme:end */
  /* @kiki-panel-kit:remote-css:start */
  /* GENERATED from shared/panel-kit/remote.css — run `npm run sync:panels`; do not edit this block. */
  .kiki-remote-ime-trap {
    position: fixed;
    left: -9999px;
    top: -9999px;
    width: 1px;
    height: 1px;
    opacity: 0;
    padding: 0;
    border: 0;
    pointer-events: none;
  }

  .kiki-remote-clip-pill {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 28;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: calc(100% - 28px);
    height: 28px;
    padding: 0 11px;
    border-radius: 999px;
    border: 1px solid var(--accent);
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 11.5px;
    font-weight: 500;
    box-shadow: 0 8px 22px -10px rgba(18, 17, 15, 0.28);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .kiki-remote-clip-pill:hover {
    background: var(--accent-soft);
  }

  .kiki-remote-clip-pill-label {
    color: var(--accent);
    font-weight: 600;
  }

  .kiki-remote-clip-pill-preview {
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 10.5px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .kiki-remote-drop-overlay {
    position: absolute;
    inset: 10px;
    z-index: 32;
    border-radius: 10px;
    border: 1.5px dashed var(--accent);
    background: rgba(252, 251, 248, 0.90);
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  :root[data-theme="dark"] .kiki-remote-drop-overlay {
    background: rgba(20, 20, 19, 0.88);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .kiki-remote-drop-overlay {
      background: rgba(20, 20, 19, 0.88);
    }
  }

  .kiki-remote-drop-card {
    padding: 14px 18px;
    border-radius: 8px;
    background: var(--paper);
    border: 1px solid var(--line-strong);
    text-align: center;
    max-width: 280px;
  }

  .kiki-remote-drop-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }

  .kiki-remote-drop-sub {
    margin-top: 4px;
    font-size: 11px;
    color: var(--ink-soft);
  }

  .kiki-remote-magnifier {
    position: absolute;
    z-index: 30;
    border-radius: 8px;
    border: 1.5px solid var(--line-strong);
    background: #141413;
    box-shadow: 0 14px 32px -12px rgba(0, 0, 0, 0.48);
    overflow: hidden;
    pointer-events: none;
  }

  .kiki-remote-magnifier-canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .kiki-remote-magnifier-meta {
    position: absolute;
    left: 6px;
    bottom: 5px;
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(20, 20, 19, 0.82);
    color: #fcfbf8;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: -0.01em;
  }

  .kiki-pinch-dot {
    position: absolute;
    width: 18px;
    height: 18px;
    margin-left: -9px;
    margin-top: -9px;
    border-radius: 999px;
    border: 2px solid var(--accent);
    background: var(--accent-soft);
    pointer-events: none;
    z-index: 15;
  }
  /* @kiki-panel-kit:remote-css:end */
  :root {
    --accent-soft: rgba(44, 94, 79, 0.12);
    --amber: #b85d19;
    --amber-soft: rgba(184, 93, 25, 0.14);
    --bezel: #161618;
    --bezel-edge: #2f2f35;
    --shadow: 0 18px 42px -18px rgba(18, 17, 15, 0.28), 0 2px 6px rgba(18, 17, 15, 0.08);
    --font: var(--sans);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --accent-soft: rgba(88, 168, 143, 0.16);
      --amber: #e5934a;
      --amber-soft: rgba(229, 147, 74, 0.18);
      --bezel: #0b0b0c;
      --bezel-edge: #38383f;
      --shadow: 0 22px 48px -18px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }
  }
  :root[data-theme="dark"] {
    --accent-soft: rgba(88, 168, 143, 0.16);
    --amber: #e5934a;
    --amber-soft: rgba(229, 147, 74, 0.18);
    --bezel: #0b0b0c;
    --bezel-edge: #38383f;
    --shadow: 0 22px 48px -18px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(255, 255, 255, 0.05);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  button, input, select { font: inherit; color: inherit; }
  .shell {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 42px;
    padding: 0 12px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .device-picker-wrap {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    flex: 1;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: var(--ink-faint);
    flex-shrink: 0;
    transition: background 140ms ease;
  }
  .status-dot.online { background: var(--ok); }
  .status-dot.interactive { background: var(--amber); }
  .status-dot.warn { background: var(--danger); }
  .device-select {
    appearance: none;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 7px;
    height: 27px;
    padding: 0 25px 0 9px;
    font-size: 12px;
    font-weight: 500;
    max-width: 210px;
    min-width: 106px;
    text-overflow: ellipsis;
    overflow: hidden;
    white-space: nowrap;
    cursor: pointer;
    outline: none;
  }
  .device-select:focus-visible { border-color: var(--accent); }
  .select-chevron {
    pointer-events: none;
    margin-left: -21px;
    margin-right: 4px;
    color: var(--ink-faint);
    display: flex;
  }
  .platform-pill {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 5px;
    background: var(--panel);
    color: var(--ink-soft);
    border: 1px solid var(--line);
    flex-shrink: 0;
  }
  .meta-app {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 132px;
  }
  .nav-cluster {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 2px;
    border-radius: 7px;
    background: var(--panel);
    border: 1px solid var(--line);
    flex-shrink: 0;
  }
  .nav-key {
    width: 25px;
    height: 23px;
    border-radius: 5px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 110ms ease, color 110ms ease;
  }
  .nav-key:hover:not(:disabled) { background: var(--paper); color: var(--ink); }
  .nav-key:focus-visible { outline: 1.5px solid var(--accent); outline-offset: -1px; }
  .nav-key:disabled { opacity: 0.34; cursor: default; }
  .pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 27px;
    padding: 0 9px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .pill-btn:hover:not(:disabled) { background: var(--panel); color: var(--ink); }
  .pill-btn:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 1px; }
  .pill-btn:disabled { opacity: 0.4; cursor: default; }
  .pill-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
  .pill-btn.interactive-on {
    background: var(--amber-soft);
    border-color: var(--amber);
    color: var(--amber);
  }
  .icon-btn {
    width: 27px;
    padding: 0;
    justify-content: center;
  }
  .workspace {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    overflow: hidden;
  }
  .stage {
    position: relative;
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px 56px 14px 14px;
  }
  .phone-chassis {
    position: relative;
    background: var(--bezel);
    border: 2px solid var(--bezel-edge);
    border-radius: 26px;
    padding: 8px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: width 140ms ease, height 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
  }
  .phone-chassis.interactive-ring {
    border-color: var(--amber);
    box-shadow: 0 0 0 2px var(--amber-soft), var(--shadow);
  }
  .phone-screen {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 19px;
    overflow: hidden;
    background: #09090b;
    cursor: default;
    outline: none;
    touch-action: none;
  }
  .phone-screen.interactive {
    cursor: crosshair;
  }
  .phone-screen canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
    user-select: none;
  }
  .touch-ripple {
    position: absolute;
    width: 24px;
    height: 24px;
    margin-left: -12px;
    margin-top: -12px;
    border-radius: 999px;
    border: 1.8px solid rgba(255, 255, 255, 0.92);
    background: rgba(88, 168, 143, 0.34);
    pointer-events: none;
    animation: ripple 360ms ease-out forwards;
  }
  .touch-ripple.hold {
    width: 34px;
    height: 34px;
    margin-left: -17px;
    margin-top: -17px;
    border-color: var(--amber);
    background: rgba(229, 147, 74, 0.28);
    animation: holdPulse 440ms ease-out forwards;
  }
  @keyframes ripple {
    0% { transform: scale(0.4); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  @keyframes holdPulse {
    0% { transform: scale(0.55); opacity: 0.95; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  .gesture-line {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .ax-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .ax-layer.interactive { pointer-events: auto; }
  .ax-box {
    position: absolute;
    border: 1px solid rgba(88, 168, 143, 0.65);
    background: rgba(88, 168, 143, 0.06);
    cursor: pointer;
    transition: background 90ms ease, border-color 90ms ease;
  }
  .ax-box:hover, .ax-box.selected {
    border: 1.5px solid #3ce0b5;
    background: rgba(60, 224, 181, 0.2);
    z-index: 5;
  }
  .rail {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 5px;
    border-radius: 13px;
    background: var(--paper);
    border: 1px solid var(--line);
    box-shadow: 0 8px 24px -10px rgba(0, 0, 0, 0.18);
    z-index: 10;
  }
  .rail-btn {
    width: 31px;
    height: 31px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 110ms ease, color 110ms ease;
  }
  .rail-btn:hover:not(:disabled) { background: var(--panel); color: var(--ink); }
  .rail-btn.active { background: var(--accent-soft); color: var(--accent); }
  .rail-btn:disabled { opacity: 0.35; cursor: default; }
  .rail-sep {
    height: 1px;
    margin: 2px 4px;
    background: var(--line);
  }
  .drawer {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 280px;
    max-width: calc(100% - 48px);
    border-left: 1px solid var(--line);
    background: var(--paper);
    box-shadow: -12px 0 28px -12px rgba(0, 0, 0, 0.24);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 12px 58px 12px 12px;
    gap: 14px;
    z-index: 8;
  }
  .section-title {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 6px 0;
  }
  .field-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .input {
    flex: 1;
    min-width: 0;
    height: 28px;
    padding: 0 8px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-size: 12px;
    outline: none;
    user-select: text;
  }
  .input:focus { border-color: var(--accent); }
  .ax-card {
    padding: 8px;
    border-radius: 8px;
    background: var(--bg);
    border: 1px solid var(--line);
    font-size: 11.5px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    user-select: text;
  }
  .code-box {
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px;
    border-radius: 5px;
    background: var(--panel);
    word-break: break-all;
    color: var(--ink);
  }
  .empty-state {
    max-width: 316px;
    padding: 18px 20px;
    border-radius: 12px;
    background: var(--paper);
    border: 1px solid var(--line);
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .empty-title {
    font-size: 13.5px;
    font-weight: 600;
    margin: 0;
  }
  .empty-desc {
    font-size: 12px;
    line-height: 1.45;
    color: var(--ink-soft);
    margin: 0;
  }
  .device-group-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .offline-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 7px;
    background: var(--bg);
    border: 1px solid var(--line);
    font-size: 12px;
  }
  .statusbar {
    height: 25px;
    padding: 0 12px;
    border-top: 1px solid var(--line);
    background: var(--paper);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--ink-faint);
    flex-shrink: 0;
    gap: 8px;
  }
  .statusbar-msg {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .statusbar-msg.err { color: var(--danger); }
  .statusbar-msg.amber { color: var(--amber); font-weight: 500; }
  .statusbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    white-space: nowrap;
  }
  @media (max-width: 620px) {
    .topbar { gap: 5px; padding: 0 8px; }
    .meta-app, .platform-pill { display: none; }
    .device-select { flex: 1 1 0; min-width: 0; width: 100%; max-width: 100%; padding: 0 22px 0 7px; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="device-picker-wrap">
      <span id="statusDot" class="status-dot"></span>
      <select id="deviceSelect" class="device-select" aria-label="Select phone device">
        <option value="">Scanning...</option>
      </select>
      <span class="select-chevron" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M4.5 6.5L8 10l3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span id="platformPill" class="platform-pill" hidden>Android</span>
      <span id="fgApp" class="meta-app"></span>
    </div>

    <div class="nav-cluster" role="group" aria-label="Navigation keys">
      <button type="button" class="nav-key android-only" data-act="back" title="Back · 返回" aria-label="Back">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5L5.5 8 10 12.5"/></svg>

        if (hiddenInput) hiddenInput.value = '';
        restoreSurfaceFocusIfRaw();

        if (text) {
          ev?.preventDefault?.();
          options.onHostPaste?.(text, { source: wasHolding ? 'paste_hold' : 'paste_event' });
        } else if (wasHolding) {
          options.onFallbackPasteChord?.();
        }
      };

      const onCompositionStart = () => {
        composing = true;
      };

      const onCompositionEnd = (ev) => {
        composing = false;
        const committed = String(ev?.data || hiddenInput?.value || '');
        if (hiddenInput) hiddenInput.value = '';
        if (!committed) return;
        if (typeof options.isInteractive === 'function' && !options.isInteractive()) return;
        options.onCommittedText?.(committed, { source: 'ime_composition' });
      };

      const onHiddenInput = () => {
        if (composing || awaitingPasteHold || !hiddenInput) return;
        const val = hiddenInput.value;
        if (!val) return;
        hiddenInput.value = '';
        if (typeof options.isInteractive === 'function' && !options.isInteractive()) return;
        options.onCommittedText?.(val, { source: 'input' });
      };

      if (hiddenInput && typeof hiddenInput.addEventListener === 'function') {
        hiddenInput.addEventListener('compositionstart', onCompositionStart);
        hiddenInput.addEventListener('compositionend', onCompositionEnd);
        hiddenInput.addEventListener('input', onHiddenInput);
        if (typeof options.onHiddenKeyDown === 'function') {
          hiddenInput.addEventListener('keydown', (ev) => {
            if (composing || ev.isComposing || ev.keyCode === 229) return;
            if (handleKeyDownForPasteHold(ev)) return;
            options.onHiddenKeyDown(ev);
          });
        }
        if (typeof options.onHiddenKeyUp === 'function') {
          hiddenInput.addEventListener('keyup', (ev) => {
            if (composing || ev.isComposing) return;
            options.onHiddenKeyUp(ev);
          });
        }
      }

      win?.addEventListener?.('paste', onWindowPaste);

      function focusInteractiveTarget() {
        if (mode === 'compose' && hiddenInput) {
          try {
            hiddenInput.focus?.({ preventScroll: true });
            return;
          } catch {}
        }
        try {
          options.surfaceEl?.focus?.({ preventScroll: true });
        } catch {}
      }

      function setMode(nextMode) {
        mode = nextMode === 'raw' ? 'raw' : 'compose';
        if (options.surfaceEl && typeof options.surfaceEl.setAttribute === 'function') {
          options.surfaceEl.setAttribute('inputmode', mode === 'raw' ? 'none' : 'text');
        }
        if (typeof options.isInteractive === 'function' && options.isInteractive()) {
          focusInteractiveTarget();
        }
        return mode;
      }

      function notifyRemoteClipboard(text) {
        const str = String(text ?? '');
        if (!str) return;
        latestRemoteText = str;
        renderPillIdle();
      }

      function bindToolbarPasteForm(formEl, inputEl, { clearOnSend = true } = {}) {
        if (!formEl || !inputEl || typeof formEl.addEventListener !== 'function') return;
        formEl.addEventListener('submit', (ev) => {
          ev.preventDefault?.();
          const val = String(inputEl.value || '');
          if (!val) return;
          options.onHostPaste?.(val, { source: 'toolbar_box', submit: false });
          if (clearOnSend) inputEl.value = '';
        });
      }

      return {
        getMode: () => mode,
        setMode,
        isComposing: () => composing,
        focusInteractiveTarget,
        handleKeyDownForPasteHold,
        notifyRemoteClipboard,
        getLatestRemoteClipboard: () => latestRemoteText,
        bindToolbarPasteForm,
        getHiddenInput: () => hiddenInput,
        dispose() {
          if (disposed) return;
          disposed = true;
          clearPasteHold();
          if (resetPillTimer) clearTimeout(resetPillTimer);
          win?.removeEventListener?.('paste', onWindowPaste);
          pillEl?.removeEventListener?.('click', onPillClick);
          if (createdHiddenInput) hiddenInput?.remove?.();
        },
      };
    }

    /**
     * Context-aware drag-and-drop file/APK overlay for Kiki remote panels.
     * Enforces Frame Audit Blocker 2:
     * - NEVER multiplexes bulk file bytes onto the interactive video/input stream.
     * - Routes uploads over chunked RPC (`uploadInit` -> `uploadChunk` -> `uploadFinish`)
     *   or a dedicated `'upload'` stream channel.
     */

    const WINDOWS_RESERVED_STEM = /^(con|prn|aux|nul|com[1-9]|lpt[1-9])$/i;
    const DEFAULT_UPLOAD_CHUNK_BYTES = 768 * 1024; // 768 KiB raw (~1 MiB base64, <=130 chunks for 100 MB)

    function sanitizeDropFileName(rawName, index = 0) {
      const base = String(rawName ?? '')
        .replace(/^.*[\\/]/, '')
        .replace(/[\x00-\x1f\x7f<>:"/\\|?*]+/g, '_')
        .replace(/^\.+/, '')
        .trim();
      const fallback = base || `dropped-file-${index + 1}`;
      const dotIdx = fallback.lastIndexOf('.');
      const stem = dotIdx > 0 ? fallback.slice(0, dotIdx) : fallback;
      const ext = dotIdx > 0 ? fallback.slice(dotIdx) : '';
      const safeStem = WINDOWS_RESERVED_STEM.test(stem) ? `_${stem}` : stem;
      return `${safeStem.slice(0, 120)}${ext.slice(0, 24)}`;
    }

    function uint8ToBase64(bytes) {
      if (bytes && typeof bytes.toBase64 === 'function') {
        return bytes.toBase64();
      }
      let binary = '';
      const step = 0x8000;
      for (let i = 0; i < bytes.length; i += step) {
        const slice = bytes.subarray(i, Math.min(bytes.length, i + step));
        binary += String.fromCharCode.apply(null, slice);
      }
      return btoa(binary);
    }

    function attachRemoteDropZone(stageEl, options = {}) {
      if (!stageEl || typeof stageEl.addEventListener !== 'function') {
        throw new Error('attachRemoteDropZone requires a stage element');
      }

      const doc = options.documentObj || (typeof document !== 'undefined' ? document : null);
      const isZh = options.isZh !== undefined
        ? Boolean(options.isZh)
        : /^zh\b/i.test(String(typeof navigator !== 'undefined' ? navigator.language : ''));
      const chunkBytes = Number.isFinite(options.chunkBytes) && options.chunkBytes > 0
        ? Math.floor(options.chunkBytes)
        : DEFAULT_UPLOAD_CHUNK_BYTES;

      let dragDepth = 0;
      let uploading = false;
      let disposed = false;

      let overlayEl = options.overlayEl || null;
      let titleEl = null;
      let subEl = null;
      let createdOverlay = false;

      if (!overlayEl && doc && typeof doc.createElement === 'function') {
        overlayEl = doc.createElement('div');
        overlayEl.className = 'kiki-remote-drop-overlay';
        overlayEl.hidden = true;
        const card = doc.createElement('div');
        card.className = 'kiki-remote-drop-card';
        titleEl = doc.createElement('div');
        titleEl.className = 'kiki-remote-drop-title';
        subEl = doc.createElement('div');
        subEl.className = 'kiki-remote-drop-sub';
        card.append(titleEl, subEl);
        overlayEl.appendChild(card);
        stageEl.appendChild(overlayEl);
        createdOverlay = true;
      }

      function showOverlay(title, subtitle = '') {
        if (!overlayEl) return;
        overlayEl.hidden = false;
        if (titleEl) titleEl.textContent = title;
        if (subEl) subEl.textContent = subtitle;
      }

      function hideOverlay() {
        if (overlayEl) overlayEl.hidden = true;
      }

      function hasFiles(ev) {
        const types = ev?.dataTransfer?.types;
        if (!types) return false;
        for (let i = 0; i < types.length; i += 1) {
          if (types[i] === 'Files') return true;
        }
        return false;
      }

      const onDragEnter = (ev) => {
        if (disposed || uploading || !hasFiles(ev)) return;
        if (typeof options.isEnabled === 'function' && !options.isEnabled()) return;
        ev.preventDefault?.();
        dragDepth += 1;
        showOverlay(
          options.dropTitle || (isZh ? '松开以投送文件至设备' : 'Drop files to send to device'),
          options.dropSubtitle || (isZh ? '.apk 自动安装 · 图片与文件推入 Download 并刷新媒体库' : '.apk installs automatically · files push to Download'),
        );
      };

      const onDragOver = (ev) => {
        if (disposed || uploading || !hasFiles(ev)) return;
        if (typeof options.isEnabled === 'function' && !options.isEnabled()) return;
        ev.preventDefault?.();
        if (ev.dataTransfer) ev.dataTransfer.dropEffect = 'copy';
      };

      const onDragLeave = (ev) => {
        if (disposed || uploading) return;
        ev.preventDefault?.();
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) hideOverlay();
      };

      async function uploadSingleFile(file, idx, total) {
        const safeName = sanitizeDropFileName(file.name, idx);
        const isApk = /\.apk$/i.test(safeName);
        const ab = await file.arrayBuffer();
        const bytes = new Uint8Array(ab);

        if (typeof options.uploadFile === 'function') {
          return options.uploadFile({
            fileName: safeName,
            byteLength: bytes.byteLength,
            isApk,
            bytes,
            chunkBytes,
            uint8ToBase64,
            onProgress(pct) {
              showOverlay(
                isZh ? `正在传输 ${safeName} (${pct}%)` : `Uploading ${safeName} (${pct}%)`,
                `${idx + 1} / ${total}`,
              );
            },
          });
        }

        if (typeof options.callRpc !== 'function') {
          throw new Error('DropZone requires uploadFile or callRpc handler');
        }

        const targetMeta = typeof options.getTargetMeta === 'function' ? options.getTargetMeta() : {};
        const initRes = await options.callRpc('uploadInit', {
          ...targetMeta,
          fileName: safeName,
          byteLength: bytes.byteLength,
          mode: isApk ? 'install_apk' : 'push_file',
        });
        if (!initRes || initRes.ok === false || !initRes.uploadId) {
          throw new Error(initRes?.error || 'Failed to initialize file transfer');
        }

        const uploadId = initRes.uploadId;
        let offset = 0;
        while (offset < bytes.byteLength) {
          const end = Math.min(bytes.byteLength, offset + chunkBytes);
          const chunkB64 = uint8ToBase64(bytes.subarray(offset, end));
          const chunkRes = await options.callRpc('uploadChunk', {
            uploadId,
            offset,
            dataBase64: chunkB64,
          });
          if (!chunkRes || chunkRes.ok === false) {
            throw new Error(chunkRes?.error || 'Chunk upload failed');
          }
          offset = end;
          const pct = bytes.byteLength > 0 ? Math.round((offset / bytes.byteLength) * 100) : 100;
          showOverlay(
            isZh
              ? (pct >= 100 && isApk ? `正在安装 ${safeName}...` : `正在传输 ${safeName} (${pct}%)`)
              : (pct >= 100 && isApk ? `Installing ${safeName}...` : `Sending ${safeName} (${pct}%)`),
            `${idx + 1} / ${total}`,
          );
        }

        const finishRes = await options.callRpc('uploadFinish', {
          ...targetMeta,
          uploadId,
        });
        if (!finishRes || finishRes.ok === false) {
          throw new Error(finishRes?.error || 'File finalize failed');
        }
        return finishRes;
      }

      const onDrop = async (ev) => {
        if (disposed) return;
        ev.preventDefault?.();
        dragDepth = 0;
        if (uploading) return;
        if (typeof options.isEnabled === 'function' && !options.isEnabled()) {
          hideOverlay();
          return;
        }

        const rawFiles = ev?.dataTransfer?.files ? Array.from(ev.dataTransfer.files) : [];
        if (rawFiles.length === 0) {
          hideOverlay();
          return;
        }

        uploading = true;
        const results = [];
        try {
          for (let i = 0; i < rawFiles.length; i += 1) {
            const file = rawFiles[i];
            showOverlay(
              isZh ? `准备传输 ${file.name}...` : `Preparing ${file.name}...`,
              `${i + 1} / ${rawFiles.length}`,
            );
            const res = await uploadSingleFile(file, i, rawFiles.length);
            results.push(res);
          }
          options.onComplete?.(results);
        } catch (err) {
          options.onError?.(err);
        } finally {
          uploading = false;
          hideOverlay();
        }
      };

      stageEl.addEventListener('dragenter', onDragEnter);
      stageEl.addEventListener('dragover', onDragOver);
      stageEl.addEventListener('dragleave', onDragLeave);
      stageEl.addEventListener('drop', onDrop);

      return {
        isUploading: () => uploading,
        sanitizeDropFileName,
        dispose() {
          if (disposed) return;
          disposed = true;
          stageEl.removeEventListener('dragenter', onDragEnter);
          stageEl.removeEventListener('dragover', onDragOver);
          stageEl.removeEventListener('dragleave', onDragLeave);
          stageEl.removeEventListener('drop', onDrop);
          if (createdOverlay) overlayEl?.remove?.();
        },
      };
    }

    /**
     * Per-target Lease & Human Takeover status bar controller for Kiki remote panels.
     * Synchronizes `AI 控制中 · 接管` <-> `人工接管中 · 交还 AI` per target without blocking
     * sibling devices/VMs.
     */

    function createRemoteLeaseBar(options = {}) {
      const win = options.windowObj || (typeof window !== 'undefined' ? window : null);
      const doc = options.documentObj || (typeof document !== 'undefined' ? document : null);
      const buttonEl = options.buttonEl || null;
      const labelEl = options.labelEl || null;
      const dotEl = options.dotEl || null;
      const shortcutKey = String(options.shortcutKey || 'i').toLowerCase();
      const isZh = options.isZh !== undefined
        ? Boolean(options.isZh)
        : /^zh\b/i.test(String(win?.navigator?.language || ''));

      const stateByTarget = new Map();
      let currentTargetKey = options.initialTargetKey || '';
      let online = true;
      let disposed = false;

      function getEntry(targetKey = currentTargetKey) {
        const key = String(targetKey || '');
        if (!key) return { active: false, controlledBy: 'agent', reason: null };
        return stateByTarget.get(key) || { active: false, controlledBy: 'agent', reason: null };
      }

      function formatLabel(active) {
        if (options.labels) {
          return active ? options.labels.active : options.labels.idle;
        }
        if (isZh) {
          return active ? '人工接管中 · 交还 AI' : 'AI 控制中 · 接管';
        }
        return active ? 'Human Takeover · Hand back' : 'AI Ready · Take over';
      }

      function render() {
        const entry = getEntry(currentTargetKey);
        const active = Boolean(entry.active);
        if (buttonEl) {
          buttonEl.disabled = !online || !currentTargetKey;
          buttonEl.classList?.toggle?.('takeover-locked', active);
          buttonEl.classList?.toggle?.('interactive-on', active);
          buttonEl.setAttribute?.('aria-pressed', active ? 'true' : 'false');
        }
        if (labelEl) {
          labelEl.textContent = formatLabel(active);
        }
        if (dotEl) {
          dotEl.className = 'status-dot ' + (!online ? 'warn' : (active ? 'warn' : 'online'));
        }
        options.onRender?.({
          targetKey: currentTargetKey,
          takeoverActive: active,
          controlledBy: active ? 'human' : 'agent',
          online,
        });
      }

      async function setTakeover(nextActive, { targetKey = currentTargetKey, syncBackend = true, reason } = {}) {
        const key = String(targetKey || '');
        if (!key) return { active: false, targetKey: '' };
        const active = Boolean(nextActive);
        stateByTarget.set(key, {
          active,
          controlledBy: active ? 'human' : 'agent',
          reason: reason || null,
        });
        if (key === currentTargetKey) {
          render();
        }
        if (syncBackend && typeof options.onToggleBackend === 'function') {
          const res = await options.onToggleBackend({ targetKey: key, active, reason });
          if (res && typeof res.takeoverActive === 'boolean') {
            stateByTarget.set(key, {
              active: Boolean(res.takeoverActive),
              controlledBy: res.takeoverActive ? 'human' : 'agent',
              reason: res.reason || null,
            });
            if (key === currentTargetKey) render();
          }
        }
        return getEntry(key);
      }

      function syncFromBackend(targetKey, takeoverActive, extra = {}) {
        const key = String(targetKey || currentTargetKey || '');
        if (!key) return;
        stateByTarget.set(key, {
          active: Boolean(takeoverActive),
          controlledBy: takeoverActive ? 'human' : (extra.controlledBy || 'agent'),
          reason: extra.reason || null,
        });
        if (key === currentTargetKey) render();
      }

      function setTarget(targetKey, { isOnline = true, initialActive } = {}) {
        currentTargetKey = String(targetKey || '');
        online = Boolean(isOnline);
        if (currentTargetKey && typeof initialActive === 'boolean' && !stateByTarget.has(currentTargetKey)) {
          stateByTarget.set(currentTargetKey, {
            active: initialActive,
            controlledBy: initialActive ? 'human' : 'agent',
            reason: null,
          });
        }
        render();
      }

      const onButtonClick = () => {
        if (disposed || !online || !currentTargetKey) return;
        const cur = getEntry(currentTargetKey);
        void setTakeover(!cur.active, { targetKey: currentTargetKey, syncBackend: true });
      };

      const onWindowKeyDown = (ev) => {
        if (disposed || !ev || !ev.altKey || ev.ctrlKey || ev.metaKey) return;
        const tag = String(doc?.activeElement?.tagName || '').toUpperCase();
        if (tag === 'INPUT' || tag === 'SELECT') return;
        if (String(ev.key || '').toLowerCase() === shortcutKey) {
          ev.preventDefault?.();
          onButtonClick();
        }
      };

      buttonEl?.addEventListener?.('click', onButtonClick);
      win?.addEventListener?.('keydown', onWindowKeyDown);

      return {
        getTarget: () => currentTargetKey,
        setTarget,
        isTakeoverActive: (targetKey = currentTargetKey) => Boolean(getEntry(targetKey).active),
        setTakeover,
        syncFromBackend,
        render,
        dispose() {
          if (disposed) return;
          disposed = true;
          buttonEl?.removeEventListener?.('click', onButtonClick);
          win?.removeEventListener?.('keydown', onWindowKeyDown);
        },
      };
    }

    /**
     * Crisp nearest-neighbor pixel magnifier (2x-4x, default 3x) for dense 1024x768
     * CAD/PDM and desktop UIs inside narrow Kiki workspace side panels.
     * Activated via toolbar toggle button OR while holding `Alt` / Backquote (`).
     */

    function attachRemoteMagnifier(options = {}) {
      const stageEl = options.stageEl;
      const sourceCanvas = options.sourceCanvas;
      if (!stageEl || !sourceCanvas) {
        throw new Error('attachRemoteMagnifier requires stageEl and sourceCanvas');
      }

      const win = options.windowObj || (typeof window !== 'undefined' ? window : null);
      const doc = options.documentObj || (typeof document !== 'undefined' ? document : null);
      const zoomFactor = Math.min(4, Math.max(2, Number(options.zoomFactor) || 3));
      const lensSize = Number.isFinite(options.lensSize) ? options.lensSize : 168;
      const toggleBtn = options.toggleBtn || null;
      const enableAltHold = options.enableAltHold !== false;
      const enableBackquoteHold = options.enableBackquoteHold !== false;

      let pinned = false;
      let holdActive = false;
      let lastPointer = null;
      let disposed = false;

      let lensEl = options.lensEl || null;
      let lensCanvas = null;
      let lensCtx = null;
      let coordEl = null;
      let createdDom = false;

      if (!lensEl && doc && typeof doc.createElement === 'function') {
        lensEl = doc.createElement('div');
        lensEl.className = 'kiki-remote-magnifier';
        lensEl.hidden = true;
        if (lensEl.style) {
          lensEl.style.width = `${lensSize}px`;
          lensEl.style.height = `${lensSize}px`;
        }

        lensCanvas = doc.createElement('canvas');
        lensCanvas.width = lensSize;
        lensCanvas.height = lensSize;
        lensCanvas.className = 'kiki-remote-magnifier-canvas';
        lensCtx = lensCanvas.getContext?.('2d', { alpha: false }) || null;

        coordEl = doc.createElement('div');
        coordEl.className = 'kiki-remote-magnifier-meta';

        lensEl.append(lensCanvas, coordEl);
        stageEl.appendChild(lensEl);
        createdDom = true;
      }

      function isActive() {
        return pinned || holdActive;
      }

      function syncButtonState() {
        if (!toggleBtn) return;
        const on = isActive();
        toggleBtn.classList?.toggle?.('active', on);
        toggleBtn.setAttribute?.('aria-pressed', on ? 'true' : 'false');
      }

      function hideLens() {
        if (lensEl) lensEl.hidden = true;
      }

      function renderAt(projectedPt, clientEvent) {
        if (!lensEl || !lensCtx || !isActive() || !projectedPt || !projectedPt.inside) {
          hideLens();
          return;
        }
        const srcW = Number(sourceCanvas.width) || 0;
        const srcH = Number(sourceCanvas.height) || 0;
        if (srcW <= 0 || srcH <= 0) {
          hideLens();
          return;
        }

        const stageRect = stageEl.getBoundingClientRect();
        const cx = (Number(clientEvent?.clientX) || 0) - (Number(stageRect?.left) || 0);
        const cy = (Number(clientEvent?.clientY) || 0) - (Number(stageRect?.top) || 0);
        const margin = 10;
        const offset = 22;

        let left = cx + offset;
        let top = cy - lensSize - offset;
        if (left + lensSize + margin > stageRect.width) {
          left = Math.max(margin, cx - lensSize - offset);
        }
        if (top < margin) {
          top = Math.min(Math.max(margin, stageRect.height - lensSize - margin), cy + offset);
        }

        lensEl.hidden = false;
        if (lensEl.style) {
          lensEl.style.left = `${Math.round(left)}px`;
          lensEl.style.top = `${Math.round(top)}px`;
        }

        const sampleW = Math.max(8, Math.round(lensSize / zoomFactor));
        const sampleH = Math.max(8, Math.round(lensSize / zoomFactor));
        const centerSrcX = Math.round(projectedPt.normX * (srcW - 1));
        const centerSrcY = Math.round(projectedPt.normY * (srcH - 1));
        const sx = centerSrcX - Math.floor(sampleW / 2);
        const sy = centerSrcY - Math.floor(sampleH / 2);

        lensCtx.imageSmoothingEnabled = false;
        lensCtx.fillStyle = '#141413';
        lensCtx.fillRect(0, 0, lensSize, lensSize);

        const clampSx = Math.max(0, sx);
        const clampSy = Math.max(0, sy);
        const clampSw = Math.min(srcW - clampSx, sampleW - (clampSx - sx));
        const clampSh = Math.min(srcH - clampSy, sampleH - (clampSy - sy));
        if (clampSw > 0 && clampSh > 0) {
          const dx = (clampSx - sx) * zoomFactor;
          const dy = (clampSy - sy) * zoomFactor;
          const dw = clampSw * zoomFactor;
          const dh = clampSh * zoomFactor;
          lensCtx.drawImage(sourceCanvas, clampSx, clampSy, clampSw, clampSh, dx, dy, dw, dh);
        }

        // Crisp 1px center reticle
        const mid = Math.floor(lensSize / 2) + 0.5;
        lensCtx.strokeStyle = 'rgba(44, 94, 79, 0.92)';
        lensCtx.lineWidth = 1;
        lensCtx.beginPath();
        lensCtx.moveTo(mid - 12, mid);
        lensCtx.lineTo(mid - 3, mid);
        lensCtx.moveTo(mid + 3, mid);
        lensCtx.lineTo(mid + 12, mid);
        lensCtx.moveTo(mid, mid - 12);
        lensCtx.lineTo(mid, mid - 3);
        lensCtx.moveTo(mid, mid + 3);
        lensCtx.lineTo(mid, mid + 12);
        lensCtx.stroke();

        if (coordEl) {
          coordEl.textContent = `${zoomFactor}x · ${projectedPt.targetX}, ${projectedPt.targetY}`;
        }
      }

      function updateFromPointer(projectedPt, ev) {
        if (!projectedPt) {
          lastPointer = null;
          hideLens();
          return;
        }
        lastPointer = { projectedPt, ev };
        renderAt(projectedPt, ev);
      }

      function refresh() {
        if (lastPointer && isActive()) {
          renderAt(lastPointer.projectedPt, lastPointer.ev);
        }
      }

      function setPinned(next) {
        pinned = Boolean(next);
        syncButtonState();
        if (!isActive()) hideLens();
        else refresh();
        options.onToggle?.(isActive());
        return pinned;
      }

      const onToggleClick = () => {
        setPinned(!pinned);
      };

      const isEditable = () => {
        const tag = String(doc?.activeElement?.tagName || '').toUpperCase();
        return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
      };

      const onKeyDown = (ev) => {
        if (disposed || !ev || isEditable()) return;
        if (enableAltHold && ev.key === 'Alt' && !ev.ctrlKey && !ev.metaKey && !holdActive) {
          holdActive = true;
          syncButtonState();
          refresh();
          return;
        }
        if (enableBackquoteHold && ev.code === 'Backquote' && !ev.ctrlKey && !ev.altKey && !ev.metaKey && !holdActive) {
          if (typeof options.allowBackquoteHold === 'function' && !options.allowBackquoteHold()) return;
          holdActive = true;
          syncButtonState();
          refresh();
        }
      };

      const onKeyUp = (ev) => {
        if (disposed || !ev || !holdActive) return;
        if ((enableAltHold && ev.key === 'Alt') || (enableBackquoteHold && ev.code === 'Backquote')) {
          holdActive = false;
          syncButtonState();

    if (gen !== state.streamGeneration || !(arrayBuffer instanceof ArrayBuffer) || arrayBuffer.byteLength <= 16) return;
    const dv = new DataView(arrayBuffer);
    if (dv.getUint8(0) !== FRAME_MAGIC) return;
    const isKey = dv.getUint8(1) === 1;
    const w = dv.getUint16(2, false);
    const h = dv.getUint16(4, false);
    const ptsUs = dv.getFloat64(8, false);
    const nalu = new Uint8Array(arrayBuffer, 16);

    if (w && h) updateScreenDimensions(w, h);
    if (document.hidden) {
      state.waitingForKeyframe = true;
      state.pendingDecodeChunks.length = 0;
      cancelPendingVideoFrame();
      return;
    }

    if (isKey) {
      const detectedCodec = extractAvcCodecFromAnnexB(nalu) || state.configuredCodec || 'avc1.640020';
      const needsConfigure = !state.videoDecoder
        || state.videoDecoder.state !== 'configured'
        || state.configuredCodec !== detectedCodec
        || Boolean(state.configuringDecoderPromise);
      if (needsConfigure) {
        state.pendingDecodeChunks = [{ isKey: true, ptsUs, data: nalu }];
        state.waitingForKeyframe = false;
        void startDecoderConfigure(detectedCodec, gen);
        return;
      }
      state.waitingForKeyframe = false;
    } else if (state.configuringDecoderPromise) {
      if (state.pendingDecodeChunks.length > 0 && state.pendingDecodeChunks.length < 90) {
        state.pendingDecodeChunks.push({ isKey: false, ptsUs, data: nalu });

      return;
    } else if (state.waitingForKeyframe || !state.videoDecoder || state.videoDecoder.state !== 'configured') {
      return;
    } else if (state.videoDecoder.decodeQueueSize > 16) {
      state.waitingForKeyframe = true;
      requestStreamVideoReset();
      return;
    }

    try {
      feedDecoderChunk(state.videoDecoder, { isKey, ptsUs, data: nalu });
    } catch {
      state.waitingForKeyframe = true;
      requestStreamVideoReset();
    }
  }

  function sendStreamTouch(action, buttons, normX, normY, slot = 0) {
