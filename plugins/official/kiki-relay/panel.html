<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Encrypted Relay</title>

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--ink);
  font: 400 13px/1.55 var(--sans);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

.sheet {
  max-width: 760px;
  margin: 0 auto;
  padding: 20px 20px 44px;
}

.masthead {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line-strong);
}

h1 {
  margin: 0;
  font: 400 20px/1.28 var(--display);
}

.lead {
  margin: 10px 0 18px;
  color: var(--ink-soft);
  font-size: 12.5px;
  max-width: 60ch;
}

.bar {
  display: flex;
  gap: 8px;
  align-items: center;
}

input[type="text"], input[type="number"] {
  flex: 1;
  min-width: 0;
  padding: 7px 10px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  font: 400 12px/1.4 var(--mono);
  outline: none;
}

input[type="text"]:focus, input[type="number"]:focus {
  border-color: var(--line-strong);
}

button {
  padding: 6px 11px;
  border-radius: var(--radius);
  border: 1px solid var(--line-strong);
  background: var(--paper);
  color: var(--ink);
  font: 400 12px/1.3 var(--sans);
  cursor: pointer;
}

button:hover:not(:disabled) {
  background: var(--panel);
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

button[aria-pressed="true"] {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent-deep);
}

.box {
  margin-top: 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  divide-y: 1px solid var(--line);
}

.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 12px;
  border-top: 1px solid var(--line);
}

.row:first-child {
  border-top: none;
}

.dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--ink-faint);
}

.dot[data-online="true"] { background: var(--ok); }
.dot[data-slot="error"] { background: var(--danger); }

.meta {
  font: 400 11.5px/1.4 var(--mono);
  color: var(--ink-faint);
  word-break: break-all;
}

.notice {
  margin-top: 10px;
  font-size: 12px;
  color: var(--ink-soft);
}

.notice[data-tone="error"] { color: var(--danger); }
.notice[data-tone="ok"] { color: var(--ok); }

details {
  margin-top: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 12px;
  background: var(--paper);
}

summary {
  cursor: pointer;
  color: var(--ink-soft);
  font-size: 12.5px;
}

  margin: 8px 0 0;
  padding: 9px 10px;
  border-radius: var(--radius);
  background: var(--wash);
  font: 400 11.5px/1.5 var(--mono);
  color: var(--ink-soft);
  overflow-x: auto;
}

  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

  display: grid;
  grid-template-columns: 1fr 110px;
  gap: 8px;
  margin-top: 10px;
}

</head>
<body>
<main class="sheet">
  <header class="masthead">
    <h1 id="title">加密中转</h1>
    <div class="bar">
      <button type="button" id="refreshBtn">测速刷新</button>
      <button type="button" id="langBtn">EN</button>
    </div>
  </header>

  <p class="lead" id="lead">无公网 IP 时通过自建加密中转连接这台 Kiki，内层全程端到端证书固定。</p>

  <form id="addForm" class="bar">
    <input type="text" id="quickInput" spellcheck="false" placeholder="kiki-relay://relay.example.com · https://team.example.com/relays.json">
    <button type="submit" id="addBtn">添加</button>
  </form>

  <p class="notice" id="feedback" hidden></p>

  <div class="box" id="nodesBox" hidden></div>
  <p class="notice" id="emptyHint">尚未配置中转节点。</p>

  <div class="box" id="subsBox" hidden></div>

  <div class="box" id="localServerBox">
    <div class="row">
      <div>
        <div id="localServerTitle">本机中转服务端</div>
        <div class="meta" id="localServerMeta">已停止</div>
      </div>
      <div class="bar">
        <button type="button" id="copyShareBtn" hidden>复制分享串</button>
        <button type="button" id="toggleLocalBtn">启动</button>
      </div>
    </div>
  </div>

  <details id="deployDetails">
    <summary id="deploySummary">自建部署与反代配置生成</summary>
    <div class="grid-two">
      <input type="text" id="deployHost" value="relay.example.com" spellcheck="false" aria-label="Public host">
      <input type="number" id="deployPort" value="9440" min="1" max="65535" aria-label="Port">
    </div>
    <div class="pills" id="proxyPills">
      <button type="button" data-proxy="caddy" aria-pressed="true">Caddy</button>
      <button type="button" data-proxy="nginx" aria-pressed="false">Nginx</button>
      <button type="button" data-proxy="openresty" aria-pressed="false">OpenResty</button>
      <button type="button" data-proxy="cloudflare" aria-pressed="false">Cloudflare</button>
    </div>
    <pre id="dockerCode"></pre>
    <div class="bar" style="margin-top:6px"><button type="button" id="copyDockerBtn">复制 Docker 命令</button></div>
    <pre id="proxyCode"></pre>
    <div class="bar" style="margin-top:6px"><button type="button" id="copyProxyBtn">复制反代配置</button></div>
  </details>
</main>

      installPrerequisite: (prerequisiteId, consent = true, opts = {}) =>
        request('plugin.installPrerequisite', { prerequisiteId, consent }, opts),
      sendSessionMessage: (text, sessionId, opts = {}) =>
        request('session.sendMessage', { ...(sessionId ? { sessionId } : {}), text }, opts),
      openStream: (stream, args = {}, opts = {}) =>
        request('plugin.openStream', { stream, args }, { timeoutMs: 4000, ...opts, withPort: true }),
      isReady: () => ready,
      isVisible: () => visible,
      isStandalone,
      getOrigin: () => parentOrigin,
      pendingCount: () => pending.size,
      dispose,
    };
  }

  async function openManagedStream(client, stream, args = {}, handlers = {}) {
    const { result, port } = await client.openStream(stream, args, handlers.openOpts || {});
    if (!port) {
      throw new Error('Host did not transfer a stream port');
    }

    let closed = false;
    const close = (notifyHost = true) => {
      if (closed) return;
      closed = true;
      try {
        if (notifyHost && typeof port.postMessage === 'function') {
          port.postMessage({ __kikiStreamControl: 'close' });
        }
      } catch {}
      try {
        port.onmessage = null;
        port.onmessageerror = null;
        if (typeof port.close === 'function') port.close();
      } catch {}
    };

    port.onmessage = (event) => {
      const data = event ? event.data : undefined;
      if (data && typeof data === 'object' && data.__kikiStreamEvent === 'close') {
        close(false);
        if (typeof handlers.onClose === 'function') {
          handlers.onClose(data.reason || 'closed');
        }
        return;
      }
      if (typeof handlers.onMessage === 'function') {
        handlers.onMessage(data, event);
      }
    };

    port.onmessageerror = (event) => {
      if (typeof handlers.onError === 'function') {
        handlers.onError(event);
      }
    };

    return { port, result, close };
  }

  return {
    createSafeStorage,
    safeStorage,
    copyTextSafe,
    randomId,
    applyThemeName,
    initThemeFromUrl,
    applyPresentation,
    PANEL_CHANNEL,
    DEFAULT_RPC_TIMEOUT_MS,
    createPanelClient,
    openManagedStream,
  };
})();
/* @kiki-panel-kit:runtime:end */

const { safeStorage, copyTextSafe, initThemeFromUrl, applyPresentation, createPanelClient } = KikiPanelKit;
initThemeFromUrl();

const I18N = {
  zh: {
    title: '加密中转',
    langBtn: 'EN',
    refresh: '测速刷新',
    lead: '无公网 IP 时通过自建加密中转连接这台 Kiki，内层全程端到端证书固定。',
    add: '添加',
    empty: '尚未配置中转节点。粘贴 kiki-relay:// 分享串或 relays.json 订阅链接即可启用。',
    home: '主节点',
    standby: '热备',
    backup: '仅备份',
    auto: '自动',
    remove: '移除',
    localTitle: '本机中转服务端',
    stopped: '已停止',
    start: '启动',
    stop: '停止',
    copyShare: '复制分享串',
    copied: '已复制',
    deploySummary: '自建部署与反代配置生成',
    copyDocker: '复制 Docker 命令',
    copyProxy: '复制反代配置',
  },
  en: {
    title: 'Encrypted Relay',
    langBtn: '中文',
    refresh: 'Probe latency',
    lead: 'Reach this Kiki without a public IP through self-hosted encrypted relays with end-to-end TLS pinning.',
    add: 'Add',
    empty: 'No relay nodes configured. Paste a kiki-relay:// share link or relays.json URL above.',
    home: 'Home',
    standby: 'Standby',
    backup: 'Backup only',
    auto: 'Auto',
    remove: 'Remove',
    localTitle: 'Embedded relay server',
    stopped: 'Stopped',
    start: 'Start',
    stop: 'Stop',
    copyShare: 'Copy share URI',
    copied: 'Copied',
    deploySummary: 'Self-host & reverse-proxy generator',
    copyDocker: 'Copy Docker command',
    copyProxy: 'Copy proxy config',
  },
};

let lang = safeStorage.get('relay.lang') || 'zh';
let t = I18N[lang] || I18N.zh;
let currentStatus = null;
let currentGuide = null;
let selectedProxy = 'caddy';

const $ = (id) => document.getElementById(id);

function setNotice(text, tone = '') {
  const el = $('feedback');
  if (!text) {
    el.hidden = true;
    el.textContent = '';
    return;
  }
  el.hidden = false;
  el.dataset.tone = tone;
  el.textContent = text;
}

function applyStrings() {
  t = I18N[lang] || I18N.zh;
  $('title').textContent = t.title;
  $('langBtn').textContent = t.langBtn;
  $('refreshBtn').textContent = t.refresh;
  $('lead').textContent = t.lead;
  $('addBtn').textContent = t.add;
  $('emptyHint').textContent = t.empty;
  $('localServerTitle').textContent = t.localTitle;
  $('copyShareBtn').textContent = t.copyShare;
  $('deploySummary').textContent = t.deploySummary;
  $('copyDockerBtn').textContent = t.copyDocker;
  $('copyProxyBtn').textContent = t.copyProxy;
}

function renderStatus(status) {
  currentStatus = status;
  if (!status) return;
  const nodes = Array.isArray(status.nodes) ? status.nodes : [];
  const subs = Array.isArray(status.subscriptions) ? status.subscriptions : [];
  $('emptyHint').hidden = nodes.length > 0 || subs.length > 0;

  const nodesBox = $('nodesBox');
  nodesBox.replaceChildren();
  nodesBox.hidden = nodes.length === 0;
  for (const node of nodes) {
    const row = document.createElement('div');
    row.className = 'row';
    const left = document.createElement('div');
    const titleLine = document.createElement('div');
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.dataset.online = String(Boolean(node.connected));
    dot.dataset.slot = node.slot || '';
    const slotText = node.slot === 'home' ? t.home : node.slot === 'standby' ? t.standby : (node.role === 'backup-only' ? t.backup : t.auto);
    const rttText = typeof node.rttMs === 'number' ? ` · ${node.rttMs} ms` : '';
    titleLine.append(dot, document.createTextNode(` ${node.label}${rttText} · ${slotText}`));
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = node.url + (node.lastError ? ` (${node.lastError})` : '');
    left.append(titleLine, meta);

    const actions = document.createElement('div');
    actions.className = 'bar';
    if (!node.subscriptionId) {
      const rmBtn = document.createElement('button');
      rmBtn.type = 'button';
      rmBtn.textContent = t.remove;
      rmBtn.onclick = async () => {
        try { renderStatus(await bridge.call('removeNode', { id: node.id })); }
        catch (err) { setNotice(err?.message || 'Error', 'error'); }
      };
      actions.append(rmBtn);
    }
    row.append(left, actions);
    nodesBox.append(row);
  }

  const subsBox = $('subsBox');
  subsBox.replaceChildren();
  subsBox.hidden = subs.length === 0;
  for (const sub of subs) {
    const row = document.createElement('div');
    row.className = 'row';
    const left = document.createElement('div');
    left.textContent = sub.label || sub.url;
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = sub.url;
    left.append(meta);
    const actions = document.createElement('div');
    actions.className = 'bar';
    const rmBtn = document.createElement('button');
    rmBtn.type = 'button';
    rmBtn.textContent = t.remove;
    rmBtn.onclick = async () => {
      try { renderStatus(await bridge.call('removeSubscription', { id: sub.id })); }
      catch (err) { setNotice(err?.message || 'Error', 'error'); }
    };
    actions.append(rmBtn);
    row.append(left, actions);
    subsBox.append(row);
  }

  const ls = status.localServer || { state: 'stopped' };
  const running = ls.state === 'running';
  $('localServerMeta').textContent = running ? (ls.shareUri || `127.0.0.1:${ls.port}`) : (ls.error || t.stopped);
  $('toggleLocalBtn').textContent = running ? t.stop : t.start;
  $('copyShareBtn').hidden = !running || !ls.shareUri;
}

async function refreshGuide() {
  if (!bridge.isReady()) return;
  try {
    currentGuide = await bridge.call('deployGuide', {
      publicHost: $('deployHost').value.trim() || 'relay.example.com',
      port: Number($('deployPort').value) || 9440,
      proxyTarget: selectedProxy,
    });
    $('dockerCode').textContent = currentGuide.dockerCommand;
    $('proxyCode').textContent = currentGuide.proxySnippet;
  } catch {}
}

const bridge = createPanelClient({
  defaultTimeoutMs: 20000,
  autoApplyPresentation: false,
  onPresentation: (pres) => {
    applyPresentation(pres, {
      onLocale: (locale) => {
        if (!safeStorage.get('relay.lang')) {
          lang = String(locale).toLowerCase().startsWith('zh') ? 'zh' : 'en';
          applyStrings();
        }
      },
    });
  },
  onInit: async (data) => {
    applyPresentation(data.presentation, {
      fallbackTheme: data.theme,
      onLocale: (locale) => {
        if (!safeStorage.get('relay.lang')) {
          lang = String(locale).toLowerCase().startsWith('zh') ? 'zh' : 'en';
        }
      },
    });
    applyStrings();
    try {
      renderStatus(await bridge.call('status'));
      await refreshGuide();
    } catch (err) {
      setNotice(err?.message || 'Error', 'error');
    }
  },
});

$('langBtn').onclick = () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  safeStorage.set('relay.lang', lang);
  applyStrings();
  renderStatus(currentStatus);
};

$('refreshBtn').onclick = async () => {
  setNotice('');
  try {
    const st = await bridge.call('status');
    for (const node of st.nodes || []) {
      if (node.enabled) await bridge.call('probe', { url: node.url });
    }
    renderStatus(await bridge.call('status'));
  } catch (err) {
    setNotice(err?.message || 'Error', 'error');
  }
};

$('addForm').onsubmit = async (ev) => {
  ev.preventDefault();
  const val = $('quickInput').value.trim();
  if (!val) return;
  setNotice('');
  try {
    let next;
    if (/^kiki-relay:\/\//i.test(val)) {
      next = await bridge.call('addNode', { uri: val });
    } else if (/^https?:\/\//i.test(val) && /\.json(?:\?|$)/i.test(val)) {
      next = await bridge.call('addSubscription', { url: val });
    } else {
      next = await bridge.call('addNode', { url: val });
    }
    $('quickInput').value = '';
    renderStatus(next);
  } catch (err) {
    setNotice(err?.message || 'Error', 'error');
  }
};

$('toggleLocalBtn').onclick = async () => {
  setNotice('');
  try {
    const running = currentStatus?.localServer?.state === 'running';
    renderStatus(await bridge.call(running ? 'stopLocalServer' : 'startLocalServer'));
  } catch (err) {
    setNotice(err?.message || 'Error', 'error');
  }
};

$('copyShareBtn').onclick = () => {
  const uri = currentStatus?.localServer?.shareUri;
  if (uri) void copyTextSafe(uri, { button: $('copyShareBtn'), copiedLabel: t.copied, resetMs: 1200 });
};

$('copyDockerBtn').onclick = () => {
  if (currentGuide?.dockerCommand) void copyTextSafe(currentGuide.dockerCommand, { button: $('copyDockerBtn'), copiedLabel: t.copied, resetMs: 1200 });
};

$('copyProxyBtn').onclick = () => {
  if (currentGuide?.proxySnippet) void copyTextSafe(currentGuide.proxySnippet, { button: $('copyProxyBtn'), copiedLabel: t.copied, resetMs: 1200 });
};

$('deployHost').onchange = () => void refreshGuide();
$('deployPort').onchange = () => void refreshGuide();

for (const btn of document.querySelectorAll('#proxyPills button')) {
  btn.onclick = () => {
    selectedProxy = btn.dataset.proxy || 'caddy';
    for (const b of document.querySelectorAll('#proxyPills button')) {
      b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
    }
    void refreshGuide();
  };
}

window.addEventListener('pagehide', () => bridge.dispose());
applyStrings();
})();
</script>
</body>
</html>
