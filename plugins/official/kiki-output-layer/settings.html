<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>输出层设置</title>
<style>
:root{color-scheme:light;--paper:#fbfaf6;--ink:#1b1a17;--soft:#665e54;--line:#e4ddd0;--accent:#c8401a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 'Instrument Sans', 'Segoe UI','Microsoft YaHei',sans-serif}main{max-width:680px;padding:8px 4px 24px}h2{font-size:16px;margin:0 0 16px}label{display:block;margin:12px 0 4px}input,select,textarea,button{font:inherit;color:inherit}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px;background:transparent}textarea{min-height:112px;resize:vertical}input:focus,select:focus,textarea:focus{outline:1px solid var(--accent)}button{border:1px solid var(--line);border-radius:7px;padding:6px 12px;background:transparent;cursor:pointer}button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}.row{display:flex;gap:8px;align-items:center}.row select{flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}section+section{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}footer{display:flex;gap:12px;align-items:center;margin-top:24px}#status{color:var(--soft)}#status.error{color:#b0261e}details{margin-top:16px}summary{cursor:pointer;color:var(--soft)}@media(max-width:420px){.grid{grid-template-columns:1fr}.row{flex-wrap:wrap}}
</style></head><body><main>
<section><h2>输出预设</h2><div class="row"><select id="preset" aria-label="输出预设"></select><button id="remove" type="button">删除</button></div><label for="template">新增预设</label><div class="row"><select id="template" aria-label="内置模板"></select><button id="add" type="button">添加</button></div>
<label for="label">名称</label><input id="label" required>
<label for="instruction">提示词</label><textarea id="instruction" required></textarea>
<label for="modelId">Kiki 模型（留空不处理）</label><input id="modelId" autocomplete="off" list="models"><datalist id="models"></datalist><datalist id="connections"></datalist>
<details><summary>已有连接上的自定义模型</summary><div class="grid"><div><label for="connectionId">连接 ID</label><input id="connectionId" autocomplete="off" list="connections"></div><div><label for="customModelId">自定义模型 ID</label><input id="customModelId" autocomplete="off"></div></div><label for="contextWindow">模型窗口 tokens</label><input id="contextWindow" type="number" min="1024"></details>
<label for="maxOutputTokens">每组最大输出 tokens（留空不限制）</label><input id="maxOutputTokens" type="number" min="1">
</section><section><h2>阅读与历史</h2><div class="grid"><div><label for="groupChars">每组 Unicode 字符</label><input id="groupChars" type="number" min="80" max="10000"></div><div><label for="historyTokens">历史 tokens（0 关闭）</label><input id="historyTokens" type="number" min="0" max="1048576"></div><div><label for="preloadBefore">向前预加载组数</label><input id="preloadBefore" type="number" min="0" max="20"></div><div><label for="preloadAfter">向后预加载组数</label><input id="preloadAfter" type="number" min="0" max="20"></div></div></section>
<footer><button id="save" class="primary" type="button">保存</button><span id="status" role="status">正在加载…</span></footer>
</main><script type="module">
const channel='kiki.panel.v1', waiting=new Map(); let next=0, config, selected=0, started=false;
const $=id=>document.getElementById(id), fields=['label','instruction','modelId','connectionId','customModelId','contextWindow','maxOutputTokens'], numbers=['contextWindow','maxOutputTokens'], settings=['groupChars','historyTokens','preloadBefore','preloadAfter'];
function ask(method,extra={}){const id=++next;return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{waiting.delete(id);reject(new Error('请求超时，请重试'));},10000);waiting.set(id,{resolve:value=>{clearTimeout(timer);resolve(value)},reject:error=>{clearTimeout(timer);reject(error)}});parent.postMessage({channel,kind:'request',id,method,...extra},'*')})}
function status(text,error=false){$('status').textContent=text;$('status').className=error?'error':''}
function collect(){if(!config?.presets[selected])return;const preset=config.presets[selected];for(const key of fields){const value=String($(key).value).trim();if(!value)delete preset[key];else if(numbers.includes(key)){if(!$(key).checkValidity())throw new Error('请检查模型窗口和输出上限');preset[key]=Number(value)}else preset[key]=value}}
function render(){const picker=$('preset');picker.replaceChildren();config.presets.forEach((preset,index)=>{const option=document.createElement('option');option.value=String(index);option.textContent=preset.label;picker.append(option)});picker.value=String(selected);const preset=config.presets[selected];for(const key of fields){$(key).value=preset?.[key]??'';$(key).disabled=!preset}for(const key of settings)$(key).value=config.settings[key];$('remove').disabled=!preset}
async function boot(){try{const [prepared,catalog]=await Promise.all([ask('plugin.call',{action:'configuration',args:{}}),ask('plugin.models.list')]);config=prepared;for(const preset of config.templates??[]){const option=document.createElement('option');option.value=preset.id;option.textContent=preset.label;$('template').append(option)}for(const [id,items] of [['models',catalog.models],['connections',catalog.connections]]){for(const item of items){const option=document.createElement('option');option.value=item.id;option.textContent=item.display_name||item.type||item.id;$(id).append(option)}}render();status('')}catch(error){status(error.message,true)}}
$('preset').onchange=()=>{collect();selected=Number($('preset').value);render()};
$('add').onclick=()=>{collect();const template=config.templates?.find(preset=>preset.id===$('template').value);if(!template)return;config.presets.push({...structuredClone(template),id:crypto.randomUUID()});selected=config.presets.length-1;render();status('未保存');$('label').focus()};
$('remove').onclick=()=>{config.presets.splice(selected,1);selected=Math.max(0,selected-1);render();status('未保存')};
$('save').onclick=async()=>{try{collect();for(const key of settings){const field=$(key);if(!field.checkValidity())throw new Error('请检查阅读与历史的数值');config.settings[key]=Number(field.value)}if(config.presets.some(preset=>!preset.label?.trim()||!preset.instruction?.trim()))throw new Error('请填写预设名称和提示词');$('save').disabled=true;await ask('plugin.settings.patch',{values:{presets:JSON.stringify(config.presets),...config.settings}});render();status('已保存')}catch(error){status(error.message,true)}finally{$('save').disabled=false}};
document.querySelector('main').addEventListener('input',()=>{status('未保存')});
window.addEventListener('message',event=>{if(event.source!==parent||event.data?.channel!==channel)return;const data=event.data;if(data.kind==='init'&&!started){started=true;void boot()}if(data.kind==='response'){const item=waiting.get(data.id);if(!item)return;waiting.delete(data.id);data.ok?item.resolve(data.result):item.reject(new Error(data.error||'请求失败'))}});
</script></body></html>
