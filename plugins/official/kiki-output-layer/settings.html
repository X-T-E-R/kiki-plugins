<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Output Layer</title>
<style>
  :root {
    color-scheme: light dark;
    font-synthesis: none;
    --bg: #f6f4ef;
    --paper: #fcfbf8;
    --panel: #efece4;
    --ink: #1b1a17;
    --ink-soft: #5c5850;
    --ink-faint: #8c867b;
    --line: rgba(27, 26, 23, 0.10);
    --line-strong: rgba(27, 26, 23, 0.20);
    --accent: #2c5e4f;
    --accent-soft: rgba(44, 94, 79, 0.11);
    --accent-ink: #fcfbf8;
    --danger: #a1352b;
    --selected: rgba(44, 94, 79, 0.12);
    --selected-ink: #2c5e4f;
    --sans: 'Instrument Sans', ui-sans-serif, system-ui, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413;
      --paper: #1c1b19;
      --panel: #252320;
      --ink: #edeae2;
      --ink-soft: #b2aca0;
      --ink-faint: #7b766c;
      --line: rgba(237, 234, 226, 0.10);
      --line-strong: rgba(237, 234, 226, 0.22);
      --accent: #58a88f;
      --accent-soft: rgba(88, 168, 143, 0.15);
      --accent-ink: #141413;
      --danger: #e28379;
      --selected: rgba(88, 168, 143, 0.16);
      --selected-ink: #58a88f;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #141413;
    --paper: #1c1b19;
    --panel: #252320;
    --ink: #edeae2;
    --ink-soft: #b2aca0;
    --ink-faint: #7b766c;
    --line: rgba(237, 234, 226, 0.10);
    --line-strong: rgba(237, 234, 226, 0.22);
    --accent: #58a88f;
    --accent-soft: rgba(88, 168, 143, 0.15);
    --accent-ink: #141413;
    --danger: #e28379;
    --selected: rgba(88, 168, 143, 0.16);
    --selected-ink: #58a88f;
  }
  :root[data-theme="light"] { color-scheme: light; }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { margin: 0; scroll-padding-bottom: 72px; }
  body {
    margin: 0;
    overflow-x: clip;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.52 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 720px; margin: 0 auto; padding: 14px 16px 28px; min-width: 0; }
  fieldset { padding: 0; margin: 0; border: 0; min-width: 0; }
  fieldset:disabled { opacity: 0.58; }

  .group-block {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
    min-width: 0;
  }
  .group-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }
  .group-label {
    margin: 0;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--ink-faint);
  }

  button, input, select, textarea { font: inherit; color: inherit; max-width: 100%; }
  input, select, textarea, .picker-trigger {
    width: 100%;
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 7px 10px;
    min-height: 34px;
    background: var(--bg);
    outline: none;
    transition: border-color 140ms ease, background-color 140ms ease;
  }
  input:hover, select:hover, textarea:hover, .picker-trigger:hover:not(:disabled) {
    border-color: var(--line-strong);
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
  }
  select {
    appearance: none;
    padding-right: 28px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2.5 4.5 6 8l3.5-3.5' fill='none' stroke='%238c867b' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 9px center;
    background-size: 11px;
  }
  textarea { resize: vertical; min-height: 132px; line-height: 1.62; }
  input[type="number"], #customModelId {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }

  button {
    min-height: 34px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;
    transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
  }
  button:hover:not(:disabled) {
    border-color: var(--line-strong);
    color: var(--ink);
    background: var(--panel);
  }
  button:disabled { opacity: 0.48; cursor: not-allowed; }
  button.primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
    font-weight: 600;
  }
  button.primary:hover:not(:disabled) {
    opacity: 0.92;
    background: var(--accent);
    color: var(--accent-ink);
  }
  button.danger { color: var(--danger); }
  button.danger:hover:not(:disabled) { border-color: var(--danger); }
  button.quiet { border-color: transparent; background: transparent; color: var(--ink-faint); padding: 0 8px; }
  button.quiet:hover:not(:disabled) { background: var(--panel); color: var(--ink); border-color: transparent; }
  button.quiet.danger { color: var(--danger); }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible {
    outline: 2px solid var(--selected-ink);
    outline-offset: 2px;
  }

  .field { margin-bottom: 14px; min-width: 0; }
  .field:last-child { margin-bottom: 0; }
  label { display: block; margin-bottom: 5px; color: var(--ink-soft); font-size: 12px; font-weight: 500; }
  .label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 5px;
  }
  .label-row label { margin-bottom: 0; }
  .row { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
  .row select, .row input { flex: 1 1 160px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); gap: 12px 14px; }
  .grid .field { margin-bottom: 0; }
  .hint { margin: 5px 0 0; font-size: 12px; color: var(--ink-faint); line-height: 1.45; }
  .error { color: var(--danger); font-size: 12px; }

  /* Model combobox */
  .picker-trigger {
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-align: left;
    gap: 10px;
    min-height: 36px;
    color: var(--ink);
  }
  .picker-trigger span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .picker {
    margin-top: 6px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--paper);
    padding: 6px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  }
  #model-search { margin-bottom: 6px; }
  #model-options {
    max-height: 210px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  button.option {
    width: 100%;
    justify-content: space-between;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--ink);
    padding: 6px 9px;
    min-height: 32px;
    text-align: left;
    font-size: 12.5px;
  }
  button.option small {
    color: var(--ink-faint);
    font-family: var(--mono);
    font-size: 11px;
    margin-left: 8px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  button.option.active, button.option:hover:not(:disabled) {
    background: var(--selected);
    color: var(--ink);
  }
  button.option[aria-selected="true"] {
    font-weight: 600;
    color: var(--selected-ink);
  }

  /* Live Output Rule & Chunk Preview */
  .rule-preview {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 11px 12px;
    margin-top: 14px;
    display: grid;
    gap: 8px;
  }
  .rule-summary {
    font-size: 12px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    line-height: 1.45;
  }
  .chunk-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .chunk-pill {
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--paper);
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }

  /* Collapsible secondary & advanced disclosures */
  details {
    border-top: 1px solid var(--line);
    padding-top: 12px;
    margin-top: 12px;
  }
  details.top-disclosure {
    border-top: 0;
    padding-top: 0;
    margin-top: 0;
  }
  summary {
    cursor: pointer;
    list-style: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--ink-soft);
    padding: 2px 0;
    font-size: 12px;
    font-weight: 500;
    user-select: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before {
    content: '';
    width: 6px;
    height: 6px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: rotate(-45deg);
    transition: transform 140ms ease;
  }
  details[open] > summary::before { transform: rotate(45deg); }
  details[open] > summary { margin-bottom: 12px; color: var(--ink); }

  /* Sticky dirty dock footer */
  footer#footer {
    position: sticky;
    bottom: 0;
    margin-top: 14px;
    padding: 10px 12px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  footer#footer[data-dirty="true"] {
    border-color: var(--line-strong);
    background: var(--panel);
  }
  #status {
    font-size: 12px;
    color: var(--ink-soft);
    margin-right: auto;
  }
  #status.ok { color: var(--accent); font-weight: 500; }
  #status.error { color: var(--danger); }
  .kbd-hint {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    padding: 1px 5px;
    border: 1px solid var(--line);
    border-radius: 4px;
  }

  dialog {
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    background: var(--paper);
    color: var(--ink);
    padding: 18px 20px;
    max-width: 360px;
    width: calc(100% - 32px);
  }
  dialog::backdrop { background: rgba(20, 20, 19, 0.38); }
  dialog h2 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
  dialog p { margin: 0 0 16px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }

  @media (max-width: 480px) {
    main { padding: 10px 10px 24px; }
    .group-block { padding: 12px; }
  }
  @media (pointer: coarse) {
    button, input, select, .picker-trigger { min-height: 42px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <div id="load-error" class="row" hidden role="alert" style="margin-bottom: 12px;">
    <span id="load-message" class="error"></span>
    <button id="retry" data-copy="retry" type="button">重试</button>
  </div>
  <p id="loading" role="status" data-copy="loading" class="hint">正在加载…</p>

  <fieldset id="editor" disabled hidden>
    <!-- Group 1: Core Connection & Preset Selection -->
    <div class="group-block">
      <div class="group-head">
        <h2 class="group-label" data-copy="groupCore">核心连接与路由</h2>
      </div>

      <div class="field">
        <label for="preset" data-copy="preset">输出预设</label>
        <div class="row">
          <select id="preset"></select>
          <button id="remove" class="quiet danger" data-copy="remove" type="button">删除</button>
        </div>
      </div>

      <details id="add-details">
        <summary data-copy="addPreset">从内置模板添加预设</summary>
        <div class="field">
          <label for="template" data-copy="template">内置模板</label>
          <div class="row">
            <select id="template"></select>
            <button id="add" data-copy="add" type="button">添加</button>
          </div>
        </div>
      </details>

      <p id="empty" class="hint" hidden data-copy="empty">还没有预设。从上方模板添加一个。</p>

      <div id="preset-core" style="margin-top: 14px;">
        <div class="field">
          <label for="model-picker" data-copy="model">处理模型</label>
          <button id="model-picker" class="picker-trigger" aria-haspopup="listbox" aria-expanded="false" type="button">
            <span id="model-name"></span>
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2.5 4.5 6 8l3.5-3.5"></path>
            </svg>
          </button>
          <div id="model-list" class="picker" hidden>
            <input id="model-search" role="combobox" aria-controls="model-options" aria-expanded="true" autocomplete="off">
            <div id="model-options" role="listbox"></div>
          </div>
          <div id="catalog-error" class="row" hidden style="margin-top: 6px;">
            <span id="catalog-message" class="error"></span>
            <button id="retry-models" data-copy="retry" type="button">重试</button>
          </div>
          <p id="model-hint" class="hint"></p>
        </div>

        <div id="custom-fields" hidden class="grid" style="margin-top: 12px;">
          <div class="field">
            <label for="connectionId" data-copy="connection">已有连接</label>
            <select id="connectionId"></select>
          </div>
          <div class="field">
            <div class="label-row">
              <label for="customModelId" data-copy="customModel">自定义模型 ID</label>
              <button id="clear-custom-model" class="quiet" type="button" data-copy="clearField" style="min-height: 22px; font-size: 11px;">清空</button>
            </div>
            <input id="customModelId" autocomplete="off">
          </div>
        </div>
      </div>
    </div>

    <!-- Group 2: Default Preset Strategy & Live Rule Preview -->
    <div id="preset-fields" class="group-block">
      <div class="group-head">
        <h2 class="group-label" data-copy="groupStrategy">默认改写策略与实时预览</h2>
      </div>

      <details id="prompt-details" class="top-disclosure" open>
        <summary data-copy="promptDetails">名称与提示词</summary>
        <div class="field">
          <label for="label" data-copy="name">名称</label>
          <input id="label" required>
        </div>
        <div class="field">
          <div class="label-row">
            <label for="instruction" data-copy="instruction">提示词</label>
            <button id="copy-prompt" class="quiet" type="button" data-copy="copyPrompt" style="min-height: 24px; font-size: 11.5px;">复制提示词</button>
          </div>
          <textarea id="instruction" required></textarea>
        </div>
      </details>

      <div class="rule-preview" id="rule-preview">
        <div id="rule-summary" class="rule-summary"></div>
        <div id="chunk-strip" class="chunk-strip"></div>
      </div>
    </div>

    <!-- Group 3: Advanced Parameters (Collapsed on Demand) -->
    <div class="group-block">
      <div class="group-head" style="margin-bottom: 0;">
        <h2 class="group-label" data-copy="groupAdvanced">高级参数</h2>
      </div>

      <details id="preset-advanced">
        <summary data-copy="advanced">模型高级设置</summary>
        <div class="grid">
          <div class="field">
            <label for="maxOutputTokens" data-copy="maxOutput">每组输出上限（tokens）</label>
            <input id="maxOutputTokens" type="number" min="1" step="1" data-placeholder="unlimited">
          </div>
          <div class="field">
            <label for="contextWindow" data-copy="contextWindow">模型窗口（tokens）</label>
            <input id="contextWindow" type="number" min="1" step="1">
          </div>
        </div>
      </details>

      <details id="reading-details">
        <summary data-copy="reading">流式分组与历史窗口</summary>
        <div class="grid">
          <div class="field">
            <label for="groupChars" data-copy="groupChars">每组字符数</label>
            <input id="groupChars" type="number" min="80" max="10000" step="1" required>
          </div>
          <div class="field">
            <label for="historyTokens" data-copy="historyTokens">历史 tokens（0 关闭）</label>
            <input id="historyTokens" type="number" min="0" max="1048576" step="1" required>
          </div>
          <div class="field">
            <label for="preloadBefore" data-copy="preloadBefore">向前预加载组数</label>
            <input id="preloadBefore" type="number" min="0" max="20" step="1" required>
          </div>
          <div class="field">
            <label for="preloadAfter" data-copy="preloadAfter">向后预加载组数</label>
            <input id="preloadAfter" type="number" min="0" max="20" step="1" required>
          </div>
        </div>
      </details>
    </div>
  </fieldset>

  <footer id="footer" hidden>
    <span id="status" role="status" aria-live="polite"></span>
    <span id="dirty-kbd" class="kbd-hint" hidden aria-hidden="true">Ctrl+S</span>
    <button id="discard" type="button" data-copy="discard" hidden>重置更改</button>
    <button id="save" class="primary" data-copy="save" type="button" disabled>保存</button>
  </footer>
</main>

<dialog id="remove-dialog" aria-labelledby="remove-title">
  <h2 id="remove-title" data-copy="removeTitle">删除预设？</h2>
  <p id="remove-body"></p>
  <div class="dialog-actions">
    <button id="cancel-remove" type="button" data-copy="cancel">取消</button>
    <button id="confirm-remove" class="danger" type="button" data-copy="remove">删除</button>
  </div>
</dialog>

<script type="module">
/* @kiki-panel-kit:runtime:start */
// GENERATED from shared/panel-kit/{storage,theme,rpc}.mjs — run `npm run sync:panels`; do not edit this block.
const KikiPanelKit = (() => {
  /**
   * Opaque ('null'-origin) sandbox-safe storage, clipboard copy, and ID helpers
   * for Kiki plugin panels running inside <iframe sandbox="allow-scripts">.
   */

  function createSafeStorage(targetWindow) {
    const mem = new Map();
    const resolveStorage = () => {
      const win = targetWindow !== undefined ? targetWindow : (typeof window !== 'undefined' ? window : null);
      if (!win) return null;
      try {
        return win.localStorage || null;
      } catch {
        return null;
      }
    };
    return {
      get(key) {
        const k = String(key);
        try {
          const s = resolveStorage();
          if (s) {
            const v = s.getItem(k);
            if (v !== null) return v;
          }
        } catch {}
        return mem.has(k) ? mem.get(k) : null;
      },
      set(key, value) {
        const k = String(key);
        const str = String(value);
        mem.set(k, str);
        try {
          const s = resolveStorage();
          if (s) s.setItem(k, str);
        } catch {}
      },
      remove(key) {
        const k = String(key);
        mem.delete(k);
        try {
          const s = resolveStorage();
          if (s) s.removeItem(k);
        } catch {}
      },
    };
  }

  const safeStorage = createSafeStorage();

  async function copyTextSafe(text, options = {}) {
    const str = String(text ?? '');
    const feedbackEl = options.labelEl || options.button || null;
    const copiedLabel = typeof options.copiedLabel === 'string' ? options.copiedLabel : '';
    const resetMs = Number.isFinite(options.resetMs) ? options.resetMs : 1200;
    const markCopied = () => {
      if (!feedbackEl || !copiedLabel) return;
      const prev = feedbackEl.textContent;
      feedbackEl.textContent = copiedLabel;
      if (typeof setTimeout === 'function') {
        setTimeout(() => {
          feedbackEl.textContent = prev;
        }, resetMs);
      }
    };

    try {
      const nav = options.navigatorObj !== undefined
        ? options.navigatorObj
        : (typeof navigator !== 'undefined' ? navigator : null);
      if (nav && nav.clipboard && typeof nav.clipboard.writeText === 'function') {
        await nav.clipboard.writeText(str);
        markCopied();
        return true;
      }
    } catch {}

    try {
      const doc = options.documentObj !== undefined
        ? options.documentObj
        : (typeof document !== 'undefined' ? document : null);
      if (!doc || !doc.body || typeof doc.createElement !== 'function' || typeof doc.execCommand !== 'function') {
        return false;
      }
      const ta = doc.createElement('textarea');
      ta.value = str;
      if (typeof ta.setAttribute === 'function') ta.setAttribute('readonly', '');
      if (ta.style) {
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.opacity = '0';
        ta.style.pointerEvents = 'none';
      }
      doc.body.append(ta);
      if (typeof ta.select === 'function') ta.select();
      let ok = false;
      try {
        ok = Boolean(doc.execCommand('copy'));
        if (ok) markCopied();
      } catch {}
      if (typeof ta.remove === 'function') ta.remove();
      return ok;
    } catch {
      return false;
    }
  }

  function randomId(prefix = '') {
    const c = typeof crypto !== 'undefined' ? crypto : null;
    let core = '';
    if (c && typeof c.randomUUID === 'function') {
      core = c.randomUUID();
    } else if (c && typeof c.getRandomValues === 'function' && typeof Uint8Array === 'function') {
      const bytes = new Uint8Array(12);
      c.getRandomValues(bytes);
      core = Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
    } else {
      core = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
    }
    return prefix ? `${prefix}${core}` : core;

}

function renderConnections(current = $('connectionId').value) {
  const entries = [new Option(text('connection'), '')];
  if (current && !catalog.connections.some((item) => item.id === current)) entries.push(new Option(current, current));
  for (const item of catalog.connections) entries.push(new Option(item.display_name || item.name || item.id, item.id));
  $('connectionId').replaceChildren(...entries);
  $('connectionId').value = current;
}

function renderModel() {
  const selectedModel = catalog.models.find((item) => item.id === modelId);
  $('model-name').textContent = mode === 'custom'
    ? text('custom')
    : modelId
      ? (selectedModel?.display_name || selectedModel?.name || modelId)
      : text('noModel');
  $('custom-fields').hidden = mode !== 'custom';
  $('model-hint').hidden = mode === 'custom' || Boolean(modelId);
  $('model-hint').textContent = text('noModelHint');
  if (!$('model-list').hidden) renderOptions();
}

function renderPresetList() {
  const picker = $('preset');
  picker.replaceChildren(...config.presets.map((item, index) => {
    const template = config.templates.find((candidate) => candidate.id === item.id && candidate.label === item.label);
    return new Option((template ? templateLabel(template) : item.label) || text('name'), String(index));
  }));
  picker.value = String(selected);
  picker.disabled = config.presets.length === 0;
}

function render() {
  renderPresetList();
  const preset = config.presets[selected];
  $('preset-fields').hidden = !preset;
  const coreEl = $('preset-core');
  if (coreEl) coreEl.hidden = !preset;
  $('empty').hidden = Boolean(preset);
  $('remove').disabled = !preset;
  for (const key of fields) $(key).value = preset?.[key] ?? '';
  modelId = preset?.modelId ?? '';
  mode = preset?.connectionId || preset?.customModelId ? 'custom' : 'catalog';
  renderConnections(preset?.connectionId ?? '');
  renderModel();
  renderPreview();
}

function closePicker() {
  $('model-list').hidden = true;
  $('model-picker').setAttribute('aria-expanded', 'false');
}

function renderOptions() {
  const query = $('model-search').value.toLocaleLowerCase();
  options = [
    { id: '', label: text('noModel') },
    ...catalog.models.map((item) => ({
      id: item.id,
      label: item.display_name || item.name || item.id,
      hint: item.provider_id || item.providerName || item.id,
    })),
  ];
  if (modelId && !catalog.models.some((item) => item.id === modelId)) {
    options.push({ id: modelId, label: modelId, hint: text('stored') });
  }
  options.push({ id: '__custom', label: text('custom') });
  options = options.filter((item) => `${item.label} ${item.id} ${item.hint ?? ''}`.toLocaleLowerCase().includes(query));
  active = Math.min(active, options.length - 1);
  $('model-options').replaceChildren();
  options.forEach((item, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.tabIndex = -1;
    button.id = `model-option-${index}`;
    button.className = `option${index === active ? ' active' : ''}`;
    button.setAttribute('role', 'option');
    button.setAttribute('aria-selected', String((mode === 'custom' ? '__custom' : modelId) === item.id));
    button.append(document.createTextNode(item.label));
    if (item.hint) {
      const hint = document.createElement('small');
      hint.textContent = item.hint;
      button.append(hint);
    }
    button.onclick = () => choose(item.id);
    $('model-options').append(button);
  });
  if (!options.length) {
    const empty = document.createElement('p');
    empty.className = 'hint';
    empty.textContent = text('noMatch');
    $('model-options').append(empty);
  }
  $('model-search').setAttribute('aria-activedescendant', active >= 0 ? `model-option-${active}` : '');
}

function choose(id) {
  const preset = config.presets[selected];
  if (id === '__custom') {
    if (mode !== 'custom') delete preset.modelId;
    mode = 'custom';
  } else {
    mode = 'catalog';
    modelId = id;
    if (id) preset.modelId = id;
    else delete preset.modelId;
    delete preset.connectionId;
    delete preset.customModelId;
    $('connectionId').value = '';
    $('customModelId').value = '';
  }
  closePicker();
  renderModel();
  changed();
  $(mode === 'custom' ? 'connectionId' : 'model-picker').focus();
}

async function loadCatalog() {
  if (catalogLoading) return;
  catalogLoading = true;
  $('retry-models').disabled = true;
  try {
    catalog = await ask('plugin.models.list');
    $('catalog-error').hidden = true;
    if (config) {
      renderConnections();
      renderModel();
      renderPreview();
    }
  } catch (error) {
    $('catalog-message').textContent = `${text('catalogFailed')} ${error.message}`;
    $('catalog-error').hidden = false;
  } finally {
    catalogLoading = false;
    $('retry-models').disabled = false;
  }
}

async function boot() {
  $('loading').hidden = false;
  $('load-error').hidden = true;
  $('retry').disabled = true;
  try {
    config = await ask('plugin.call', { action: 'configuration', args: {} });
    initialConfig = structuredClone(config);
    baseline = snapshot();
    const savedIndex = Number(safeStorage.get('kiki.outputLayer.selected') ?? 0);
    selected = Number.isInteger(savedIndex) && savedIndex >= 0 && savedIndex < config.presets.length ? savedIndex : 0;
    for (const key of settingKeys) $(key).value = config.settings[key];
    renderTemplates();
    render();
    $('editor').hidden = false;
    $('editor').disabled = false;
    $('footer').hidden = false;
    syncDirtyChrome();
    status('');
  } catch (error) {
    $('load-message').textContent = error.message;
    $('load-error').hidden = false;
  } finally {
    $('loading').hidden = true;
    $('retry').disabled = false;
  }
}

function invalidField(key, message, index) {
  if (index !== undefined && index !== selected) {
    selected = index;
    render();
  }
  const field = $(key);
  const detail = typeof field.closest === 'function' ? field.closest('details') : null;
  if (detail) detail.open = true;
  field.focus();
  throw new Error(text(message));
}

function validate() {
  for (const key of settingKeys) if (!$(key).checkValidity()) invalidField(key, 'invalid');
  for (const [index, preset] of config.presets.entries()) {
    if (!preset.label?.trim()) invalidField('label', 'required', index);
    if (!preset.instruction?.trim()) invalidField('instruction', 'required', index);
    if (Boolean(preset.connectionId) !== Boolean(preset.customModelId)) invalidField(preset.connectionId ? 'customModelId' : 'connectionId', 'customPair', index);
    for (const key of numeric) if (preset[key] !== undefined && (!Number.isSafeInteger(preset[key]) || preset[key] < 1)) invalidField(key, 'invalid', index);
  }
}

async function performSave() {
  if (!dirty || saving) return;
  try {
    validate();
    saving = true;
    $('editor').disabled = true;
    syncDirtyChrome();
    status(text('saving'), false, 'saving');
    const values = patch();
    const result = await ask('plugin.settings.patch', { values });
    if (values.presets !== undefined) config.presets = JSON.parse(result.values.presets);
    for (const key of settingKeys) {
      if (values[key] !== undefined) {
        config.settings[key] = result.values[key];
        $(key).value = config.settings[key];
      }
    }
    initialConfig = structuredClone(config);
    baseline = snapshot();
    reportDirty(false);
    render();
    status(text('saved'), false, 'saved');
  } catch (error) {
    status(error.message, true);
  } finally {
    saving = false;
    $('editor').disabled = false;
    syncDirtyChrome();
  }
}

$('model-picker').onclick = () => {
  if (!$('model-list').hidden) { closePicker(); return; }
  $('model-list').hidden = false;
  $('model-picker').setAttribute('aria-expanded', 'true');
  $('model-search').value = '';
  active = 0;
  renderOptions();
  $('model-search').focus();
};
$('model-search').oninput = (event) => {
  if (event && typeof event.stopPropagation === 'function') event.stopPropagation();
  active = 0;
  renderOptions();
};
$('model-search').onkeydown = (event) => {
  if (event.key === 'Escape') {
    event.preventDefault();
    closePicker();
    $('model-picker').focus();
  } else if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    event.preventDefault();
    active = options.length ? (active + (event.key === 'ArrowDown' ? 1 : -1) + options.length) % options.length : -1;
    renderOptions();
    $(`model-option-${active}`)?.scrollIntoView?.({ block: 'nearest' });
  } else if (event.key === 'Enter' && options[active]) {
    event.preventDefault();
    choose(options[active].id);
  } else if (event.key === 'Tab') {
    closePicker();
  }
};

document.addEventListener('click', (event) => {
  if (event && event.target && typeof event.target.closest === 'function') {
    if (!event.target.closest('#model-list') && !event.target.closest('#model-picker')) closePicker();
  }
});
document.addEventListener('keydown', (event) => {
  if (event && (event.ctrlKey || event.metaKey) && String(event.key).toLowerCase() === 's') {
    event.preventDefault();
    void performSave();
  }
});

$('preset').onchange = () => {
  selected = Number($('preset').value);
  safeStorage.set('kiki.outputLayer.selected', String(selected));
  closePicker();
  render();
};
$('add').onclick = () => {
  const template = config.templates.find((item) => item.id === $('template').value) ?? config.templates[0];
  const preset = structuredClone(template);
  if (typeof crypto === 'object' && crypto && typeof crypto.randomUUID === 'function') {
    preset.id = crypto.randomUUID();
  } else if (typeof crypto === 'object' && crypto && typeof crypto.getRandomValues === 'function') {
    const b = new Uint8Array(16);
    crypto.getRandomValues(b);
    preset.id = Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
  } else {
    preset.id = 'preset-' + Date.now().toString(36);
  }
  delete preset.modelId;
  delete preset.connectionId;
  delete preset.customModelId;
  delete preset.maxOutputTokens;
  config.presets.push(preset);
  selected = config.presets.length - 1;
  safeStorage.set('kiki.outputLayer.selected', String(selected));
  render();
  $('add-details').open = false;
  $('prompt-details').open = true;
  changed();
  $('label').focus();
};
$('remove').onclick = () => {
  $('remove-body').textContent = `${config.presets[selected].label} · ${text('removeBody')}`;
  if (typeof $('remove-dialog').showModal === 'function') {
    $('remove-dialog').showModal();
    $('cancel-remove').focus();
  } else {
    config.presets.splice(selected, 1);
    selected = Math.max(0, selected - 1);
    render();
    changed();
  }
};
$('cancel-remove').onclick = () => $('remove-dialog').close?.();
$('confirm-remove').onclick = () => {
  config.presets.splice(selected, 1);
  selected = Math.max(0, selected - 1);
  safeStorage.set('kiki.outputLayer.selected', String(selected));
  render();
  $('remove-dialog').close?.();
  changed();
  $('preset').focus();
};
$('save').onclick = () => performSave();

const discardBtn = $('discard');
if (discardBtn) {
  discardBtn.onclick = () => {
    if (!initialConfig || saving) return;
    config = structuredClone(initialConfig);
    selected = Math.min(selected, Math.max(0, config.presets.length - 1));
    for (const key of settingKeys) $(key).value = config.settings[key];
    render();
    status('');
    reportDirty(false);
  };
}
const clearCustomBtn = $('clear-custom-model');
if (clearCustomBtn) {
  clearCustomBtn.onclick = () => {
    const field = $('customModelId');
    field.value = '';
    editField(field);
    field.focus();
  };
}
const copyPromptBtn = $('copy-prompt');
if (copyPromptBtn) {
  copyPromptBtn.onclick = async () => {
    const val = $('instruction').value;
    if (!val) return;
    const ok = await copyText(val);
    if (ok) status(text('copiedPrompt'), false, '');
  };
}

for (const key of [...fields, ...settingKeys]) $(key).oninput = (event) => editField(event.currentTarget);
$('connectionId').onchange = (event) => editField(event.currentTarget);
$('retry').onclick = () => void boot();
$('retry-models').onclick = () => void loadCatalog();
</script>
</body>
</html>
