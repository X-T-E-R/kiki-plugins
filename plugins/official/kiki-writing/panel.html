<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manuscript</title>
  <style>
    :root {
      color-scheme: light dark;
      font-synthesis: none;
      --bg: #f6f4ef;
      --paper: #fcfbf8;
      --panel: #efece4;
      --ink: #1b1a17;
      --ink-soft: #5c5850;
      --ink-faint: #8c867b;
      --line: rgba(27, 26, 23, 0.10);
      --line-strong: rgba(27, 26, 23, 0.20);
      --accent: #2c5e4f;
      --accent-soft: rgba(44, 94, 79, 0.11);
      --accent-ink: #fcfbf8;
      --del-ink: #9e362b;
      --del-bg: rgba(158, 54, 43, 0.10);
      --ins-ink: #235344;
      --ins-bg: rgba(44, 94, 79, 0.13);
      --serif: "Newsreader", "EB Garamond", Georgia, "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
      --sans: "Instrument Sans", ui-sans-serif, system-ui, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
      --editor-font: var(--serif);
      --editor-lh: 1.84;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #141413;
        --paper: #1c1b19;
        --panel: #252320;
        --ink: #edeae2;
        --ink-soft: #b2aca0;
        --ink-faint: #7b766c;
        --line: rgba(237, 234, 226, 0.10);
        --line-strong: rgba(237, 234, 226, 0.22);
        --accent: #58a88f;
        --accent-soft: rgba(88, 168, 143, 0.15);
        --accent-ink: #141413;
        --del-ink: #e4877d;
        --del-bg: rgba(228, 135, 125, 0.15);
        --ins-ink: #72c4aa;
        --ins-bg: rgba(88, 168, 143, 0.17);
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #141413;
      --paper: #1c1b19;
      --panel: #252320;
      --ink: #edeae2;
      --ink-soft: #b2aca0;
      --ink-faint: #7b766c;
      --line: rgba(237, 234, 226, 0.10);
      --line-strong: rgba(237, 234, 226, 0.22);
      --accent: #58a88f;
      --accent-soft: rgba(88, 168, 143, 0.15);
      --accent-ink: #141413;
      --del-ink: #e4877d;
      --del-bg: rgba(228, 135, 125, 0.15);
      --ins-ink: #72c4aa;
      --ins-bg: rgba(88, 168, 143, 0.17);
    }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-typeface="sans"] {
      --editor-font: var(--sans);
      --editor-lh: 1.74;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { margin: 0; height: 100%; }
    body {
      margin: 0;
      overflow-x: clip;
      background: var(--bg);
      color: var(--ink);
      font: 13.5px/1.5 var(--sans);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }
    .topbar-left, .topbar-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    h1 {
      margin: 0 6px 0 0;
      font: 500 16px/1.28 var(--serif);
      letter-spacing: 0.01em;
      color: var(--ink);
      white-space: nowrap;
    }
    button, select, textarea {
      font: inherit;
      color: inherit;
      max-width: 100%;
    }
    button, select {
      height: 30px;
      min-height: 30px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink-soft);
      font-size: 12px;
      padding: 0 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
    }
    button:hover:not(:disabled), select:hover:not(:disabled) {
      color: var(--ink);
      border-color: var(--line-strong);
      background: var(--paper);
    }
    button[aria-pressed="true"], button.active {
      background: var(--panel);
      color: var(--ink);
      border-color: var(--line-strong);
      font-weight: 500;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      font-weight: 500;
      padding: 0 13px;
    }
    button.primary:hover:not(:disabled) {
      opacity: 0.92;
      background: var(--accent);
      color: var(--accent-ink);
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    select {
      appearance: none;
      padding-right: 24px;
      background-color: var(--paper);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2.5 4.5 6 8l3.5-3.5' fill='none' stroke='%238c867b' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat: no-repeat;
      background-position: right 7px center;
      background-size: 10px;
    }
    button:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .seg-group {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 2px;
      background: var(--panel);
      gap: 2px;
    }
    .seg-group button {
      border: 0;
      height: 24px;
      min-height: 24px;
      padding: 0 9px;
      border-radius: 5px;
      background: transparent;
    }
    .seg-group button[aria-pressed="true"] {
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    /* Desk layout: quiet left outline rail + serene writing sheet */
    .desk {
      flex: 1;
      display: flex;
      align-items: stretch;
      max-width: 1060px;
      width: 100%;
      margin: 0 auto;
      padding: 22px 20px 16px;
      gap: 28px;
      min-width: 0;
    }
    .outline {
      width: 176px;
      flex-shrink: 0;
      border-right: 1px solid var(--line);
      padding-right: 14px;
      align-self: flex-start;
      position: sticky;
      top: 16px;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
    }
    .outline-label {
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--ink-faint);
      margin: 0 0 8px;
      font-weight: 600;
    }
    .outline-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .outline-item {
      justify-content: flex-start;
      border: 0;
      height: auto;
      min-height: 26px;
      padding: 4px 7px;
      font-size: 12px;
      line-height: 1.35;
      color: var(--ink-soft);
      text-align: left;
      white-space: normal;
      overflow-wrap: anywhere;
      border-radius: 5px;
    }
    .outline-item[data-level="2"] { padding-left: 15px; font-size: 11.5px; }
    .outline-item[data-level="3"] { padding-left: 23px; font-size: 11.5px; color: var(--ink-faint); }
    .outline-item:hover { background: var(--panel); color: var(--ink); }
    .outline-empty {
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
      color: var(--ink-faint);
    }

    .sheet-col {
      flex: 1;
      min-width: 0;
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      width: 100%;
    }
    .paper-sheet {
      flex: 1;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      min-height: 400px;
    }
    #draft {
      flex: 1;
      width: 100%;
      min-height: 340px;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      color: var(--ink);
      font-family: var(--editor-font);
      font-size: 16.5px;
      line-height: var(--editor-lh);
      resize: vertical;
      outline: none;
      overflow-wrap: anywhere;
    }
    #draft::placeholder { color: var(--ink-faint); }

    /* Diff view */
    .diff-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      color: var(--ink-soft);
    }
    .diff-delta {
      font-family: var(--mono);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      gap: 8px;
    }
    .diff-delta .plus { color: var(--ins-ink); }
    .diff-delta .minus { color: var(--del-ink); }
    .diff-body {
      font-family: var(--editor-font);
      font-size: 16.5px;
      line-height: var(--editor-lh);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: var(--ink);
    }
    .diff-body del {
      background: var(--del-bg);
      color: var(--del-ink);
      text-decoration: line-through;
      border-radius: 3px;
      padding: 0 2px;
    }
    .diff-body ins {
      background: var(--ins-bg);
      color: var(--ins-ink);
      text-decoration: none;
      border-bottom: 1.5px solid var(--accent);
      border-radius: 3px;
      padding: 0 2px;
    }
    .diff-unchanged {
      color: var(--ink-faint);
      font-family: var(--sans);
      font-size: 13px;
    }

    /* Footer bar: subtle micro-metrics + review dispatch */
    .footbar {
      max-width: 1060px;
      width: 100%;
      margin: 0 auto;
      padding: 10px 20px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 14px;
    }
    .metrics {
      font-size: 12px;
      color: var(--ink-faint);
      font-variant-numeric: tabular-nums;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    #status {
      margin: 0;
      font-size: 12px;
      color: var(--accent);
    }
    #status.err { color: var(--del-ink); }
    .dispatch-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    @media (max-width: 820px) {
      .topbar { padding: 10px 14px; }
      .desk {
        flex-direction: column;
        padding: 14px 12px 10px;
        gap: 12px;
      }
      .outline {
        width: 100%;
        position: static;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        padding: 0 0 10px;
        max-height: 150px;
      }
      .paper-sheet { padding: 18px 16px; min-height: 300px; }
      #draft, .diff-body { font-size: 16px; }
      .footbar { padding: 8px 12px 18px; }
      .dispatch-bar { width: 100%; justify-content: flex-end; }
    }
    @media (pointer: coarse) {
      button, select { min-height: 38px; height: 38px; }
      .seg-group button { min-height: 32px; height: 32px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <h1 id="heading">写作台</h1>
      <button id="outline-toggle" type="button" aria-pressed="false">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <path d="M2.5 4h11M2.5 8h7.5M2.5 12h9.5"></path>
        </svg>
        <span id="outline-btn-text">大纲</span>
      </button>
      <div class="seg-group" role="group" aria-label="View mode">
        <button id="mode-write" type="button" aria-pressed="true">写作</button>
        <button id="mode-diff" type="button" aria-pressed="false">对比</button>
      </div>
    </div>
    <div class="topbar-right">
      <div class="seg-group" role="group" aria-label="Typeface">
        <button id="font-serif" type="button" aria-pressed="true">衬线</button>
        <button id="font-sans" type="button" aria-pressed="false">无衬线</button>
      </div>
      <button id="copy-btn" type="button">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5.5" y="5.5" width="8" height="8" rx="1.5"></rect>
          <path d="M3.5 10.5h-1a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v1"></path>
        </svg>
        <span id="copy-text">复制成稿</span>
      </button>
      <button id="lang-btn" type="button">EN</button>
    </div>
  </header>

  <main class="desk">
    <aside id="outline-pane" class="outline" hidden>
      <p id="outline-title" class="outline-label">章节大纲</p>
      <div id="outline-list" class="outline-list"></div>
    </aside>

    <div class="sheet-col">
      <div class="paper-sheet">
        <textarea id="draft" aria-label="Draft passage" placeholder="落笔成章。以 # 标记小节，支持原稿对比与一键送审…"></textarea>
        <div id="diff-pane" hidden>
          <div class="diff-toolbar">
            <span id="diff-caption">与原稿对比</span>
            <span id="diff-delta" class="diff-delta"></span>
            <button id="pin-baseline" type="button">将当前设为原稿</button>
          </div>
          <div id="diff-body" class="diff-body"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footbar">
    <div class="metrics">
      <span id="stats">0 字 · 0 段 · 约 1 分钟</span>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
    <div class="dispatch-bar">
      <select id="intent" aria-label="Review instruction">
        <option value="raw">直发成稿</option>
        <option value="polish">审阅润色</option>
        <option value="deai">去机器腔</option>
        <option value="continue">顺势续写</option>
        <option value="critique">结构诊断</option>
      </select>
      <button id="send" class="primary" type="button">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2 7.5 8.5"></path>
          <path d="m14 2-4.2 12-2.3-5.5L2 6.2Z"></path>
        </svg>
        <span id="send-text">发送至会话</span>
      </button>
    </div>
  </footer>

  <script>
    /* @kiki-panel-kit:runtime:start */
    // GENERATED from shared/panel-kit/{storage,theme,rpc}.mjs — run `npm run sync:panels`; do not edit this block.
    const KikiPanelKit = (() => {

       * for Kiki plugin panels running inside <iframe sandbox="allow-scripts">.
       */

          const win = targetWindow !== undefined ? targetWindow : (typeof window !== 'undefined' ? window : null);

            return win.localStorage || null;

            return null;
          }
        };
        return {
          get(key) {
            const k = String(key);
            try {
              const s = resolveStorage();

                if (v !== null) return v;
              }
            } catch {}
            return mem.has(k) ? mem.get(k) : null;
          },
          set(key, value) {
            const k = String(key);
            const str = String(value);
            mem.set(k, str);
            try {
              const s = resolveStorage();
              if (s) s.setItem(k, str);
            } catch {}
          },
          remove(key) {
            const k = String(key);
            mem.delete(k);
            try {
              const s = resolveStorage();
              if (s) s.removeItem(k);
            } catch {}
          },
        };
      }

      const safeStorage = createSafeStorage();

      async function copyTextSafe(text, options = {}) {
        const str = String(text ?? '');
        const feedbackEl = options.labelEl || options.button || null;
        const copiedLabel = typeof options.copiedLabel === 'string' ? options.copiedLabel : '';
        const resetMs = Number.isFinite(options.resetMs) ? options.resetMs : 1200;
        const markCopied = () => {
          if (!feedbackEl || !copiedLabel) return;
          const prev = feedbackEl.textContent;
          feedbackEl.textContent = copiedLabel;
          if (typeof setTimeout === 'function') {
            setTimeout(() => {
              feedbackEl.textContent = prev;
            }, resetMs);
          }

        try {

            ? options.navigatorObj

          ta.value = str;
          if (typeof ta.setAttribute === 'function') ta.setAttribute('readonly', '');
          if (ta.style) {
            ta.style.position = 'fixed';
            ta.style.top = '-9999px';
            ta.style.opacity = '0';
            ta.style.pointerEvents = 'none';

          doc.body.append(ta);
          if (typeof ta.select === 'function') ta.select();

      function randomId(prefix = '') {
        const c = typeof crypto !== 'undefined' ? crypto : null;
        let core = '';
        if (c && typeof c.randomUUID === 'function') {
          core = c.randomUUID();
        } else if (c && typeof c.getRandomValues === 'function' && typeof Uint8Array === 'function') {

          c.getRandomValues(bytes);
          core = Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');

        }
        return prefix ? `${prefix}${core}` : core;

      /**
       * Unified 4-way presentation and theme synchronization for Kiki plugin panels:
       * 1) URL ?theme=dark|light initial hydration

       * 3) Host appearance skin CSS custom property injection (--color-*)
       * 4) Host locale propagation callback

      function applyThemeName(theme, root) {

      function initThemeFromUrl(options = {}) {
        try {
          if (typeof URLSearchParams !== 'function') return null;

          if (options.search !== undefined) {
            urlTheme = new URLSearchParams(options.search).get('theme');
          } else if (typeof window !== 'undefined' && window.location && typeof window.location.search === 'string') {
            urlTheme = new URLSearchParams(window.location.search).get('theme');
          } else if (typeof location !== 'undefined' && typeof location.search === 'string') {
            urlTheme = new URLSearchParams(location.search).get('theme');
          }
          if (urlTheme === 'dark' || urlTheme === 'light') {
            return applyThemeName(urlTheme, options.root);
          }
        } catch {}
        return null;
      }

      function applyPresentation(presentation, options = {}) {
        const opts = typeof options === 'string' ? { fallbackTheme: options } : (options || {});
        const el = opts.root || (typeof document !== 'undefined' ? document.documentElement : null);
        const pres = presentation && typeof presentation === 'object' ? presentation : null;
        const theme = applyThemeName(
          (pres && (pres.theme || pres.colorScheme)) || opts.fallbackTheme,
          el,
        );

        const tokenPrefix = typeof opts.tokenPrefix === 'string' ? opts.tokenPrefix : '--color-';
        const appliedTokens = [];
        if (el && el.style && typeof el.style.setProperty === 'function' && pres && pres.tokens && typeof pres.tokens === 'object') {
          for (const [key, value] of Object.entries(pres.tokens)) {

              el.style.setProperty(key, value.trim());
              appliedTokens.push(key);
            }
          }

        let locale = null;
        if (pres && typeof pres.locale === 'string' && pres.locale.trim()) {

          if (typeof opts.onLocale === 'function') {

          }

        return { theme, locale, appliedTokens };
      }

      /**
       * Standardized kiki.panel.v1 postMessage RPC client and MessageChannel stream helper.
       * Enforces default request timeout protection so pending requests never leak or wedge UI state.
       */


      const PANEL_CHANNEL = 'kiki.panel.v1';
      const DEFAULT_RPC_TIMEOUT_MS = 20_000;

      function createPanelClient(options = {}) {
        const channel = options.channel || PANEL_CHANNEL;
        const defaultTimeoutMs = Number.isFinite(options.defaultTimeoutMs)
          ? options.defaultTimeoutMs
          : DEFAULT_RPC_TIMEOUT_MS;
        const defaultTimeoutMessage = options.timeoutMessage || 'Request timed out';
        const defaultErrorMessage = options.errorMessage || 'Bridge error';
        const autoApplyPresentation = options.autoApplyPresentation !== false;

        const win = options.windowObj !== undefined
          ? options.windowObj
          : (typeof window !== 'undefined' ? window : null);
        const par = options.parentObj !== undefined
          ? options.parentObj
          : ((win && win.parent) || (typeof parent !== 'undefined' ? parent : null));

      const intentEl = $('intent');
      if (intentEl) {
        const cur = intentEl.value || 'raw';
        intentEl.replaceChildren();
        for (const [key, label] of Object.entries(copy.intents)) {
          const opt = document.createElement('option');
          opt.value = key;
          opt.textContent = label;
          if (key === cur) opt.selected = true;
          intentEl.append(opt);
        }
        intentEl.value = cur;
      }

      renderOutline();
      renderStats();
      if (viewMode === 'diff') renderDiff();
    }

    const bridge = createPanelClient({
      defaultTimeoutMs: 12000,
      autoApplyPresentation: false,
      onPresentation: (pres, data) => {
        applyPresentation(pres, data.theme);
        renderChrome();
      },
      onInit: (data) => {
        if (data.presentation || data.theme) applyPresentation(data.presentation || data, data.theme);
        sessionId = data.sessionId;
        setStatus(t().ready);
        renderChrome();
      },
    });

    async function sendToSession() {
      if (!draftEl) return;
      const hasSel = typeof draftEl.selectionStart === 'number' && typeof draftEl.selectionEnd === 'number' && draftEl.selectionEnd > draftEl.selectionStart;
      const rawBody = (hasSel ? draftEl.value.slice(draftEl.selectionStart, draftEl.selectionEnd) : draftEl.value).trim();
      if (!sessionId || !rawBody) {
        setStatus(t().needSession, true);
        return;
      }
      const intentEl = $('intent');
      const intentKey = intentEl ? intentEl.value : 'raw';
      const prefix = t().prompts[intentKey] || '';
      const payload = prefix + rawBody;
      const sendBtn = $('send');
      if (sendBtn) sendBtn.disabled = true;
      let ok = false;
      try {
        await bridge.sendSessionMessage(payload, sessionId, { timeoutMs: 12000 });
        ok = true;
      } catch {
        ok = false;
      }
      if (sendBtn) sendBtn.disabled = false;
      setStatus(ok ? t().sent : t().sendFailed, !ok);
    }

    if (draftEl) {
      draftEl.addEventListener('input', () => {
        safeStorage.set('kiki.writing.draft', draftEl.value);
        if (!baseline) {
          baseline = draftEl.value;
          safeStorage.set('kiki.writing.baseline', baseline);
        }
        renderOutline();
        renderStats();
      });
      draftEl.addEventListener('select', renderStats);
      draftEl.addEventListener('keyup', renderStats);
      draftEl.addEventListener('mouseup', renderStats);
      draftEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          void sendToSession();
        }
      });
    }
    if ($('send')) $('send').addEventListener('click', () => sendToSession());
    if ($('copy-btn')) {
      $('copy-btn').addEventListener('click', async () => {
        const val = draftEl ? draftEl.value.trim() : '';
        if (!val) { setStatus(t().emptyCopy, true); return; }
        const ok = await copyText(draftEl.value);
        setStatus(ok ? t().copied : t().sendFailed, !ok);
      });
    }
    if ($('font-serif')) {
      $('font-serif').addEventListener('click', () => {
        typeface = 'serif';
        safeStorage.set('kiki.writing.typeface', typeface);
        renderChrome();
      });
    }
    if ($('font-sans')) {
      $('font-sans').addEventListener('click', () => {
        typeface = 'sans';
        safeStorage.set('kiki.writing.typeface', typeface);
        renderChrome();
      });
    }
    if ($('mode-write')) {
      $('mode-write').addEventListener('click', () => {
        viewMode = 'write';
        renderChrome();
      });
    }
    if ($('mode-diff')) {
      $('mode-diff').addEventListener('click', () => {
        viewMode = 'diff';
        renderChrome();
      });
    }
    if ($('pin-baseline')) {
      $('pin-baseline').addEventListener('click', () => {
        baseline = draftEl ? draftEl.value : '';
        safeStorage.set('kiki.writing.baseline', baseline);
        renderDiff();
        setStatus(t().baselinePinned, false);
      });
    }
    if ($('outline-toggle')) {
      $('outline-toggle').addEventListener('click', () => {
        const pane = $('outline-pane');
        const nextVisible = pane ? pane.hidden : true;
        outlineManual = nextVisible ? '1' : '0';
        safeStorage.set('kiki.writing.outline', outlineManual);
        renderOutline();
      });
    }
    if ($('lang-btn')) {
      $('lang-btn').addEventListener('click', () => {
        locale = locale === 'zh' ? 'en' : 'zh';
        safeStorage.set('kiki.writing.locale', locale);
        renderChrome();
      });
    }

    renderChrome();
  </script>
</body>
</html>
