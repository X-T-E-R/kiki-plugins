<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manuscript</title>
  <style>
    :root {
      color-scheme: light dark;
      font-synthesis: none;
      --bg: #f6f4ef;
      --paper: #fcfbf8;
      --panel: #efece4;
      --ink: #1b1a17;
      --ink-soft: #5c5850;
      --ink-faint: #8c867b;
      --line: rgba(27, 26, 23, 0.10);
      --line-strong: rgba(27, 26, 23, 0.20);
      --accent: #2c5e4f;
      --accent-soft: rgba(44, 94, 79, 0.11);
      --accent-ink: #fcfbf8;
      --del-ink: #9e362b;
      --del-bg: rgba(158, 54, 43, 0.10);
      --ins-ink: #235344;
      --ins-bg: rgba(44, 94, 79, 0.13);
      --serif: "Newsreader", "EB Garamond", Georgia, "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
      --sans: "Instrument Sans", ui-sans-serif, system-ui, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
      --editor-font: var(--serif);
      --editor-lh: 1.84;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #141413;
        --paper: #1c1b19;
        --panel: #252320;
        --ink: #edeae2;
        --ink-soft: #b2aca0;
        --ink-faint: #7b766c;
        --line: rgba(237, 234, 226, 0.10);
        --line-strong: rgba(237, 234, 226, 0.22);
        --accent: #58a88f;
        --accent-soft: rgba(88, 168, 143, 0.15);
        --accent-ink: #141413;
        --del-ink: #e4877d;
        --del-bg: rgba(228, 135, 125, 0.15);
        --ins-ink: #72c4aa;
        --ins-bg: rgba(88, 168, 143, 0.17);
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #141413;
      --paper: #1c1b19;
      --panel: #252320;
      --ink: #edeae2;
      --ink-soft: #b2aca0;
      --ink-faint: #7b766c;
      --line: rgba(237, 234, 226, 0.10);
      --line-strong: rgba(237, 234, 226, 0.22);
      --accent: #58a88f;
      --accent-soft: rgba(88, 168, 143, 0.15);
      --accent-ink: #141413;
      --del-ink: #e4877d;
      --del-bg: rgba(228, 135, 125, 0.15);
      --ins-ink: #72c4aa;
      --ins-bg: rgba(88, 168, 143, 0.17);
    }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-typeface="sans"] {
      --editor-font: var(--sans);
      --editor-lh: 1.74;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { margin: 0; height: 100%; }
    body {
      margin: 0;
      overflow-x: clip;
      background: var(--bg);
      color: var(--ink);
      font: 13.5px/1.5 var(--sans);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }
    .topbar-left, .topbar-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    h1 {
      margin: 0 6px 0 0;
      font: 500 16px/1.28 var(--serif);
      letter-spacing: 0.01em;
      color: var(--ink);
      white-space: nowrap;
    }
    button, select, textarea {
      font: inherit;
      color: inherit;
      max-width: 100%;
    }
    button, select {
      height: 30px;
      min-height: 30px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink-soft);
      font-size: 12px;
      padding: 0 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
    }
    button:hover:not(:disabled), select:hover:not(:disabled) {
      color: var(--ink);
      border-color: var(--line-strong);
      background: var(--paper);
    }
    button[aria-pressed="true"], button.active {
      background: var(--panel);
      color: var(--ink);
      border-color: var(--line-strong);
      font-weight: 500;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      font-weight: 500;
      padding: 0 13px;
    }
    button.primary:hover:not(:disabled) {
      opacity: 0.92;
      background: var(--accent);
      color: var(--accent-ink);
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    select {
      appearance: none;
      padding-right: 24px;
      background-color: var(--paper);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2.5 4.5 6 8l3.5-3.5' fill='none' stroke='%238c867b' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat: no-repeat;
      background-position: right 7px center;
      background-size: 10px;
    }
    button:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .seg-group {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 2px;
      background: var(--panel);
      gap: 2px;
    }
    .seg-group button {
      border: 0;
      height: 24px;
      min-height: 24px;
      padding: 0 9px;
      border-radius: 5px;
      background: transparent;
    }
    .seg-group button[aria-pressed="true"] {
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    /* Desk layout: quiet left outline rail + serene writing sheet */
    .desk {
      flex: 1;
      display: flex;
      align-items: stretch;
      max-width: 1060px;
      width: 100%;
      margin: 0 auto;
      padding: 22px 20px 16px;
      gap: 28px;
      min-width: 0;
    }
    .outline {
      width: 176px;
      flex-shrink: 0;
      border-right: 1px solid var(--line);
      padding-right: 14px;
      align-self: flex-start;
      position: sticky;
      top: 16px;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
    }
    .outline-label {
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--ink-faint);
      margin: 0 0 8px;
      font-weight: 600;
    }
    .outline-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .outline-item {
      justify-content: flex-start;
      border: 0;
      height: auto;
      min-height: 26px;
      padding: 4px 7px;
      font-size: 12px;
      line-height: 1.35;
      color: var(--ink-soft);
      text-align: left;
      white-space: normal;
      overflow-wrap: anywhere;
      border-radius: 5px;
    }
    .outline-item[data-level="2"] { padding-left: 15px; font-size: 11.5px; }
    .outline-item[data-level="3"] { padding-left: 23px; font-size: 11.5px; color: var(--ink-faint); }
    .outline-item:hover { background: var(--panel); color: var(--ink); }
    .outline-empty {
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
      color: var(--ink-faint);
    }

    .sheet-col {
      flex: 1;
      min-width: 0;
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      width: 100%;
    }
    .paper-sheet {
      flex: 1;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      min-height: 400px;
    }
    #draft {
      flex: 1;
      width: 100%;
      min-height: 340px;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      color: var(--ink);
      font-family: var(--editor-font);
      font-size: 16.5px;
      line-height: var(--editor-lh);
      resize: vertical;
      outline: none;
      overflow-wrap: anywhere;
    }
    #draft::placeholder { color: var(--ink-faint); }

    /* Diff view */
    .diff-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      color: var(--ink-soft);
    }
    .diff-delta {
      font-family: var(--mono);
      font-size: 11.5px;
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      gap: 8px;
    }
    .diff-delta .plus { color: var(--ins-ink); }
    .diff-delta .minus { color: var(--del-ink); }
    .diff-body {
      font-family: var(--editor-font);
      font-size: 16.5px;
      line-height: var(--editor-lh);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: var(--ink);
    }
    .diff-body del {
      background: var(--del-bg);
      color: var(--del-ink);
      text-decoration: line-through;
      border-radius: 3px;
      padding: 0 2px;
    }
    .diff-body ins {
      background: var(--ins-bg);
      color: var(--ins-ink);
      text-decoration: none;
      border-bottom: 1.5px solid var(--accent);
      border-radius: 3px;
      padding: 0 2px;
    }
    .diff-unchanged {
      color: var(--ink-faint);
      font-family: var(--sans);
      font-size: 13px;
    }

    /* Footer bar: subtle micro-metrics + review dispatch */
    .footbar {
      max-width: 1060px;
      width: 100%;
      margin: 0 auto;
      padding: 10px 20px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 14px;
    }
    .metrics {
      font-size: 12px;
      color: var(--ink-faint);
      font-variant-numeric: tabular-nums;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    #status {
      margin: 0;
      font-size: 12px;
      color: var(--accent);
    }
    #status.err { color: var(--del-ink); }
    .dispatch-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    @media (max-width: 820px) {
      .topbar { padding: 10px 14px; }
      .desk {
        flex-direction: column;
        padding: 14px 12px 10px;
        gap: 12px;
      }
      .outline {
        width: 100%;
        position: static;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        padding: 0 0 10px;
        max-height: 150px;
      }
      .paper-sheet { padding: 18px 16px; min-height: 300px; }
      #draft, .diff-body { font-size: 16px; }
      .footbar { padding: 8px 12px 18px; }
      .dispatch-bar { width: 100%; justify-content: flex-end; }
    }
    @media (pointer: coarse) {
      button, select { min-height: 38px; height: 38px; }
      .seg-group button { min-height: 32px; height: 32px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <h1 id="heading">写作台</h1>
      <button id="outline-toggle" type="button" aria-pressed="false">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <path d="M2.5 4h11M2.5 8h7.5M2.5 12h9.5"></path>
        </svg>
        <span id="outline-btn-text">大纲</span>
      </button>
      <div class="seg-group" role="group" aria-label="View mode">
        <button id="mode-write" type="button" aria-pressed="true">写作</button>
        <button id="mode-diff" type="button" aria-pressed="false">对比</button>
      </div>
    </div>
    <div class="topbar-right">
      <div class="seg-group" role="group" aria-label="Typeface">
        <button id="font-serif" type="button" aria-pressed="true">衬线</button>
        <button id="font-sans" type="button" aria-pressed="false">无衬线</button>
      </div>
      <button id="copy-btn" type="button">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5.5" y="5.5" width="8" height="8" rx="1.5"></rect>
          <path d="M3.5 10.5h-1a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v1"></path>
        </svg>
        <span id="copy-text">复制成稿</span>
      </button>
      <button id="lang-btn" type="button">EN</button>
    </div>
  </header>

  <main class="desk">
    <aside id="outline-pane" class="outline" hidden>
      <p id="outline-title" class="outline-label">章节大纲</p>
      <div id="outline-list" class="outline-list"></div>
    </aside>

    <div class="sheet-col">
      <div class="paper-sheet">
        <textarea id="draft" aria-label="Draft passage" placeholder="落笔成章。以 # 标记小节，支持原稿对比与一键送审…"></textarea>
        <div id="diff-pane" hidden>
          <div class="diff-toolbar">
            <span id="diff-caption">与原稿对比</span>
            <span id="diff-delta" class="diff-delta"></span>
            <button id="pin-baseline" type="button">将当前设为原稿</button>
          </div>
          <div id="diff-body" class="diff-body"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footbar">
    <div class="metrics">
      <span id="stats">0 字 · 0 段 · 约 1 分钟</span>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
    <div class="dispatch-bar">
      <select id="intent" aria-label="Review instruction">
        <option value="raw">直发成稿</option>
        <option value="polish">审阅润色</option>
        <option value="deai">去机器腔</option>
        <option value="continue">顺势续写</option>
        <option value="critique">结构诊断</option>
      </select>
      <button id="send" class="primary" type="button">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2 7.5 8.5"></path>
          <path d="m14 2-4.2 12-2.3-5.5L2 6.2Z"></path>
        </svg>
        <span id="send-text">发送至会话</span>
      </button>
    </div>
  </footer>

  <script>
    const mem = new Map();
    const safeStorage = {
      get(key) {
        try {
          const s = window.localStorage;
          if (!s) throw new Error('no storage');
          const v = s.getItem(key);
          return v === null ? (mem.has(key) ? mem.get(key) : null) : v;
        } catch {
          return mem.has(key) ? mem.get(key) : null;
        }
      },
      set(key, value) {
        const str = String(value);
        mem.set(key, str);
        try {
          const s = window.localStorage;
          if (s) s.setItem(key, str);
        } catch {}
      },
    };

    async function copyText(str) {
      try {
        if (typeof navigator === 'object' && navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          await navigator.clipboard.writeText(str);
          return true;
        }
      } catch {}
      try {
        if (!document.body || typeof document.execCommand !== 'function') return false;
        const area = document.createElement('textarea');
        area.value = str;
        if (area.style) {
          area.style.position = 'fixed';
          area.style.opacity = '0';
          area.style.pointerEvents = 'none';
        }
        document.body.append(area);
        if (typeof area.select === 'function') area.select();
        const ok = document.execCommand('copy');
        if (typeof area.remove === 'function') area.remove();
        return Boolean(ok);
      } catch {
        return false;
      }
    }

    const STRINGS = {
      zh: {
        heading: '写作台',
        outline: '大纲',
        outlineTitle: '章节大纲',
        outlineEmpty: '使用 # 标题或「第…章」自动生成跳转目录。',
        write: '写作',
        diff: '对比',
        serif: '衬线',
        sans: '无衬线',
        copy: '复制成稿',
        copied: '已复制全文',
        emptyCopy: '尚无内容可复制',
        langToggle: 'EN',
        placeholder: '落笔成章。以 # 标记章节，支持原稿对比与一键送审…',
        diffCaption: '原稿 / 当前润色对比',
        pinBaseline: '设为新原稿',
        baselinePinned: '已更新原稿基准',
        diffIdentical: '当前文稿与原稿一致。修改正文后再切回对比即可查看增删痕迹。',
        send: '发送至会话',
        sendSelection: '发送选中段',
        ready: '',
        needSession: '请先在会话中打开写作台并输入正文。',
        sent: '已发送至当前会话',
        sendFailed: '发送未完成，请重试。',
        intents: {
          raw: '直发成稿',
          polish: '审阅润色',
          deai: '去机器腔',
          continue: '顺势续写',
          critique: '结构诊断',
        },
        prompts: {
          raw: '',
          polish: '请按原稿语境精炼润色以下段落，保留核心意象与事实，直接给出改定稿：\n\n',
          deai: '请洗去以下文字中的套话、排比腔与连接词赘余，使其自然凝练：\n\n',
          continue: '请沿用以下文稿的叙事视角、节奏与气息顺势续写下一节：\n\n',
          critique: '请审阅以下文稿的节奏、逻辑转折与拖沓之处，指出最关键的三处改进点：\n\n',
        },
        formatStats: (units, paras, mins, selected) =>
          `${units} 字 · ${paras} 段 · 约 ${mins} 分钟` + (selected > 0 ? `（已选 ${selected} 字）` : ''),
      },
      en: {
        heading: 'Manuscript',
        outline: 'Outline',
        outlineTitle: 'Outline',
        outlineEmpty: 'Use # headings to jump between sections.',
        write: 'Write',
        diff: 'Diff',
        serif: 'Serif',
        sans: 'Sans',
        copy: 'Copy draft',
        copied: 'Copied to clipboard',
        emptyCopy: 'Nothing to copy yet',
        langToggle: '中文',
        placeholder: 'Begin a passage. Mark sections with # headings…',
        diffCaption: 'Baseline vs. current revision',
        pinBaseline: 'Pin as baseline',
        baselinePinned: 'Baseline updated',
        diffIdentical: 'Current draft matches the pinned baseline.',
        send: 'Send to session',
        sendSelection: 'Send excerpt',
        ready: '',
        needSession: 'Open a session and write a passage first.',
        sent: 'Sent to session.',
        sendFailed: 'The message was not sent. Try again.',
        intents: {
          raw: 'Send as-is',
          polish: 'Line edit & polish',
          deai: 'Strip stiffness',
          continue: 'Continue scene',
          critique: 'Critique pacing',
        },
        prompts: {
          raw: '',
          polish: 'Tighten and polish the following passage while preserving its voice and facts:\n\n',
          deai: 'Rewrite the following passage so it reads naturally without formulaic transitions or filler:\n\n',
          continue: 'Continue the following scene while preserving its point of view, cadence, and tone:\n\n',
          critique: 'Review the pacing, structure, and weak lines in the following draft with concrete suggestions:\n\n',
        },
        formatStats: (units, paras, mins, selected) =>
          `${units} words · ${paras} para · ~${mins} min` + (selected > 0 ? ` (${selected} selected)` : ''),
      },
    };

    let locale = (typeof navigator === 'object' && String(navigator.language || '').toLowerCase().startsWith('zh')) ? 'zh' : 'en';
    const storedLocale = safeStorage.get('kiki.writing.locale');
    if (storedLocale === 'zh' || storedLocale === 'en') locale = storedLocale;

    let typeface = safeStorage.get('kiki.writing.typeface') === 'sans' ? 'sans' : 'serif';
    let viewMode = 'write';
    let outlineManual = safeStorage.get('kiki.writing.outline');
    let sessionId;
    let sequence = 0;
    const pending = new Map();
    let hostTheme = '';

    const $ = (id) => document.getElementById(id);
    const t = () => STRINGS[locale] || STRINGS.en;

    function setRootAttr(name, val) {
      if (document.documentElement.dataset && name.startsWith('data-')) {
        const camel = name.slice(5).replace(/-([a-z])/g, (_, c) => c.toUpperCase());
        document.documentElement.dataset[camel] = val;
      } else if (typeof document.documentElement.setAttribute === 'function') {
        document.documentElement.setAttribute(name, val);
      }
    }

    function applyPresentation(p) {
      if (!p || typeof p !== 'object') return;
      if (typeof p.locale === 'string') locale = p.locale.toLowerCase().startsWith('zh') ? 'zh' : 'en';
      if (p.theme === 'dark' || p.theme === 'light') {
        hostTheme = p.theme;
        setRootAttr('data-theme', p.theme);
      }
      if (p.tokens && typeof p.tokens === 'object' && document.documentElement.style && typeof document.documentElement.style.setProperty === 'function') {
        const map = {
          '--color-canvas': '--bg',
          '--color-paper': '--paper',
          '--color-panel': '--panel',
          '--color-ink': '--ink',
          '--color-ink-soft': '--ink-soft',
          '--color-ink-faint': '--ink-faint',
          '--color-hairline': '--line',
          '--color-accent': '--accent',
        };
        for (const [src, dst] of Object.entries(map)) {
          const val = p.tokens[src];
          if (typeof val === 'string' && val.length < 120 && /^(#[0-9a-fA-F]{3,9}|rgba?\(|hsla?\(|color-mix\()/.test(val.trim())) {
            document.documentElement.style.setProperty(dst, val.trim());
          }
        }
      }
    }

    try {
      if (typeof URLSearchParams !== 'undefined' && typeof location === 'object' && location && location.search) {
        const qTheme = new URLSearchParams(location.search).get('theme');
        if (qTheme === 'dark' || qTheme === 'light') {
          hostTheme = qTheme;
          setRootAttr('data-theme', qTheme);
        }
      }
    } catch {}
    if (!hostTheme && typeof matchMedia === 'function') {
      const mq = matchMedia('(prefers-color-scheme: dark)');
      const syncOs = () => { if (!hostTheme) setRootAttr('data-theme', mq.matches ? 'dark' : 'light'); };
      syncOs();
      if (typeof mq.addEventListener === 'function') mq.addEventListener('change', syncOs);
    }

    const draftEl = $('draft');
    const savedDraft = safeStorage.get('kiki.writing.draft');
    if (savedDraft && draftEl && !draftEl.value) draftEl.value = savedDraft;
    let baseline = safeStorage.get('kiki.writing.baseline') ?? (draftEl ? draftEl.value : '');

    function setStatus(msg, isError = false) {
      const el = $('status');
      if (!el) return;
      el.textContent = msg || '';
      el.className = isError ? 'err' : '';
    }

    function countUnits(str) {
      const cjk = (str.match(/[\u3400-\u9fff\uf900-\ufaff]/g) || []).length;
      const latinWords = (str.replace(/[\u3400-\u9fff\uf900-\ufaff]/g, ' ').trim().match(/\S+/g) || []).length;
      return cjk + latinWords;
    }

    function extractOutline(str) {
      const items = [];
      const lines = str.split('\n');
      let offset = 0;
      for (const line of lines) {
        const trimmed = line.trim();
        const md = trimmed.match(/^(#{1,3})\s+(.+)$/);
        if (md) {
          items.push({ level: md[1].length, title: md[2].trim(), offset });
        } else if (/^第[一二三四五六七八九十百千万零\d]+[章节回篇幕]\b/.test(trimmed) && trimmed.length <= 42) {
          items.push({ level: 1, title: trimmed, offset });
        }
        offset += line.length + 1;
      }
      return items;
    }

    function tokenizeDiff(str) {
      return str.match(/[\u3400-\u9fff\uf900-\ufaff]|[A-Za-z0-9_]+|\s+|[^\s\w\u3400-\u9fff\uf900-\ufaff]/g) || [];
    }

    function computeDiffOps(oldText, newText) {
      if (oldText === newText) return [];
      const a = tokenizeDiff(oldText);
      const b = tokenizeDiff(newText);
      if (a.length * b.length > 400000) {
        const aLines = oldText.split(/(\n)/);
        const bLines = newText.split(/(\n)/);
        return lcsDiff(aLines, bLines);
      }
      return lcsDiff(a, b);
    }

    function lcsDiff(a, b) {
      let start = 0;
      while (start < a.length && start < b.length && a[start] === b[start]) start++;
      let endA = a.length - 1;
      let endB = b.length - 1;
      while (endA >= start && endB >= start && a[endA] === b[endB]) { endA--; endB--; }

      const midA = a.slice(start, endA + 1);
      const midB = b.slice(start, endB + 1);
      const m = midA.length;
      const n = midB.length;
      const ops = [];
      if (start > 0) ops.push({ type: 'eq', text: a.slice(0, start).join('') });

      if (m === 0 && n > 0) {
        ops.push({ type: 'ins', text: midB.join('') });
      } else if (n === 0 && m > 0) {
        ops.push({ type: 'del', text: midA.join('') });
      } else if (m * n > 250000) {
        ops.push({ type: 'del', text: midA.join('') });
        ops.push({ type: 'ins', text: midB.join('') });
      } else if (m > 0 && n > 0) {
        const dp = Array.from({ length: m + 1 }, () => new Uint16Array(n + 1));
        for (let i = m - 1; i >= 0; i--) {
          for (let j = n - 1; j >= 0; j--) {
            dp[i][j] = midA[i] === midB[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
          }
        }
        let i = 0;
        let j = 0;
        while (i < m && j < n) {
          if (midA[i] === midB[j]) {
            ops.push({ type: 'eq', text: midA[i] });
            i++; j++;
          } else if (dp[i + 1][j] >= dp[i][j + 1]) {
            ops.push({ type: 'del', text: midA[i++] });
          } else {
            ops.push({ type: 'ins', text: midB[j++] });
          }
        }
        while (i < m) ops.push({ type: 'del', text: midA[i++] });
        while (j < n) ops.push({ type: 'ins', text: midB[j++] });
      }

      if (endA + 1 < a.length) ops.push({ type: 'eq', text: a.slice(endA + 1).join('') });
      const merged = [];
      for (const op of ops) {
        if (!op.text) continue;
        const last = merged[merged.length - 1];
        if (last && last.type === op.type) last.text += op.text;
        else merged.push({ ...op });
      }
      return merged;
    }

    function renderDiff() {
      const pane = $('diff-pane');
      const body = $('diff-body');
      const delta = $('diff-delta');
      if (!pane || !body || !draftEl) return;
      const current = draftEl.value;
      body.replaceChildren();
      if (delta) delta.replaceChildren();
      if (baseline === current) {
        const p = document.createElement('p');
        p.className = 'diff-unchanged';
        p.textContent = t().diffIdentical;
        body.append(p);
        return;
      }
      const ops = computeDiffOps(baseline, current);
      let added = 0;
      let removed = 0;
      for (const op of ops) {
        if (op.type === 'eq') {
          const span = document.createElement('span');
          span.textContent = op.text;
          body.append(span);
        } else if (op.type === 'del') {
          removed += countUnits(op.text) || op.text.trim().length;
          const del = document.createElement('del');
          del.textContent = op.text;
          body.append(del);
        } else {
          added += countUnits(op.text) || op.text.trim().length;
          const ins = document.createElement('ins');
          ins.textContent = op.text;
          body.append(ins);
        }
      }
      if (delta) {
        const plus = document.createElement('span');
        plus.className = 'plus';
        plus.textContent = `+${added}`;
        const minus = document.createElement('span');
        minus.className = 'minus';
        minus.textContent = `-${removed}`;
        delta.append(plus, minus);
      }
    }

    function jumpToOffset(offset) {
      if (!draftEl) return;
      if (viewMode !== 'write') {
        viewMode = 'write';
        renderChrome();
      }
      if (typeof draftEl.focus === 'function') draftEl.focus();
      if (typeof draftEl.setSelectionRange === 'function') draftEl.setSelectionRange(offset, offset);
      const before = draftEl.value.slice(0, offset);
      const lineIdx = before.split('\n').length - 1;
      const totalLines = Math.max(1, draftEl.value.split('\n').length);
      if (typeof draftEl.scrollHeight === 'number' && draftEl.scrollHeight > 0) {
        draftEl.scrollTop = Math.max(0, Math.floor((lineIdx / totalLines) * draftEl.scrollHeight) - 32);
      }
    }

    function renderOutline() {
      const pane = $('outline-pane');
      const list = $('outline-list');
      const toggle = $('outline-toggle');
      if (!pane || !list || !draftEl) return;
      const items = extractOutline(draftEl.value);
      const visible = outlineManual === '1' ? true : outlineManual === '0' ? false : items.length >= 2;
      pane.hidden = !visible;
      if (toggle) toggle.setAttribute('aria-pressed', visible ? 'true' : 'false');
      list.replaceChildren();
      if (items.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'outline-empty';
        empty.textContent = t().outlineEmpty;
        list.append(empty);
        return;
      }
      for (const item of items) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'outline-item';
        btn.dataset.level = String(item.level);
        btn.textContent = item.title;
        btn.addEventListener('click', () => jumpToOffset(item.offset));
        list.append(btn);
      }
    }

    function renderStats() {
      const statsEl = $('stats');
      const sendTextEl = $('send-text');
      if (!draftEl) return;
      const val = draftEl.value;
      const units = countUnits(val);
      const paras = val.trim() ? val.trim().split(/\n\s*\n+/).filter((s) => s.trim()).length : 0;
      const rate = locale === 'zh' ? 380 : 220;
      const mins = units === 0 ? 0 : Math.max(1, Math.ceil(units / rate));
      let selectedUnits = 0;
      if (typeof draftEl.selectionStart === 'number' && typeof draftEl.selectionEnd === 'number' && draftEl.selectionEnd > draftEl.selectionStart) {
        selectedUnits = countUnits(val.slice(draftEl.selectionStart, draftEl.selectionEnd));
      }
      if (statsEl) statsEl.textContent = t().formatStats(units, paras, mins, selectedUnits);
      if (sendTextEl) sendTextEl.textContent = selectedUnits > 0 ? t().sendSelection : t().send;
    }

    function renderChrome() {
      const copy = t();
      document.documentElement.lang = locale === 'zh' ? 'zh-CN' : 'en';
      setRootAttr('data-typeface', typeface);

      if ($('heading')) $('heading').textContent = copy.heading;
      if ($('outline-btn-text')) $('outline-btn-text').textContent = copy.outline;
      if ($('outline-title')) $('outline-title').textContent = copy.outlineTitle;
      if ($('mode-write')) {
        $('mode-write').textContent = copy.write;
        $('mode-write').setAttribute('aria-pressed', viewMode === 'write' ? 'true' : 'false');
      }
      if ($('mode-diff')) {
        $('mode-diff').textContent = copy.diff;
        $('mode-diff').setAttribute('aria-pressed', viewMode === 'diff' ? 'true' : 'false');
      }
      if ($('font-serif')) {
        $('font-serif').textContent = copy.serif;
        $('font-serif').setAttribute('aria-pressed', typeface === 'serif' ? 'true' : 'false');
      }
      if ($('font-sans')) {
        $('font-sans').textContent = copy.sans;
        $('font-sans').setAttribute('aria-pressed', typeface === 'sans' ? 'true' : 'false');
      }
      if ($('copy-text')) $('copy-text').textContent = copy.copy;
      if ($('lang-btn')) $('lang-btn').textContent = copy.langToggle;
      if (draftEl) {
        draftEl.placeholder = copy.placeholder;
        draftEl.hidden = viewMode !== 'write';
      }
      if ($('diff-pane')) $('diff-pane').hidden = viewMode !== 'diff';
      if ($('diff-caption')) $('diff-caption').textContent = copy.diffCaption;
      if ($('pin-baseline')) $('pin-baseline').textContent = copy.pinBaseline;

      const intentEl = $('intent');
      if (intentEl) {
        const cur = intentEl.value || 'raw';
        intentEl.replaceChildren();
        for (const [key, label] of Object.entries(copy.intents)) {
          const opt = document.createElement('option');
          opt.value = key;
          opt.textContent = label;
          if (key === cur) opt.selected = true;
          intentEl.append(opt);
        }
        intentEl.value = cur;
      }

      renderOutline();
      renderStats();
      if (viewMode === 'diff') renderDiff();
    }

    async function sendToSession() {
      if (!draftEl) return;
      const hasSel = typeof draftEl.selectionStart === 'number' && typeof draftEl.selectionEnd === 'number' && draftEl.selectionEnd > draftEl.selectionStart;
      const rawBody = (hasSel ? draftEl.value.slice(draftEl.selectionStart, draftEl.selectionEnd) : draftEl.value).trim();
      if (!sessionId || !rawBody) {
        setStatus(t().needSession, true);
        return;
      }
      const intentEl = $('intent');
      const intentKey = intentEl ? intentEl.value : 'raw';
      const prefix = t().prompts[intentKey] || '';
      const payload = prefix + rawBody;
      const sendBtn = $('send');
      if (sendBtn) sendBtn.disabled = true;
      const id = ++sequence;
      const response = new Promise((resolve) => {
        const timer = setTimeout(() => {
          if (pending.has(id)) {
            pending.delete(id);
            resolve({ ok: false });
          }
        }, 12000);
        pending.set(id, (msg) => {
          clearTimeout(timer);
          resolve(msg);
        });
      });
      window.parent.postMessage({
        channel: 'kiki.panel.v1',
        kind: 'request',
        id,
        method: 'session.sendMessage',
        sessionId,
        text: payload,
      }, '*');
      const result = await response;
      if (sendBtn) sendBtn.disabled = false;
      setStatus(result && result.ok ? t().sent : t().sendFailed, !(result && result.ok));
    }

    window.addEventListener('message', (event) => {
      if (event.source !== window.parent || !event.data || event.data.channel !== 'kiki.panel.v1') return;
      if (event.data.theme === 'dark' || event.data.theme === 'light') {
        hostTheme = event.data.theme;
        setRootAttr('data-theme', event.data.theme);
      }
      if (event.data.presentation) applyPresentation(event.data.presentation);
      if (event.data.kind === 'init') {
        sessionId = event.data.sessionId;
        setStatus(t().ready);
        renderChrome();
        return;
      }
      if (event.data.kind === 'presentation' || event.data.kind === 'theme') {
        renderChrome();
        return;
      }
      if (event.data.kind === 'response') {
        const settle = pending.get(event.data.id);
        if (settle) { pending.delete(event.data.id); settle(event.data); }
      }
    });

    if (draftEl) {
      draftEl.addEventListener('input', () => {
        safeStorage.set('kiki.writing.draft', draftEl.value);
        if (!baseline) {
          baseline = draftEl.value;
          safeStorage.set('kiki.writing.baseline', baseline);
        }
        renderOutline();
        renderStats();
      });
      draftEl.addEventListener('select', renderStats);
      draftEl.addEventListener('keyup', renderStats);
      draftEl.addEventListener('mouseup', renderStats);
      draftEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          void sendToSession();
        }
      });
    }
    if ($('send')) $('send').addEventListener('click', () => sendToSession());
    if ($('copy-btn')) {
      $('copy-btn').addEventListener('click', async () => {
        const val = draftEl ? draftEl.value.trim() : '';
        if (!val) { setStatus(t().emptyCopy, true); return; }
        const ok = await copyText(draftEl.value);
        setStatus(ok ? t().copied : t().sendFailed, !ok);
      });
    }
    if ($('font-serif')) {
      $('font-serif').addEventListener('click', () => {
        typeface = 'serif';
        safeStorage.set('kiki.writing.typeface', typeface);
        renderChrome();
      });
    }
    if ($('font-sans')) {
      $('font-sans').addEventListener('click', () => {
        typeface = 'sans';
        safeStorage.set('kiki.writing.typeface', typeface);
        renderChrome();
      });
    }
    if ($('mode-write')) {
      $('mode-write').addEventListener('click', () => {
        viewMode = 'write';
        renderChrome();
      });
    }
    if ($('mode-diff')) {
      $('mode-diff').addEventListener('click', () => {
        viewMode = 'diff';
        renderChrome();
      });
    }
    if ($('pin-baseline')) {
      $('pin-baseline').addEventListener('click', () => {
        baseline = draftEl ? draftEl.value : '';
        safeStorage.set('kiki.writing.baseline', baseline);
        renderDiff();
        setStatus(t().baselinePinned, false);
      });
    }
    if ($('outline-toggle')) {
      $('outline-toggle').addEventListener('click', () => {
        const pane = $('outline-pane');
        const nextVisible = pane ? pane.hidden : true;
        outlineManual = nextVisible ? '1' : '0';
        safeStorage.set('kiki.writing.outline', outlineManual);
        renderOutline();
      });
    }
    if ($('lang-btn')) {
      $('lang-btn').addEventListener('click', () => {
        locale = locale === 'zh' ? 'en' : 'zh';
        safeStorage.set('kiki.writing.locale', locale);
        renderChrome();
      });
    }

    renderChrome();
  </script>
</body>
</html>
