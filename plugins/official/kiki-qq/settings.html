<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QQ</title>
<style>
:root{color-scheme:light dark;--paper:#fbfaf6;--panel:#fffdfa;--hairline:#e4ddd0;--hairline-strong:#cdc3b1;--ink:#1b1a17;--ink-soft:#4b453e;--ink-faint:#665e54;--accent:#c8401a;--accent-deep:#9c3012;--on-accent:#fff;--danger:#b0261e;--selected-ink:#1d4d6d}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1b2226;--panel:#252d31;--hairline:#354047;--hairline-strong:#596870;--ink:#eeeae2;--ink-soft:#c1c5c5;--ink-faint:#a2acaf;--accent:#eb946f;--accent-deep:#f4b08f;--on-accent:#261a14;--danger:#f1a29a;--selected-ink:#a3cbde}}
:root[data-theme="dark"]{--paper:#1b2226;--panel:#252d31;--hairline:#354047;--hairline-strong:#596870;--ink:#eeeae2;--ink-soft:#c1c5c5;--ink-faint:#a2acaf;--accent:#eb946f;--accent-deep:#f4b08f;--on-accent:#261a14;--danger:#f1a29a;--selected-ink:#a3cbde}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.55 'Instrument Sans',ui-sans-serif,system-ui,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased}main{max-width:680px;margin:auto;padding:18px 16px 36px}h1{font-size:18px;font-weight:600;letter-spacing:-.01em;margin:0 0 20px}h2{font-size:14px;margin:0 0 6px;font-weight:600}p{margin:6px 0;color:var(--ink-soft)}.muted,.hint{color:var(--ink-faint);font-size:12px}.account{margin:0 0 18px;overflow-wrap:anywhere}.account strong,.appid{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-weight:500;color:var(--ink)}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}button,input{font:inherit;color:inherit;max-width:100%}button{min-height:34px;padding:5px 12px;border:1px solid var(--hairline);border-radius:6px;background:var(--panel);cursor:pointer;white-space:nowrap}button:hover:not(:disabled){border-color:var(--hairline-strong);color:var(--ink)}button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:500}button.primary:hover:not(:disabled){background:var(--accent-deep);border-color:var(--accent-deep);color:var(--on-accent)}button:active:not(:disabled){transform:translateY(1px)}button:disabled{opacity:.5;cursor:not-allowed}:is(button,input,summary):focus-visible{outline:2px solid var(--selected-ink);outline-offset:2px}input{width:100%;padding:7px 10px;border:1px solid var(--hairline);border-radius:6px;background:var(--panel)}input:hover{border-color:var(--hairline-strong)}label{display:block;font-size:12px;font-weight:500;color:var(--ink-soft);margin:0 0 5px}.field{min-width:0;margin-bottom:14px}.hint{margin:4px 0 0;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.wide{grid-column:1/-1}#qr-area{display:grid;grid-template-columns:184px minmax(0,1fr);gap:20px;align-items:center;margin:18px 0}#qr{display:block;width:184px;height:184px;max-width:100%;background:#fff;border-radius:6px}#qr-link{display:inline-block;margin-top:8px;color:var(--selected-ink);text-underline-offset:3px}#candidate{margin:18px 0}#candidate .appid{font-size:20px;margin-top:4px;overflow-wrap:anywhere}#message{min-height:21px;margin-top:12px;color:var(--ink-soft)}#message.error,#manual-status.error{color:var(--danger)}details{margin-top:24px;padding-top:16px;border-top:1px solid var(--hairline)}summary{cursor:pointer;font-weight:500;color:var(--ink-soft)}details[open]>summary{margin-bottom:18px}fieldset{border:0;padding:0;margin:0 0 16px;min-width:0}legend{font-size:14px;font-weight:600;margin-bottom:12px;padding:0}#manual-status{font-size:12px;color:var(--ink-faint)}[hidden]{display:none!important}@media(max-width:767px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}#qr-area{grid-template-columns:1fr;gap:10px}#qr{width:200px;height:200px}main{padding:18px 16px 28px}}
</style>
</head>
<body>
<main>
<h1 data-copy="title">QQ 连接</h1>
<section aria-labelledby="official-title">
<h2 id="official-title" data-copy="official">官方 QQ Bot</h2>
<p id="account" class="account muted"></p>
<p id="intro" data-copy="intro">使用手机 QQ 扫码，并在手机页面确认机器人。</p>
<div id="qr-area" hidden>
  <img id="qr" alt="">
  <div><p data-copy="scan">使用手机 QQ 扫码，在官方页面完成确认。</p><p id="qr-fallback" class="muted" data-copy="qrHint" hidden>二维码暂时无法显示时，可打开官方页面。</p><a id="qr-link" href="#" data-copy="open">打开官方页面</a></div>
</div>
<div id="candidate" hidden><p data-copy="pending">手机已确认，待保存 AppID</p><div class="appid" id="candidate-id"></div></div>
<div class="actions"><button type="button" id="begin" class="primary" disabled data-copy="begin">开始扫码</button><button type="button" id="save-bind" class="primary" hidden data-copy="saveBind">保存此账号</button><button type="button" id="cancel" hidden data-copy="cancel">取消</button></div>
<p id="save-impact" class="muted" hidden data-copy="impact">保存会替换官方账号配置。已开启的 QQ 连接会使用新配置重新连接。</p>
<p id="message" role="status" aria-live="polite"></p>
</section>
<details id="manual"><summary data-copy="manual">手动填写 / OneBot</summary>
<div id="manual-form"><fieldset><legend data-copy="official">官方 QQ Bot</legend><div id="official-fields" class="grid"></div></fieldset><fieldset><legend>OneBot 11</legend><div id="onebot-fields" class="grid"></div></fieldset><p class="muted" data-copy="manualHint">密钥留空会保留已保存的值。保存后，已开启的连接会使用新配置重新连接。</p><div class="actions"><button id="save-manual" type="button" disabled data-copy="saveManual">保存手填配置</button><span id="manual-status" role="status"></span></div></div>
</details>
</main>
<script type="module">
const channel='kiki.panel.v1',instanceId='plugin:kiki-qq/qq-official',clientId=crypto.randomUUID(),waiting=new Map(),$=id=>document.getElementById(id);
const copy={zh:{title:'QQ 连接',official:'官方 QQ Bot',intro:'使用手机 QQ 扫码，并在手机页面确认机器人。',scan:'使用手机 QQ 扫码，在官方页面完成确认。',qrHint:'二维码暂时无法显示时，可打开官方页面。',open:'打开官方页面',pending:'手机已确认，待保存 AppID',begin:'开始扫码',restart:'重新扫码',saveBind:'保存此账号',cancel:'取消',impact:'保存会替换官方账号配置。已开启的 QQ 连接会使用新配置重新连接。',manual:'手动填写 / OneBot',manualHint:'密钥留空会保留已保存的值。保存后，已开启的连接会使用新配置重新连接。',saveManual:'保存手填配置',loading:'正在读取配置…',unconfigured:'尚未配置官方账号',configured:'已配置 AppID',starting:'正在获取官方二维码…',waiting:'等待手机确认。确认后再在这里保存。',saving:'正在保存…',saved:'已保存官方账号。',expired:'二维码已过期，请重新扫码。',cancelled:'已停止本地扫码任务。手机端已确认的授权不会被撤销。',failed:'扫码失败，请重新扫码。',secretSaved:'已保存，留空保留',secretEmpty:'尚未设置',manualSaved:'已保存手填配置',unsaved:'未保存',requestFailed:'请求未完成。请重试；若刚才已点击保存，请先核对当前 AppID。',invalid_request:'请求已失效，请重新打开设置。',unsupported_instance:'请选择官方 QQ Bot 账号。',inactive:'插件尚未就绪，请重新启用插件。',stale_request:'此扫码任务已被另一页面替换或已结束，请重新扫码。',busy:'正在保存，请等待完成。',not_ready:'请先完成手机确认。',settings_changed:'官方配置已在其他位置更改。请核对当前配置后重新扫码。',save_failed:'保存失败，候选账号仍保留，可再次点击保存。',bind_failed:'扫码失败，请重新扫码。',invalid_credentials:'未收到有效账号，请重新扫码。',invalid_qr_url:'官方二维码无法使用，请重新扫码。',unknown_action:'请更新插件后重试。'},en:{title:'QQ connection',official:'Official QQ Bot',intro:'Scan with mobile QQ and confirm the bot on your phone.',scan:'Scan with mobile QQ, then confirm on the official page.',qrHint:'If the QR image is unavailable, open the official page.',open:'Open official page',pending:'Confirmed on phone. AppID ready to save',begin:'Start QR setup',restart:'New QR code',saveBind:'Save this account',cancel:'Cancel',impact:'Saving replaces the official account credentials. An enabled QQ connection will reconnect using the new configuration.',manual:'Manual setup / OneBot',manualHint:'Leave secrets blank to keep saved values. Enabled connections will reconnect using the saved configuration.',saveManual:'Save manual settings',loading:'Loading settings…',unconfigured:'No official account configured',configured:'Configured AppID',starting:'Getting the official QR code…',waiting:'Waiting for phone confirmation. Save here after confirming.',saving:'Saving…',saved:'Official account saved.',expired:'QR code expired. Request a new code.',cancelled:'Local setup stopped. This does not revoke authorization confirmed on your phone.',failed:'QR setup failed. Request a new code.',secretSaved:'Saved; leave blank to keep',secretEmpty:'Not configured',manualSaved:'Manual settings saved',unsaved:'Unsaved',requestFailed:'The request did not complete. Retry; if you just saved, check the current AppID first.',invalid_request:'This request is no longer valid. Reopen settings.',unsupported_instance:'Select the official QQ Bot account.',inactive:'The plugin is not ready. Enable it again.',stale_request:'Another page replaced this setup, or it has ended. Request a new code.',busy:'Saving. Wait for it to finish.',not_ready:'Complete confirmation on your phone first.',settings_changed:'Official settings changed elsewhere. Check the current configuration and start QR setup again.',save_failed:'Saving failed. The candidate is kept; choose Save this account to retry.',bind_failed:'QR setup failed. Request a new code.',invalid_credentials:'No valid account was returned. Request a new code.',invalid_qr_url:'The official QR code is unavailable. Request a new code.',unknown_action:'Update the plugin and try again.'}};
copy.zh.reload='重试加载';copy.en.reload='Retry loading';
let locale='zh',next=0,started=false,ready=false,loading=true,requestId,state={phase:'idle',configured:false},timer,busy=false,epoch=0,schema,values={},secrets=[],manualDirty=false,messageKey='loading',manualKey='',errorMessage=false,closed=false;
const t=key=>key===''?'':copy[locale][key]??copy.en[key]??copy[locale].requestFailed;
function ask(method,extra={}){const id=++next;return new Promise((resolve,reject)=>{const timeout=setTimeout(()=>{waiting.delete(id);reject(new Error('timeout'))},15000);waiting.set(id,{resolve:value=>{clearTimeout(timeout);resolve(value)},reject:()=>{clearTimeout(timeout);reject(new Error('bridge'))}});parent.postMessage({channel,kind:'request',id,method,...extra},'*')})}
function call(action,withRequest=true){return ask('plugin.call',{action:`official_bind_${action}`,args:{instanceId,clientId,...(withRequest&&requestId?{requestId}:{})}})}
let lastDirty,qrImageFailed=false;
const editedFields=new Set();
function fieldValue(key){const raw=$(key).value;return schema.properties[key].type==='number'?(raw===''?null:Number(raw)):(raw===''?null:raw)}
function storedValue(key){return values[key]??schema.properties[key].default??null}
function dirty(){const value=manualDirty||['candidate','saving'].includes(state.phase);if(value===lastDirty)return;lastDirty=value;parent.postMessage({channel,kind:'request',id:++next,method:'plugin.dirty',dirty:value},'*')}
function message(key,error=false){messageKey=key;errorMessage=error;render()}
function render(){document.title=t('title');document.querySelectorAll('[data-copy]').forEach(el=>el.textContent=t(el.dataset.copy));$('account').replaceChildren();$('account').append(document.createTextNode(state.appId?`${t('configured')} `:t('unconfigured')));if(state.appId){const id=document.createElement('strong');id.textContent=state.appId;$('account').append(id)}const phase=state.phase,active=['starting','waiting','candidate'].includes(phase);$('begin').textContent=t(!ready&&!loading?'reload':requestId?'restart':'begin');$('begin').disabled=loading||busy||phase==='saving';$('begin').className=phase==='candidate'?'':'primary';$('save-bind').hidden=!['candidate','saving'].includes(phase);$('save-bind').disabled=busy||phase==='saving'||state.error?.code==='settings_changed';$('cancel').hidden=!active;$('cancel').disabled=busy;$('intro').hidden=['waiting','candidate','saving'].includes(phase);$('qr-area').hidden=phase!=='waiting'||!state.qrUrl;const qrSource=state.qrDataUrl??'';if($('qr').dataset.source!==qrSource){$('qr').dataset.source=qrSource;qrImageFailed=false;if(qrSource)$('qr').src=qrSource;else $('qr').removeAttribute('src')}$('qr').hidden=!qrSource||qrImageFailed;$('qr-fallback').hidden=phase!=='waiting'||Boolean(qrSource&&!qrImageFailed);$('qr').alt=t('scan');$('candidate').hidden=!['candidate','saving'].includes(phase);$('candidate-id').textContent=state.candidateAppId??'';$('save-impact').hidden=!['candidate','saving'].includes(phase);$('message').textContent=messageKey==='candidate'?'':t(messageKey);$('message').hidden=messageKey==='candidate'||messageKey==='';$('message').className=errorMessage?'error':'';$('manual-status').textContent=manualKey?t(manualKey):'';$('save-manual').disabled=!ready||busy||phase==='saving'||!manualDirty;localizeFields()}
function localizeFields(){for(const [key,prop]of Object.entries(schema?.properties??{})){const field=$(key);if(!field)continue;field.disabled=loading||busy||state.phase==='saving';const text=locale==='zh'?(prop.localizations?.zh??prop):prop;document.querySelector(`label[for="${key}"]`).textContent=text.title??key;const hint=$(`${key}-hint`);if(hint)hint.textContent=text.description??'';if(prop.secret)field.placeholder=t(secrets.includes(key)?'secretSaved':'secretEmpty')}}
function fields(){for(const [key,prop]of Object.entries(schema?.properties??{})){const group=$(key.startsWith('official__')?'official-fields':'onebot-fields');const wrap=document.createElement('div');wrap.className='field'+(key.includes('Url')?' wide':'');const label=document.createElement('label');label.htmlFor=key;const input=document.createElement('input');input.id=key;input.name=key;input.type=prop.secret?'password':prop.type==='number'?'number':'text';input.autocomplete=prop.secret?'new-password':'off';if(prop.type==='number')input.step='1';input.value=prop.secret?'':values[key]??prop.default??'';const hint=document.createElement('p');hint.id=`${key}-hint`;hint.className='hint';input.setAttribute('aria-describedby',hint.id);wrap.append(label,input,hint);group.append(wrap)}localizeFields()}
function accept(result){state=result;if(result.requestId)requestId=result.requestId;messageKey=result.error?.code??(result.phase==='idle'?'':result.phase);errorMessage=Boolean(result.error);render();dirty()}
function schedule(){clearTimeout(timer);if(!closed&&['starting','waiting'].includes(state.phase))timer=setTimeout(poll,2500)}
async function poll(){const generation=epoch;try{const result=await call('status');if(generation!==epoch||closed)return;accept(result);schedule()}catch{if(generation===epoch&&!closed){message('requestFailed',true);schedule()}}}
async function settings(replace=false){const result=await ask('plugin.settings.get');schema=result.schema?.schema??result.schema;values=result.values??{};secrets=result.secretsConfigured??[];if(!document.querySelector('#official-fields input'))fields();else if(replace){for(const [key,prop]of Object.entries(schema?.properties??{})){if(editedFields.has(key))continue;$(key).value=prop.secret?'':values[key]??prop.default??''}}localizeFields()}
async function boot(){loading=true;messageKey='loading';render();try{await settings();const result=await call('status',false);state=result;messageKey=result.error?.code??'';ready=!result.error;errorMessage=Boolean(result.error)}catch{ready=false;messageKey='requestFailed';errorMessage=true}finally{loading=false;render()}}
$('begin').onclick=async()=>{if(!ready){await boot();return}busy=true;++epoch;clearTimeout(timer);render();try{const result=await call('start',false);requestId=result.requestId;accept(result);schedule()}catch{message('requestFailed',true)}finally{busy=false;render()}};
$('cancel').onclick=async()=>{busy=true;++epoch;clearTimeout(timer);render();try{accept(await call('cancel'))}catch{message('requestFailed',true)}finally{busy=false;render()}};
$('save-bind').onclick=async()=>{busy=true;render();try{accept(await call('save'));await settings(true)}catch{message('requestFailed',true)}finally{busy=false;render()}};
$('qr-link').onclick=event=>{event.preventDefault();if(state.qrUrl)ask('plugin.openExternal',{url:state.qrUrl}).catch(()=>message('requestFailed',true))};
$('qr').onerror=()=>{qrImageFailed=true;render()};
$('manual-form').oninput=event=>{const key=event.target.id,prop=schema?.properties?.[key];if(!prop)return;if(prop.secret?Boolean(event.target.value):fieldValue(key)!==storedValue(key))editedFields.add(key);else editedFields.delete(key);manualDirty=editedFields.size>0;manualKey=manualDirty?'unsaved':'';dirty();render()};
$('save-manual').onclick=async()=>{if(busy)return;if([...editedFields].some(key=>!$(key).reportValidity()))return;const patch={};for(const key of editedFields){const prop=schema.properties[key];if(prop.secret){if($(key).value)patch[key]=$(key).value}else if(fieldValue(key)!==storedValue(key))patch[key]=fieldValue(key)}busy=true;render();try{await ask('plugin.settings.patch',{values:patch});editedFields.clear();manualDirty=false;manualKey='manualSaved';$('manual-status').className='';await settings(true);const result=await call('status',Boolean(requestId));accept(result);dirty()}catch{manualKey='requestFailed';$('manual-status').className='error'}finally{busy=false;render()}};
function presentation(p){if(!p)return;if(p.locale)locale=p.locale.startsWith('zh')?'zh':'en';document.documentElement.lang=locale==='zh'?'zh-CN':'en';if(['light','dark'].includes(p.theme))document.documentElement.dataset.theme=p.theme;for(const [key,value]of Object.entries(p.tokens??{})){if(key.startsWith('--color-')&&typeof value==='string')document.documentElement.style.setProperty(key.replace('--color-','--'),value)}render()}
window.addEventListener('message',event=>{if(event.source!==parent||event.data?.channel!==channel)return;const data=event.data;if(data.kind==='init'){presentation(data.presentation);if(!started){started=true;void boot()}}if(data.kind==='presentation')presentation(data.presentation);if(data.kind==='response'){const item=waiting.get(data.id);if(!item)return;waiting.delete(data.id);data.ok?item.resolve(data.result):item.reject()}});
window.addEventListener('pagehide',()=>{closed=true;++epoch;clearTimeout(timer);if(requestId&&['starting','waiting','candidate'].includes(state.phase))parent.postMessage({channel,kind:'request',id:++next,method:'plugin.call',action:'official_bind_cancel',args:{instanceId,clientId,requestId}},'*')});
render();
</script>
</body>
</html>
