<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sites</title>
<style>
/* @kiki-panel-kit:theme:start */

:root {
  color-scheme: light dark;
  font-synthesis: none;
  --bg: var(--color-canvas, #f6f4ef);
  --paper: var(--color-paper, #fcfbf8);
  --panel: var(--color-panel, #efece4);
  --ink: var(--color-ink, #1b1a17);
  --ink-soft: var(--color-ink-soft, #5c5850);
  --ink-faint: var(--color-ink-faint, #8c867b);
  --line: var(--color-hairline, rgba(27, 26, 23, 0.10));
  --line-strong: var(--color-hairline-strong, rgba(27, 26, 23, 0.18));
  --accent: var(--color-accent, #2c5e4f);
  --accent-deep: var(--color-accent-deep, #22493d);
  --accent-soft: rgba(44, 94, 79, 0.10);
  --on-accent: var(--color-on-accent, #fcfbf8);
  --ok: var(--color-success, #2c6e49);
  --warn: var(--color-amber-ink, #8a5a19);
  --warn-bg: var(--color-amber-card, rgba(138, 90, 25, 0.11));
  --danger: var(--color-danger, #a63429);
  --danger-bg: rgba(166, 52, 41, 0.09);
  --wash: rgba(27, 26, 23, 0.04);
  --sans: "Instrument Sans", ui-sans-serif, system-ui, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --display: "Newsreader", Georgia, "Songti SC", "Noto Serif SC", serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 6px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--color-canvas, #141413);
    --paper: var(--color-paper, #1c1b19);
    --panel: var(--color-panel, #252320);
    --ink: var(--color-ink, #edeae2);
    --ink-soft: var(--color-ink-soft, #b2aca0);
    --ink-faint: var(--color-ink-faint, #7b766c);
    --line: var(--color-hairline, rgba(237, 234, 226, 0.10));
    --line-strong: var(--color-hairline-strong, rgba(237, 234, 226, 0.18));
    --accent: var(--color-accent, #58a88f);
    --accent-deep: var(--color-accent-deep, #6ebe9f);
    --accent-soft: rgba(88, 168, 143, 0.15);
    --on-accent: var(--color-on-accent, #141413);
    --ok: var(--color-success, #6bbf8e);
    --warn: var(--color-amber-ink, #dca056);
    --warn-bg: var(--color-amber-card, rgba(220, 160, 86, 0.14));
    --danger: var(--color-danger, #e27a6e);
    --danger-bg: rgba(226, 122, 110, 0.14);
    --wash: rgba(237, 234, 226, 0.05);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: var(--color-canvas, #141413);
  --paper: var(--color-paper, #1c1b19);
  --panel: var(--color-panel, #252320);
  --ink: var(--color-ink, #edeae2);
  --ink-soft: var(--color-ink-soft, #b2aca0);
  --ink-faint: var(--color-ink-faint, #7b766c);
  --line: var(--color-hairline, rgba(237, 234, 226, 0.10));
  --line-strong: var(--color-hairline-strong, rgba(237, 234, 226, 0.18));
  --accent: var(--color-accent, #58a88f);
  --accent-deep: var(--color-accent-deep, #6ebe9f);
  --accent-soft: rgba(88, 168, 143, 0.15);
  --on-accent: var(--color-on-accent, #141413);
  --ok: var(--color-success, #6bbf8e);
  --warn: var(--color-amber-ink, #dca056);
  --warn-bg: var(--color-amber-card, rgba(220, 160, 86, 0.14));
  --danger: var(--color-danger, #e27a6e);
  --danger-bg: rgba(226, 122, 110, 0.14);
  --wash: rgba(237, 234, 226, 0.05);

:root[data-theme="light"] {
  color-scheme: light;
}
/* @kiki-panel-kit:theme:end */

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--ink);
  font: 12.5px/1.55 var(--sans);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

main {
  max-width: 880px;
  margin: 0 auto;
  padding: 20px 22px 48px;
}

.masthead {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line-strong);
}

h1 {
  margin: 0;
  font: 500 20px/1.28 var(--display);
  letter-spacing: 0;
}

.session-pill {
  font: 11.5px/1.3 var(--mono);
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--paper);
  border: 1px solid var(--line);
  color: var(--ink-soft);
  max-width: 340px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.top-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 6px;
}

section { margin-top: 22px; }

.head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line-strong);
}

.head h2 {
  margin: 0;
  font: 600 13px/1.3 var(--sans);
  letter-spacing: 0;
  color: var(--ink);
}

.count {
  font: 11px/1.2 var(--mono);
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--panel);
  color: var(--ink-soft);
}

.push { margin-left: auto; }

.banner {
  margin-top: 12px;
  padding: 8px 12px;
  border-radius: var(--radius);
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
}
.banner p { margin: 0; min-width: 0; }
.banner .rec { display: block; margin-top: 2px; color: var(--ink-soft); font-size: 12px; }
.t-danger { background: var(--danger-bg); color: var(--danger); }
.t-warn { background: var(--warn-bg); color: var(--warn); }
.t-good { background: var(--accent-soft); color: var(--accent); }

.ledger {
  margin-top: 8px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 4px 14px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--line);
  align-items: start;
}
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--wash); }

.title {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  flex-wrap: wrap;
}
.title h3 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0;
  overflow-wrap: anywhere;
}
.title .lbl { font-weight: 400; color: var(--ink-soft); }

.meta {
  grid-column: 1;
  color: var(--ink-faint);
  font-size: 11.5px;
  min-width: 0;
}
.fact { display: block; margin-top: 2px; overflow-wrap: anywhere; }

.acts {
  grid-row: 1 / span 2;
  grid-column: 2;
  display: flex;
  gap: 5px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.drawer-span {
  grid-column: 1 / -1;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}

.state {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  color: var(--ink-soft);
  white-space: nowrap;
}
.state::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ink-faint);
  flex: none;
}
.state[data-tone="good"] { color: var(--ok); }
.state[data-tone="good"]::before { background: var(--ok); }
.state[data-tone="bad"] { color: var(--danger); }
.state[data-tone="bad"]::before { background: var(--danger); }
.state[data-tone="warn"] { color: var(--warn); }
.state[data-tone="warn"]::before { background: var(--warn); }
.state[data-tone="busy"] { color: var(--accent); }
.state[data-tone="busy"]::before { background: var(--accent); animation: beat 1.6s ease-in-out infinite; }
@keyframes beat { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

.tag { font: 11.5px/1.3 var(--mono); color: var(--ink-faint); }
.mono { font-family: var(--mono); font-size: 11.5px; }

button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font: 500 12px/1 var(--sans);
  min-height: 28px;
  padding: 0 10px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-soft);
  cursor: pointer;
  transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
}
button:hover:not(:disabled) { border-color: var(--line-strong); color: var(--ink); background: var(--wash); }
button:disabled { cursor: default; opacity: 0.48; }
button.sec { border-color: var(--line-strong); background: var(--bg); color: var(--ink-soft); }
button.sec:hover:not(:disabled) { background: var(--panel); color: var(--ink); }
button.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
button.pri:hover:not(:disabled) { background: var(--accent-deep); border-color: var(--accent-deep); color: var(--on-accent); }
button.danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
button.sm { min-height: 24px; padding: 0 8px; font-size: 11.5px; }

:is(button, input, select, .switch):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.switch {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 26px;
  padding: 0 4px;
  cursor: pointer;
}
.track {
  width: 26px;
  height: 15px;
  border-radius: 999px;
  background: var(--line-strong);
  position: relative;
  flex: none;
  transition: background-color 0.12s ease;
}
.track::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--paper);
  transition: transform 0.12s ease;
}
.switch[aria-checked="true"] { color: var(--accent); }
.switch[aria-checked="true"] .track { background: var(--accent); }
.switch[aria-checked="true"] .track::after { transform: translateX(11px); }

form.inline-form {
  padding: 14px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 10px 12px;
  align-items: end;
}

.field { display: block; min-width: 0; }
.field > span { display: block; margin-bottom: 4px; font-size: 12px; color: var(--ink-soft); }
.req { color: var(--danger); }
.hint { display: block; margin-top: 3px; font-size: 11px; color: var(--ink-faint); }

input[type="text"], input[type="password"], select {
  width: 100%;
  min-height: 31px;
  padding: 4px 9px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
  font: 12.5px/1.3 var(--sans);
}
input:focus, select:focus { border-color: var(--accent); outline: none; }
input::placeholder { color: var(--ink-faint); }

.check { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-soft); cursor: pointer; min-height: 30px; }
.check input { width: 14px; height: 14px; accent-color: var(--accent); flex: none; }

.modes { display: flex; flex-wrap: wrap; gap: 14px; padding: 8px 0 4px; }
.modes label { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-soft); cursor: pointer; }
.modes input { accent-color: var(--accent); }

.formfoot {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  padding-top: 10px;
}

.blockhead {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.blockhead h4 {
  margin: 0;
  font: 600 12px/1.3 var(--sans);
  color: var(--ink-soft);
}

.kv {
  display: grid;
  grid-template-columns: minmax(84px, max-content) minmax(0, 1fr);
  gap: 3px 12px;
  margin: 8px 0 0;
  font-size: 12px;
}
.kv dt { color: var(--ink-faint); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

pre.cmd {
  margin: 6px 0 0;
  padding: 8px 10px;
  border-radius: var(--radius);
  background: var(--bg);
  border: 1px solid var(--line);
  font: 11.5px/1.5 var(--mono);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 150px;
  overflow: auto;
}

.warns {
  margin: 8px 0 0;
  padding: 0;
  list-style: none;
  border-left: 2px solid var(--warn);
}
.warns li { padding: 2px 0 2px 9px; color: var(--warn); font-size: 11.5px; }

.caution { margin: 6px 0 0; color: var(--warn); font-size: 12px; }
.errorline { margin: 6px 0 0; color: var(--danger); font-size: 12px; }

.urlrow {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
  flex-wrap: wrap;
}
.urlrow .url {
  font: 11.5px/1.4 var(--mono);
  overflow-wrap: anywhere;
  min-width: 0;
  color: var(--ink);
}

.history-list {
  margin-top: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--bg);
  overflow: hidden;
}

.hist-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  padding: 7px 10px;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.hist-row:last-child { border-bottom: 0; }

.repo-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.repo-bar input { flex: 1 1 160px; }

.empty-state {
  padding: 20px 14px;
  text-align: center;
  color: var(--ink-faint);
  font-size: 12.5px;
}

@media (max-width: 600px) {
  main { padding: 14px 12px 40px; }
  .row { grid-template-columns: minmax(0, 1fr); }
  .acts { grid-row: auto; grid-column: 1; justify-content: flex-start; margin-top: 4px; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .kv { grid-template-columns: minmax(0, 1fr); }
}

@media (pointer: coarse) {
  button, input, select, .switch { min-height: 38px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
  <main>
    <header class="masthead">
      <h1 data-i18n="title"></h1>
      <span class="session-pill" id="session" hidden></span>
      <div class="top-right">
        <button type="button" class="sec sm" id="refreshBtn" data-i18n="refresh"></button>
        <button type="button" class="sec sm" id="langBtn"></button>
      </div>
    </header>

    <div id="banner" role="status" aria-live="polite"></div>

    <section aria-labelledby="h-connections">
      <div class="head">
        <h2 id="h-connections" data-i18n="connections"></h2>
        <span class="count" id="connCount">0</span>
        <span class="push"></span>
        <button type="button" class="sec sm" id="addConnection" data-i18n="addConnection"></button>
      </div>
      <div class="ledger" id="connectionList"></div>
    </section>

    <section id="targetSection" aria-labelledby="h-targets">
      <div class="head">
        <h2 id="h-targets" data-i18n="targets"></h2>
        <span class="count" id="targetCount">0</span>
        <span class="push"></span>
        <button type="button" class="sec sm" id="addTarget" data-i18n="addTarget"></button>
      </div>
      <div class="ledger" id="targetList"></div>
    </section>

    <section id="jobSection" aria-labelledby="h-jobs" hidden>
      <div class="head">
        <h2 id="h-jobs" data-i18n="jobs"></h2>
        <span class="count" id="jobCount">0</span>
      </div>
      <div class="ledger" id="jobList"></div>
    </section>
  </main>

<script>
(() => {

    const feedbackEl = options.labelEl || options.button || null;
    const copiedLabel = typeof options.copiedLabel === 'string' ? options.copiedLabel : '';

  function applyPresentation(presentation, options = {}) {

  if (value && typeof value === 'object') {
    const out = {};
    for (const key of Object.keys(value)) out[key] = SECRET.test(key) ? '[redacted]' : redact(value[key]);
    return out;
  }
  return value;
}

function flatten(value, prefix, out) {
  if (value === undefined || value === null) return out;
  if (Array.isArray(value)) {
    value.forEach((item, index) => flatten(item, `${prefix}[${index}]`, out));
    return out;
  }
  if (typeof value === 'object') {
    for (const key of Object.keys(value)) flatten(value[key], prefix ? `${prefix}.${key}` : key, out);
    return out;
  }
  out.push([prefix, String(value)]);
  return out;
}

function findUrl(result) {
  if (!result || typeof result !== 'object') return null;
  if (typeof result.url === 'string' && /^https?:\/\//i.test(result.url)) return result.url;
  for (const [, val] of flatten(result, '', [])) {
    if (/^https?:\/\/\S+$/.test(val)) return val;
  }
  return null;
}

function commandText(cmd) {
  if (!cmd || typeof cmd !== 'object') return String(cmd || '');
  const exe = cmd.executable || '';
  const argv = Array.isArray(cmd.argv) ? cmd.argv : [];
  return [exe, ...argv].filter(Boolean).join(' ');
}

async function saveConnection() {
  const draft = view.connectionForm;
  if (!draft) return;
  const connection = { service: draft.service, enabled: Boolean(draft.enabled), authMode: draft.authMode };
  if (draft.id) connection.id = draft.id;
  const cut = (v) => String(v || '').trim();
  if (cut(draft.label)) connection.label = cut(draft.label);
  if (cut(draft.baseUrl)) connection.baseUrl = cut(draft.baseUrl);
  if (draft.authMode === 'cli') {
    if (cut(draft.cliPath)) connection.cliPath = cut(draft.cliPath);
    if (cut(draft.accountId)) connection.accountId = cut(draft.accountId);
  }
  if (cut(draft.username)) connection.username = cut(draft.username);
  const args = { connection };
  if (draft.authMode === 'token' && draft.token !== '') args.token = draft.token;
  if (draft.authMode === 'token' && draft.clearToken) args.clearToken = true;

  setBusy('connection:save', true);
  let ok = false;
  let created;
  try {
    const result = await call('save_connection', args);
    created = result.connection;
    ok = true;
    view.connectionForm = null;
    view.previews.clear();
  } catch (err) {
    draft.token = '';
    complain(err, () => saveConnection());
  } finally {
    setBusy('connection:save', false);
  }
  if (ok && view.afterConnection === 'target') {
    const pending = view.pendingTarget;
    view.afterConnection = null;
    view.pendingTarget = null;
    if (pending) {
      view.targetForm = Object.assign({}, pending, { open: true, connectionId: created?.service === pending.service ? created.id : pending.connectionId });
    }
  }
  if (ok) flashed('good', t('saved'));
  await refresh();
}

async function saveTarget() {
  const draft = view.targetForm;
  if (!draft) return;
  const meta = svc(draft.service);
  const project = String(draft.project || '').trim();
  const missing = [];
  if (!project) missing.push(t('project'));
  else if (!/^([A-Za-z]:[\\/]|\\\\|\/)/.test(project)) missing.push(t('notAbsolute'));
  if (meta) for (const item of meta.fields || []) {
    if (item.required && item.type === 'string' && !String(draft[item.key] || '').trim()) missing.push(item.label);
  }
  if (missing.length) { complain({ message: missing.map((it) => tf('needField', it)).join(' ') }, null); return; }

  const target = { service: draft.service, connectionId: draft.connectionId, project };
  if (draft.id) target.id = draft.id;
  if (String(draft.label || '').trim()) target.label = String(draft.label).trim();
  if (meta) for (const item of meta.fields || []) {
    if (item.type === 'boolean') target[item.key] = Boolean(draft[item.key]);
    else if (String(draft[item.key] || '').trim()) target[item.key] = String(draft[item.key]).trim();
  }

  setBusy('target:save', true);
  try {
    const result = await call('save_target', { target });
    view.previews.delete(result.target.id);
    view.targetForm = null;
    view.selectedTarget = result.target.id;
    safeStorage.set('sites.target', result.target.id);
    flashed('good', t('saved'));
  } catch (err) { complain(err, () => saveTarget()); }
  finally { setBusy('target:save', false); }
  await refresh();
}

async function removeTarget(target) {

    await call('remove_target', { id: target.id });
    view.previews.delete(target.id);
    if (view.selectedTarget === target.id) view.selectedTarget = null;
    flashed('good', t('removed'));
  } catch (err) { complain(err, null); }

function targetJobsOf(targetId) {
  return view.jobs

    .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
}

function targetStamp(target) {
  const conn = connOf(target.connectionId);
  return JSON.stringify([target, conn ? [conn.id, conn.enabled, conn.authMode, authOf(conn).state] : null]);
}

async function makePreview(target, quiet) {
  setBusy(`preview:${target.id}`, true);
  try {
    const result = await call('preview', { id: target.id });
    view.previews.set(target.id, { preview: result.preview, stamp: targetStamp(target) });
    if (!quiet) view.banner = null;
  } catch (err) {
    if (quiet) view.previews.delete(target.id);
    else complain(err, () => makePreview(target));
  } finally {
    setBusy(`preview:${target.id}`, false);
  }
  await refresh();
}

async function selectTarget(target) {
  view.selectedTarget = target.id;
  safeStorage.set('sites.target', target.id);
  render();
  if (!view.previews.has(target.id)) await makePreview(target, true);
}

async function deploy(target) {
  setBusy(`deploy:${target.id}`, true);
  try {
    const entry = view.previews.get(target.id);
    const fresh = entry && entry.stamp === targetStamp(target);
    const result = await call('deploy', fresh ? { previewId: entry.preview.id } : { id: target.id });
    upsert(result.job);
    view.banner = null;
  } catch (err) {
    if (['preview_stale', 'preview_required', 'preview_used'].includes(err.code)) {
      view.previews.delete(target.id);
      try {
        const retry = await call('deploy', { id: target.id });
        upsert(retry.job);
        view.banner = null;
      } catch (retryErr) { complain(retryErr, () => deploy(target)); }
    } else {
      complain(err, () => deploy(target));
    }
  } finally {
    setBusy(`deploy:${target.id}`, false);
  }
  await refresh();
}

async function rollbackToJob(job) {
  setBusy(`rollback:${job.id}`, true);
  view.confirmRollbackId = null;
  try {
    const result = await call('rollback', { jobId: job.id });
    upsert(result.job);
    flashed('good', t('rollbackStarted'));
  } catch (err) {
    complain(err, null);
  } finally {
    setBusy(`rollback:${job.id}`, false);
  }
  await refresh();
}

function deployDrawer(target) {
  const conn = connOf(target.connectionId);
  const entry = view.previews.get(target.id);
  const preview = entry ? entry.preview : null;
  const history = targetJobsOf(target.id);
  const running = history.some(live);
  const unknown = history.some((j) => String(j.state) === 'unknown');
  const authState = String(authOf(conn).state);
  const loading = view.busy.has(`preview:${target.id}`);
  const deploying = view.busy.has(`deploy:${target.id}`);

  const previewHead = h('div', { class: 'blockhead' },
    h('h4', { text: `${t('mode')}: ${preview ? preview.mode : '—'}` }),
    h('span', { class: 'push' }),
    h('button', {
      type: 'button', class: 'sec sm', disabled: loading,
      onclick: () => void makePreview(target),
    }, loading ? t('loading') : t('refreshPreview')),
    h('button', {
      type: 'button', class: 'pri sm',
      disabled: !conn || !conn.enabled || running || deploying,
      onclick: () => void deploy(target),
    }, deploying ? t('deploying') : t('deploy')));

  const parts = [previewHead];
  if (loading && !preview) {
    parts.push(h('p', { class: 'tag', text: t('needPreview') }));
  } else if (!preview) {
    parts.push(h('p', { class: 'tag', text: conn ? t('previewFailed') : tf('noServiceConnection', labelOf(target.service)) }));
  } else {
    if (preview.command) parts.push(h('pre', { class: 'cmd', text: commandText(preview.command) }));
    if (preview.request) parts.push(h('pre', { class: 'cmd', text: JSON.stringify(redact(preview.request), null, 2) }));
    if (Array.isArray(preview.warnings) && preview.warnings.length) {
      parts.push(h('ul', { class: 'warns' }, ...preview.warnings.slice(0, 2).map((w) => h('li', { text: String(w) }))));
    }
  }

  if (conn && ['not_logged_in', 'expired'].includes(authState)) parts.push(h('p', { class: 'caution', text: t('deployNeedsSignIn') }));
  if (conn && authState === 'missing_cli') parts.push(h('p', { class: 'caution', text: t('deployNeedsCli') }));
  if (unknown) parts.push(h('p', { class: 'caution', text: t('unknownBeforeRetry') }));

  // Inline version history & rollback
  parts.push(h('div', { class: 'blockhead', style: 'margin-top:14px' },
    h('h4', { text: t('historyHeading') }),
    h('span', { class: 'count', text: String(history.length) })));

  const histBox = h('div', { class: 'history-list' });
  if (!history.length) {
    histBox.append(h('div', { class: 'empty-state', text: t('historyEmpty') }));
  } else {
    history.slice(0, 8).forEach((job, idx) => {
      const url = findUrl(job.result);
      const revId = job.result?.remoteId ? String(job.result.remoteId).slice(0, 12) : job.id.slice(0, 8);
      const rowActs = [];

      if (live(job)) {
        rowActs.push(h('button', {
          type: 'button', class: 'sec sm danger', disabled: view.busy.has(`cancel:${job.id}`),
          onclick: () => void cancelJob(job),
        }, t('cancel')));
      } else if (['submitted', 'unknown', 'completed_without_url'].includes(String(job.state)) && job.result?.remoteId) {
        rowActs.push(h('button', {
          type: 'button', class: 'sec sm', disabled: view.busy.has(`status:${job.id}`),
          onclick: () => void checkStatus(job),
        }, t('checkStatus')));
      }

      if (url) {
        const cp = h('button', { type: 'button', class: 'sec sm', onclick: () => void copySafe(url, cp) }, t('copyUrl'));
        const op = h('button', { type: 'button', class: 'sec sm', onclick: () => void openExternal(url) }, t('open'));
        rowActs.push(cp, op);
      }

      if (idx > 0 && job.rollbackable && !running) {
        const busyRb = view.busy.has(`rollback:${job.id}`);
        if (view.confirmRollbackId === job.id) {
          rowActs.push(
            h('button', { type: 'button', class: 'pri sm', disabled: busyRb, onclick: () => void rollbackToJob(job) }, busyRb ? t('rollingBack') : t('confirmRollback')),
            h('button', { type: 'button', class: 'sec sm', onclick: () => { view.confirmRollbackId = null; render(); } }, t('keep')),
          );
        } else {
          rowActs.push(h('button', {
            type: 'button', class: 'sec sm', disabled: busyRb,
            onclick: () => { view.confirmRollbackId = job.id; render(); },
          }, t('rollback')));
        }
      }

      histBox.append(h('div', { class: 'hist-row' },
        h('span', { style: 'display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap' },
          h('span', { class: 'state', 'data-tone': jobTone(job) }, jobText(job)),
          h('span', { class: 'mono', text: revId }),
          h('span', { class: 'tag', text: when(job.createdAt) })),
        h('span', { style: 'display:inline-flex;gap:5px;flex-wrap:wrap' }, ...rowActs)));
    });
  }
  parts.push(histBox);

  return h('div', { class: 'drawer-span' }, ...parts);
}

function targetRow(target) {
  const conn = connOf(target.connectionId);
  const open = view.selectedTarget === target.id;
  const history = targetJobsOf(target.id);
  const latest = history[0] || null;
  const latestLiveJob = history.find((j) => READY.has(String(j.state))) || null;
  const liveUrl = latestLiveJob ? findUrl(latestLiveJob.result) : null;

  const acts = [];
  if (liveUrl) {
    const cpBtn = h('button', { type: 'button', class: 'sec sm', onclick: () => void copySafe(liveUrl, cpBtn) }, t('copyUrl'));
    const opBtn = h('button', { type: 'button', class: 'sec sm', onclick: () => void openExternal(liveUrl) }, t('open'));
    acts.push(cpBtn, opBtn);
  }
  acts.push(
    h('button', {
      type: 'button', class: open ? 'sec sm' : 'pri sm',
      'aria-expanded': open ? 'true' : 'false',
      onclick: () => {
        if (open) { view.selectedTarget = null; safeStorage.set('sites.target', ''); render(); }
        else void selectTarget(target);
      },
    }, open ? t('hide') : t('previewAndHistory')),
    h('button', { type: 'button', class: 'sec sm', onclick: () => openTargetForm(target) }, t('edit')),
    removeControl(`target:${target.id}`, () => removeTarget(target)),
  );

  return h('div', { class: 'row' },
    h('div', { class: 'title' },
      h('h3', null, labelOf(target.service),
        target.label && target.label !== labelOf(target.service) ? h('span', { class: 'lbl', text: ` · ${target.label}` }) : null),
      latest ? h('span', { class: 'state', 'data-tone': jobTone(latest) }, jobText(latest)) : null),
    h('div', { class: 'meta' },
      h('span', { class: 'fact mono', text: target.project + (conn ? ` · ${conn.label || labelOf(conn.service)}` : '') }),
      liveUrl ? h('span', { class: 'fact mono', style: 'color:var(--accent)', text: liveUrl }) : null),
    h('div', { class: 'acts' }, ...acts),
    open ? deployDrawer(target) : null);
}

/* --- NON-TARGET / ACTIVE JOBS --- */

async function cancelJob(job) {
  setBusy(`cancel:${job.id}`, true);
  try {
    const result = await call('cancel_job', { id: job.id });
    upsert(result.job);
    view.banner = null;
  } catch (err) { complain(err, () => cancelJob(job)); }
  finally { setBusy(`cancel:${job.id}`, false); }
  await refresh();
}

async function checkStatus(job) {
  setBusy(`status:${job.id}`, true);
  try {
    const result = await call('deployment_status', { jobId: job.id });
    upsert(result.job);
    view.banner = null;
  } catch (err) { complain(err, () => checkStatus(job)); }
  finally { setBusy(`status:${job.id}`, false); }
  await refresh();
}

function renderRecentJobs() {
  const host = fill($('#jobList'));
  const jobs = view.jobs
    .filter((j) => live(j) || j.kind !== 'deploy')
    .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')))
    .slice(0, 6);
  $('#jobCount').textContent = String(jobs.length);
  $('#jobSection').hidden = jobs.length === 0;
  for (const job of jobs) {
    const kindLbl = job.kind === 'login' ? t('signinKind') : job.kind === 'install' ? t('installKind') : t('deployKind');
    const acts = [];
    if (live(job)) {
      acts.push(h('button', { type: 'button', class: 'sec sm danger', onclick: () => void cancelJob(job) }, t('cancel')));
    }
    host.append(h('div', { class: 'row' },
      h('div', { class: 'title' },
        h('h3', { text: kindLbl }),
        h('span', { class: 'state', 'data-tone': jobTone(job) }, jobText(job))),
      h('div', { class: 'meta' },
        h('span', { class: 'mono', text: when(job.createdAt) }),
        job.error ? h('p', { class: 'errorline', text: String(job.error.message || job.error) }) : null),
      h('div', { class: 'acts' }, ...acts)));
  }
}

function render() {
  document.documentElement.lang = zh() ? 'zh-CN' : 'en';
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  $('#langBtn').textContent = t('langBtn');

  const sessPill = $('#session');
  if (sessionId) {
    sessPill.hidden = false;
    sessPill.textContent = sessionTitle || sessionId;
  } else {
    sessPill.hidden = true;
  }

  $('#connCount').textContent = String(view.connections.length);
  $('#targetCount').textContent = String(view.targets.length);

  const bHost = $('#banner');
  if (!view.banner) fill(bHost);
  else {
    fill(bHost, h('div', { class: `banner t-${view.banner.tone}` },
      h('p', null,
        h('span', { text: view.banner.text }),
        view.banner.recovery ? h('span', { class: 'rec', text: view.banner.recovery }) : null),
      view.banner.retry ? h('button', { type: 'button', class: 'sec sm', onclick: () => { const fn = view.banner.retry; view.banner = null; render(); fn(); } }, t('tryAgain')) : null));
  }

  const cHost = fill($('#connectionList'), connectionFormNode());
  if (!view.connections.length && !view.connectionForm) {
    cHost.append(h('div', { class: 'empty-state', text: t('emptyConnections') }));
  } else {
    for (const c of view.connections) cHost.append(connectionRow(c));
  }

  const tHost = fill($('#targetList'), targetFormNode());
  if (!view.targets.length && !view.targetForm) {
    tHost.append(h('div', { class: 'empty-state', text: t('noTargetsYet') }));
  } else {
    for (const tg of view.targets) tHost.append(targetRow(tg));
  }

  renderRecentJobs();
}

async function refresh() {
  try {
    await load();
    view.status = 'ready';
  } catch (err) {
    if (view.status !== 'ready') view.status = 'error';
    view.banner = { tone: 'danger', text: String(err.message || err), recovery: err.recovery || '', retry: () => void boot(true) };
  }
  render();
  schedulePoll();
}

let started = false;
async function boot(force) {
  if (started && !force) { await syncSession(); render(); return; }
  started = true;
  view.status = 'loading';
  render();
  await syncSession();
  await refresh();
  if (view.selectedTarget) {
    const tg = view.targets.find((it) => it.id === view.selectedTarget);
    if (tg && !view.previews.has(tg.id)) void makePreview(tg, true);
  }
}

$('#langBtn').addEventListener('click', () => {
  lang = zh() ? 'en' : 'zh';
  safeStorage.set('sites.lang', lang);
  render();
});
$('#refreshBtn').addEventListener('click', () => { void refresh(); });
$('#addConnection').addEventListener('click', () => { view.afterConnection = null; openConnectionForm(null); });
$('#addTarget').addEventListener('click', () => openTargetForm(null));
render();
})();
</script>
</body>
</html>
