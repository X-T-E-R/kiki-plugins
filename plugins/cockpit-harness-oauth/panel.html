<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cockpit OAuth</title>
<style>
/* @kiki-panel-kit:theme:start */

  --sans: "Instrument Sans", ui-sans-serif, system-ui, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;

@media (prefers-color-scheme: dark) {

    --ink-faint: var(--color-ink-faint, #7b766c);
    --line: var(--color-hairline, rgba(237, 234, 226, 0.10));
    --line-strong: var(--color-hairline-strong, rgba(237, 234, 226, 0.18));
    --accent: var(--color-accent, #58a88f);
    --accent-deep: var(--color-accent-deep, #6ebe9f);
    --accent-soft: rgba(88, 168, 143, 0.15);
    --on-accent: var(--color-on-accent, #141413);
    --ok: var(--color-success, #6bbf8e);
    --warn: var(--color-amber-ink, #dca056);

  color-scheme: dark;
  --bg: var(--color-canvas, #141413);
  --paper: var(--color-paper, #1c1b19);
  --panel: var(--color-panel, #252320);
  --ink: var(--color-ink, #edeae2);
  --ink-soft: var(--color-ink-soft, #b2aca0);
  --ink-faint: var(--color-ink-faint, #7b766c);
  --line: var(--color-hairline, rgba(237, 234, 226, 0.10));
  --line-strong: var(--color-hairline-strong, rgba(237, 234, 226, 0.18));
  --accent: var(--color-accent, #58a88f);
  --accent-deep: var(--color-accent-deep, #6ebe9f);
  --accent-soft: rgba(88, 168, 143, 0.15);

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.55 var(--sans);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

main {
  max-width: 760px;
  margin: 0 auto;
  padding: 22px 22px 48px;
}

.icon {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  flex: none;
}

.masthead {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line-strong);
}

.title-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

h1 {
  margin: 0;
  font: 500 20px/1.28 var(--display);
  letter-spacing: 0;
}

.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--paper);
  border: 1px solid var(--line);
  color: var(--ink-soft);
  font-size: 11.5px;
  line-height: 1.2;
}
.status-chip[data-tone="error"] {
  border-color: var(--danger);
  background: var(--danger-bg);
  color: var(--danger);
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ink-faint);
  flex: none;
}
.dot[data-tone="ok"] { background: var(--ok); }
.dot[data-tone="warn"] { background: var(--warn); }
.dot[data-tone="error"] { background: var(--danger); }
.dot[data-tone="busy"] { background: var(--accent); }

.head-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 30px;
  padding: 0 11px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink-soft);
  font: 500 12px/1 var(--sans);
  cursor: pointer;
  transition: background-color 0.14s ease, border-color 0.14s ease, color 0.14s ease;
}
button:hover:not(:disabled) { background: var(--panel); color: var(--ink); }
button.primary {
  border-color: transparent;
  background: var(--accent);
  color: var(--on-accent);
}
button.primary:hover:not(:disabled) { background: var(--accent-deep); color: var(--on-accent); }
button.ghost-sm {
  min-height: 25px;
  padding: 0 8px;
  font-size: 11.5px;
}
button[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
}
button:disabled { opacity: 0.5; cursor: default; }

@keyframes spin { to { transform: rotate(360deg); } }
button[data-busy="true"] .icon { animation: spin 0.9s linear infinite; }

:is(button, input, summary):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.pool-summary {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 14px 28px;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
}

.pool-stat {
  display: inline-flex;
  align-items: baseline;
  gap: 7px;
}

.pool-stat-label {
  font-size: 12px;
  color: var(--ink-faint);
}

.pool-stat-val {
  font: 600 18px/1.2 var(--sans);
  color: var(--ink);
}
.pool-stat-val[data-tone="ok"] { color: var(--ok); }
.pool-stat-val[data-tone="warn"] { color: var(--warn); }

.setup-guide {
  margin-top: 16px;
  padding: 14px 16px;
  border-radius: var(--radius);
  background: var(--paper);
  border: 1px solid var(--line-strong);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.setup-guide-text {
  display: grid;
  gap: 3px;
  min-width: 0;
}

.setup-guide-title {
  font-weight: 600;
  font-size: 13px;
  color: var(--ink);
}

.setup-guide-sub {
  font-size: 12px;
  color: var(--ink-soft);
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 16px;
}

.seg {
  display: inline-flex;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--paper);
}

.seg button {
  border: 0;
  border-right: 1px solid var(--line);
  border-radius: 0;
  min-height: 28px;
  padding: 0 10px;
  background: transparent;
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}

.search-wrap {
  position: relative;
  flex: 1 1 180px;
  min-width: 0;
  display: flex;
  align-items: center;
}

.search-wrap .icon {
  position: absolute;
  left: 9px;
  color: var(--ink-faint);
  pointer-events: none;
}

.search-wrap input {
  width: 100%;
  min-width: 0;
  height: 30px;
  padding: 0 10px 0 29px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
  font: 12px/1.3 var(--sans);
}
.search-wrap input:focus { border-color: var(--accent); outline: none; }

.engine-list {
  display: grid;
  gap: 14px;
  margin-top: 16px;
}

.engine-sheet {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

.engine-head {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 11px 14px;
  border-bottom: 1px solid var(--line);
}

.engine-head h2 {
  margin: 0;
  font: 600 13.5px/1.3 var(--sans);
  color: var(--ink);
}

.engine-tag {
  font: 11px/1.3 var(--mono);
  color: var(--ink-faint);
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--panel);
}

.health-bar-wrap {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font: 11.5px/1 var(--mono);
  color: var(--ink-soft);
}

.health-track {
  display: block;
  width: 64px;
  height: 5px;
  border-radius: 3px;
  background: var(--line-strong);
  overflow: hidden;
}

.health-fill {
  display: block;
  height: 100%;
  background: var(--ok);
  border-radius: 3px;
  transition: width 0.2s ease;
}

.acct-rows {
  list-style: none;
  margin: 0;
  padding: 0;
}

.acct-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
}
.acct-row:last-child { border-bottom: 0; }
.acct-row[data-hidden-local="true"] { display: none; }

.acct-main {
  min-width: 0;
  display: grid;
  gap: 4px;
}

.acct-title-line {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  min-width: 0;
}

.acct-label {
  font-weight: 500;
  color: var(--ink);
  overflow-wrap: anywhere;
}

.acct-id {
  color: var(--ink-faint);
  font: 11.5px/1.35 var(--mono);
  overflow-wrap: anywhere;
}

.acct-meta-line {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 11.5px;
  color: var(--ink-faint);
}

.quota-meter {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: 11px/1 var(--mono);
  color: var(--ink-soft);
}

.quota-track {
  display: block;
  width: 56px;
  height: 5px;
  border-radius: 3px;
  background: var(--line-strong);
  overflow: hidden;
}

.quota-fill {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
}
.quota-fill[data-low="true"] { background: var(--warn); }

.acct-actions {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  border: 1px solid var(--line-strong);
  color: var(--ink-soft);
}
.badge.ready {
  border-color: rgba(44, 110, 73, 0.35);
  background: rgba(44, 110, 73, 0.08);
  color: var(--ok);
}
.badge.signed_out {
  border-color: rgba(138, 90, 25, 0.35);
  background: var(--warn-bg);
  color: var(--warn);
}
.badge.disabled {
  border-color: rgba(166, 52, 41, 0.35);
  background: var(--danger-bg);
  color: var(--danger);
}

.engine-empty {
  padding: 14px;
  color: var(--ink-faint);
  font-size: 12.5px;
}

.engine-error {
  padding: 10px 14px;
  background: var(--danger-bg);
  color: var(--danger);
  font-size: 12px;
  overflow-wrap: anywhere;
}

details.config-drawer {
  margin-top: 20px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

details.config-drawer > summary {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  cursor: pointer;
  list-style: none;
  font-weight: 500;
  font-size: 12.5px;
  color: var(--ink-soft);
  user-select: none;
}
details.config-drawer > summary::-webkit-details-marker { display: none; }

.summary-meta {
  margin-left: auto;
  font: 11.5px/1.2 var(--mono);
  color: var(--ink-faint);
}

.chevron {
  transition: transform 0.14s ease;
  color: var(--ink-faint);
}
details.config-drawer[open] .chevron { transform: rotate(90deg); color: var(--ink); }

.config-body {
  padding: 4px 14px 14px;
  border-top: 1px solid var(--line);
}

.configuration {
  display: grid;
  gap: 10px;
  margin-top: 10px;
}

.config-field {
  display: grid;
  gap: 4px;
  font-size: 12px;
  color: var(--ink-soft);
}

.config-field input {
  width: 100%;
  min-width: 0;
  min-height: 32px;
  padding: 5px 9px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--ink);
  font: 12px/1.4 var(--mono);
}
.config-field input:focus { border-color: var(--accent); outline: none; }
.config-field input:disabled { opacity: 0.55; }

.config-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.config-status {
  margin: 0;
  font-size: 12px;
  color: var(--ink-faint);
}
.config-status.error { color: var(--danger); }
.config-status.ok { color: var(--ok); }

@media (max-width: 560px) {
  main { padding: 14px 12px 36px; }
  .head-actions { margin-left: 0; width: 100%; justify-content: space-between; }
  .health-bar-wrap { margin-left: 0; }
  .acct-row { grid-template-columns: minmax(0, 1fr); }
  .acct-actions { justify-content: flex-start; }
}

@media (pointer: coarse) {
  button, input, summary { min-height: 40px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<body>
<main>
  <header class="masthead">
    <div class="title-wrap">
      <h1 data-i18n="title">Cockpit OAuth</h1>
      <span class="status-chip" id="statusBadge">
        <span class="dot" id="statusDot"></span>
        <span id="status" role="status" aria-live="polite">等待宿主…</span>
      </span>
    </div>
    <div class="head-actions">
      <button type="button" id="maskToggle" aria-pressed="true">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2 8s2.4-4 6-4 6 4 6 4-2.4 4-6 4-6-4-6-4z"/>
          <circle cx="8" cy="8" r="1.75"/>
        </svg>
        <span id="maskToggleText">脱敏</span>
      </button>
      <button type="button" id="langToggle">EN</button>
      <button class="primary" id="refresh" type="button">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.45-3.72M13.5 2.75v2.75h-2.75"/>
        </svg>
        <span data-i18n="refreshBtn">刷新账号池</span>
      </button>
    </div>
  </header>

  <section class="pool-summary" id="poolSummary" hidden>
    <div class="pool-stat">
      <span class="pool-stat-label" data-i18n="statReady">就绪账号</span>
      <span class="pool-stat-val" id="statReadyVal" data-tone="ok">0</span>
    </div>
    <div class="pool-stat">
      <span class="pool-stat-label" data-i18n="statAttention">待重授权 / 停用</span>
      <span class="pool-stat-val" id="statAttentionVal">0</span>
    </div>
    <div class="pool-stat">
      <span class="pool-stat-label" data-i18n="statTotal">总计</span>
      <span class="pool-stat-val" id="statTotalVal">0</span>
    </div>
    <div class="pool-stat" id="leaseStatWrap" hidden>
      <span class="pool-stat-label" data-i18n="statLeases">活跃租约</span>
      <span class="pool-stat-val" id="statLeasesVal">0</span>
    </div>
  </section>

  <div class="setup-guide" id="setupGuide" hidden>
    <div class="setup-guide-text">
      <span class="setup-guide-title" data-i18n="guideTitle">一步接入本地 Cockpit 账号池</span>
      <span class="setup-guide-sub" data-i18n="guideSub">填写下方可执行程序与 Sidecar 绝对路径并保存，即可为 AGY 与 Codex 实例分配已授权账号。</span>
    </div>
    <button type="button" class="primary" id="focusSetupBtn" data-i18n="guideAction">填写路径</button>
  </div>

  <div class="toolbar" id="poolToolbar" hidden>
    <div class="seg" role="group" aria-label="账号状态筛选">
      <button type="button" data-filter="all" aria-pressed="true" data-i18n="filterAll">全部</button>
      <button type="button" data-filter="ready" aria-pressed="false" data-i18n="filterReady">可用</button>
      <button type="button" data-filter="attention" aria-pressed="false" data-i18n="filterAttention">待处理</button>
    </div>
    <div class="search-wrap">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="7" cy="7" r="4.5"/>
        <path d="M10.5 10.5L14 14"/>
      </svg>
      <input type="search" id="searchInput" autocomplete="off" spellcheck="false" data-i18n-placeholder="searchPlaceholder" placeholder="搜索账号标签或 ID…">
    </div>
  </div>

  <section class="engine-list" id="accounts"></section>

  <details class="config-drawer" id="configDrawer" open>
    <summary>
      <svg class="icon chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5L10.5 8L6 12.5"/></svg>
      <span data-i18n="configTitle">后端连接路径</span>
      <span class="summary-meta" id="configSummaryMeta"></span>
    </summary>
    <div class="config-body">
      <div class="configuration" id="configuration" hidden>
        <label class="config-field" for="backendPath">
          <span data-i18n="backendLabel">cockpit-harness-oauth 可执行文件</span>
          <input id="backendPath" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="backendPh" placeholder="例如 C:\Tools\cockpit-harness-oauth.exe">
        </label>
        <label class="config-field" for="sidecarPath">
          <span data-i18n="sidecarLabel">Cockpit Sidecar 路径</span>
          <input id="sidecarPath" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="sidecarPh" placeholder="Cockpit Sidecar 绝对路径">
        </label>
        <label class="config-field" for="dataDir">
          <span data-i18n="dataDirLabel">数据目录（可选）</span>
          <input id="dataDir" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="dataDirPh" placeholder="留空使用默认 Cockpit 存储目录">
        </label>
      </div>
      <div class="config-actions">
        <button class="primary" id="save" type="button" disabled hidden data-i18n="saveBtn">保存并重连</button>
        <button id="retry-settings" type="button" hidden data-i18n="retryBtn">重试读取</button>
        <p class="config-status" id="config-status" role="status" aria-live="polite">…</p>
      </div>
    </div>
  </details>
</main>

<script>

    if (dirty === next) return;
    dirty = next;
    void request('plugin.dirty', { dirty: next }).catch(() => undefined);
  }

  function updateDirty() {
    const changed = settingsReady && Object.keys(patchOf()).length > 0;
    $('save').disabled = !settingsReady || settingsLoading || saving || refreshing || !changed;
    mark(changed);
  }

  function adoptSettings(next) {
    settingsView = next && typeof next === 'object' ? next : { values: {}, secretsConfigured: [] };
    for (const key of keys) $(key).value = String(settingsView?.values?.[key] ?? '');
    const configured = isConfigured();
    $('configDrawer').open = !configured;
    syncConfigSummary();
    updateDirty();
  }

  async function loadSettings() {
    if (settingsLoading) return false;
    settingsLoading = true;
    settingsReady = false;
    $('configuration').hidden = true;
    $('save').hidden = true;
    $('retry-settings').hidden = true;
    $('retry-settings').disabled = true;
    for (const key of keys) $(key).disabled = true;
    updateDirty();
    configNote(tr('loadingSettings'));
    try {
      const next = await request('plugin.settings.get');
      settingsReady = true;
      adoptSettings(next);
      $('configuration').hidden = false;
      $('save').hidden = false;
      configNote('');
      return true;
    } catch (error) {
      configNote(error?.message || tr('loadFailed'), 'error');
      $('retry-settings').hidden = false;
      return false;
    } finally {
      settingsLoading = false;
      for (const key of keys) $(key).disabled = saving || !settingsReady;
      $('retry-settings').disabled = false;
      updateDirty();
    }
  }

  function matchesAccountFilter(item, engineLabel) {
    if (statusFilter === 'ready' && item.status !== 'ready') return false;
    if (statusFilter === 'attention' && item.status === 'ready') return false;
    if (!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    return (
      String(item.label || '').toLowerCase().includes(q) ||
      String(item.id || '').toLowerCase().includes(q) ||
      String(engineLabel || '').toLowerCase().includes(q)
    );
  }

  function renderAccounts(payload) {
    lastPayload = payload;
    const accounts = Array.isArray(payload?.accounts) ? payload.accounts : [];
    const root = $('accounts');
    root.replaceChildren();

    let totalReady = 0;
    let totalAttention = 0;
    let totalAll = 0;

    for (const group of accounts) {
      const items = Array.isArray(group.items) ? group.items : [];
      const readyInGroup = items.filter((it) => it.status === 'ready').length;
      totalReady += readyInGroup;
      totalAttention += items.length - readyInGroup;
      totalAll += items.length;

      const sheet = document.createElement('article');
      sheet.className = 'engine-sheet';

      const head = document.createElement('div');
      head.className = 'engine-head';

      const h2 = document.createElement('h2');
      h2.textContent = group.label || group.engineId || 'Harness';

      const tag = document.createElement('span');
      tag.className = 'engine-tag';
      tag.textContent = group.engineId || '';

      const healthWrap = document.createElement('div');
      healthWrap.className = 'health-bar-wrap';

      if (items.length > 0) {
        const track = document.createElement('span');
        track.className = 'health-track';
        const fill = document.createElement('span');
        fill.className = 'health-fill';
        fill.style.width = `${Math.round((readyInGroup / items.length) * 100)}%`;
        track.append(fill);

        const ratio = document.createElement('span');
        ratio.textContent = `${readyInGroup}/${items.length}`;
        healthWrap.append(track, ratio);
      }

      const engineRefreshBtn = document.createElement('button');
      engineRefreshBtn.type = 'button';
      engineRefreshBtn.className = 'ghost-sm';
      engineRefreshBtn.title = `${tr('refreshBtn')} (${group.label || group.engineId})`;
      engineRefreshBtn.disabled = refreshing;
      engineRefreshBtn.append(svgIcon(['M13.5 8a5.5 5.5 0 1 1-1.45-3.72M13.5 2.75v2.75h-2.75']));
      engineRefreshBtn.onclick = () => { void refresh(group.engineId); };
      healthWrap.append(engineRefreshBtn);

      head.append(h2, tag, healthWrap);
      sheet.append(head);

      if (items.length > 0) {
        const visibleItems = items.filter((it) => matchesAccountFilter(it, group.label || group.engineId));
        if (visibleItems.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'engine-empty';
          empty.textContent = tr('noMatch');
          sheet.append(empty);
        } else {
          const ul = document.createElement('ul');
          ul.className = 'acct-rows';

          for (const item of visibleItems) {
            const li = document.createElement('li');
            li.className = 'acct-row';

            const mainCol = document.createElement('div');
            mainCol.className = 'acct-main';

            const titleLine = document.createElement('div');
            titleLine.className = 'acct-title-line';

            const dot = document.createElement('span');
            dot.className = 'dot';
            dot.dataset.tone = item.status === 'ready' ? 'ok' : item.status === 'signed_out' ? 'warn' : 'error';

            const lbl = document.createElement('span');
            lbl.className = 'acct-label';
            lbl.textContent = redactIdentity(item.label || 'Account');

            const idSpan = document.createElement('span');
            idSpan.className = 'acct-id';
            idSpan.textContent = redactIdentity(item.id || '');

            titleLine.append(dot, lbl, idSpan);
            mainCol.append(titleLine);

            const hasQuota = typeof item.quotaRemaining === 'number';
            const hasExpiry = Boolean(item.expiresAt);
            const needsAction = item.status !== 'ready';

            if (hasQuota || hasExpiry || needsAction) {
              const metaLine = document.createElement('div');
              metaLine.className = 'acct-meta-line';

              if (hasQuota) {
                const pct = Math.round(item.quotaRemaining * 100);
                const qWrap = document.createElement('span');
                qWrap.className = 'quota-meter';
                const qTrack = document.createElement('span');
                qTrack.className = 'quota-track';
                const qFill = document.createElement('span');
                qFill.className = 'quota-fill';
                qFill.style.width = `${pct}%`;
                qFill.dataset.low = pct <= 20 ? 'true' : 'false';
                qTrack.append(qFill);
                const qTxt = document.createElement('span');
                qTxt.textContent = item.quotaLabel || `${tr('quotaPrefix')} ${pct}%`;
                qWrap.append(qTrack, qTxt);
                metaLine.append(qWrap);
              }

              if (hasExpiry) {
                const exp = document.createElement('span');
                exp.textContent = `${tr('expiresPrefix')} ${fmtShortTime(item.expiresAt)}`;
                exp.title = item.expiresAt;
                metaLine.append(exp);
              }

              if (needsAction) {
                const hint = document.createElement('span');
                hint.textContent = tr('reauthHint');
                metaLine.append(hint);
              }

              mainCol.append(metaLine);
            }

            const actCol = document.createElement('div');
            actCol.className = 'acct-actions';

            const badge = document.createElement('span');
            badge.className = 'badge ' + (item.status || '');
            const statusKey = `status_${item.status}`;
            const translated = tr(statusKey);
            badge.textContent = translated !== statusKey ? translated : String(item.status || '').replace(/_/g, ' ');
            actCol.append(badge);

            if (item.status !== 'ready') {
              const recheckBtn = document.createElement('button');
              recheckBtn.type = 'button';
              recheckBtn.className = 'ghost-sm';
              recheckBtn.disabled = refreshing;
              recheckBtn.textContent = tr('recheck');
              recheckBtn.onclick = () => { void refresh(group.engineId); };
              actCol.append(recheckBtn);
            }

            if (item.id) {
              const copyBtn = document.createElement('button');
              copyBtn.type = 'button';
              copyBtn.className = 'ghost-sm';
              const copyLbl = document.createElement('span');
              copyLbl.textContent = tr('copyId');
              copyBtn.append(
                svgIcon(['M5.5 5.5h7v8h-7z', 'M3.5 10.5h-1v-8h7v1']),
                copyLbl,
              );
              copyBtn.onclick = () => { void copySafe(item.id, copyLbl); };
              actCol.append(copyBtn);
            }

            li.append(mainCol, actCol);
            ul.append(li);
          }
          sheet.append(ul);
        }
      } else if (!group.error) {
        const empty = document.createElement('div');
        empty.className = 'engine-empty';
        empty.textContent = tr('emptyEngine');
        sheet.append(empty);
      }

      if (group.error) {
        const err = document.createElement('div');
        err.className = 'engine-error';
        err.textContent = group.error;
        sheet.append(err);
      }

      root.append(sheet);
    }

    $('poolSummary').hidden = totalAll === 0 && !payload?.activeLeases;
    $('poolToolbar').hidden = totalAll === 0;
    $('statReadyVal').textContent = String(totalReady);
    $('statAttentionVal').textContent = String(totalAttention);
    $('statAttentionVal').dataset.tone = totalAttention > 0 ? 'warn' : '';
    $('statTotalVal').textContent = String(totalAll);

    const leases = Number(payload?.activeLeases) || 0;
    $('leaseStatWrap').hidden = leases === 0;
    $('statLeasesVal').textContent = String(leases);
  }

  async function refresh(singleEngineId = '') {
    if (refreshing) return;
    if (settingsReady && !isConfigured()) {
      setStatus(tr('unconfiguredStatus'), 'warn');
      syncConfigSummary();
      return;
    }
    refreshing = true;
    $('refresh').disabled = true;
    $('refresh').dataset.busy = 'true';
    setStatus(tr('refreshing'), 'busy');
    updateDirty();
    try {
      const result = await call('refresh', singleEngineId ? { engineId: singleEngineId } : {});
      if (singleEngineId && lastPayload && Array.isArray(lastPayload.accounts) && Array.isArray(result?.accounts)) {
        const merged = lastPayload.accounts.map((oldGroup) => {
          const updated = result.accounts.find((g) => g.engineId === oldGroup.engineId);
          return updated || oldGroup;
        });
        result.accounts = merged;
      }
      renderAccounts(result);
      const failed = result?.accounts?.filter((a) => a.error).length ?? 0;
      const tip = result?.refreshedAt ? `${tr('refreshed')} · ${fmtShortTime(result.refreshedAt)}` : '';
      if (failed) {
        setStatus(
          failed === result.accounts.length ? tr('loadFailed') : tr('partialErr'),
          failed === result.accounts.length ? 'error' : 'warn',
          tip,
        );
      } else {
        setStatus(tr('refreshed'), 'ok', tip);
      }
    } catch (error) {
      setStatus(tr('loadFailed'), 'error', error?.message || '');
    } finally {
      refreshing = false;
      $('refresh').disabled = false;
      $('refresh').dataset.busy = 'false';
      updateDirty();
      if (lastPayload) renderAccounts(lastPayload);
    }
  }

  $('refresh').addEventListener('click', () => { void refresh(); });
  $('retry-settings').addEventListener('click', () => {
    void (async () => { if (await loadSettings()) await refresh(); })();
  });

  $('focusSetupBtn').addEventListener('click', () => {
    $('configDrawer').open = true;
    $('backendPath').focus();
  });

  $('maskToggle').addEventListener('click', () => {
    maskIds = !maskIds;
    safeStorage.set('cockpit.mask', maskIds ? '1' : '0');
    applyLocaleStrings();
  });

  $('langToggle').addEventListener('click', () => {
    lang = lang === 'zh' ? 'en' : 'zh';
    safeStorage.set('cockpit.lang', lang);
    applyLocaleStrings();
  });

  for (const btn of document.querySelectorAll('.seg button[data-filter]')) {
    btn.addEventListener('click', () => {
      statusFilter = btn.dataset.filter || 'all';
      for (const b of document.querySelectorAll('.seg button[data-filter]')) {
        b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
      }
      if (lastPayload) renderAccounts(lastPayload);
    });
  }

  $('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value.trim();
    if (lastPayload) renderAccounts(lastPayload);
  });

  for (const key of keys) {
    $(key).addEventListener('input', () => { configNote(''); updateDirty(); });
    $(key).addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      if (!$('save').disabled) $('save').click();
    });
  }

  $('save').addEventListener('click', async () => {
    if (saving) return;
    const values = patchOf();
    if (Object.keys(values).length === 0) return;
    saving = true;
    for (const key of keys) $(key).disabled = true;
    updateDirty();
    configNote(tr('savingSettings'));
    try {
      adoptSettings(await request('plugin.settings.patch', { values }));
      configNote(tr('savedSettings'), 'ok');
      await refresh();
    } catch (error) {
      configNote(error?.message || tr('loadFailed'), 'error');
    } finally {
      saving = false;
      for (const key of keys) $(key).disabled = false;
      updateDirty();
    }
  });

  applyLocaleStrings();
  setStatus(tr('waiting'));
})();
</script>
</body>
</html>
