<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>报错雷达</title>
<style>
/* @kiki-panel-kit:theme:start */
/* GENERATED from shared/panel-kit/theme.css — run `npm run sync:panels`; do not edit this block. */
:root {
  color-scheme: light dark;
  font-synthesis: none;
  --bg: var(--color-canvas, #f6f4ef);
  --paper: var(--color-paper, #fcfbf8);
  --panel: var(--color-panel, #efece4);
  --ink: var(--color-ink, #1b1a17);
  --ink-soft: var(--color-ink-soft, #5c5850);
  --ink-faint: var(--color-ink-faint, #8c867b);
  --line: var(--color-hairline, rgba(27, 26, 23, 0.10));
  --line-strong: var(--color-hairline-strong, rgba(27, 26, 23, 0.18));
  --accent: var(--color-accent, #2c5e4f);
  --accent-deep: var(--color-accent-deep, #22493d);
  --accent-soft: rgba(44, 94, 79, 0.10);
  --on-accent: var(--color-on-accent, #fcfbf8);
  --ok: var(--color-success, #2c6e49);
  --warn: var(--color-amber-ink, #8a5a19);
  --warn-bg: var(--color-amber-card, rgba(138, 90, 25, 0.11));
  --danger: var(--color-danger, #a63429);
  --danger-bg: rgba(166, 52, 41, 0.09);
  --wash: rgba(27, 26, 23, 0.04);
  --sans: "Instrument Sans", ui-sans-serif, system-ui, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --display: "Newsreader", Georgia, "Songti SC", "Noto Serif SC", serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 6px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--color-canvas, #141413);
    --paper: var(--color-paper, #1c1b19);
    --panel: var(--color-panel, #252320);
    --ink: var(--color-ink, #edeae2);
    --ink-soft: var(--color-ink-soft, #b2aca0);
    --ink-faint: var(--color-ink-faint, #7b766c);
    --line: var(--color-hairline, rgba(237, 234, 226, 0.10));
    --line-strong: var(--color-hairline-strong, rgba(237, 234, 226, 0.18));
    --accent: var(--color-accent, #58a88f);
    --accent-deep: var(--color-accent-deep, #6ebe9f);
    --accent-soft: rgba(88, 168, 143, 0.15);
    --on-accent: var(--color-on-accent, #141413);
    --ok: var(--color-success, #6bbf8e);
    --warn: var(--color-amber-ink, #dca056);
    --warn-bg: var(--color-amber-card, rgba(220, 160, 86, 0.14));
    --danger: var(--color-danger, #e27a6e);
    --danger-bg: rgba(226, 122, 110, 0.14);
    --wash: rgba(237, 234, 226, 0.05);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: var(--color-canvas, #141413);
  --paper: var(--color-paper, #1c1b19);
  --panel: var(--color-panel, #252320);
  --ink: var(--color-ink, #edeae2);
  --ink-soft: var(--color-ink-soft, #b2aca0);
  --ink-faint: var(--color-ink-faint, #7b766c);
  --line: var(--color-hairline, rgba(237, 234, 226, 0.10));
  --line-strong: var(--color-hairline-strong, rgba(237, 234, 226, 0.18));
  --accent: var(--color-accent, #58a88f);
  --accent-deep: var(--color-accent-deep, #6ebe9f);
  --accent-soft: rgba(88, 168, 143, 0.15);
  --on-accent: var(--color-on-accent, #141413);
  --ok: var(--color-success, #6bbf8e);
  --warn: var(--color-amber-ink, #dca056);
  --warn-bg: var(--color-amber-card, rgba(220, 160, 86, 0.14));
  --danger: var(--color-danger, #e27a6e);
  --danger-bg: rgba(226, 122, 110, 0.14);
  --wash: rgba(237, 234, 226, 0.05);
}

:root[data-theme="light"] {
  color-scheme: light;
}
/* @kiki-panel-kit:theme:end */

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--ink);
  font: 13px/1.55 var(--sans);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

main {
  max-width: 900px;
  margin: 0 auto;
  padding: 22px 24px 56px;
}

.icon {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  flex: none;
}

.masthead {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line-strong);
}

.title-group {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

h1 {
  margin: 0;
  font: 500 21px/1.28 var(--display);
  letter-spacing: 0;
}

.pulse-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--paper);
  border: 1px solid var(--line);
  color: var(--ink-soft);
  font-size: 11.5px;
  line-height: 1.2;
}

.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--ink-faint);
  flex: none;
}
.dot[data-tone="ok"] { background: var(--ok); }
.dot[data-tone="busy"] { background: var(--accent); }
.dot[data-tone="warn"] { background: var(--warn); }
.dot[data-tone="danger"] { background: var(--danger); }

.controls {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.seg {
  display: inline-flex;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--paper);
}

.seg button {
  border: 0;
  border-right: 1px solid var(--line);
  border-radius: 0;
  min-height: 30px;
  padding: 0 11px;
  background: transparent;
  color: var(--ink-soft);
  font: 500 12px/1 var(--sans);
  cursor: pointer;
}
.seg button:last-child { border-right: 0; }
.seg button:hover:not([aria-pressed="true"]):not(:disabled) { background: var(--wash); color: var(--ink); }
.seg button[aria-pressed="true"] {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}

button.action {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 30px;
  padding: 0 12px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  background: var(--accent);
  color: var(--on-accent);
  font: 500 12.5px/1 var(--sans);
  cursor: pointer;
  transition: background-color 0.14s ease;
}
button.action:hover:not(:disabled) { background: var(--accent-deep); }
button.action:disabled, .seg button:disabled, button.ghost:disabled { opacity: 0.5; cursor: default; }

@keyframes spin { to { transform: rotate(360deg); } }
button.action[data-busy="true"] .icon { animation: spin 0.9s linear infinite; }

button.ghost {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 26px;
  padding: 0 9px;
  border-radius: var(--radius);
  border: 1px solid var(--line-strong);
  background: var(--paper);
  color: var(--ink-soft);
  font: 500 11.5px/1 var(--sans);
  cursor: pointer;
  transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
}
button.ghost:hover:not(:disabled) { background: var(--panel); color: var(--ink); }
button.ghost[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
}

:is(button, input, .sig-head, .tool-row):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.telemetry-ribbon {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 16px 32px;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
}

.stat-unit {
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
}

.stat-label {
  font-size: 12px;
  color: var(--ink-faint);
}

.stat-val {
  font: 600 19px/1.2 var(--sans);
  color: var(--ink);
}
.stat-val[data-tone="danger"] { color: var(--danger); }
.stat-val[data-tone="warn"] { color: var(--warn); }

.stat-sub {
  font: 500 12px/1 var(--mono);
  color: var(--ink-faint);
}

.notice {
  margin: 12px 0 0;
  padding: 8px 12px;
  border-radius: var(--radius);
  background: var(--danger-bg);
  color: var(--danger);
  font-size: 12.5px;
}

.toast {
  margin: 10px 0 0;
  padding: 7px 11px;
  border-radius: var(--radius);
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 12px;
}

.triage-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 18px;
}

.search-box {
  position: relative;
  flex: 1 1 220px;
  min-width: 0;
  display: flex;
  align-items: center;
}

.search-box .icon-search {
  position: absolute;
  left: 10px;
  color: var(--ink-faint);
  pointer-events: none;
}

.search-box input {
  width: 100%;
  min-width: 0;
  height: 32px;
  padding: 0 30px 0 32px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
  font: 12.5px/1.3 var(--sans);
}
.search-box input::placeholder { color: var(--ink-faint); }
.search-box input:focus { border-color: var(--accent); outline: none; }

.clear-search {
  position: absolute;
  right: 5px;
  width: 22px;
  height: 22px;
  padding: 0;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--ink-faint);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.clear-search:hover { background: var(--wash); color: var(--ink); }

.kbd-hint {
  margin-left: auto;
  color: var(--ink-faint);
  font: 11px/1.3 var(--mono);
  white-space: nowrap;
}

.section {
  padding-top: 22px;
}

.sec-head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

h2 {
  margin: 0;
  font: 600 12px/1.35 var(--sans);
  letter-spacing: 0.02em;
  color: var(--ink-soft);
}

.sec-count {
  font: 11.5px/1.2 var(--mono);
  color: var(--ink-faint);
}

.filter-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 9px;
  border: 1px solid var(--accent);
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font: 500 11.5px/1.4 var(--mono);
  cursor: pointer;
}
.filter-pill:hover { background: var(--panel); }

.tools-ledger {
  border-top: 1px solid var(--line);
}

.tool-row {
  display: grid;
  grid-template-columns: minmax(120px, 1.4fr) minmax(80px, 1.1fr) auto;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 8px 6px;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  color: inherit;
  text-align: left;
  font: inherit;
  cursor: pointer;
}
.tool-row:hover { background: var(--wash); }
.tool-row[aria-current="true"] {
  background: var(--accent-soft);
  border-radius: 4px;
}

.tool-name {
  font: 500 12px/1.35 var(--mono);
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bar-track {
  display: block;
  width: 100%;
  height: 3px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
}

.bar-fill {
  display: block;
  height: 100%;
  background: var(--ink-faint);
  border-radius: 2px;
}
.bar-fill[data-high="true"] { background: var(--danger); }

.tool-stats {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  justify-content: flex-end;
  font-size: 11.5px;
  color: var(--ink-soft);
  white-space: nowrap;
}

.rate {
  min-width: 44px;
  text-align: right;
  font-family: var(--mono);
}
.rate[data-high="true"] { color: var(--danger); font-weight: 600; }

.tag-streak {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--warn-bg);
  color: var(--warn);
  font: 500 11px/1.45 var(--sans);
  white-space: nowrap;
}

.tag-tool {
  display: inline-flex;
  align-items: center;
  padding: 1px 6px;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  background: var(--paper);
  color: var(--ink-soft);
  font: 500 11px/1.4 var(--mono);
  max-width: 100%;
  overflow-wrap: anywhere;
}

.sig-list {
  border-top: 1px solid var(--line);
  background: var(--paper);
  border-radius: var(--radius);
  border: 1px solid var(--line);
}

.sig-item {
  border-bottom: 1px solid var(--line);
}
.sig-item:last-child { border-bottom: 0; }
.sig-item[data-focused="true"] > .sig-head {
  background: var(--accent-soft);
}
.sig-item[data-open="true"] {
  background: var(--paper);
}

.sig-head {
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 10px;
  width: 100%;
  padding: 11px 12px;
  border: 0;
  background: transparent;
  color: inherit;
  text-align: left;
  font: inherit;
  cursor: pointer;
}
.sig-head:hover { background: var(--wash); }

.sig-count {
  font: 600 14.5px/1.25 var(--mono);
  color: var(--danger);
}

.sig-body {
  min-width: 0;
  display: grid;
  gap: 4px;
}

.sig-meta-line {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}

.sig-time {
  font-size: 11px;
  color: var(--ink-faint);
}

.sig-code {
  font: 400 12.5px/1.45 var(--mono);
  color: var(--ink);
  overflow-wrap: anywhere;
  word-break: break-word;
}

.chevron {
  width: 14px;
  height: 14px;
  color: var(--ink-faint);
  transition: transform 0.14s ease;
  align-self: center;
}
.sig-item[data-open="true"] .chevron { transform: rotate(90deg); color: var(--ink); }

.sig-drawer {
  padding: 2px 14px 14px 60px;
  border-top: 1px dashed var(--line);
}

.drawer-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  padding: 8px 0 10px;
  color: var(--ink-faint);
  font-size: 11.5px;
}

.drawer-actions {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.streak-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}

.streak-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  border-radius: 4px;
  background: var(--warn-bg);
  color: var(--warn);
  font: 11.5px/1.35 var(--mono);
}

.sample-list {
  display: grid;
  gap: 8px;
}

.sample-row {
  padding: 9px 11px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--bg);
  display: grid;
  gap: 5px;
}

.sample-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 4px 10px;
  color: var(--ink-faint);
  font: 11px/1.35 var(--mono);
}

.arg-kv-list {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 6px;
}

.arg-chip {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--panel);
  color: var(--ink-soft);
  font: 11px/1.4 var(--mono);
  max-width: 100%;
  overflow-wrap: anywhere;
}
.arg-chip b {
  font-weight: 600;
  color: var(--ink-faint);
}

.sample-trace {
  margin: 0;
  padding: 6px 8px;
  border-left: 2px solid var(--accent);
  background: var(--paper);
  font: 11.5px/1.5 var(--mono);
  color: var(--ink);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.empty-state {
  padding: 28px 16px;
  color: var(--ink-faint);
  font-size: 12.5px;
  text-align: center;
}

@media (max-width: 620px) {
  main { padding: 14px 12px 40px; }
  .controls { margin-left: 0; width: 100%; justify-content: space-between; }
  .telemetry-ribbon { gap: 12px 20px; padding: 12px 0; }
  .kbd-hint { display: none; }
  .tool-row { grid-template-columns: minmax(0, 1fr) auto; }
  .bar-track { display: none; }
  .sig-head { grid-template-columns: 38px minmax(0, 1fr) auto; padding: 10px 8px; gap: 8px; }
  .sig-drawer { padding: 4px 10px 12px 10px; }
}

@media (pointer: coarse) {
  button.action, .seg button, button.ghost, .search-box input { min-height: 38px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main>
  <header class="masthead">
    <div class="title-group">
      <h1>报错雷达</h1>
      <span class="pulse-chip" id="scanBadge" title="等待宿主连接">
        <span class="dot" id="statusDot"></span>
        <span id="scanStatus">就绪</span>
      </span>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="时间窗口">
        <button type="button" data-hours="24" aria-pressed="false">24h</button>
        <button type="button" data-hours="168" aria-pressed="true">7d</button>
        <button type="button" data-hours="720" aria-pressed="false">30d</button>
      </div>
      <button type="button" class="action" id="refreshBtn">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M13.5 8a5.5 5.5 0 1 1-1.45-3.72M13.5 2.75v2.75h-2.75"/>
        </svg>
        <span>增量刷新</span>
      </button>
    </div>
  </header>

  <div class="notice" id="errorBanner" hidden role="alert"></div>
  <div class="toast" id="toastBanner" hidden role="status" aria-live="polite"></div>

  <section class="telemetry-ribbon" aria-label="时间窗概览">
    <div class="stat-unit">
      <span class="stat-label">报错 / 错率</span>
      <span class="stat-val" id="mErrors">0</span>
      <span class="stat-sub" id="mRate">0%</span>
    </div>
    <div class="stat-unit">
      <span class="stat-label">调用</span>
      <span class="stat-val" id="mCalls">0</span>
    </div>
    <div class="stat-unit">
      <span class="stat-label">连环重试</span>
      <span class="stat-val" id="mStreaks">0</span>
    </div>
    <div class="stat-unit">
      <span class="stat-label">生命周期异常</span>
      <span class="stat-val" id="mLifecycle">0</span>
    </div>
  </section>

  <div class="triage-bar">
    <div class="search-box">
      <svg class="icon icon-search" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="7" cy="7" r="4.5"/>
        <path d="M10.5 10.5L14 14"/>
      </svg>
      <input type="search" id="searchInput" autocomplete="off" spellcheck="false" placeholder="搜索错误签名、退出码或工具名…" aria-label="搜索错误签名或工具名">
      <button type="button" class="clear-search" id="clearSearchBtn" hidden aria-label="清空搜索">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
      </button>
    </div>
    <button type="button" class="ghost" id="streakOnlyBtn" aria-pressed="false">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2L4 9h4l-1 5 5-7H8l1-5z"/></svg>
      <span>仅连撞</span>
    </button>
    <button type="button" class="filter-pill" id="clearFilterBtn" hidden></button>
    <span class="kbd-hint" aria-hidden="true">↑↓ 浏览 · Enter 展开 · / 搜索</span>
  </div>

  <section class="section" id="toolsSection" hidden>
    <div class="sec-head">
      <h2>异常工具分布</h2>
      <span class="sec-count" id="toolsCount"></span>
    </div>
    <div class="tools-ledger" id="toolsRoot"></div>
  </section>

  <section class="section">
    <div class="sec-head">
      <h2>报错签名分诊</h2>
      <span class="sec-count" id="sigsCount"></span>
    </div>
    <div class="sig-list" id="sigsRoot" role="list"></div>

    for (const item of list) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tool-row';
      const selected = Boolean(toolFilter && toolFilter.toLowerCase() === item.tool.toLowerCase());
      btn.setAttribute('aria-current', selected ? 'true' : 'false');
      btn.onclick = () => {
        toolFilter = selected ? '' : item.tool;
        void loadState();
      };

      const name = document.createElement('span');
      name.className = 'tool-name';
      name.textContent = item.tool;

      const track = document.createElement('span');
      track.className = 'bar-track';
      const fill = document.createElement('span');
      fill.className = 'bar-fill';
      const ratio = item.errors > 0 ? Math.max(6, Math.round((item.errors / maxErrors) * 100)) : 0;
      fill.style.width = `${ratio}%`;
      fill.dataset.high = item.errorRate >= 0.2 || item.isLifecycle ? 'true' : 'false';
      track.append(fill);

      const stats = document.createElement('span');
      stats.className = 'tool-stats';

      if (item.streaks > 0) {
        const st = document.createElement('span');
        st.className = 'tag-streak';
        st.textContent = `连撞 ${fmtInt(item.streaks)}`;
        stats.append(st);
      }

      const ratioText = document.createElement('span');
      ratioText.textContent = item.isLifecycle
        ? `${fmtInt(item.errors)} 次`
        : `${fmtInt(item.errors)}/${fmtInt(item.calls)}`;

      const rate = document.createElement('span');
      rate.className = 'rate';
      rate.dataset.high = item.errorRate >= 0.2 && item.errors > 0 ? 'true' : 'false';
      rate.textContent = item.isLifecycle ? '事件' : fmtPercent(item.errorRate);

      stats.append(ratioText, rate);
      btn.append(name, track, stats);
      root.append(btn);
    }
  }

  function matchingStreaksForSig(sigId) {
    const episodes = latestReport?.topStreaks || [];
    return episodes.filter((ep) => ep && ep.signatureId === sigId);
  }

  function renderSampleDrawer(drawerEl, sigItem, detail) {
    drawerEl.replaceChildren();

    const bar = document.createElement('div');
    bar.className = 'drawer-toolbar';
    const streakNote = document.createElement('span');
    streakNote.textContent =
      sigItem.streaks > 0
        ? `连环重试 ${fmtInt(sigItem.streaks)} 轮 · 单轮峰值连续失败 ${fmtInt(detail?.maxStreakLength || sigItem.maxStreakLength || 2)} 次`
        : `脱敏现场样本（近 ${fmtInt((detail?.samples || []).length)} 条）`;

    const actions = document.createElement('div');
    actions.className = 'drawer-actions';

    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'ghost';
    const copyLabel = document.createElement('span');
    copyLabel.textContent = '复制签名';
    copyBtn.append(
      svgIcon(['M5.5 5.5h7v8h-7z', 'M3.5 10.5h-1v-8h7v1']),
      copyLabel,
    );
    copyBtn.onclick = () => {
      void copyTextSafe(`${sigItem.tool}: ${sigItem.signature}`, copyBtn, copyLabel);
    };

    const sendBtn = document.createElement('button');
    sendBtn.type = 'button';
    sendBtn.className = 'ghost';
    const sendLabel = document.createElement('span');
    sendLabel.textContent = '发送排查指令';
    sendBtn.append(
      svgIcon(['M14 2L7 9', 'M14 2l-4.5 12-2.5-5-5-2.5L14 2z']),
      sendLabel,
    );
    sendBtn.title = sessionId ? '发送结构化排查指令至当前会话' : '发回活跃会话（无会话时自动复制）';
    sendBtn.onclick = () => {
      void sendTriageToSession(sigItem, detail);
    };

    actions.append(copyBtn, sendBtn);
    bar.append(streakNote, actions);
    drawerEl.append(bar);

    const episodes = matchingStreaksForSig(sigItem.signatureId);
    if (episodes.length > 0) {
      const strip = document.createElement('div');
      strip.className = 'streak-strip';
      for (const ep of episodes.slice(0, 3)) {
        const pill = document.createElement('span');
        pill.className = 'streak-pill';
        pill.textContent = `连续 ${fmtInt(ep.length)} 次 · ${ep.workspace || 'default'} · ${fmtTimeAgo(ep.timestamp)}`;
        strip.append(pill);
      }
      drawerEl.append(strip);
    }

    const samples = Array.isArray(detail?.samples) ? detail.samples : [];
    if (samples.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'sample-head';
      empty.textContent = '暂无样本明细。';
      drawerEl.append(empty);
      return;
    }

    const list = document.createElement('div');
    list.className = 'sample-list';
    for (const s of samples) {
      const row = document.createElement('div');
      row.className = 'sample-row';

      const head = document.createElement('div');
      head.className = 'sample-head';
      const loc = document.createElement('span');
      loc.textContent = `${s.workspace || 'default'} · ${s.sessionId || '-'} · ${s.agentId || 'main'}`;
      const ts = document.createElement('span');
      ts.textContent = fmtTimeAgo(s.timestamp);
      if (s.timestamp) ts.title = new Date(s.timestamp).toISOString();
      head.append(loc, ts);
      row.append(head);

      const kvPairs = parseStructuredArgs(s.argsPreview);
      if (kvPairs.length > 0) {
        const kvWrap = document.createElement('div');
        kvWrap.className = 'arg-kv-list';
        for (const [k, v] of kvPairs) {
          const chip = document.createElement('span');
          chip.className = 'arg-chip';
          const keyNode = document.createElement('b');
          keyNode.textContent = `${k}=`;
          chip.append(keyNode, document.createTextNode(String(v).slice(0, 120)));
          kvWrap.append(chip);
        }
        row.append(kvWrap);
      }

      const trace = document.createElement('pre');
      trace.className = 'sample-trace';
      trace.textContent = formatTraceLines(s.errorPreview || sigItem.signature);
      row.append(trace);
      list.append(row);
    }
    drawerEl.append(list);
  }

  async function loadSamplesIntoDrawer(drawerEl, sigItem, forceReload = false) {
    if (!forceReload && sampleCache.has(sigItem.signatureId)) {
      renderSampleDrawer(drawerEl, sigItem, sampleCache.get(sigItem.signatureId));
      return;
    }
    if (!drawerEl.hasChildNodes()) {
      drawerEl.textContent = '正在读取脱敏样本…';
    }
    try {
      const detail = await call('samples', {
        signatureId: sigItem.signatureId,
        windowHours,
      });
      sampleCache.set(sigItem.signatureId, detail);
      if (expandedSigId === sigItem.signatureId) {
        renderSampleDrawer(drawerEl, sigItem, detail);
      }
    } catch (err) {
      if (expandedSigId === sigItem.signatureId && !drawerEl.children.length) {
        drawerEl.textContent = err?.message || '无法读取样本。';
      }
    }
  }

  async function toggleSignature(sigId) {
    const record = sigDomMap.get(sigId);
    if (!record) return;
    const { wrapper, drawer, getItem } = record;
    const sigItem = getItem();
    const isOpen = wrapper.dataset.open === 'true';

    if (isOpen) {
      wrapper.dataset.open = 'false';
      wrapper.querySelector('.sig-head')?.setAttribute('aria-expanded', 'false');
      drawer.hidden = true;
      expandedSigId = '';
      return;
    }

    for (const [otherId, otherRec] of sigDomMap.entries()) {
      if (otherId !== sigId && otherRec.wrapper.dataset.open === 'true') {
        otherRec.wrapper.dataset.open = 'false';
        otherRec.wrapper.querySelector('.sig-head')?.setAttribute('aria-expanded', 'false');
        otherRec.drawer.hidden = true;
      }
    }

    expandedSigId = sigId;
    setFocusedSignature(sigId, false);
    wrapper.dataset.open = 'true';
    wrapper.querySelector('.sig-head')?.setAttribute('aria-expanded', 'true');
    drawer.hidden = false;
    await loadSamplesIntoDrawer(drawer, sigItem, false);
  }

  function setFocusedSignature(sigId, scroll = true) {
    focusedSigId = sigId;
    for (const [id, rec] of sigDomMap.entries()) {
      const active = id === sigId;
      rec.wrapper.dataset.focused = active ? 'true' : 'false';
      if (active && scroll) {
        rec.wrapper.scrollIntoView({ block: 'nearest' });
      }
    }
  }

  function updateSignatureEntryDom(record, sigItem) {
    record.currentItem = sigItem;
    record.countEl.textContent = fmtInt(sigItem.count);
    record.toolTagEl.textContent = sigItem.tool;

    if (sigItem.streaks > 0) {
      record.streakTagEl.hidden = false;
      record.streakTagEl.textContent = `连撞 ${fmtInt(sigItem.streaks)}`;
    } else {
      record.streakTagEl.hidden = true;
    }

    if (sigItem.lastSeenAt) {
      record.timeEl.hidden = false;
      record.timeEl.textContent = fmtTimeAgo(sigItem.lastSeenAt);
      record.timeEl.title = new Date(sigItem.lastSeenAt).toISOString();
    } else {
      record.timeEl.hidden = true;
    }

    record.codeEl.textContent = sigItem.signature;
  }

  function createSignatureEntryDom(sigItem) {
    const wrapper = document.createElement('div');
    wrapper.className = 'sig-item';
    wrapper.setAttribute('role', 'listitem');
    wrapper.dataset.sigId = sigItem.signatureId;
    wrapper.dataset.open = 'false';
    wrapper.dataset.focused = 'false';

    const head = document.createElement('button');
    head.type = 'button';
    head.className = 'sig-head';
    head.setAttribute('aria-expanded', 'false');

    const countEl = document.createElement('span');
    countEl.className = 'sig-count';

    const body = document.createElement('span');
    body.className = 'sig-body';

    const metaLine = document.createElement('span');
    metaLine.className = 'sig-meta-line';

    const toolTagEl = document.createElement('span');
    toolTagEl.className = 'tag-tool';

    const streakTagEl = document.createElement('span');
    streakTagEl.className = 'tag-streak';
    streakTagEl.hidden = true;

    const timeEl = document.createElement('span');
    timeEl.className = 'sig-time';
    timeEl.hidden = true;

    metaLine.append(toolTagEl, streakTagEl, timeEl);

    const codeEl = document.createElement('span');
    codeEl.className = 'sig-code';

    body.append(metaLine, codeEl);

    const chevron = svgIcon(['M6 3.5L10.5 8L6 12.5']);
    chevron.classList.add('chevron');

    head.append(countEl, body, chevron);

    const drawer = document.createElement('div');
    drawer.className = 'sig-drawer';
    drawer.hidden = true;

    const record = {
      wrapper,
      head,
      drawer,
      countEl,
      toolTagEl,
      streakTagEl,
      timeEl,
      codeEl,
      currentItem: sigItem,
      getItem: () => record.currentItem,
    };

    head.onclick = () => {
      void toggleSignature(sigItem.signatureId);
    };

    wrapper.append(head, drawer);
    updateSignatureEntryDom(record, sigItem);
    return record;
  }

  function visibleSignaturesFromReport(report) {
    const raw = Array.isArray(report?.topSignatures) ? report.topSignatures : [];
    return raw.filter((s) => {
      if (streakOnly && !(s.streaks > 0)) return false;
      return matchesLocalQuery(s.tool, s.signature);
    });
  }

  function reconcileSignatures(signatures = [], indexed = true, refreshExpandedSamples = false) {
    const root = $('sigsRoot');
    const filterBtn = $('clearFilterBtn');
    if (toolFilter) {
      filterBtn.hidden = false;
      filterBtn.textContent = `${toolFilter} ×`;
      filterBtn.onclick = () => {
        toolFilter = '';
        void loadState();
      };
    } else {
      filterBtn.hidden = true;
    }

    $('sigsCount').textContent = signatures.length > 0 ? `${signatures.length}` : '';

    if (signatures.length === 0) {
      sigDomMap.clear();
      root.replaceChildren();
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = !indexed
        ? '点击右上角「增量刷新」建立近期会话报错索引。'
        : queryText || streakOnly || toolFilter
          ? '当前筛选条件下无匹配报错。'
          : '当前时间窗内无报错记录。';
      root.append(empty);
      return;
    }

    // Remove placeholder empty state if present
    for (const child of [...root.children]) {
      if (!child.dataset || !child.dataset.sigId) child.remove();
    }

    const nextIds = new Set(signatures.map((s) => s.signatureId));
    for (const [existingId, rec] of sigDomMap.entries()) {
      if (!nextIds.has(existingId)) {
        rec.wrapper.remove();
        sigDomMap.delete(existingId);
      }
    }

    let cursorNode = root.firstElementChild;
    for (const sigItem of signatures) {
      let rec = sigDomMap.get(sigItem.signatureId);
      if (!rec) {
        rec = createSignatureEntryDom(sigItem);
        sigDomMap.set(sigItem.signatureId, rec);
      } else {
        updateSignatureEntryDom(rec, sigItem);
      }

      if (rec.wrapper !== cursorNode) {
        root.insertBefore(rec.wrapper, cursorNode);
      } else {
        cursorNode = cursorNode.nextElementSibling;
      }

      const shouldOpen = expandedSigId === sigItem.signatureId;
      rec.wrapper.dataset.open = shouldOpen ? 'true' : 'false';
      rec.head.setAttribute('aria-expanded', shouldOpen ? 'true' : 'false');
      rec.drawer.hidden = !shouldOpen;
      if (shouldOpen && (refreshExpandedSamples || !rec.drawer.hasChildNodes())) {
        void loadSamplesIntoDrawer(rec.drawer, sigItem, refreshExpandedSamples);
      }
    }

    if (focusedSigId && !nextIds.has(focusedSigId)) {
      focusedSigId = signatures[0]?.signatureId || '';
    }
    setFocusedSignature(focusedSigId, false);
  }

  function applyReport(report, { refreshExpandedSamples = false } = {}) {
    const prevScrollY = window.scrollY;
    latestReport = report;
    const status = describeScanStatus(report);
    setStatus(status.label, status.tone, status.tooltip);
    renderSummaryMetrics(report?.totals || {});
    renderTools(report?.highErrorTools || [], report?.lifecycleFailures || []);
    reconcileSignatures(visibleSignaturesFromReport(report), report?.indexed !== false, refreshExpandedSamples);
    if (Math.abs(window.scrollY - prevScrollY) > 2) {
      window.scrollTo(0, prevScrollY);
    }
  }

  function rerenderLocalFilters() {
    if (!latestReport) return;
    renderTools(latestReport?.highErrorTools || [], latestReport?.lifecycleFailures || []);
    reconcileSignatures(visibleSignaturesFromReport(latestReport), latestReport?.indexed !== false, false);
  }

  function syncControls() {
    const btn = $('refreshBtn');
    btn.disabled = busy;
    btn.dataset.busy = busy ? 'true' : 'false';
    for (const segBtn of document.querySelectorAll('.seg button[data-hours]')) {
      const h = Number(segBtn.dataset.hours);
      segBtn.setAttribute('aria-pressed', h === windowHours ? 'true' : 'false');
      segBtn.disabled = busy;
    }
    $('streakOnlyBtn').setAttribute('aria-pressed', streakOnly ? 'true' : 'false');
    $('clearSearchBtn').hidden = !queryText;
  }

  async function loadState() {
    const epoch = ++viewEpoch;
    setError('');
    try {
      const report = await call('state', {
        windowHours,
        ...(toolFilter ? { toolFilter } : {}),
        limit: 35,
      });
      if (epoch !== viewEpoch) return;
      applyReport(report, { refreshExpandedSamples: false });
    } catch (err) {
      if (epoch !== viewEpoch) return;
      setStatus('读取失败', 'danger', err?.message || '');
      setError(err?.message || '无法读取报错索引。');
    }
  }

  async function runIncrementalScan() {
    if (busy) return;
    busy = true;
    const epoch = ++viewEpoch;
    syncControls();
    setError('');
    setStatus('扫描中…', 'busy', '正在增量读取新增会话日志');
    sampleCache.clear();
    try {
      const report = await call('scan_now', {
        windowHours,
        ...(toolFilter ? { toolFilter } : {}),
        limit: 35,
      });
      if (epoch === viewEpoch) {
        applyReport(report, { refreshExpandedSamples: true });
      }
    } catch (err) {
      if (epoch === viewEpoch) {
        setStatus('扫描未完成', 'danger', err?.message || '');
        setError(err?.message || '增量扫描失败。');
      }
    } finally {
      busy = false;
      syncControls();
    }
  }

  for (const segBtn of document.querySelectorAll('.seg button[data-hours]')) {
    segBtn.addEventListener('click', () => {
      const next = Number(segBtn.dataset.hours);
      if (!next || next === windowHours) return;
      windowHours = next;
      safeStorage.set('pulse.windowHours', next);
      syncControls();
      void loadState();
    });
  }

  $('refreshBtn').addEventListener('click', () => {
    void runIncrementalScan();
  });

  $('searchInput').addEventListener('input', (e) => {
    queryText = e.target.value.trim();
    syncControls();
    rerenderLocalFilters();
  });

  $('clearSearchBtn').addEventListener('click', () => {
    $('searchInput').value = '';
    queryText = '';
    syncControls();
    rerenderLocalFilters();
    $('searchInput').focus();
  });

  $('streakOnlyBtn').addEventListener('click', () => {
    streakOnly = !streakOnly;
    syncControls();
    rerenderLocalFilters();
  });

  window.addEventListener('keydown', (event) => {
    const activeEl = document.activeElement;
    const inSearch = activeEl === $('searchInput');
    const inInput = activeEl && ['INPUT', 'TEXTAREA', 'SELECT'].includes(activeEl.tagName);

    if (event.key === '/' && !inInput && !event.metaKey && !event.ctrlKey && !event.altKey) {
      event.preventDefault();
      $('searchInput').focus();
      $('searchInput').select();
      return;
    }

    if (event.key === 'Escape' && inSearch && queryText) {
      event.preventDefault();
      $('clearSearchBtn').click();
      return;
    }

    const orderedIds = [...sigDomMap.keys()];
    if (orderedIds.length === 0) return;

    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      if (inInput && !inSearch) return;
      event.preventDefault();
      const idx = orderedIds.indexOf(focusedSigId);
      let nextIdx;
      if (event.key === 'ArrowDown') {
        nextIdx = idx < 0 ? 0 : Math.min(orderedIds.length - 1, idx + 1);
      } else {
        nextIdx = idx <= 0 ? 0 : idx - 1;
      }
      setFocusedSignature(orderedIds[nextIdx], true);
      return;
    }

    if (event.key === 'Enter' && focusedSigId && (inSearch || !inInput && activeEl?.tagName !== 'BUTTON')) {
      event.preventDefault();
      void toggleSignature(focusedSigId);
    }
  });

  syncControls();
})();
</script>
</body>
</html>
